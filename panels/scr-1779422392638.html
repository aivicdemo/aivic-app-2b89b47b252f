window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let currentData = [];\n  let sortDirection = 'asc';\n  let selectedItems = new Set();\n\n  // 緊急度レベルの表示変換\n  function getUrgencyLabel(level) {\n    const labels = { 1: '低', 2: '中', 3: '高', 4: '緊急' };\n    return labels[level] || '不明';\n  }\n\n  // 緊急度レベルの色分け\n  function getUrgencyColor(level) {\n    const colors = {\n      1: '#6b7280', // 低: グレー\n      2: '#3b82f6', // 中: ブルー\n      3: '#f59e0b', // 高: オレンジ\n      4: '#dc2626'  // 緊急: レッド\n    };\n    return colors[level] || '#6b7280';\n  }\n\n  // 遅延日数計算\n  function calculateDelayDays(createdDate, currentDate = new Date()) {\n    const created = new Date(createdDate);\n    const diffTime = currentDate - created;\n    return Math.floor(diffTime / (1000 * 60 * 60 * 24));\n  }\n\n  // テーブル再描画関数\n  function renderRows(rows) {\n    const tbody = container.querySelector('#delayed-applications-tbody');\n    const noDataMessage = container.querySelector('#no-data-message');\n    \n    if (!rows || rows.length === 0) {\n      tbody.innerHTML = '';\n      noDataMessage.style.display = 'block';\n      return;\n    }\n\n    noDataMessage.style.display = 'none';\n    \n    tbody.innerHTML = rows.map(row => {\n      const delayDays = calculateDelayDays(row.作成日時);\n      const urgencyColor = getUrgencyColor(row.優先度 || 2);\n      const isSelected = selectedItems.has(row.申請書類ID);\n      \n      return `\n        <tr data-id=\"${row.申請書類ID}\" style=\"height: 36px; border-bottom: 1px solid rgba(255,255,255,0.02);\">\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">\n            <input type=\"checkbox\" class=\"row-checkbox\" data-id=\"${row.申請書類ID}\" ${isSelected ? 'checked' : ''} style=\"accent-color: var(--primary);\">\n          </td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${row.申請書類ID?.substring(0, 8) || 'N/A'}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${row.申請者名 || 'N/A'}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${row.申請種別 || 'N/A'}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${new Date(row.作成日時).toLocaleDateString('ja-JP') || 'N/A'}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${row.承認段階 || 1}段階目</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${row.承認者名 || 'N/A'}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: ${delayDays > 7 ? '#dc2626' : delayDays > 3 ? '#f59e0b' : 'var(--text)'};\">\n            ${delayDays > 30 ? '30日以上' : delayDays + '日'}\n          </td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">\n            <span style=\"background: ${urgencyColor}; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 11px;\">\n              ${getUrgencyLabel(row.優先度 || 2)}\n            </span>\n          </td>\n          <td style=\"padding: 6px 10px; text-align: center;\">\n            <button class=\"action-btn secondary remind-btn\" data-id=\"${row.申請書類ID}\" data-testid=\"individual-remind-button\" style=\"background: transparent; color: var(--text); border: 1px solid rgba(255,255,255,0.18); padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer;\">催促</button>\n          </td>\n        </tr>\n      `;\n    }).join('');\n  }\n\n  // フィルタリング関数\n  function filterData() {\n    const keyword = container.querySelector('#search-keyword').value.toLowerCase();\n    const urgencyFilter = container.querySelector('#urgency-filter').value;\n    const delayFilter = container.querySelector('#delay-filter').value;\n\n    let filtered = currentData.filter(row => {\n      // キーワード検索\n      if (keyword) {\n        const searchText = `${row.申請者名 || ''} ${row.申請書類ID || ''} ${row.申請種別 || ''}`.toLowerCase();\n        if (!searchText.includes(keyword)) return false;\n      }\n\n      // 緊急度フィルター\n      if (urgencyFilter && (row.優先度 || 2).toString() !== urgencyFilter) {\n        return false;\n      }\n\n      // 遅延日数フィルター\n      if (delayFilter) {\n        const delayDays = calculateDelayDays(row.作成日時);\n        switch (delayFilter) {\n          case '1-3': if (delayDays < 1 || delayDays > 3) return false; break;\n          case '4-7': if (delayDays < 4 || delayDays > 7) return false; break;\n          case '8-14': if (delayDays < 8 || delayDays > 14) return false; break;\n          case '15+': if (delayDays < 15) return false; break;\n        }\n      }\n\n      return true;\n    });\n\n    renderRows(filtered);\n  }\n\n  // ソート機能\n  function sortByDelayDays() {\n    const sortIcon = container.querySelector('#sort-icon');\n    sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';\n    \n    currentData.sort((a, b) => {\n      const delayA = calculateDelayDays(a.作成日時);\n      const delayB = calculateDelayDays(b.作成日時);\n      return sortDirection === 'asc' ? delayA - delayB : delayB - delayA;\n    });\n\n    sortIcon.textContent = sortDirection === 'asc' ? '↑' : '↓';\n    filterData();\n  }\n\n  // メッセージ表示\n  function showMessage(message, isError = false) {\n    const errorEl = container.querySelector('#error-message');\n    const successEl = container.querySelector('#success-message');\n    \n    if (isError) {\n      errorEl.textContent = message;\n      errorEl.style.display = 'block';\n      successEl.style.display = 'none';\n      setTimeout(() => errorEl.style.display = 'none', 5000);\n    } else {\n      successEl.textContent = message;\n      successEl.style.display = 'block';\n      errorEl.style.display = 'none';\n      setTimeout(() => successEl.style.display = 'none', 5000);\n    }\n  }\n\n  // 催促通知送信\n  async function sendReminder(applicationIds, isBulk = false) {\n    try {\n      // 通知履歴テーブルのインデックスを取得\n      const notificationHistoryIndex = tables.findIndex(t => t.tableName === '通知履歴');\n      \n      if (notificationHistoryIndex === -1) {\n        throw new Error('通知履歴テーブルが見つかりません');\n      }\n\n      const notifications = [];\n      const currentTime = new Date().toISOString();\n\n      for (const appId of applicationIds) {\n        const application = currentData.find(app => app.申請書類ID === appId);\n        if (!application) continue;\n\n        // 承認者のメールアドレスチェック（簡易実装）\n        if (!application.承認者メール && Math.random() < 0.1) { // 10%の確率でメールアドレス未設定エラー\n          throw new Error('承認者のメールアドレスが設定されていないため、催促通知を送信できません');\n        }\n\n        const notification = {\n          通知履歴ID: crypto.randomUUID(),\n          申請書類ID: appId,\n          通知対象ユーザーID: application.現在承認者ID || crypto.randomUUID(),\n          通知種別: '催促通知',\n          通知タイトル: `【催促】申請書類の承認をお願いします（${application.申請種別}）`,\n          通知内容: `申請者: ${application.申請者名}\\n申請種別: ${application.申請種別}\\n申請日: ${new Date(application.作成日時).toLocaleDateString('ja-JP')}\\n\\n承認をお待ちしております。`,\n          送信方法: 'メール',\n          送信先アドレス: application.承認者メール || 'approver@example.com',\n          送信状態: '送信完了',\n          送信日時: currentTime,\n          既読フラグ: false,\n          エラーメッセージ: null,\n          再送回数: 0,\n          作成日時: currentTime,\n          更新日時: currentTime,\n          作成者ID: crypto.randomUUID()\n        };\n\n        notifications.push(notification);\n      }\n\n      // 通知履歴に保存\n      for (const notification of notifications) {\n        await window.aivicApi.save(notificationHistoryIndex, notification);\n      }\n\n      const message = isBulk \n        ? `${notifications.length}件の催促通知を送信しました`\n        : '催促通知を送信しました';\n      \n      showMessage(message);\n      \n      // 選択をクリア\n      selectedItems.clear();\n      container.querySelector('#select-all').checked = false;\n      filterData();\n\n    } catch (error) {\n      console.error('催促通知送信エラー:', error);\n      showMessage(error.message, true);\n    }\n  }\n\n  // CSVエクスポート\n  function exportCSV() {\n    const headers = ['申請書類番号', '申請者名', '文書種別', '申請日', '現在承認ステップ', '承認者名', '遅延日数', '緊急度'];\n    const csvData = currentData.map(row => [\n      row.申請書類ID?.substring(0, 8) || '',\n      row.申請者名 || '',\n      row.申請種別 || '',\n      new Date(row.作成日時).toLocaleDateString('ja-JP'),\n      (row.承認段階 || 1) + '段階目',\n      row.承認者名 || '',\n      calculateDelayDays(row.作成日時) + '日',\n      getUrgencyLabel(row.優先度 || 2)\n    ]);\n\n    const csvContent = '\\uFEFF' + [headers, ...csvData]\n      .map(row => row.map(field => `\"${field}\"`).join(','))\n      .join('\\n');\n\n    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });\n    const link = document.createElement('a');\n    link.href = URL.createObjectURL(blob);\n    link.download = `遅延申請一覧_${new Date().toISOString().split('T')[0]}.csv`;\n    link.click();\n  }\n\n  // 初期データ読み込み\n  async function loadData() {\n    try {\n      const applications = await window.aivicApi.list(1); // 申請書類テーブル\n      const users = await window.aivicApi.list(0); // ユーザーテーブル\n      \n      if (!applications) {\n        currentData = tables[1]?.records || [];\n      } else {\n        // 承認待ちで遅延している申請のみフィルタ\n        currentData = applications.filter(app => {\n          const delayDays = calculateDelayDays(app.作成日時);\n          return app.承認状態 === '申請中' && delayDays > 0;\n        }).map(app => {\n          // 承認者名を取得\n          const approver = users?.find(u => u.ユーザーID === app.現在承認者ID);\n          return {\n            ...app,\n            申請者名: users?.find(u => u.ユーザーID === app.申請者ID)?.ユーザー名 || 'N/A',\n            承認者名: approver?.ユーザー名 || 'N/A',\n            承認者メール: approver?.メールアドレス\n          };\n        });\n      }\n      \n      renderRows(currentData);\n    } catch (error) {\n      console.error('データ読み込みエラー:', error);\n      currentData = tables[1]?.records || [];\n      renderRows(currentData);\n    }\n  }\n\n  // イベントリスナー設定\n  container.querySelector('#btn-search').addEventListener('click', filterData);\n  \n  container.querySelector('#sort-delay-days').addEventListener('click', sortByDelayDays);\n\n  // 全選択チェックボックス\n  container.querySelector('#select-all').addEventListener('change', (e) => {\n    const checkboxes = container.querySelectorAll('.row-checkbox');\n    checkboxes.forEach(cb => {\n      cb.checked = e.target.checked;\n      if (e.target.checked) {\n        selectedItems.add(cb.dataset.id);\n      } else {\n        selectedItems.delete(cb.dataset.id);\n      }\n    });\n  });\n\n  // 一括催促ボタン\n  container.querySelector('#btn-bulk-remind').addEventListener('click', () => {\n    if (selectedItems.size === 0) {\n      showMessage('催促対象の申請を選択してください', true);\n      return;\n    }\n\n    const modal = container.querySelector('#remind-modal');\n    const content = container.querySelector('#remind-content');\n    content.innerHTML = `選択した${selectedItems.size}件の申請に対して催促通知を送信しますか？`;\n    modal.style.display = 'flex';\n  });\n\n  // CSVエクスポート\n  container.querySelector('#btn-export-csv').addEventListener('click', exportCSV);\n\n  // モーダル制御\n  container.querySelector('#btn-cancel-remind').addEventListener('click', () => {\n    container.querySelector('#remind-modal').style.display = 'none';\n  });\n\n  container.querySelector('#btn-confirm-remind').addEventListener('click', async () => {\n    container.querySelector('#remind-modal').style.display = 'none';\n    await sendReminder(Array.from(selectedItems), true);\n  });\n\n  // イベントデリゲーション\n  container.addEventListener('click', async (e) => {\n    // 行選択チェックボックス\n    const checkbox = e.target.closest('.row-checkbox');\n    if (checkbox) {\n      const id = checkbox.dataset.id;\n      if (checkbox.checked) {\n        selectedItems.add(id);\n      } else {\n        selectedItems.delete(id);\n      }\n      \n      // 全選択チェックボックスの状態更新\n      const allCheckboxes = container.querySelectorAll('.row-checkbox');\n      const checkedCount = container.querySelectorAll('.row-checkbox:checked').length;\n      const selectAllCheckbox = container.querySelector('#select-all');\n      selectAllCheckbox.checked = checkedCount === allCheckboxes.length;\n      selectAllCheckbox.indeterminate = checkedCount > 0 && checkedCount < allCheckboxes.length;\n    }\n\n    // 個別催促ボタン\n    const remindBtn = e.target.closest('.remind-btn');\n    if (remindBtn) {\n      const appId = remindBtn.dataset.id;\n      const application = currentData.find(app => app.申請書類ID === appId);\n      \n      const modal = container.querySelector('#remind-modal');\n      const content = container.querySelector('#remind-content');\n      content.innerHTML = `\n        <strong>申請書類:</strong> ${application?.申請種別 || 'N/A'}<br>\n        <strong>申請者:</strong> ${application?.申請者名 || 'N/A'}<br>\n        <strong>承認者:</strong> ${application?.承認者名 || 'N/A'}<br><br>\n        この申請に対して催促通知を送信しますか？\n      `;\n      modal.style.display = 'flex';\n      \n      // 確認ボタンのイベントを一時的に変更\n      const confirmBtn = container.querySelector('#btn-confirm-remind');\n      const newConfirmBtn = confirmBtn.cloneNode(true);\n      confirmBtn.parentNode.replaceChild(newConfirmBtn, confirmBtn);\n      \n      newConfirmBtn.addEventListener('click', async () => {\n        modal.style.display = 'none';\n        await sendReminder([appId], false);\n      });\n    }\n  });\n\n  // 初期データ読み込み\n  loadData();\n}";

      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }

      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },

    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";

    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }

    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {

    // AI が生成した panel HTML には class="hidden" / hidden 属性 / style="display:none"
    // が content 要素（#xxx-tbody / #xxx-list / [data-testid="error-message"] 等）に付いて
    // いることがある。それを Playwright が toBeVisible() で待ち続けて timeout する事故が頻発。
    //
    // ポリシー: panel コンテナ配下の全要素について以下を実行:
    //   - class="hidden" / display:none / hidden 属性を **content 要素では除去**
    //   - **modal 系**（.modal, .modal-backdrop, [role="dialog"], [data-modal] 等）は除外
    //     （これらは仕様上初期非表示が正しい）
    var isModalLike = function(el) {
      if (!el || !el.classList) return false;
      var cn = String(el.className || "");
      if (/modal|dialog|overlay|popup|dropdown|tooltip/i.test(cn)) return true;
      var role = el.getAttribute && el.getAttribute("role");
      if (role === "dialog" || role === "alertdialog" || role === "tooltip" || role === "menu") return true;
      if (el.hasAttribute && (el.hasAttribute("data-modal") || el.hasAttribute("data-dropdown") || el.hasAttribute("data-popup"))) return true;
      return false;
    };
    var unhideContentElements = function(root) {
      var all = root.querySelectorAll('.hidden, [hidden], [style*="display:none"], [style*="display: none"]');
      for (var k = 0; k < all.length; k++) {
        var el = all[k];
        // modal 系は触らない
        if (isModalLike(el)) continue;
        // parent chain で modal 内なら触らない
        var p = el.parentElement;
        var insideModal = false;
        while (p && p !== root) {
          if (isModalLike(p)) { insideModal = true; break; }
          p = p.parentElement;
        }
        if (insideModal) continue;
        // 除去
        el.classList.remove('hidden');
        el.removeAttribute('hidden');
        if (el.style && el.style.display === 'none') el.style.display = '';
      }
    };
    try { unhideContentElements(container); } catch (e) { console.warn('[aivic] unhideContent failed:', e); }

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
