<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ハイブリッド申請承認システム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-main: #ffffff;
            --bg-card: #f8fafc;
            --bg-sidebar: #f1f5f9;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-muted: #64748b;
            --text-light: #94a3b8;
            --top-bar-bg: #ffffff;
            --top-bar-border: #e2e8f0;
            --success: #059669;
            --warning: #d97706;
            --danger: #dc2626;
            --radius: 8px;
            --radius-sm: 6px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 13px;
            line-height: 1.4;
            color: var(--text);
            background: var(--bg-main);
        }

        .app-layout {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--top-bar-bg);
        }

        .logo {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }

        .nav-section {
            padding: 12px 0;
        }

        .nav-section-title {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0 16px 8px;
        }

        .nav-item {
            display: block;
            padding: 6px 16px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .nav-item:hover {
            background: rgba(59, 130, 246, 0.08);
            color: var(--primary);
        }

        .nav-item.aivic-active {
            background: rgba(59, 130, 246, 0.12);
            color: var(--primary);
            font-weight: 500;
            border-right: 2px solid var(--primary);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            height: 52px;
            background: var(--top-bar-bg);
            border-bottom: 1px solid var(--top-bar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .breadcrumb {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 500;
        }

        .logout-link {
            font-size: 12px;
            color: var(--text-muted);
            text-decoration: none;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            transition: background 0.15s ease;
        }

        .logout-link:hover {
            background: var(--bg-card);
        }

        .content-area {
            flex: 1;
            overflow: auto;
            padding: 16px 20px;
        }

        .panel-container {
            height: 100%;
            background: var(--bg-main);
        }

        .status-indicator {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .status-pending { background: var(--warning); }
        .status-approved { background: var(--success); }
        .status-rejected { background: var(--danger); }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .badge-primary {
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary);
        }

        .badge-success {
            background: rgba(5, 150, 105, 0.1);
            color: var(--success);
        }

        .badge-warning {
            background: rgba(217, 119, 6, 0.1);
            color: var(--warning);
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            margin-bottom: 12px;
        }

        .card-header {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
            background: var(--bg-main);
            color: var(--text);
        }

        .btn:hover {
            background: var(--bg-card);
            border-color: var(--primary);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .table th,
        .table td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .table th {
            font-weight: 500;
            color: var(--text-muted);
            background: var(--bg-card);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .table tbody tr:hover {
            background: rgba(59, 130, 246, 0.02);
        }

        .loading-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--text-light);
            font-size: 12px;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            
            .content-area {
                padding: 12px 16px;
            }
        }
    </style>

id","required":true,"description":"適用される承認フロー定義への外部キー"},{"name":"現在ステップ番号","type":"integer","required":true,"description":"現在処理中の承認ステップ番号"},{"name":"現在承認者ID","type":"uuid","required":false,"description":"現在の承認担当者のユーザーID"},{"name":"処理状況","type":"varchar(100)","required":true,"description":"処理の現在状況（申請中/承認待ち/承認済み/差戻し/却下/取下げ）"},{"name":"開始日時","type":"timestamp","required":true,"description":"処理ルートの開始日時"},{"name":"完了日時","type":"timestamp","required":false,"description":"処理ルートの完了日時"},{"name":"期限日時","type":"timestamp","required":false,"description":"処理完了の期限日時"},{"name":"優先度","type":"integer","required":true,"description":"処理の優先度（1:低 2:通常 3:高 4:緊急）"},{"name":"自動処理フラグ","type":"boolean","required":true,"description":"自動処理対象かどうかのフラグ"},{"name":"備考","type":"text","required":false,"description":"処理ルートに関する備考・メモ"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"遅延検知設定","purpose":"申請承認プロセスにおける遅延を検知するための設定を管理し、承認ステップごとの期限や通知タイミングを定義する","columns":[{"name":"遅延検知設定ID","type":"uuid","required":true,"description":"遅延検知設定の一意識別子（主キー）"},{"name":"文書種別ID","type":"uuid","required":true,"description":"文書種別マスタへの外部キー"},{"name":"承認ステップID","type":"uuid","required":false,"description":"承認ステップへの外部キー（全ステップ共通の場合はNULL）"},{"name":"設定名","type":"varchar(100)","required":true,"description":"遅延検知設定の名称"},{"name":"期限日数","type":"integer","required":true,"description":"承認期限までの日数"},{"name":"警告日数","type":"integer","required":false,"description":"期限前の警告通知を行う日数"},{"name":"エスカレーション日数","type":"integer","required":false,"description":"期限超過後のエスカレーション通知を行う日数"},{"name":"営業日計算フラグ","type":"boolean","required":true,"description":"営業日ベースで計算するかどうか"},{"name":"有効フラグ","type":"boolean","required":true,"description":"設定が有効かどうか"},{"name":"備考","type":"text","required":false,"description":"設定に関する補足説明"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"補助金関連度マスタ","purpose":"申請書類と補助金制度の関連度を管理し、適切な承認フローや処理ルートの決定に使用するマスタテーブル","columns":[{"name":"補助金関連度ID","type":"uuid","required":true,"description":"補助金関連度の一意識別子（主キー）"},{"name":"補助金関連度コード","type":"varchar(100)","required":true,"description":"補助金関連度の業務コード（表示・検索用）"},{"name":"補助金関連度名","type":"varchar(100)","required":true,"description":"補助金関連度の名称"},{"name":"関連度レベル","type":"integer","required":true,"description":"関連度の数値レベル（1:低、2:中、3:高など）"},{"name":"説明","type":"text","required":false,"description":"補助金関連度の詳細説明"},{"name":"表示順","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"マスタデータの有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]}];

window.AIVIC_PAGE_INIT_JS = "javascript\nfunction(container, apiUrl, tables) {\n  // 業務ロジックのインポート\n  const { \n    identifyStagnantApplications, \n    determinePriorityForReminder, \n    validateReminderFrequency, \n    generateReminderMessage, \n    identifyNotificationRecipient \n  } = window.businessLogic || {};\n\n  let currentDelayedApplications = [];\n  let selectedApplicationIds = new Set();\n\n  // 緊急度レベルの表示名を取得\n  function getUrgencyLabel(level) {\n    const labels = { 1: '低', 2: '通常', 3: '高', 4: '緊急' };\n    return labels[level] || '不明';\n  }\n\n  // 緊急度レベルの色を取得\n  function getUrgencyColor(level) {\n    const colors = { 1: '#6b7280', 2: '#3b82f6', 3: '#f59e0b', 4: '#ef4444' };\n    return colors[level] || '#6b7280';\n  }\n\n  // 遅延日数を計算\n  function calculateDelayDays(createdDate) {\n    const created = new Date(createdDate);\n    const now = new Date();\n    const diffTime = Math.abs(now - created);\n    return Math.ceil(diffTime / (1000 * 60 * 60 * 24));\n  }\n\n  // 統計情報を更新\n  function updateStatistics(applications) {\n    const total = applications.length;\n    const urgent = applications.filter(app => app.優先度 === 4).length;\n    const avgDelay = total > 0 ? Math.round(applications.reduce((sum, app) => sum + calculateDelayDays(app.作成日時), 0) / total) : 0;\n    const todayNotifications = applications.filter(app => {\n      const today = new Date().toDateString();\n      return app.作成日時 && new Date(app.作成日時).toDateString() === today;\n    }).length;\n\n    const statTotal = container.querySelector('#stat-total') || container.querySelector('[data-testid=\"total-delayed\"]');\n    const statUrgent = container.querySelector('#stat-urgent') || container.querySelector('[data-testid=\"urgent-cases\"]');\n    const statAvg = container.querySelector('#stat-avg');\n    const statToday = container.querySelector('#stat-today');\n\n    if (statTotal) statTotal.textContent = total;\n    if (statUrgent) statUrgent.textContent = urgent;\n    if (statAvg) statAvg.textContent = avgDelay;\n    if (statToday) statToday.textContent = todayNotifications;\n  }\n\n  // 遅延申請一覧を描画\n  function renderDelayedApplications(applications) {\n    const tbody = container.querySelector('#delayed-applications-tbody') || \n                  container.querySelector('[data-testid=\"delayed-applications-table\"] tbody');\n    \n    if (!tbody) return;\n\n    if (!applications || applications.length === 0) {\n      tbody.innerHTML = '<tr><td colspan=\"10\" style=\"padding: 20px; text-align: center; color: var(--text-muted);\">遅延している申請はありません</td></tr>';\n      updateStatistics([]);\n      return;\n    }\n\n    tbody.innerHTML = applications.map(app => {\n      const delayDays = calculateDelayDays(app.作成日時);\n      const urgencyColor = getUrgencyColor(app.優先度);\n      const urgencyLabel = getUrgencyLabel(app.優先度);\n      \n      return `\n        <tr data-id=\"${app.id}\" style=\"border-bottom: 1px solid var(--border);\">\n          <td style=\"padding: 6px 10px;\">\n            <input type=\"checkbox\" class=\"row-checkbox\" data-id=\"${app.id}\" style=\"accent-color: var(--primary);\">\n          </td>\n          <td style=\"padding: 6px 10px;\">${app.申請書類番号 || '-'}</td>\n          <td style=\"padding: 6px 10px;\">${app.申請者 || '-'}</td>\n          <td style=\"padding: 6px 10px;\">${app.申請日 || '-'}</td>\n          <td style=\"padding: 6px 10px;\">${app.申請種別 || '-'}</td>\n          <td style=\"padding: 6px 10px;\">${app.承認者 || '-'}</td>\n          <td style=\"padding: 6px 10px;\">${delayDays}日</td>\n          <td style=\"padding: 6px 10px;\">\n            <span class=\"badge\" style=\"background: ${urgencyColor}; color: white; padding: 2px 6px; border-radius: 3px; font-size: 11px;\">${urgencyLabel}</span>\n          </td>\n          <td style=\"padding: 6px 10px;\">${app.最終催促日 || '-'}</td>\n          <td style=\"padding: 6px 10px;\">\n            <button class=\"action-btn primary remind-btn\" data-id=\"${app.id}\" style=\"font-size: 11px; padding: 4px 8px;\">催促</button>\n          </td>\n        </tr>\n      `;\n    }).join('');\n\n    // 個別催促ボタンのイベントリスナーを追加\n    tbody.querySelectorAll('.remind-btn').forEach(btn => {\n      btn.addEventListener('click', (e) => {\n        const appId = e.target.getAttribute('data-id');\n        const app = applications.find(a => a.id === appId);\n        if (app) {\n          showRemindModal([app]);\n        }\n      });\n    });\n\n    // チェックボックスのイベントリスナーを追加\n    tbody.querySelectorAll('.row-checkbox').forEach(checkbox => {\n      checkbox.addEventListener('change', (e) => {\n        const appId = e.target.getAttribute('data-id');\n        if (e.target.checked) {\n          selectedApplicationIds.add(appId);\n        } else {\n          selectedApplicationIds.delete(appId);\n        }\n        updateBulkActionButtons();\n      });\n    });\n\n    updateStatistics(applications);\n  }\n\n  // 一括操作ボタンの状態を更新\n  function updateBulkActionButtons() {\n    const bulkRemindBtn = container.querySelector('[data-testid=\"bulk-remind-button\"]');\n    if (bulkRemindBtn) {\n      bulkRemindBtn.disabled = selectedApplicationIds.size === 0;\n    }\n  }\n\n  // 催促モーダルを表示\n  function showRemindModal(applications) {\n    const isMultiple = applications.length > 1;\n    \n    // モーダルHTML作成\n    const modalHtml = `\n      <div class=\"modal-overlay\" data-testid=\"remind-modal\" style=\"position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center;\">\n        <div class=\"modal-content\" style=\"background: var(--bg-main); padding: 20px; border-radius: 8px; width: 500px; max-width: 90vw;\">\n          <h3 style=\"margin: 0 0 16px 0;\">${isMultiple ? '一括催促通知' : '催促通知'}</h3>\n          <div style=\"margin-bottom: 16px;\">\n            <label style=\"display: block; margin-bottom: 4px;\">件名</label>\n            <input type=\"text\" data-testid=\"notification-title\" value=\"承認催促のご連絡\" style=\"width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px;\">\n          </div>\n          <div style=\"margin-bottom: 16px;\">\n            <label style=\"display: block; margin-bottom: 4px;\">メッセージ</label>\n            <textarea data-testid=\"notification-message\" rows=\"6\" style=\"width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; resize: vertical;\">承認が遅延している申請があります。ご確認をお願いいたします。</textarea>\n          </div>\n          <div style=\"display: flex; gap: 8px; justify-content: flex-end;\">\n            <button class=\"action-btn secondary\" onclick=\"this.closest('.modal-overlay').remove()\">キャンセル</button>\n            <button class=\"action-btn primary\" data-testid=\"send-remind-button\">送信</button>\n          </div>\n        </div>\n      </div>\n    `;\n\n    // モーダルを追加\n    document.body.insertAdjacentHTML('beforeend', modalHtml);\n    \n    // 送信ボタンのイベントリスナー\n    const modal = document.querySelector('[data-testid=\"remind-modal\"]');\n    const sendBtn = modal.querySelector('[data-testid=\"send-remind-button\"]');\n    \n    sendBtn.addEventListener('click', async () => {\n      const title = modal.querySelector('[data-testid=\"notification-title\"]').value;\n      const message = modal.querySelector('[data-testid=\"notification-message\"]').value;\n      \n      try {\n        // 業務ロジックを使用してメッセージを生成・検証\n        if (generateReminderMessage) {\n          const generatedMessage = generateReminderMessage({\n            applications: applications,\n            customMessage: message,\n            title: title\n          });\n        }\n\n        // 通知頻度の検証\n        if (validateReminderFrequency) {\n          const frequencyValid = validateReminderFrequency({\n            applications: applications,\n            lastReminderDates: applications.map(app => app.最終催促日)\n          });\n          \n          if (!frequencyValid.isValid) {\n            window.aivicNotify.error(frequencyValid.message || '催促通知の頻度制限に違反しています');\n            return;\n          }\n        }\n\n        // 通知送信処理\n        for (const app of applications) {\n          await window.aivicApi.save('notifications', {\n            申請ID: app.id,\n            件名: title,\n            メッセージ: message,\n            送信日時: new Date().toISOString(),\n            送信者: window.currentUser?.name || 'システム',\n            受信者: app.承認者\n          });\n\n          // 申請の最終催促日を更新\n          await window.aivicApi.update('applications', app.id, {\n            最終催促日: new Date().toISOString().split('T')[0]\n          });\n        }\n\n        modal.remove();\n        \n        if (isMultiple) {\n          window.aivicNotify.success('一括催促通知を送信しました');\n        } else {\n          window.aivicNotify.success('催促通知を送信しました');\n        }\n        \n        // 一覧を再読み込み\n        loadDelayedApplications();\n        \n        // 選択状態をクリア\n        selectedApplicationIds.clear();\n        updateBulkActionButtons();\n        \n      } catch (error) {\n        console.error('催促通知送信エラー:', error);\n        window.aivicNotify.error('催促通知の送信に失敗しました');\n      }\n    });\n  }\n\n  // 遅延申請データを読み込み\n  async function loadDelayedApplications() {\n    try {\n      // 申請データを取得\n      const applications = await window.aivicApi.list('applications');\n      \n      // 業務ロジックを使用して遅延申請を特定\n      let delayedApps = [];\n      if (identifyStagnantApplications) {\n        delayedApps = identifyStagnantApplications({\n          applications: applications,\n          currentDate: new Date(),\n          thresholdDays: 3\n        });\n      } else {\n        // フォールバック: 3日以上経過した未承認申請を抽出\n        delayedApps = applications.filter(app => {\n          if (app.承認状態 === '承認済み' || app.承認状態 === '却下') return false;\n          const delayDays = calculateDelayDays(app.作成日時);\n          return delayDays >= 3;\n        });\n      }\n\n      // 優先度を設定\n      if (determinePriorityForReminder) {\n        delayedApps = delayedApps.map(app => {\n          const priority = determinePriorityForReminder({\n            application: app,\n            delayDays: calculateDelayDays(app.作成日時),\n            urgencyLevel: app.緊急度\n          });\n          return { ...app, 優先度: priority.level || 2 };\n        });\n      } else {\n        // フォールバック: 遅延日数に基づいて優先度を設定\n        delayedApps = delayedApps.map(app => {\n          const delayDays = calculateDelayDays(app.作成日時);\n          let priority = 1;\n          if (delayDays >= 10) priority = 4;\n          else if (delayDays >= 7) priority = 3;\n          else if (delayDays >= 5) priority = 2;\n          return { ...app, 優先度: priority };\n        });\n      }\n\n      currentDelayedApplications = delayedApps;\n      renderDelayedApplications(delayedApps);\n      \n    } catch (error) {\n      console.error('遅延申請データの読み込みエラー:', error);\n      window.aivicNotify.error('データの読み込みに失敗しました');\n    }\n  }\n\n  // フィルタリング処理\n  function applyFilters() {\n    const urgencyFilter = container.querySelector('[data-testid=\"urgency-filter\"]');\n    const searchInput = container.querySelector('[data-testid=\"search-input\"]');\n    \n    let filteredApps = [...currentDelayedApplications];\n    \n    // 緊急度フィルタ\n    if (urgencyFilter && urgencyFilter.value !== '全て') {\n      const urgencyMap = { '低': 1, '中': 2, '通常': 2, '高': 3, '緊急': 4 };\n      const targetUrgency = urgencyMap[urgencyFilter.value];\n      if (targetUrgency) {\n        filteredApps = filteredApps.filter(app => app.優先度 === targetUrgency);\n      }\n    }\n    \n    // 検索フィルタ\n    if (searchInput && searchInput.value.trim()) {\n      const searchTerm = searchInput.value.trim().toLowerCase();\n      filteredApps = filteredApps.filter(app => \n        (app.申請書類番号 && app.申請書類番号.toLowerCase().includes(searchTerm)) ||\n        (app.申請者 && app.申請者.toLowerCase().includes(searchTerm)) ||\n        (app.申請種別 && app.申請種別.toLowerCase().includes(searchTerm))\n      );\n    }\n    \n    renderDelayedApplications(filteredApps);\n  }\n\n  // 権限チェック\n  function checkPermissions() {\n    const currentUser = window.currentUser;\n    const hasRemindPermission = currentUser && (currentUser.role === 'admin' || currentUser.permissions?.includes('send_reminders'));\n    \n    const bulkRemindBtn = container.querySelector('[data-testid=\"bulk-remind-button\"]');\n    if (bulkRemindBtn && !hasRemindPermission) {\n      bulkRemindBtn.disabled = true;\n    }\n    \n    return hasRemindPermission;\n  }\n\n  // イベントリスナーの設定\n  function setupEventListeners() {\n    // 検索ボタン\n    const searchBtn = container.querySelector('[data-testid=\"search-button\"]');\n    if (searchBtn) {\n      searchBtn.addEventListener('click', applyFilters);\n    }\n\n    // 緊急度フィルタ\n    const urgencyFilter = container.querySelector('[data-testid=\"urgency-filter\"]');\n    if (urgencyFilter) {\n      urgencyFilter.addEventListener('change', applyFilters);\n    }\n\n    // 全選択チェックボックス\n    const selectAllCheckbox = container.querySelector('[data-testid=\"select-all-checkbox\"]');\n    if (selectAllCheckbox) {\n      selectAllCheckbox.addEventListener('change', (e) => {\n        const checkboxes = container.querySelectorAll('.row-checkbox');\n        checkboxes.forEach(checkbox => {\n          checkbox.checked = e.target.checked;\n          const appId = checkbox.getAttribute('data-id');\n          if (e.target.checked) {\n            selectedApplicationIds.add(appId);\n          } else {\n            selectedApplicationIds.delete(appId);\n          }\n        });\n        updateBulkActionButtons();\n      });\n    }\n\n    // 一括催促ボタン\n    const bulkRemindBtn = container.querySelector('[data-testid=\"bulk-remind-button\"]');\n    if (bulkRemindBtn) {\n      bulkRemindBtn.addEventListener('click', () => {\n        const selectedApps = currentDelayedApplications.filter(app => \n          selectedApplicationIds.has(app.id)\n        );\n        if (selectedApps.length > 0) {\n          showRemindModal(selectedApps);\n        }\n      });\n    }\n\n    // ソート機能（操作列クリック）\n    const operationHeader = container.querySelector('th:has-text(\"操作\")');\n    if (operationHeader) {\n      operationHeader.style.cursor = 'pointer';\n      operationHeader.addEventListener('click', () => {\n        currentDelayedApplications.sort((a, b) => {\n          const delayA = calculateDelayDays(a.作成日時);\n          const delayB = calculateDelayDays(b.作成日時);\n          return delayB - delayA; // 降順\n        });\n        renderDelayedApplications(currentDelayedApplications);\n      });\n    }\n  }\n\n  // 初期化処理\n  async function initialize() {\n    checkPermissions();\n    setupEventListeners();\n    await loadDelayedApplications();\n    updateBulkActionButtons();\n  }\n\n  // 初期化実行\n  initialize();\n}";

                <div data-aivic-panel="scr-1779422470870" class="panel-container" style="display:none"></div>
                <div data-aivic-panel="scr-1779422527556" class="panel-container" style="display:none"></div>
                <div data-aivic-panel="scr-1779422546501" class="panel-container" style="display:none"></div>
                <div data-aivic-panel="scr-1779422563059" class="panel-container" style="display:none"></div>
                <div data-aivic-panel="scr-1779422575885" class="panel-container" style="display:none"></div>
                <div data-aivic-panel="scr-1779422591281" class="panel-container" style="display:none"></div>
                <div data-aivic-panel="scr-1779422606208" class="panel-container" style="display:none"></div>
            </div>
        </main>
    </div>

    <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
