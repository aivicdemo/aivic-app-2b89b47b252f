window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let currentSort = { field: null, direction: 'asc' };\n  let allDelayedApplications = [];\n  let selectedApplications = [];\n\n  // 緊急度レベルのマッピング\n  const urgencyLevels = {\n    1: { text: '低', color: '#6b7280' },\n    2: { text: '中', color: '#f59e0b' },\n    3: { text: '高', color: '#ef4444' },\n    4: { text: '緊急', color: '#dc2626' }\n  };\n\n  // 遅延申請データを取得・計算する関数\n  function getDelayedApplications() {\n    const applications = tables[0]?.records || [];\n    const users = tables[1]?.records || [];\n    const documentTypes = tables[2]?.records || [];\n    const approvalSteps = tables[4]?.records || [];\n    \n    const now = new Date();\n    \n    return applications\n      .filter(app => app.承認状態 === '申請中' || app.承認状態 === '承認待ち')\n      .map(app => {\n        const applicant = users.find(u => u.ユーザーID === app.申請者ID);\n        const docType = documentTypes.find(d => d.文書種別ID === app.申請種別);\n        const currentStep = approvalSteps.find(s => s.申請書類ID === app.申請書類ID && s.承認状態 === '未承認');\n        const approver = currentStep ? users.find(u => u.ユーザーID === currentStep.承認者ID) : null;\n        \n        const createdDate = new Date(app.作成日時);\n        const delayDays = Math.floor((now - createdDate) / (1000 * 60 * 60 * 24));\n        \n        // 緊急度レベルを遅延日数に基づいて決定\n        let urgencyLevel = 1;\n        if (delayDays >= 14) urgencyLevel = 4; // 緊急\n        else if (delayDays >= 10) urgencyLevel = 3; // 高\n        else if (delayDays >= 7) urgencyLevel = 2; // 中\n        else urgencyLevel = 1; // 低\n        \n        return {\n          ...app,\n          申請者名: applicant?.ユーザー名 || '不明',\n          文書種別名: docType?.文書種別名 || '不明',\n          承認者名: approver?.ユーザー名 || '不明',\n          承認者メール: approver?.メールアドレス || '',\n          遅延日数: delayDays,\n          緊急度レベル: urgencyLevel,\n          承認ステップ番号: currentStep?.ステップ番号 || 1\n        };\n      })\n      .filter(app => app.遅延日数 > 0); // 遅延している申請のみ\n  }\n\n  // テーブル再描画関数\n  function renderRows(rows) {\n    const tbody = container.querySelector('#delayed-applications-tbody');\n    const noDataMessage = container.querySelector('#no-data-message');\n    \n    if (!rows || rows.length === 0) {\n      tbody.innerHTML = '';\n      noDataMessage.style.display = 'block';\n      return;\n    }\n    \n    noDataMessage.style.display = 'none';\n    tbody.innerHTML = rows.map(row => {\n      const urgency = urgencyLevels[row.緊急度レベル] || urgencyLevels[1];\n      const createdDate = new Date(row.作成日時).toLocaleDateString('ja-JP');\n      const hasEmail = row.承認者メール && row.承認者メール.trim() !== '';\n      \n      return `\n        <tr data-id=\"${row.申請書類ID}\" style=\"height: 36px;\">\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">\n            <input type=\"checkbox\" class=\"row-checkbox\" data-id=\"${row.申請書類ID}\" style=\"accent-color: var(--primary);\" ${!hasEmail ? 'disabled' : ''}>\n          </td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${row.申請書類ID.substring(0, 8)}...</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${row.申請者名}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${row.文書種別名}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${createdDate}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">ステップ${row.承認ステップ番号}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${row.承認者名}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text); font-weight: 500;\">${row.遅延日数}日</td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">\n            <span style=\"background: ${urgency.color}; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 500;\">${urgency.text}</span>\n          </td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">\n            <button class=\"notify-btn action-btn secondary\" data-id=\"${row.申請書類ID}\" ${!hasEmail ? 'disabled title=\"承認者のメールアドレスが未設定です\"' : ''} style=\"font-size: 12px; padding: 4px 8px;\">催促送信</button>\n          </td>\n        </tr>\n      `;\n    }).join('');\n  }\n\n  // フィルタリング関数\n  function filterApplications() {\n    const searchTerm = container.querySelector('#input-search').value.toLowerCase();\n    const urgencyFilter = container.querySelector('#urgency-filter').value;\n    const delayDaysFilter = parseInt(container.querySelector('#delay-days-filter').value) || 0;\n    \n    let filtered = allDelayedApplications.filter(app => {\n      const matchesSearch = !searchTerm || \n        app.申請者名.toLowerCase().includes(searchTerm) ||\n        app.申請書類ID.toLowerCase().includes(searchTerm) ||\n        app.申請タイトル.toLowerCase().includes(searchTerm);\n      \n      const matchesUrgency = !urgencyFilter || app.緊急度レベル.toString() === urgencyFilter;\n      const matchesDelayDays = app.遅延日数 >= delayDaysFilter;\n      \n      return matchesSearch && matchesUrgency && matchesDelayDays;\n    });\n    \n    // ソート適用\n    if (currentSort.field) {\n      filtered.sort((a, b) => {\n        let aVal = a[currentSort.field];\n        let bVal = b[currentSort.field];\n        \n        if (currentSort.field === '遅延日数') {\n          aVal = parseInt(aVal) || 0;\n          bVal = parseInt(bVal) || 0;\n        }\n        \n        if (currentSort.direction === 'asc') {\n          return aVal > bVal ? 1 : -1;\n        } else {\n          return aVal < bVal ? 1 : -1;\n        }\n      });\n    }\n    \n    renderRows(filtered);\n    updateSelectAllState();\n  }\n\n  // 全選択チェックボックスの状態更新\n  function updateSelectAllState() {\n    const selectAll = container.querySelector('#select-all');\n    const checkboxes = container.querySelectorAll('.row-checkbox:not([disabled])');\n    const checkedBoxes = container.querySelectorAll('.row-checkbox:checked');\n    \n    if (checkboxes.length === 0) {\n      selectAll.indeterminate = false;\n      selectAll.checked = false;\n    } else if (checkedBoxes.length === checkboxes.length) {\n      selectAll.indeterminate = false;\n      selectAll.checked = true;\n    } else if (checkedBoxes.length > 0) {\n      selectAll.indeterminate = true;\n      selectAll.checked = false;\n    } else {\n      selectAll.indeterminate = false;\n      selectAll.checked = false;\n    }\n  }\n\n  // 催促通知送信処理\n  async function sendNotification(applicationIds, isBulk = false) {\n    const modal = container.querySelector('#notify-modal');\n    const content = container.querySelector('#notify-content');\n    \n    const applications = allDelayedApplications.filter(app => applicationIds.includes(app.申請書類ID));\n    const validApplications = applications.filter(app => app.承認者メール && app.承認者メール.trim() !== '');\n    \n    if (validApplications.length === 0) {\n      showError('承認者のメールアドレスが設定されていないため、催促通知を送信できません');\n      return;\n    }\n    \n    if (isBulk) {\n      content.innerHTML = `\n        <p>以下の${validApplications.length}件の申請について催促通知を送信します：</p>\n        <ul style=\"margin: 8px 0; padding-left: 20px; max-height: 200px; overflow-y: auto;\">\n          ${validApplications.map(app => `<li>${app.申請者名} - ${app.申請タイトル || '申請書類'}</li>`).join('')}\n        </ul>\n      `;\n    } else {\n      const app = validApplications[0];\n      content.innerHTML = `\n        <p>以下の申請について催促通知を送信します：</p>\n        <div style=\"background: var(--bg-main); padding: 12px; border-radius: 6px; margin: 8px 0;\">\n          <div><strong>申請者：</strong> ${app.申請者名}</div>\n          <div><strong>申請内容：</strong> ${app.申請タイトル || '申請書類'}</div>\n          <div><strong>承認者：</strong> ${app.承認者名}</div>\n          <div><strong>遅延日数：</strong> ${app.遅延日数}日</div>\n        </div>\n      `;\n    }\n    \n    modal.style.display = 'flex';\n    \n    return new Promise((resolve) => {\n      const confirmBtn = container.querySelector('#btn-confirm-notify');\n      const cancelBtn = container.querySelector('#btn-cancel-notify');\n      \n      const handleConfirm = async () => {\n        modal.style.display = 'none';\n        \n        try {\n          // 通知履歴に記録\n          for (const app of validApplications) {\n            const notificationData = {\n              申請書類ID: app.申請書類ID,\n              通知対象ユーザーID: app.現在承認者ID,\n              通知種別: '催促通知',\n              通知タイトル: `【催促】申請の承認をお願いします - ${app.申請タイトル || '申請書類'}`,\n              通知内容: `申請者：${app.申請者名}\\n申請日：${new Date(app.作成日時).toLocaleDateString('ja-JP')}\\n遅延日数：${app.遅延日数}日\\n\\n承認処理をお願いいたします。`,\n              送信方法: 'メール',\n              送信先アドレス: app.承認者メール,\n              送信状態: '送信完了',\n              送信日時: new Date().toISOString(),\n              既読フラグ: false,\n              再送回数: 0,\n              作成者ID: 'current-user-id'\n            };\n            \n            await window.aivicApi.save(5, notificationData); // 通知履歴テーブル\n          }\n          \n          showSuccess(`催促通知を${validApplications.length}件送信しました`);\n          \n          // チェックボックスをクリア\n          container.querySelectorAll('.row-checkbox:checked').forEach(cb => cb.checked = false);\n          updateSelectAllState();\n          \n        } catch (error) {\n          showError('催促通知の送信に失敗しました: ' + error.message);\n        }\n        \n        cleanup();\n        resolve();\n      };\n      \n      const handleCancel = () => {\n        modal.style.display = 'none';\n        cleanup();\n        resolve();\n      };\n      \n      const cleanup = () => {\n        confirmBtn.removeEventListener('click', handleConfirm);\n        cancelBtn.removeEventListener('click', handleCancel);\n      };\n      \n      confirmBtn.addEventListener('click', handleConfirm);\n      cancelBtn.addEventListener('click', handleCancel);\n    });\n  }\n\n  // エラーメッセージ表示\n  function showError(message) {\n    const errorDiv = container.querySelector('#error-message');\n    errorDiv.textContent = message;\n    errorDiv.style.display = 'block';\n    setTimeout(() => errorDiv.style.display = 'none', 5000);\n  }\n\n  // 成功メッセージ表示\n  function showSuccess(message) {\n    const successDiv = container.querySelector('#success-message');\n    successDiv.textContent = message;\n    successDiv.style.display = 'block';\n    setTimeout(() => successDiv.style.display = 'none', 3000);\n  }\n\n  // CSVエクスポート\n  function exportToCSV() {\n    const headers = ['申請書類番号', '申請者名', '文書種別', '申請日', '承認ステップ', '承認者名', '遅延日数', '緊急度レベル'];\n    const csvContent = [\n      '\\uFEFF' + headers.join(','),\n      ...allDelayedApplications.map(row => [\n        `\"${row.申請書類ID}\"`,\n        `\"${row.申請者名}\"`,\n        `\"${row.文書種別名}\"`,\n        `\"${new Date(row.作成日時).toLocaleDateString('ja-JP')}\"`,\n        `\"ステップ${row.承認ステップ番号}\"`,\n        `\"${row.承認者名}\"`,\n        row.遅延日数,\n        urgencyLevels[row.緊急度レベル]?.text || '不明'\n      ].join(','))\n    ].join('\\n');\n    \n    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });\n    const link = document.createElement('a');\n    link.href = URL.createObjectURL(blob);\n    link.download = `遅延申請一覧_${new Date().toISOString().split('T')[0]}.csv`;\n    link.click();\n  }\n\n  // 初期データ読み込み\n  async function loadData() {\n    try {\n      // 最新データを取得\n      const [applications, users, documentTypes, , approvalSteps] = await Promise.all([\n        window.aivicApi.list(0), // 申請書類\n        window.aivicApi.list(1), // ユーザー\n        window.aivicApi.list(2), // 文書種別マスタ\n        Promise.resolve([]), // 承認フロー定義（使用しない）\n        window.aivicApi.list(4)  // 承認ステップ\n      ]);\n      \n      // tablesを更新\n      tables[0] = { ...tables[0], records: applications || [] };\n      tables[1] = { ...tables[1], records: users || [] };\n      tables[2] = { ...tables[2], records: documentTypes || [] };\n      tables[4] = { ...tables[4], records: approvalSteps || [] };\n      \n      allDelayedApplications = getDelayedApplications();\n      filterApplications();\n    } catch (error) {\n      console.error('データ読み込みエラー:', error);\n      allDelayedApplications = getDelayedApplications();\n      filterApplications();\n    }\n  }\n\n  // イベントリスナー設定\n  \n  // 検索ボタン\n  container.querySelector('#btn-search').addEventListener('click', filterApplications);\n  \n  // リアルタイム検索\n  container.querySelector('#input-search').addEventListener('input', filterApplications);\n  container.querySelector('#urgency-filter').addEventListener('change', filterApplications);\n  container.querySelector('#delay-days-filter').addEventListener('input', filterApplications);\n  \n  // ソート機能\n  container.querySelector('#sort-delay-days').addEventListener('click', () => {\n    const icon = container.querySelector('#sort-icon');\n    if (currentSort.field === '遅延日数' && currentSort.direction === 'asc') {\n      currentSort.direction = 'desc';\n      icon.textContent = '↓';\n    } else {\n      currentSort.field = '遅延日数';\n      currentSort.direction = 'asc';\n      icon.textContent = '↑';\n    }\n    filterApplications();\n  });\n  \n  // 全選択チェックボックス\n  container.querySelector('#select-all').addEventListener('change', (e) => {\n    const checkboxes = container.querySelectorAll('.row-checkbox:not([disabled])');\n    checkboxes.forEach(cb => cb.checked = e.target.checked);\n  });\n  \n  // 一括催促送信\n  container.querySelector('#btn-bulk-notify').addEventListener('click', async () => {\n    const checkedBoxes = container.querySelectorAll('.row-checkbox:checked');\n    if (checkedBoxes.length === 0) {\n      showError('催促通知を送信する申請を選択してください');\n      return;\n    }\n    \n    const applicationIds = Array.from(checkedBoxes).map(cb => cb.dataset.id);\n    await sendNotification(applicationIds, true);\n  });\n  \n  // CSVエクスポート\n  container.querySelector('#btn-export-csv').addEventListener('click', exportToCSV);\n  \n  // 行レベル操作（個別催促送信）\n  container.addEventListener('click', async (e) => {\n    const notifyBtn = e.target.closest('.notify-btn');\n    if (notifyBtn && !notifyBtn.disabled) {\n      const applicationId = notifyBtn.dataset.id;\n      await sendNotification([applicationId], false);\n    }\n  });\n  \n  // 初期データ読み込み\n  loadData();\n}";
</script>

      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");

    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
