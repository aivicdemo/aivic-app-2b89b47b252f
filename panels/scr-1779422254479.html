<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ハイブリッド申請承認システム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-main: #ffffff;
            --bg-card: #f8fafc;
            --bg-sidebar: #f1f5f9;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-muted: #64748b;
            --text-light: #94a3b8;
            --top-bar-bg: #ffffff;
            --top-bar-border: #e2e8f0;
            --success: #059669;
            --warning: #d97706;
            --danger: #dc2626;
            --radius: 8px;
            --radius-sm: 6px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 13px;
            line-height: 1.4;
            color: var(--text);
            background: var(--bg-main);
        }

        .app-layout {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--top-bar-bg);
        }

        .logo {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }

        .nav-section {
            padding: 12px 0;
        }

        .nav-section-title {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0 16px 8px;
        }

        .nav-item {
            display: block;
            padding: 6px 16px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .nav-item:hover {
            background: rgba(59, 130, 246, 0.08);
            color: var(--primary);
        }

        .nav-item.aivic-active {
            background: rgba(59, 130, 246, 0.12);
            color: var(--primary);
            font-weight: 500;
            border-right: 2px solid var(--primary);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            height: 52px;
            background: var(--top-bar-bg);
            border-bottom: 1px solid var(--top-bar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .breadcrumb {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 500;
        }

        .logout-link {
            font-size: 12px;
            color: var(--text-muted);
            text-decoration: none;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            transition: background 0.15s ease;
        }

        .logout-link:hover {
            background: var(--bg-card);
        }

        .content-area {
            flex: 1;
            overflow: auto;
            padding: 16px 20px;
        }

        .panel-container {
            height: 100%;
            background: var(--bg-main);
        }

        .status-indicator {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .status-pending { background: var(--warning); }
        .status-approved { background: var(--success); }
        .status-rejected { background: var(--danger); }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .badge-primary {
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary);
        }

        .badge-success {
            background: rgba(5, 150, 105, 0.1);
            color: var(--success);
        }

        .badge-warning {
            background: rgba(217, 119, 6, 0.1);
            color: var(--warning);
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            margin-bottom: 12px;
        }

        .card-header {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
            background: var(--bg-main);
            color: var(--text);
        }

        .btn:hover {
            background: var(--bg-card);
            border-color: var(--primary);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .table th,
        .table td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .table th {
            font-weight: 500;
            color: var(--text-muted);
            background: var(--bg-card);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .table tbody tr:hover {
            background: rgba(59, 130, 246, 0.02);
        }

        .loading-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--text-light);
            font-size: 12px;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            
            .content-area {
                padding: 12px 16px;
            }
        }
    </style>

window.AIVIC_PAGE_INIT_JS = "js\nfunction(container, apiUrl, tables) {\n  // 業務ロジックのインポート\n  const { \n    validateApplicationInput, \n    validateApplicationAmountAndPeriod, \n    determineApprovalHierarchy, \n    processUrgentApplicationPriority,\n    checkApprovalStatusViewPermission,\n    getProgressDataWithAccessControl,\n    identifyStagnantApplications\n  } = window.businessLogic || {};\n\n  let selectedApplicationId = null;\n  let currentApplications = [];\n  let currentApprovalHistory = [];\n\n  // ユーティリティ関数\n  function formatDate(dateStr) {\n    if (!dateStr) return '';\n    const date = new Date(dateStr);\n    return date.toLocaleDateString('ja-JP');\n  }\n\n  function formatDateTime(dateStr) {\n    if (!dateStr) return '';\n    const date = new Date(dateStr);\n    return date.toLocaleString('ja-JP');\n  }\n\n  function getStatusColor(status) {\n    const colors = {\n      '承認待ち': { bg: 'rgba(59,130,246,0.15)', text: '#3b82f6' },\n      '承認済み': { bg: 'rgba(34,197,94,0.15)', text: '#22c55e' },\n      '差戻し': { bg: 'rgba(239,68,68,0.15)', text: '#ef4444' },\n      '保留中': { bg: 'rgba(245,158,11,0.15)', text: '#f59e0b' }\n    };\n    return colors[status] || { bg: 'rgba(156,163,175,0.15)', text: '#9ca3af' };\n  }\n\n  // 申請書類一覧の描画\n  function renderApplicationsList(applications) {\n    const listContainer = container.querySelector('#applications-list');\n    if (!applications || applications.length === 0) {\n      listContainer.innerHTML = `\n        <div style=\"text-align: center; padding: 20px; color: var(--text-muted); font-size: 12px;\">\n          承認待ちの申請はありません\n          <div style=\"margin-top: 10px;\">\n            <div>申請書類詳細</div>\n            <div>申請者</div>\n            <div>申請日時</div>\n            <div>申請種別</div>\n          </div>\n        </div>`;\n      return;\n    }\n\n    listContainer.innerHTML = applications.map(app => {\n      const isSelected = selectedApplicationId === app.id;\n      const statusColor = getStatusColor(app.承認状態);\n      \n      return `\n        <div class=\"application-item\" data-id=\"${app.id}\" \n             style=\"padding: 10px; border: 1px solid ${isSelected ? 'var(--primary)' : 'rgba(255,255,255,0.1)'}; \n                    border-radius: 6px; cursor: pointer; background: ${isSelected ? 'rgba(var(--primary-rgb), 0.05)' : 'rgba(0,0,0,0.1)'}; \n                    transition: all 0.15s; margin-bottom: 8px;\">\n          <div style=\"display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;\">\n            <div style=\"font-size: 12px; font-weight: 500; color: var(--text); overflow: hidden; text-overflow: ellipsis;\">${app.申請タイトル || ''}</div>\n            ${app.緊急フラグ ? '<span style=\"font-size: 10px; padding: 2px 4px; background: rgba(220,38,38,0.15); color: #dc2626; border-radius: 3px;\">緊急</span>' : ''}\n          </div>\n          <div style=\"font-size: 11px; color: var(--text-muted); margin-bottom: 4px;\">申請書類詳細: ${app.申請種別 || ''}</div>\n          <div style=\"font-size: 11px; color: var(--text-muted); margin-bottom: 4px;\">申請者: ${app.申請者名 || ''}</div>\n          <div style=\"font-size: 11px; color: var(--text-muted); margin-bottom: 4px;\">申請日時: ${formatDateTime(app.作成日時)}</div>\n          <div style=\"font-size: 11px; color: var(--text-muted); margin-bottom: 4px;\">申請種別: ${app.申請種別 || ''}</div>\n          <div style=\"display: flex; align-items: center; justify-content: space-between;\">\n            <span style=\"font-size: 10px; padding: 2px 6px; background: ${statusColor.bg}; color: ${statusColor.text}; border-radius: 3px;\">${app.承認状態}</span>\n            <span style=\"font-size: 10px; color: var(--text-muted);\">${formatDate(app.作成日時)}</span>\n          </div>\n        </div>\n      `;\n    }).join('');\n\n    // 申請項目クリックイベント\n    listContainer.querySelectorAll('.application-item').forEach(item => {\n      item.addEventListener('click', () => {\n        selectedApplicationId = item.dataset.id;\n        renderApplicationsList(currentApplications);\n        loadApplicationDetail(selectedApplicationId);\n      });\n    });\n  }\n\n  // 申請詳細の描画\n  function renderApplicationDetail(application) {\n    const detailContainer = container.querySelector('#application-detail');\n    if (!application) {\n      detailContainer.innerHTML = '<div style=\"text-align: center; padding: 40px; color: var(--text-muted);\">申請を選択してください</div>';\n      return;\n    }\n\n    const statusColor = getStatusColor(application.承認状態);\n    \n    detailContainer.innerHTML = `\n      <div style=\"padding: 16px;\">\n        <div style=\"display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;\">\n          <h3 id=\"detail-title\" style=\"font-size: 16px; font-weight: 600; margin: 0; color: var(--text);\">${application.申請タイトル || ''}</h3>\n          <span id=\"status-badge\" style=\"padding: 4px 8px; background: ${statusColor.bg}; color: ${statusColor.text}; border-radius: 4px; font-size: 12px;\">${application.承認状態}</span>\n        </div>\n        \n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;\">\n          <div>\n            <label style=\"font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 4px;\">申請者</label>\n            <div id=\"applicant-name\" style=\"font-size: 14px; color: var(--text);\">${application.申請者名 || ''}</div>\n          </div>\n          <div>\n            <label style=\"font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 4px;\">申請日時</label>\n            <div id=\"application-date\" style=\"font-size: 14px; color: var(--text);\">${formatDateTime(application.作成日時)}</div>\n          </div>\n          <div>\n            <label style=\"font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 4px;\">申請種別</label>\n            <div id=\"application-type\" style=\"font-size: 14px; color: var(--text);\">${application.申請種別 || ''}</div>\n          </div>\n          <div>\n anger\" style=\"flex: 1;\">差戻し</button>\n          <button id=\"btn-hold\" class=\"action-btn secondary\" style=\"flex: 1;\">保留</button>\n        </div>\n\n        <div id=\"approval-flow\" style=\"margin-bottom: 24px;\">\n          <h4 style=\"font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--text);\">承認フロー進捗</h4>\n          <div style=\"display: flex; align-items: center; gap: 8px;\">\n            ${renderApprovalFlow(application)}\n          </div>\n        </div>\n\n        <div data-testid=\"approval-history\">\n          <h4 style=\"font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--text);\">承認履歴</h4>\n          <div style=\"overflow-x: auto;\">\n            <table style=\"width: 100%; border-collapse: collapse;\">\n              <thead>\n                <tr style=\"background: rgba(0,0,0,0.1);\">\n                  <th style=\"padding: 8px; text-align: left; font-size: 12px; color: var(--text-muted); border-bottom: 1px solid rgba(255,255,255,0.1);\">承認者</th>\n                  <th style=\"padding: 8px; text-align: left; font-size: 12px; color: var(--text-muted); border-bottom: 1px solid rgba(255,255,255,0.1);\">結果</th>\n                  <th style=\"padding: 8px; text-align: left; font-size: 12px; color: var(--text-muted); border-bottom: 1px solid rgba(255,255,255,0.1);\">日時</th>\n                  <th style=\"padding: 8px; text-align: left; font-size: 12px; color: var(--text-muted); border-bottom: 1px solid rgba(255,255,255,0.1);\">コメント</th>\n                </tr>\n              </thead>\n              <tbody id=\"approval-history-tbody\">\n                ${renderApprovalHistory(currentApprovalHistory)}\n              </tbody>\n            </table>\n          </div>\n        </div>\n      </div>\n    `;\n\n    // イベントリスナーの設定\n    setupApprovalButtons();\n  }\n\n  function renderApprovalFlow(application) {\n    if (!determineApprovalHierarchy) return '<div>承認フロー情報を取得できません</div>';\n    \n    try {\n      const hierarchy = determineApprovalHierarchy({\n        申請種別: application.申請種別,\n        申請金額: application.申請金額,\n        緊急フラグ: application.緊急フラグ\n      });\n      \n      return hierarchy.map((step, index) => {\n        const isCompleted = step.承認状態 === '承認済み';\n        const isCurrent = step.承認状態 === '承認待ち';\n        const isPending = step.承認状態 === '未処理';\n        \n        return `\n          <div style=\"display: flex; flex-direction: column; align-items: center; min-width: 100px;\">\n            <div style=\"width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; \n                        background: ${isCompleted ? '#22c55e' : isCurrent ? '#3b82f6' : '#9ca3af'}; color: white; font-size: 12px; margin-bottom: 4px;\">\n              ${index + 1}\n            </div>\n            <div style=\"font-size: 10px; color: var(--text); text-align: center; margin-bottom: 2px;\">${step.承認者名}</div>\n            <div style=\"font-size: 9px; color: var(--text-muted); text-align: center;\">${step.役職}</div>\n          </div>\n          ${index < hierarchy.length - 1 ? '<div style=\"flex: 1; height: 2px; background: #9ca3af; margin: 16px 8px 0 8px;\"></div>' : ''}\n        `;\n      }).join('');\n    } catch (error) {\n      return '<div>承認フロー情報の取得に失敗しました</div>';\n    }\n  }\n\n  function renderApprovalHistory(history) {\n    if (!history || history.length === 0) {\n      return '<tr><td colspan=\"4\" style=\"padding: 16px; text-align: center; color: var(--text-muted); font-size: 12px;\">承認履歴はありません</td></tr>';\n    }\n\n    return history.map(record => `\n      <tr>\n        <td style=\"padding: 8px; font-size: 12px; color: var(--text); border-bottom: 1px solid rgba(255,255,255,0.05);\">${record.承認者名}</td>\n        <td style=\"padding: 8px; font-size: 12px; border-bottom: 1px solid rgba(255,255,255,0.05);\">\n          <span style=\"padding: 2px 6px; background: ${getStatusColor(record.承認結果).bg}; color: ${getStatusColor(record.承認結果).text}; border-radius: 3px; font-size: 10px;\">\n            ${record.承認結果}\n          </span>\n        </td>\n        <td style=\"padding: 8px; font-size: 12px; color: var(--text); border-bottom: 1px solid rgba(255,255,255,0.05);\">${formatDateTime(record.承認日時)}</td>\n        <td style=\"padding: 8px; font-size: 12px; color: var(--text); border-bottom: 1px solid rgba(255,255,255,0.05);\">${record.コメント || ''}</td>\n      </tr>\n    `).join('');\n  }\n\n  // 承認ボタンのイベント設定\n  function setupApprovalButtons() {\n    const approveBtn = container.querySelector('#btn-approve');\n    const rejectBtn = container.querySelector('#btn-reject');\n    const holdBtn = container.querySelector('#btn-hold');\n\n    if (approveBtn) {\n      approveBtn.addEventListener('click', () => handleApproval('承認'));\n    }\n    if (rejectBtn) {\n      rejectBtn.addEventListener('click', () => handleApproval('差戻し'));\n    }\n    if (holdBtn) {\n      holdBtn.addEventListener('click', () => handleApproval('保留'));\n    }\n  }\n\n  // 承認処理\n  function handleApproval(action) {\n    const comment = container.querySelector('#approval-comment')?.value || '';\n    \n    if (action === '差戻し' || action === '保留') {\n      showRejectionModal(action, comment);\n    } else {\n      showConfirmModal(action, comment);\n    }\n  }\n\n  // 確認モーダル表示\n  function showConfirmModal(action, comment) {\n    const modal = document.createElement('div');\n    modal.style.cssText = `\n      position: fixed; top: 0; left: 0; width: 100%; height: 100%; \n      background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000;\n    `;\n    \n    modal.innerHTML = `\n      <div style=\"background: var(--bg-secondary); padding: 24px; border-radius: 8px; max-width: 400px; width: 90%;\">\n        <h3 style=\"margin: 0 0 16px 0; color: var(--text);\">${action}確認</h3>\n        <p style=\"margin: 0 0 16px 0; color: var(--text);\">この申請を${action}しますか？</p>\n        <div style=\"display: flex; gap: 8px; justify-content: flex-end;\">\n          <button id=\"modal-cancel\" class=\"action-btn secondary\">キャンセル</button>\n          <button id=\"modal-confirm\" class=\"action-btn primary\">${action}</button>\n        </div>\n      </div>\n    `;\n\n    document.body.appendChild(modal);\n\n    modal.querySelector('#modal-cancel').addEventListener('click', () => {\n      document.body.removeChild(modal);\n    });\n\n    modal.querySelector('#modal-confirm').addEventListener('click', () => {\n      document.body.removeChild(modal);\n      processApproval(action, comment);\n    });\n  }\n\n  // 差戻し・保留モーダル表示\n  function showRejectionModal(action, comment) {\n    const modal = document.createElement('div');\n    modal.style.cssText = `\n      position: fixed; top: 0; left: 0; width: 100%; height: 100%; \n      background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000;\n    `;\n    \n    modal.innerHTML = `\n      <div style=\"background: var(--bg-secondary); padding: 24px; border-radius: 8px; max-width: 400px; width: 90%;\">\n        <h3 style=\"margin: 0 0 16px 0; color: var(--text);\">${action}理由入力</h3>\n        <textarea id=\"rejection-reason\" style=\"width: 100%; height: 100px; padding: 8px; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; background: rgba(0,0,0,0.1); color: var(--text); resize: vertical; margin-bottom: 16px;\" placeholder=\"${action}理由を入力してください\">${comment}</textarea>\n        <div style=\"display: flex; gap: 8px; justify-content: flex-end;\">\n          <button id=\"modal-cancel\" class=\"action-btn secondary\">キャンセル</button>\n          <button id=\"modal-confirm\" class=\"action-btn danger\">${action}</button>\n        </div>\n      </div>\n    `;\n\n    document.body.appendChild(modal);\n\n    modal.querySelector('#modal-cancel').addEventListener('click', () => {\n      document.body.removeChild(modal);\n    });\n\n    modal.querySelector('#modal-confirm').addEventListener('click', () => {\n      const reason = modal.querySelector('#rejection-reason').value;\n      document.body.removeChild(modal);\n      processApproval(action, reason);\n    });\n  }\n\n  // 承認処理実行\n  async function processApproval(action, comment) {\n    try {\n      const application = currentApplications.find(app => app.id === selectedApplicationId);\n      if (!application) {\n        window.aivicNotify?.error('申請情報が見つかりません');\n        return;\n      }\n\n      // 業務ロジックによる検証\n      if (validateApplicationInput) {\n        const validation = validateApplicationInput({\n          申請タイトル: application.申請タイトル,\n          申請内容: application.申請内容,\n          申請種別: application.申請種別\n        });\n        if (!validation.isValid) {\n          window.aivicNotify?.error(`入力検証エラー: ${validation.errors.join(', ')}`);\n          return;\n        }\n      }\n\n      // 緊急申請の優先処理\n      if (application.緊急フラグ && processUrgentApplicationPriority) {\n        const urgentResult = processUrgentApplicationPriority({\n          申請ID: application.id,\n          緊急レベル: application.緊急レベル || 'high'\n        });\n        if (!urgentResult.success) {\n          window.aivicNotify?.error('緊急申請の処理に失敗しました');\n          return;\n        }\n      }\n\n      // 承認処理をAPIに送信\n      const result = await window.aivicApi.update('applications', selectedApplicationId, {\n        承認状態: action === '承認' ? '承認済み' : action === '差戻し' ? '差戻し' : '保留中',\n        承認コメント: comment,\n        承認日時: new Date().toISOString(),\n        承認者ID: 'current_user' // 実際のユーザーIDを設定\n      });\n\n      if (result.success) {\n        window.aivicNotify?.success(`${action}処理が完了しました`);\n        \n        // 状態バッジを更新\n        const statusBadge = container.querySelector('#status-badge');\n        if (statusBadge) {\n          const newStatus = action === '承認' ? '承認済み' : action === '差戻し' ? '差戻し' : '保留中';\n          const statusColor = getStatusColor(newStatus);\n          statusBadge.textContent = newStatus;\n          statusBadge.style.background = statusColor.bg;\n          statusBadge.style.color = statusColor.text;\n        }\n\n        // 申請一覧を更新\n        await loadApplicationsList();\n        \n        // 承認履歴を更新\n        await loadApprovalHistory(selectedApplicationId);\n        \n      } else {\n        window.aivicNotify?.error('処理に失敗しました');\n      }\n    } catch (error) {\n      console.error('承認処理エラー:', error);\n      window.aivicNotify?.error('処理中にエラーが発生しました');\n    }\n  }\n\n  // 申請一覧読み込み\n  async function loadApplicationsList() {\n    try {\n      // 権限チェック\n      if (checkApprovalStatusViewPermission) {\n        const permission = checkApprovalStatusViewPermission({\n          ユーザーID: 'current_user',\n          役職: 'approver'\n        });\n        if (!permission.hasAccess) {\n          window.aivicNotify?.error('承認画面へのアクセス権限がありません');\n          return;\n        }\n      }\n\n      const result = await window.aivicApi.list('applications', {\n        承認状態: '承認待ち',\n        承認者ID: 'current_user'\n      });\n\n      if (result.success) {\n        currentApplications = result.data || [];\n        \n        // 滞留申請の識別\n        if (identifyStagnantApplications) {\n          const stagnantApps = identifyStagnantApplications({\n            applications: currentApplications,\n            thresholdDays: 3\n          });\n          \n          // 滞留申請にマークを付ける\n          currentApplications = currentApplications.map(app => ({\n            ...app,\n            isStagnant: stagnantApps.some(stagnant => stagnant.申請ID === app.id)\n          }));\n        }\n\n        renderApplicationsList(currentApplications);\n      } else {\n        window.aivicNotify?.error('申請一覧の取得に失敗しました');\n      }\n    } catch (error) {\n      console.error('申請一覧読み込みエラー:', error);\n      window.aivicNotify?.error('申請一覧の読み込み中にエラーが発生しました');\n    }\n  }\n\n  // 申請詳細読み込み\n  async function loadApplicationDetail(applicationId) {\n    try {\n      const result = await window.aivicApi.list('applications', { id: applicationId });\n      \n      if (result.success && result.data.length > 0) {\n        const application = result.data[0];\n        renderApplicationDetail(application);\n        await loadApprovalHistory(applicationId);\n      } else {\n        window.aivicNotify?.error('申請詳細の取得に失敗しました');\n      }\n    } catch (error) {\n      console.error('申請詳細読み込みエラー:', error);\n      window.aivicNotify?.error('申請詳細の読み込み中にエラーが発生しました');\n    }\n  }\n\n  // 承認履歴読み込み\n  async function loadApprovalHistory(applicationId) {\n    try {\n      // 進捗データのアクセス制御\n      if (getProgressDataWithAccessControl) {\n        const progressData = getProgressDataWithAccessControl({\n          申請ID: applicationId,\n          ユーザーID: 'current_user',\n          アクセスレベル: 'approver'\n        });\n        \n        if (progressData.success) {\n          currentApprovalHistory = progressData.data || [];\n        }\n      } else {\n        const result = await window.aivicApi.list('approval_history', { 申請ID: applicationId });\n        if (result.success) {\n          currentApprovalHistory = result.data || [];\n        }\n      }\n\n      // 承認履歴テーブルを更新\n      const historyTbody = container.querySelector('#approval-history-tbody');\n      if (historyTbody) {\n        historyTbody.innerHTML = renderApprovalHistory(currentApprovalHistory);\n      }\n    } catch (error) {\n      console.error('承認履歴読み込みエラー:', error);\n    }\n  }\n\n  // 初期化処理\n  async function initialize() {\n    // 更新ボタンのイベント設定\n    const refreshBtn = container.querySelector('#btn-refresh');\n    if (refreshBtn) {\n      refreshBtn.addEventListener('click', loadApplicationsList);\n    }\n\n    // 初期データ読み込み\n    await loadApplicationsList();\n    \n    // 最初の申請を自動選択\n    if (currentApplications.length > 0) {\n      selectedApplicationId = currentApplications[0].id;\n      renderApplicationsList(currentApplications);\n      await loadApplicationDetail(selectedApplicationId);\n    }\n  }\n\n  // 初期化実行\n  initialize();\n}";

    <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();
