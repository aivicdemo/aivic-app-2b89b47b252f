<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ハイブリッド申請承認システム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-main: #ffffff;
            --bg-card: #f8fafc;
            --bg-sidebar: #f1f5f9;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-muted: #64748b;
            --text-light: #94a3b8;
            --top-bar-bg: #ffffff;
            --top-bar-border: #e2e8f0;
            --success: #059669;
            --warning: #d97706;
            --danger: #dc2626;
            --radius: 8px;
            --radius-sm: 6px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 13px;
            line-height: 1.4;
            color: var(--text);
            background: var(--bg-main);
        }

        .app-layout {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--top-bar-bg);
        }

        .logo {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }

        .nav-section {
            padding: 12px 0;
        }

        .nav-section-title {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0 16px 8px;
        }

        .nav-item {
            display: block;
            padding: 6px 16px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .nav-item:hover {
            background: rgba(59, 130, 246, 0.08);
            color: var(--primary);
        }

        .nav-item.aivic-active {
            background: rgba(59, 130, 246, 0.12);
            color: var(--primary);
            font-weight: 500;
            border-right: 2px solid var(--primary);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            height: 52px;
            background: var(--top-bar-bg);
            border-bottom: 1px solid var(--top-bar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .breadcrumb {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 500;
        }

        .logout-link {
            font-size: 12px;
            color: var(--text-muted);
            text-decoration: none;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            transition: background 0.15s ease;
        }

        .logout-link:hover {
            background: var(--bg-card);
        }

        .content-area {
            flex: 1;
            overflow: auto;
            padding: 16px 20px;
        }

        .panel-container {
            height: 100%;
            background: var(--bg-main);
        }

        .status-indicator {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .status-pending { background: var(--warning); }
        .status-approved { background: var(--success); }
        .status-rejected { background: var(--danger); }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .badge-primary {
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary);
        }

        .badge-success {
            background: rgba(5, 150, 105, 0.1);
            color: var(--success);
        }

        .badge-warning {
            background: rgba(217, 119, 6, 0.1);
            color: var(--warning);
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            margin-bottom: 12px;
        }

        .card-header {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
            background: var(--bg-main);
            color: var(--text);
        }

        .btn:hover {
            background: var(--bg-card);
            border-color: var(--primary);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .table th,
        .table td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .table th {
            font-weight: 500;
            color: var(--text-muted);
            background: var(--bg-card);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .table tbody tr:hover {
            background: rgba(59, 130, 246, 0.02);
        }

        .loading-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--text-light);
            font-size: 12px;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            
            .content-area {
                padding: 12px 16px;
            }
        }
    </style>

window.AIVIC_PAGE_INIT_JS = "js\nfunction(container, apiUrl, tables) {\n  // 業務ロジックのインポート（実際の環境では適切にインポート）\n  const {\n    validateApplicationInput,\n    classifyDocumentTypeAndRoute,\n    determineDocumentTypeAndRoute,\n    setApproverAuthorityLevel,\n    determineApprovalHierarchy,\n    setApprovalDeadline,\n    processUrgentApplicationPriority\n  } = window.businessLogic || {};\n\n  let approvalSteps = [];\n  let selectedUserId = null;\n  let users = [];\n  let currentFlowName = '';\n\n  // ユーザーデータを取得\n  async function loadUsers() {\n    try {\n      const userTable = tables.find(t => t.tableName === 'ユーザー');\n      if (userTable) {\n        users = userTable.records || [];\n      } else {\n        users = await window.aivicApi.list(0) || [];\n      }\n      renderUserList();\n    } catch (error) {\n      window.aivicNotify.error('ユーザーデータの取得に失敗しました');\n    }\n  }\n\n  // 承認者一覧テーブルを再描画\n  function renderApproverList() {\n    const tbody = container.querySelector('#approver-tbody');\n    if (!tbody) return;\n    \n    tbody.innerHTML = approvalSteps.map((step, index) => `\n      <tr data-id=\"${index}\">\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text); border-bottom: 1px solid var(--border);\">${step.stepNumber}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text); border-bottom: 1px solid var(--border);\">${step.approverName}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text); border-bottom: 1px solid var(--border);\">${step.position || ''}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text); border-bottom: 1px solid var(--border);\">${step.required ? '必須' : '任意'}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text); border-bottom: 1px solid var(--border);\">${step.parallel ? 'あり' : 'なし'}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text); border-bottom: 1px solid var(--border);\">${step.proxyAllowed ? '許可' : '不許可'}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text); border-bottom: 1px solid var(--border);\">\n          <button class=\"action-btn secondary delete-step-btn\" data-id=\"${index}\" style=\"background: transparent; color: var(--text); border: 1px solid rgba(255,255,255,0.18); padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer;\">削除</button>\n        </td>\n      </tr>\n    `).join('');\n\n    // 削除ボタンのイベントリスナーを追加\n    tbody.querySelectorAll('.delete-step-btn').forEach(btn => {\n      btn.addEventListener('click', (e) => {\n        const stepIndex = parseInt(e.target.dataset.id);\n        approvalSteps.splice(stepIndex, 1);\n        // ステップ番号を再調整\n        approvalSteps.forEach((step, index) => {\n          step.stepNumber = index + 1;\n        });\n        renderApproverList();\n      });\n    });\n  }\n\n  // ユーザー一覧を表示\n  function renderUserList(userList = users) {\n    const tbody = container.querySelector('#user-list-tbody');\n    if (!tbody) return;\n    \n    tbody.innerHTML = userList.map(user => `\n      <tr data-user-id=\"${user.ユーザーID || user.id}\">\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text); border-bottom: 1px solid var(--border);\">\n          <input type=\"radio\" name=\"selected-user\" value=\"${user.ユーザーID || user.id}\" style=\"accent-color: var(--primary);\">\n        </td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text); border-bottom: 1px solid var(--border);\">${user.ユーザー名 || user.name || ''}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text); border-bottom: 1px solid var(--border);\">${user.所属部署 || user.department || ''}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text); border-bottom: 1px solid var(--border);\">${user.役職 || user.position || ''}</td>\n      </tr>\n    `).join('');\n\n    // ラジオボタンの選択イベント\n    tbody.querySelectorAll('input[name=\"selected-user\"]').forEach(radio => {\n      radio.addEventListener('change', (e) => {\n        selectedUserId = e.target.value;\n      });\n    });\n  }\n\n  // 文書種別選択の処理\n  function handleDocumentTypeChange() {\n    const select = container.querySelector('[data-testid=\"document-type-select\"]');\n    if (!select) return;\n\n    select.addEventListener('change', async (e) => {\n      const documentType = e.target.value;\n      if (!documentType) return;\n\n      try {\n        // 業務ロジックで文書種別に応じたルートを決定\n        if (classifyDocumentTypeAndRoute) {\n          const routeInfo = classifyDocumentTypeAndRoute({\n            documentType: documentType,\n            amount: 0,\n            urgency: 'normal'\n          });\n          \n          if (routeInfo && routeInfo.recommendedApprovers) {\n            // 推奨承認者を承認ステップに追加\n            routeInfo.recommendedApprovers.forEach((approver, index) => {\n              approvalSteps.push({\n                stepNumber: index + 1,\n                approverId: approver.id,\n                approverName: approver.name,\n                position: approver.position,\n                required: true,\n                parallel: false,\n                proxyAllowed: true\n              });\n            });\n            renderApproverList();\n          }\n        }\n      } catch (error) {\n        window.aivicNotify.error('文書種別の処理に失敗しました');\n      }\n    });\n  }\n\n  // 承認ステップ追加の処理\n  function handleAddApprovalStep() {\n    const addBtn = container.querySelector('#btn-add-step') || \n                   container.querySelector('button:has-text(\"承認ステップ追加\")') ||\n                   container.querySelector('button[data-testid=\"add-step-button\"]');\n    \n    if (!addBtn) return;\n\n    addBtn.addEventListener('click', () => {\n      if (!selectedUserId) {\n        window.aivicNotify.error('承認者を選択してください');\n        return;\n      }\n\n      const selectedUser = users.find(u => (u.ユーザーID || u.id) === selectedUserId);\n      if (!selectedUser) {\n        window.aivicNotify.error('選択されたユーザーが見つかりません');\n        return;\n      }\n\n      try {\n        // 業務ロジックで承認者の権限レベルを設定\n        let authorityLevel = 'normal';\n        if (setApproverAuthorityLevel) {\n          const authority = setApproverAuthorityLevel({\n            userId: selectedUserId,\n            position: selectedUser.役職 || selectedUser.position,\n            department: selectedUser.所属部署 || selectedUser.department\n          });\n          authorityLevel = authority.level || 'normal';\n        }\n\n        const newStep = {\n          stepNumber: approvalSteps.length + 1,\n          approverId: selectedUserId,\n          approverName: selectedUser.ユーザー名 || selectedUser.name,\n          position: selectedUser.役職 || selectedUser.position,\n          department: selectedUser.所属部署 || selectedUser.department,\n          required: true,\n          parallel: false,\n          proxyAllowed: true,\n          authorityLevel: authorityLevel\n        };\n\n        approvalSteps.push(newStep);\n        renderApproverList();\n        \n        // 選択をクリア\n        const selectedRadio = container.querySelector('input[name=\"selected-user\"]:checked');\n        if (selectedRadio) selectedRadio.checked = false;\n        selectedUserId = null;\n\n      } catch (error) {\n        window.aivicNotify.error('承認ステップの追加に失敗しました');\n      }\n    });\n  }\n\n  // 代理承認者設定の処理\n  function handleProxyApproverSetting() {\n    const proxyBtn = container.querySelector('button:has-text(\"代理承認者設定\")') ||\n                     container.querySelector('[data-testid=\"proxy-approver-button\"]');\n    \n    if (!proxyBtn) return;\n\n    proxyBtn.addEventListener('click', () => {\n      // 代理承認者設定モーダルを表示（簡易実装）\n      const modal = document.createElement('div');\n      modal.style.cssText = `\n        position: fixed; top: 0; left: 0; width: 100%; height: 100%; \n        background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000;\n      `;\n      \n      modal.innerHTML = `\n        <div style=\"background: var(--bg-secondary); padding: 20px; border-radius: 8px; width: 400px;\">\n          <h3>代理承認者設定</h3>\n          <div style=\"margin: 16px 0;\">\n            <input type=\"text\" placeholder=\"ユーザー検索\" data-testid=\"user-search\" style=\"width: 100%; padding: 8px;\">\n          </div>\n          <div style=\"text-align: right; margin-top: 16px;\">\n            <button data-testid=\"select-user-button\" style=\"margin-right: 8px;\">選択</button>\n            <button class=\"cancel-btn\">キャンセル</button>\n          </div>\n        </div>\n      `;\n\n      document.body.appendChild(modal);\n\n      // 選択ボタンの処理\n      modal.querySelector('[data-testid=\"select-user-button\"]').addEventListener('click', () => {\n        const searchInput = modal.querySelector('[data-testid=\"user-search\"]');\n        const searchTerm = searchInput.value.trim();\n        \n        if (searchTerm) {\n          const foundUser = users.find(u => \n            (u.ユーザー名 || u.name || '').includes(searchTerm) ||\n            (u.所属部署 || u.department || '').includes(searchTerm)\n          );\n          \n          if (foundUser) {\n            selectedUserId = foundUser.ユーザーID || foundUser.id;\n            // ユーザー一覧で該当ユーザーを選択状態にする\n            const radio = container.querySelector(`input[value=\"${selectedUserId}\"]`);\n            if (radio) radio.checked = true;\n          }\n        }\n        \n        document.body.removeChild(modal);\n      });\n\n      // キャンセルボタンの処理\n      modal.querySelector('.cancel-btn').addEventListener('click', () => {\n        document.body.removeChild(modal);\n      });\n    });\n  }\n\n  // 並列承認設定の処理\n  function handleParallelApproval() {\n    const parallelCheckbox = container.querySelector('[data-testid=\"parallel-approval\"]');\n    if (!parallelCheckbox) return;\n\n    parallelCheckbox.addEventListener('change', (e) => {\n      const isParallel = e.target.checked;\n      // 現在の承認ステップに並列設定を適用\n      approvalSteps.forEach(step => {\n        step.parallel = isParallel;\n      });\n      renderApproverList();\n    });\n  }\n\n  // 条件分岐設定の処理\n  function handleConditionBranch() {\n    const branchBtn = container.querySelector('[data-testid=\"condition-branch-button\"]');\n    if (!branchBtn) return;\n\n    branchBtn.addEventListener('click', () => {\n      // 条件分岐の設定（簡易実装）\n      const condition = prompt('条件を入力してください（例：金額 > 100万円）');\n      if (condition) {\n        // 条件に応じた分岐ルートを作成\n        approvalSteps.forEach(step => {\n          step.condition = condition;\n        });\n        renderApproverList();\n      }\n    });\n  }\n\n  // 承認期限設定の処理\n  function handleApprovalDeadline() {\n    const deadlineInput = container.querySelector('[data-testid=\"approval-deadline\"]');\n    const notificationCheckbox = container.querySelector('[data-testid=\"delay-notification\"]');\n    \n    if (deadlineInput) {\n      deadlineInput.addEventListener('change', (e) => {\n        const days = parseInt(e.target.value);\n        if (days > 0 && setApprovalDeadline) {\n          try {\n            const deadline = setApprovalDeadline({\n              days: days,\n              businessDaysOnly: true\n            });\n            // 承認ステップに期限を設定\n            approvalSteps.forEach(step => {\n              step.deadline = deadline.deadline;\n              step.deadlineDays = days;\n            });\n          } catch (error) {\n            window.aivicNotify.error('承認期限の設定に失敗しました');\n          }\n        }\n      });\n    }\n\n    if (notificationCheckbox) {\n      notificationCheckbox.addEventListener('change', (e) => {\n        const enableNotification = e.target.checked;\n        approvalSteps.forEach(step => {\n          step.delayNotification = enableNotification;\n        });\n      });\n    }\n  }\n\n  // フロー名入力の処理\n  function handleFlowNameInput() {\n    const flowNameInput = container.querySelector('[data-testid=\"flow-name-input\"]');\n    if (!flowNameInput) return;\n\n    flowNameInput.addEventListener('input', (e) => {\n      currentFlowName = e.target.value;\n    });\n  }\n\n  // ユーザー検索の処理\n  function handleUserSearch() {\n    const searchInput = container.querySelector('[data-testid=\"user-search\"]');\n    if (!searchInput) return;\n\n    searchInput.addEventListener('input', (e) => {\n      const searchTerm = e.target.value.toLowerCase();\n      const filteredUsers = users.filter(user => \n        (user.ユーザー名 || user.name || '').toLowerCase().includes(searchTerm) ||\n        (user.所属部署 || user.department || '').toLowerCase().includes(searchTerm) ||\n        (user.役職 || user.position || '').toLowerCase().includes(searchTerm)\n      );\n      renderUserList(filteredUsers);\n    });\n  }\n\n  // 保存処理\n  function handleSave() {\n    const saveBtn = container.querySelector('[data-testid=\"save-button\"]') ||\n                    container.querySelector('button:has-text(\"保存\")');\n    \n    if (!saveBtn) return;\n\n    saveBtn.addEventListener('click', async () => {\n      try {\n        // 入力値の検証\n        if (validateApplicationInput) {\n          const validation = validateApplicationInput({\n            flowName: currentFlowName,\n            approvalSteps: approvalSteps\n          });\n          \n          if (!validation.isValid) {\n            window.aivicNotify.error(validation.message || '入力値に問題があります');\n            return;\n          }\n        }\n\n        // 承認階層の決定\n        if (determineApprovalHierarchy) {\n          const hierarchy = determineApprovalHierarchy({\n            steps: approvalSteps,\n            documentType: container.querySelector('[data-testid=\"document-type-select\"]')?.value\n          });\n          \n          if (hierarchy.optimizedSteps) {\n            approvalSteps = hierarchy.optimizedSteps;\n          }\n        }\n\n        // データを保存\n        const approvalRoute = {\n          flowName: currentFlowName,\n          documentType: container.querySelector('[data-testid=\"document-type-select\"]')?.value,\n          approvalSteps: approvalSteps,\n          createdAt: new Date().toISOString(),\n          isActive: true\n        };\n\n        await window.aivicApi.save(approvalRoute);\n        window.aivicNotify.success('承認ルートを保存しました');\n        \n        // 承認者一覧を表示\n        const approverList = container.querySelector('[data-testid=\"approver-list\"]');\n        if (approverList) {\n          approverList.style.display = 'block';\n        }\n\n      } catch (error) {\n        window.aivicNotify.error('保存に失敗しました: ' + error.message);\n      }\n    });\n  }\n\n  // 初期化処理\n  async function initialize() {\n    await loadUsers();\n    \n    // 各種イベントハンドラーの設定\n    handleDocumentTypeChange();\n    handleAddApprovalStep();\n    handleProxyApproverSetting();\n    handleParallelApproval();\n    handleConditionBranch();\n    handleApprovalDeadline();\n    handleFlowNameInput();\n    handleUserSearch();\n    handleSave();\n\n    // 初期表示\n    renderApproverList();\n  }\n\n  // 初期化実行\n  initialize().catch(error => {\n    window.aivicNotify.error('画面の初期化に失敗しました');\n    console.error('Initialization error:', error);\n  });\n}";

      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
