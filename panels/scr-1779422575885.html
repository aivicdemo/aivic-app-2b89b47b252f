<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ハイブリッド申請承認システム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-main: #ffffff;
            --bg-card: #f8fafc;
            --bg-sidebar: #f1f5f9;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-muted: #64748b;
            --text-light: #94a3b8;
            --top-bar-bg: #ffffff;
            --top-bar-border: #e2e8f0;
            --success: #059669;
            --warning: #d97706;
            --danger: #dc2626;
            --radius: 8px;
            --radius-sm: 6px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 13px;
            line-height: 1.4;
            color: var(--text);
            background: var(--bg-main);
        }

        .app-layout {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--top-bar-bg);
        }

        .logo {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }

        .nav-section {
            padding: 12px 0;
        }

        .nav-section-title {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0 16px 8px;
        }

        .nav-item {
            display: block;
            padding: 6px 16px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .nav-item:hover {
            background: rgba(59, 130, 246, 0.08);
            color: var(--primary);
        }

        .nav-item.aivic-active {
            background: rgba(59, 130, 246, 0.12);
            color: var(--primary);
            font-weight: 500;
            border-right: 2px solid var(--primary);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            height: 52px;
            background: var(--top-bar-bg);
            border-bottom: 1px solid var(--top-bar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .breadcrumb {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 500;
        }

        .logout-link {
            font-size: 12px;
            color: var(--text-muted);
            text-decoration: none;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            transition: background 0.15s ease;
        }

        .logout-link:hover {
            background: var(--bg-card);
        }

        .content-area {
            flex: 1;
            overflow: auto;
            padding: 16px 20px;
        }

        .panel-container {
            height: 100%;
            background: var(--bg-main);
        }

        .status-indicator {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .status-pending { background: var(--warning); }
        .status-approved { background: var(--success); }
        .status-rejected { background: var(--danger); }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .badge-primary {
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary);
        }

        .badge-success {
            background: rgba(5, 150, 105, 0.1);
            color: var(--success);
        }

        .badge-warning {
            background: rgba(217, 119, 6, 0.1);
            color: var(--warning);
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            margin-bottom: 12px;
        }

        .card-header {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
            background: var(--bg-main);
            color: var(--text);
        }

        .btn:hover {
            background: var(--bg-card);
            border-color: var(--primary);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .table th,
        .table td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .table th {
            font-weight: 500;
            color: var(--text-muted);
            background: var(--bg-card);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .table tbody tr:hover {
            background: rgba(59, 130, 246, 0.02);
        }

        .loading-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--text-light);
            font-size: 12px;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            
            .content-area {
                padding: 12px 16px;
            }
        }
    </style>

window.AIVIC_PAGE_INIT_JS = "js\nfunction(container, apiUrl, tables) {\n  // 業務ロジックのインポート\n  const { \n    classifyDocumentType, \n    evaluateSubsidyRelevance, \n    determineDigitalizationEligibility, \n    determineProcessingRoute,\n    validateApplicationInput \n  } = window.businessLogic || {};\n\n  // 利用可能な業務ロジック関数をインポート\n  const {\n    validateApplicationInput: validateInput,\n    classifyDocumentTypeAndRoute,\n    determineDocumentTypeAndRoute,\n    checkMoeComplianceRequirements,\n    determineProcessingRoute: determineRoute,\n    checkComplianceAndDetermineRoute,\n    handleDocumentClassificationException,\n    determineDocumentStorageMethod,\n    classifyDocumentType: classifyType,\n    evaluateSubsidyRelevance: evaluateSubsidy\n  } = window.businessLogic?.it1br211 || {};\n\n  // 判定履歴テーブルの再描画関数\n  function renderJudgmentHistory(rows) {\n    const tbody = container.querySelector(\"#judgment-history-tbody\");\n    if (!tbody) return;\n    \n    tbody.innerHTML = rows.map(r => `\n      <tr data-id=\"${r.id}\">\n        <td style=\"padding: 6px 10px; font-size: 12px; color: var(--text);\">${r.判定日時 || \"\"}</td>\n        <td style=\"padding: 6px 10px; font-size: 12px; color: var(--text);\">${r.文書種別 || \"\"}</td>\n        <td style=\"padding: 6px 10px; font-size: 12px; color: var(--text);\">\n          <span style=\"padding: 2px 6px; border-radius: 4px; font-size: 11px; background: ${r.判定結果 === '電子化可能' ? 'rgba(34, 197, 94, 0.2)' : 'rgba(239, 68, 68, 0.2)'}; color: ${r.判定結果 === '電子化可能' ? '#22c55e' : '#ef4444'};\">\n            ${r.判定結果 || \"\"}\n          </span>\n        </td>\n        <td style=\"padding: 6px 10px; font-size: 12px; color: var(--text);\">${r.補助金関連度 || \"\"}</td>\n        <td style=\"padding: 6px 10px; font-size: 12px; color: var(--text);\">${r.推奨ルート || \"\"}</td>\n        <td style=\"padding: 6px 10px; font-size: 12px; color: var(--text);\">${r.判定者 || \"\"}</td>\n      </tr>\n    `).join(\"\");\n  }\n\n  // 初期データの描画\n  renderJudgmentHistory(tables[0]?.records || []);\n\n  // 申請書類情報の初期表示\n  if (tables[1]?.records?.length > 0) {\n    const doc = tables[1].records[0];\n    const documentIdEl = container.querySelector(\"#document-id\") || container.querySelector('[data-testid=\"document-id\"]');\n    const documentTypeEl = container.querySelector(\"#document-type\") || container.querySelector('[data-testid=\"document-type-select\"]');\n    const documentPreviewEl = container.querySelector(\"#document-preview\") || container.querySelector('[data-testid=\"document-preview\"]');\n    const applicantNameEl = container.querySelector(\"#applicant-name\");\n    const applicantDeptEl = container.querySelector(\"#applicant-dept\");\n    const applicationDateEl = container.querySelector(\"#application-date\");\n\n    if (documentIdEl) documentIdEl.value = doc.申請書類ID || \"\";\n    if (documentTypeEl) documentTypeEl.value = doc.申請種別 || \"\";\n    if (documentPreviewEl) documentPreviewEl.value = doc.申請内容 || \"\";\n    if (applicantNameEl) applicantNameEl.textContent = doc.申請者名 || \"-\";\n    if (applicantDeptEl) applicantDeptEl.textContent = doc.所属部署 || \"-\";\n    if (applicationDateEl) applicationDateEl.textContent = doc.作成日時 ? new Date(doc.作成日時).toLocaleString() : \"-\";\n  }\n\n  // 文書種別選択時の判定条件変更\n  const documentTypeSelect = container.querySelector('[data-testid=\"document-type-select\"]') || container.querySelector(\"#document-type\");\n  if (documentTypeSelect) {\n    documentTypeSelect.addEventListener(\"change\", async (e) => {\n      const selectedType = e.target.value;\n      const reasonEl = container.querySelector(\"#judgment-reason\") || container.querySelector('[data-testid=\"judgment-reason\"]');\n      \n      try {\n        // 業務ロジックで文書種別を分類\n        if (classifyType) {\n          const classification = classifyType({\n            documentType: selectedType,\n            content: container.querySelector('[data-testid=\"document-preview\"]')?.value || \"\"\n          });\n          \n          if (reasonEl) {\n            let reasonText = \"\";\n            switch (selectedType) {\n              case '経費申請':\n                reasonText = \"経費申請は領収書等の物理的証憑が必要なため電子化制約があります\";\n                break;\n              case '休暇申請':\n                reasonText = \"休暇申請は完全電子化が可能です\";\n                break;\n              case '稟議申請':\n                reasonText = \"稟議申請は承認フローが複雑で部分的電子化が適用されます\";\n                break;\n              default:\n                reasonText = \"文書種別に応じた判定条件を適用します\";\n            }\n            reasonEl.textContent = reasonText;\n          }\n        }\n      } catch (error) {\n        console.error(\"文書種別分類エラー:\", error);\n        if (window.aivicNotify) {\n          window.aivicNotify.error(\"文書種別の分類に失敗しました\");\n        }\n      }\n    });\n  }\n\n  // 判定実行ボタンのイベントハンドラ\n  const executeButton = container.querySelector('[data-testid=\"execute-judgment-button\"]');\n  if (executeButton) {\n    executeButton.addEventListener(\"click\", async () => {\n      try {\n        const documentType = documentTypeSelect?.value;\n        const documentId = container.querySelector('[data-testid=\"document-id\"]')?.value;\n        const documentContent = container.querySelector('[data-testid=\"document-preview\"]')?.value;\n        const subsidyLevel = container.querySelector('[data-testid=\"subsidy-level-select\"]')?.value;\n\n        // 入力値検証\n        if (validateInput) {\n          const validation = validateInput({\n            documentId,\n            documentType,\n            content: documentContent\n          });\n          \n          if (!validation.isValid) {\n            if (window.aivicNotify) {\n              window.aivicNotify.error(validation.message || \"入力値が不正です\");\n            }\n            return;\n          }\n        }\n\n        // 電子化可否判定\n        let judgmentResult = \"電子化不可\";\n        let judgmentReason = \"\";\n        let recommendedRoute = \"\";\n\n        // 文書種別による判定\n        if (classifyType) {\n          const classification = classifyType({\n            documentType,\n            content: documentContent\n          });\n\n          // 補助金関連度評価\n          let subsidyRelevance = \"\";\n          if (evaluateSubsidy) {\n            const subsidyEval = evaluateSubsidy({\n              documentType,\n              content: documentContent,\n              level: subsidyLevel\n            });\n            subsidyRelevance = subsidyEval.relevanceLevel || \"\";\n          }\n\n          // 処理ルート決定\n          if (determineRoute) {\n            const routeResult = determineRoute({\n              documentType,\n              classification: classification.category,\n              subsidyRelevance\n            });\n            recommendedRoute = routeResult.recommendedRoute || \"\";\n          }\n\n          // 判定結果の決定\n          switch (documentType) {\n            case '休暇申請':\n              judgmentResult = \"電子化可能\";\n              judgmentReason = \"休暇申請は完全電子化対応済みです\";\n              break;\n            case '経費申請':\n              judgmentResult = \"電子化不可\";\n              judgmentReason = \"経費申請は物理的証憑が必要なため電子化に制約があります\";\n              break;\n            case '稟議申請':\n              judgmentResult = \"部分電子化可能\";\n              judgmentReason = \"稟議申請は承認フローの一部で電子化が可能です\";\n              break;\n            default:\n              judgmentResult = \"要検討\";\n              judgmentReason = \"個別に電子化可否を検討する必要があります\";\n          }\n        }\n\n        // 結果をUIに反映\n        const resultEl = container.querySelector(\"#judgment-result\");\n        const reasonEl = container.querySelector('[data-testid=\"judgment-reason\"]');\n        const routeEl = container.querySelector('[data-testid=\"recommended-route\"]');\n\n        if (resultEl) {\n          resultEl.textContent = judgmentResult;\n          resultEl.style.color = judgmentResult.includes('可能') ? '#22c55e' : '#ef4444';\n        }\n        if (reasonEl) reasonEl.textContent = judgmentReason;\n        if (routeEl) routeEl.textContent = recommendedRoute;\n\n        // 判定履歴に追加\n        const newRecord = {\n          判定日時: new Date().toLocaleString(),\n          文書種別: documentType,\n          判定結果: judgmentResult,\n          補助金関連度: subsidyLevel,\n          推奨ルート: recommendedRoute,\n          判定者: \"システム自動判定\"\n        };\n\n        // APIで履歴を保存\n        if (window.aivicApi) {\n          await window.aivicApi.save(\"judgment_history\", newRecord);\n          \n          // 履歴テーブルを更新\n          const currentRecords = tables[0]?.records || [];\n          currentRecords.unshift(newRecord);\n          renderJudgmentHistory(currentRecords);\n        }\n\n        if (window.aivicNotify) {\n          window.aivicNotify.success(\"判定が完了しました\");\n        }\n\n      } catch (error) {\n        console.error(\"判定実行エラー:\", error);\n        if (window.aivicNotify) {\n          window.aivicNotify.error(\"判定の実行に失敗しました\");\n        }\n      }\n    });\n  }\n\n  // 手動オーバーライドボタンのイベントハンドラ\n  const overrideButton = container.querySelector('[data-testid=\"manual-override-button\"]');\n  if (overrideButton) {\n    overrideButton.addEventListener(\"click\", async () => {\n      try {\n        const currentResult = container.querySelector(\"#judgment-result\")?.textContent;\n        let newResult = \"\";\n        \n        if (currentResult === \"電子化可能\") {\n          newResult = \"電子化不可\";\n        } else if (currentResult === \"電子化不可\") {\n          newResult = \"電子化可能\";\n        } else {\n          newResult = \"電子化可能\";\n        }\n\n        const resultEl = container.querySelector(\"#judgment-result\");\n        const reasonEl = container.querySelector('[data-testid=\"judgment-reason\"]');\n        \n        if (resultEl) {\n          resultEl.textContent = newResult;\n          resultEl.style.color = newResult.includes('可能') ? '#22c55e' : '#ef4444';\n        }\n        if (reasonEl) {\n          reasonEl.textContent = \"手動オーバーライドにより判定結果を変更しました\";\n        }\n\n        if (window.aivicNotify) {\n          window.aivicNotify.success(\"判定結果を手動で変更しました\");\n        }\n\n      } catch (error) {\n        console.error(\"手動オーバーライドエラー:\", error);\n        if (window.aivicNotify) {\n          window.aivicNotify.error(\"手動オーバーライドに失敗しました\");\n        }\n      }\n    });\n  }\n\n  // 補助金関連度選択の初期化\n  const subsidyLevelSelect = container.querySelector('[data-testid=\"subsidy-level-select\"]');\n  if (subsidyLevelSelect && subsidyLevelSelect.options.length === 0) {\n    const levels = [\n      { value: \"level1\", text: \"レベル1 (低)\" },\n      { value: \"level2\", text: \"レベル2 (中)\" },\n      { value: \"level3\", text: \"レベル3 (高)\" },\n      { value: \"level4\", text: \"レベル4 (最高)\" }\n    ];\n    \n    levels.forEach(level => {\n      const option = document.createElement(\"option\");\n      option.value = level.value;\n      option.textContent = level.text;\n      subsidyLevelSelect.appendChild(option);\n    });\n  }\n\n  // 初期表示時に最初の文書種別で判定条件を設定\n  if (documentTypeSelect && documentTypeSelect.value) {\n    documentTypeSelect.dispatchEvent(new Event('change'));\n  }\n}";

      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
