Selector(\"[data-testid='document-preview']\");\n        const previewContent = `<div style=\"white-space: pre-wrap;\">${firstApp.applicationContent}</div>`;\n        if (documentPreview) documentPreview.innerHTML = previewContent;\n        if (documentPreviewTestId) documentPreviewTestId.innerHTML = previewContent;\n      }\n      \n      // 文書種別を設定\n      if (firstApp.applicationType) {\n        const typeSelect = container.querySelector(\"#document-type\");\n        if (typeSelect) typeSelect.value = getDocumentTypeCode(firstApp.applicationType);\n      }\n    }\n  }\n\n  // 文書種別名からコードを取得\n  function getDocumentTypeCode(typeName) {\n    const typeMap = {\n      '契約書': 'contract',\n      '申請書': 'application', \n      '報告書': 'report',\n      '請求書': 'invoice',\n      '領収書': 'receipt'\n    };\n    return typeMap[typeName] || 'application';\n  }\n\n  // 判定実行\n  async function executeJudgment() {\n    const documentType = container.querySelector(\"#document-type\")?.value;\n    const applicationId = container.querySelector(\"#application-id\")?.value;\n    \n    if (!documentType) {\n      window.aivicNotify?.error(\"文書種別を選択してください\");\n      return;\n    }\n    \n    if (!applicationId) {\n      window.aivicNotify?.error(\"申請書類IDが設定されていません\");\n      return;\n    }\n\n    try {\n      // 業務ロジックを使用した判定\n      const judgment = await performJudgmentWithBusinessLogic(documentType, applicationId);\n      currentJudgment = judgment;\n      \n      // 結果を表示\n      displayJudgmentResult(judgment);\n      hideError();\n    } catch (error) {\n      window.aivicNotify?.error(`判定処理でエラーが発生しました: ${error.message}`);\n    }\n  }\n\n  // 業務ロジックを使用した判定処理\n  async function performJudgmentWithBusinessLogic(documentType, applicationId) {\n    // 業務ロジック関数が利用可能な場合は使用\n    if (determineDigitalizationEligibility && determineProcessingRoute) {\n      const eligibilityResult = determineDigitalizationEligibility({\n        documentType,\n        applicationId,\n        content: container.querySelector(\"#document-preview\")?.textContent || ''\n      });\n      \n      const routeResult = determineProcessingRoute({\n        documentType,\n        eligibility: eligibilityResult\n      });\n      \n      return {\n        result: eligibilityResult.eligible ? '電子化可能' : eligibilityResult.hybrid ? 'ハイブリッド処理推奨' : '電子化不可',\n        confidence: eligibilityResult.confidence || '85%',\n        subsidyLevel: getSubsidyLevel(documentType),\n        recommendedRoute: routeResult.route || 'ハイブリッド処理',\n        reason: eligibilityResult.reason || getDefaultReason(documentType)\n      };\n    }\n    \n    // フォールバック判定ロジック\n    return performFallbackJudgment(documentType);\n  }\n\n  // フォールバック判定ロジック\n  function performFallbackJudgment(documentType) {\n    const subsidyRelatedTypes = ['application', 'report'];\n    const digitalOnlyTypes = ['invoice', 'receipt'];\n    \n    let result, confidence, subsidyLevel, recommendedRoute, reason;\n    \n    if (subsidyRelatedTypes.includes(documentType)) {\n      result = 'ハイブリッド処理推奨';\n      confidence = '85%';\n      subsidyLevel = '高';\n      recommendedRoute = 'ハイブリッド処理';\n      reason = '補助金関連書類のため、電子化と紙媒体の併用処理が適切です。法的要件と利便性を両立できます。';\n    } else if (digitalOnlyTypes.includes(documentType)) {\n      result = '電子化可能';\n      confidence = '95%';\n      subsidyLevel = '低';\n      recommendedRoute = '電子処理';\n      reason = '定型的な書類で電子化に適しています。デジタル署名により法的効力を確保できます。';\n    } else {\n      result = '電子化不可';\n      confidence = '70%';\n      subsidyLevel = '中';\n      recommendedRoute = '紙媒体処理';\n      reason = '法的要件により紙媒体での処理が必要です。原本性の確保が重要な書類です。';\n    }\n    \n    return { result, confidence, subsidyLevel, recommendedRoute, reason };\n  }\n\n  function getSubsidyLevel(documentType) {\n    const subsidyRelatedTypes = ['application', 'report'];\n    return subsidyRelatedTypes.includes(documentType) ? '高' : '低';\n  }\n\n  function getDefaultReason(documentType) {\n    const reasons = {\n      'application': '申請書類は補助金関連のため、ハイブリッド処理が推奨されます。',\n      'report': '報告書は電子化可能ですが、重要度に応じてハイブリッド処理も検討してください。',\n      'contract': '契約書は法的要件により紙媒体での処理が必要です。',\n      'invoice': '請求書は電子化に適した定型書類です。',\n      'receipt': '領収書は電子化可能な書類です。'\n    };\n    return reasons[documentType] || '書類の性質に応じた適切な処理方法を選択してください。';\n  }\n\n  // 判定結果の表示\n  function displayJudgmentResult(judgment) {\n    const resultElement = container.querySelector(\"[data-testid='judgment-result']\");\n    const reasonElement = container.querySelector(\"[data-testid='judgment-reason']\");\n    const subsidyLevelElement = container.querySelector(\"[data-testid='subsidy-level']\");\n    const recommendedRouteElement = container.querySelector(\"[data-testid='recommended-route']\");\n    \n    if (resultElement) resultElement.textContent = judgment.result;\n    if (reasonElement) reasonElement.textContent = judgment.reason;\n    if (subsidyLevelElement) subsidyLevelElement.textContent = judgment.subsidyLevel;\n    if (recommendedRouteElement) recommendedRouteElement.textContent = judgment.recommendedRoute;\n    \n    // 結果エリアを表示\n    const resultArea = container.querySelector(\".judgment-result-area\");\n    if (resultArea) resultArea.style.display = 'block';\n  }\n\n  // 手動オーバーライド処理\n  function handleManualOverride() {\n    const overrideCheckbox = container.querySelector(\"[data-testid='manual-override']\");\n    const overrideJudgment = container.querySelector(\"[data-testid='override-judgment']\");\n    const overrideReason = container.querySelector(\"[data-testid='override-reason']\");\n    \n    if (overrideCheckbox?.checked && overrideJudgment?.value && overrideReason?.value) {\n      const overriddenResult = {\n        result: overrideJudgment.value,\n        reason: overrideReason.value,\n        subsidyLevel: currentJudgment?.subsidyLevel || '-',\n        recommendedRoute: overrideJudgment.value === '電子化可能' ? '電子処理' : '紙媒体処理'\n      };\n      \n      displayJudgmentResult(overriddenResult);\n      currentJudgment = overriddenResult;\n    }\n  }\n\n  // 文書種別変更時の処理\n  function handleDocumentTypeChange() {\n    const documentType = container.querySelector(\"#document-type\")?.value;\n    if (documentType && currentApplicationId) {\n      executeJudgment();\n    }\n  }\n\n  // エラー表示/非表示\n  function showError(message) {\n    window.aivicNotify?.error(message);\n  }\n\n  function hideError() {\n    // エラー表示をクリア（通知システムが自動で処理）\n  }\n\n  // イベントハンドラーの設定\n  function setupEventHandlers() {\n    // 判定実行ボタン\n    const executeButton = container.querySelector(\"[data-testid='execute-judgment-button']\");\n    if (executeButton) {\n      executeButton.addEventListener('click', executeJudgment);\n    }\n    \n    // 文書種別変更\n    const documentTypeSelect = container.querySelector(\"#document-type\");\n    if (documentTypeSelect) {\n      documentTypeSelect.addEventListener('change', handleDocumentTypeChange);\n    }\n    \n    // 手動オーバーライド\n    const overrideCheckbox = container.querySelector(\"[data-testid='manual-override']\");\n    const overrideJudgment = container.querySelector(\"[data-testid='override-judgment']\");\n    const overrideReason = container.querySelector(\"[data-testid='override-reason']\");\n    \n    if (overrideCheckbox) {\n      overrideCheckbox.addEventListener('change', handleManualOverride);\n    }\n    if (overrideJudgment) {\n      overrideJudgment.addEventListener('change', handleManualOverride);\n    }\n    if (overrideReason) {\n      overrideReason.addEventListener('input', handleManualOverride);\n    }\n    \n    // 申請書類ID入力時の同期\n    const applicationIdInput = container.querySelector(\"#application-id\");\n    if (applicationIdInput) {\n      applicationIdInput.addEventListener('input', function() {\n        const displayElement = container.querySelector(\"[data-testid='application-id']\");\n        if (displayElement) {\n          displayElement.textContent = this.value;\n        }\n        currentApplicationId = this.value;\n      });\n    }\n  }\n\n  // 初期化処理\n  function initialize() {\n    initializeData();\n    setupEventHandlers();\n    \n    // 申請者情報エリアの表示確保\n    const applicantInfo = container.querySelector(\"[data-testid='applicant-info']\");\n    if (applicantInfo) {\n      applicantInfo.style.display = 'block';\n    }\n  }\n\n  // 初期化実行\n  initialize();\n  \n  return {\n    executeJudgment,\n    handleManualOverride,\n    getCurrentJudgment: () => currentJudgment\n  };\n}";

    <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
