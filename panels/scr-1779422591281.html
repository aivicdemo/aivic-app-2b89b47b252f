ta-testid=\"deputy-end-date\">\n        </div>\n        <div style=\"margin-top: 16px;\">\n          <button data-testid=\"save-deputy-button\">保存</button>\n          <button data-testid=\"cancel-deputy-button\">キャンセル</button>\n        </div>\n      </div>\n    `;\n    \n    document.body.appendChild(modal);\n\n    const saveDeputyButton = modal.querySelector('[data-testid=\"save-deputy-button\"]');\n    const cancelButton = modal.querySelector('[data-testid=\"cancel-deputy-button\"]');\n    \n    saveDeputyButton.addEventListener('click', () => {\n      const deputyName = modal.querySelector('[data-testid=\"deputy-approver-select\"]').value;\n      const startDate = modal.querySelector('[data-testid=\"deputy-start-date\"]').value;\n      const endDate = modal.querySelector('[data-testid=\"deputy-end-date\"]').value;\n      \n      if (deputyName && startDate && endDate) {\n        const step = routeSteps.find(s => s.id === stepId);\n        if (step) {\n          step.deputy = { name: deputyName, startDate, endDate };\n        }\n        \n        // 代理承認者表示を更新\n        const stepElement = container.querySelector(`[data-step-id=\"${stepId}\"]`);\n        if (stepElement) {\n          const deputyInfo = document.createElement('div');\n          deputyInfo.textContent = `代理承認者: ${deputyName}`;\n          stepElement.appendChild(deputyInfo);\n        }\n        \n        document.body.removeChild(modal);\n        window.aivicNotify?.success('代理承認者を設定しました');\n      }\n    });\n    \n    cancelButton.addEventListener('click', () => {\n      document.body.removeChild(modal);\n    });\n  }\n\n  // ルートプレビュー表示\n  function showRoutePreview() {\n    if (!routePreviewContainer) return;\n    \n    const routeName = routeNameInput?.value || '';\n    const documentType = documentTypeSelect?.value || '';\n    const isParallel = parallelApprovalCheckbox?.checked || false;\n    \n    let previewHtml = `\n      <h4>処理ルートプレビュー</h4>\n      <div><strong>ルート名:</strong> ${routeName}</div> y && routeSteps.length > 0) {\n        const hierarchyResult = determineApprovalHierarchy(routeData);\n        if (hierarchyResult.error) {\n          window.aivicNotify?.error(hierarchyResult.error);\n          return;\n        }\n      }\n\n      // 承認期限設定\n      if (setApprovalDeadline && routeData.approvalDeadline) {\n        const deadlineResult = setApprovalDeadline({\n          deadline: parseInt(routeData.approvalDeadline),\n          notificationEnabled: routeData.delayNotification\n        });\n        if (deadlineResult.error) {\n          window.aivicNotify?.error(deadlineResult.error);\n          return;\n        }\n      }\n\n      // データ保存\n      const result = await window.aivicApi.save('processing_routes', routeData);\n      \n      if (result.success) {\n        window.aivicNotify?.success('処理ルートが正常に作成されました');\n        \n        // 保存後の表示更新\n        const routeListContainer = container.querySelector('.route-list');\n        if (routeListContainer) {\n          const routeItem = document.createElement('div');\n          routeItem.textContent = routeData.name;\n          routeListContainer.appendChild(routeItem);\n        }\n      } else {\n        window.aivicNotify?.error('保存に失敗しました');\n      }\n      \n    } catch (error) {\n      console.error('Save error:', error);\n      window.aivicNotify?.error('システムエラーが発生しました');\n    }\n  }\n\n  // ルート有効化切り替え\n  function toggleRouteActive() {\n    const isActive = activeToggle?.checked || false;\n    const routeName = routeNameInput?.value || '';\n    \n    if (routeName) {\n      window.aivicNotify?.success(`ルート「${routeName}」を${isActive ? '有効' : '無効'}にしました`);\n    }\n  }\n\n  // イベントリスナーの設定\n  if (addStepButton) {\n    addStepButton.addEventListener('click', addApprovalStep);\n  }\n\n  if (saveButton) {\n    saveButton.addEventListener('click', saveProcessingRoute);\n  }\n\n  if (previewButton) {\n    previewButton.addEventListener('click', showRoutePreview);\n  }\n\n  if (activeToggle) {\n    activeToggle.       btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    // **content 要素の hidden 強制除去（2026-05-24 Playwright 大量 fail 対応）**:
    // AI が生成した panel HTML には class="hidden" / hidden 属性 / style="display:none"
    // が content 要素（#xxx-tbody / #xxx-list / [data-testid="error-message"] 等）に付いて
    // いることがある。それを Playwright が toBeVisible() で待ち続けて timeout する事故が頻発。
    //
    // ポリシー: panel コンテナ配下の全要素について以下を実行:
    //   - class="hidden" / display:none / hidden 属性を **content 要素では除去**
    //   - **modal 系**（.modal, .modal-backdrop, [role="dialog"], [data-modal] 等）は除外
    //     （これらは仕様上初期非表示が正しい）
    var isModalLike = function(el) {
      if (!el || !el.classList) return false;
      var cn = String(el.className || "");
      if (/modal|dialog|overlay|popup|dropdown|tooltip/i.test(cn)) return true;
      var role = el.getAttribute && el.getAttribute("role");
      if (role === "dialog" || role === "alertdialog" || role === "tooltip" || role === "menu") return true;
      if (el.hasAttribute && (el.hasAttribute("data-modal") || el.hasAttribute("data-dropdown") || el.hasAttribute("data-popup"))) return true;
      return false;
    };
    var unhideContentElements = function(root) {
      var all = root.querySelectorAll('.hidden, [hidden], [style*="display:none"], [style*="display: none"]');
      for (var k = 0; k < all.length; k++) {
        var el = all[k];
        // modal 系は触らない
        if (isModalLike(el)) continue;
        // parent chain で modal 内なら触らない
        var p = el.parentElement;
        var insideModal = false;
        while (p && p !== root) {
          if (isModalLike(p)) { insideModal = true; break; }
          p = p.parentElement;
        }
        if (insideModal) continue;
        // 除去
        el.classList.remove('hidden');
        el.removeAttribute('hidden');
        if (el.style && el.style.display === 'none') el.style.display = '';
      }
    };
    try { unhideContentElements(container); } catch (e) { console.warn('[aivic] unhideContent failed:', e); }

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
