<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ハイブリッド申請承認システム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-main: #ffffff;
            --bg-card: #f8fafc;
            --bg-sidebar: #f1f5f9;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-muted: #64748b;
            --text-light: #94a3b8;
            --top-bar-bg: #ffffff;
            --top-bar-border: #e2e8f0;
            --success: #059669;
            --warning: #d97706;
            --danger: #dc2626;
            --radius: 8px;
            --radius-sm: 6px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 13px;
            line-height: 1.4;
            color: var(--text);
            background: var(--bg-main);
        }

        .app-layout {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--top-bar-bg);
        }

        .logo {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }

        .nav-section {
            padding: 12px 0;
        }

        .nav-section-title {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0 16px 8px;
        }

        .nav-item {
            display: block;
            padding: 6px 16px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .nav-item:hover {
            background: rgba(59, 130, 246, 0.08);
            color: var(--primary);
        }

        .nav-item.aivic-active {
            background: rgba(59, 130, 246, 0.12);
            color: var(--primary);
            font-weight: 500;
            border-right: 2px solid var(--primary);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            height: 52px;
            background: var(--top-bar-bg);
            border-bottom: 1px solid var(--top-bar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .breadcrumb {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 500;
        }

        .logout-link {
            font-size: 12px;
            color: var(--text-muted);
            text-decoration: none;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            transition: background 0.15s ease;
        }

        .logout-link:hover {
            background: var(--bg-card);
        }

        .content-area {
            flex: 1;
            overflow: auto;
            padding: 16px 20px;
        }

        .panel-container {
            height: 100%;
            background: var(--bg-main);
        }

        .status-indicator {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .status-pending { background: var(--warning); }
        .status-approved { background: var(--success); }
        .status-rejected { background: var(--danger); }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .badge-primary {
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary);
        }

        .badge-success {
            background: rgba(5, 150, 105, 0.1);
            color: var(--success);
        }

        .badge-warning {
            background: rgba(217, 119, 6, 0.1);
            color: var(--warning);
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            margin-bottom: 12px;
        }

        .card-header {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
            background: var(--bg-main);
            color: var(--text);
        }

        .btn:hover {
            background: var(--bg-card);
            border-color: var(--primary);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .table th,
        .table td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .table th {
            font-weight: 500;
            color: var(--text-muted);
            background: var(--bg-card);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .table tbody tr:hover {
            background: rgba(59, 130, 246, 0.02);
        }

        .loading-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--text-light);
            font-size: 12px;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            
            .content-area {
                padding: 12px 16px;
            }
        }
    </style>

id","required":true,"description":"適用される承認フロー定義への外部キー"},{"name":"現在ステップ番号","type":"integer","required":true,"description":"現在処理中の承認ステップ番号"},{"name":"現在承認者ID","type":"uuid","required":false,"description":"現在の承認担当者のユーザーID"},{"name":"処理状況","type":"varchar(100)","required":true,"description":"処理の現在状況（申請中/承認待ち/承認済み/差戻し/却下/取下げ）"},{"name":"開始日時","type":"timestamp","required":true,"description":"処理ルートの開始日時"},{"name":"完了日時","type":"timestamp","required":false,"description":"処理ルートの完了日時"},{"name":"期限日時","type":"timestamp","required":false,"description":"処理完了の期限日時"},{"name":"優先度","type":"integer","required":true,"description":"処理の優先度（1:低 2:通常 3:高 4:緊急）"},{"name":"自動処理フラグ","type":"boolean","required":true,"description":"自動処理対象かどうかのフラグ"},{"name":"備考","type":"text","required":false,"description":"処理ルートに関する備考・メモ"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"遅延検知設定","purpose":"申請承認プロセスにおける遅延を検知するための設定を管理し、承認ステップごとの期限や通知タイミングを定義する","columns":[{"name":"遅延検知設定ID","type":"uuid","required":true,"description":"遅延検知設定の一意識別子（主キー）"},{"name":"文書種別ID","type":"uuid","required":true,"description":"文書種別マスタへの外部キー"},{"name":"承認ステップID","type":"uuid","required":false,"description":"承認ステップへの外部キー（全ステップ共通の場合はNULL）"},{"name":"設定名","type":"varchar(100)","required":true,"description":"遅延検知設定の名称"},{"name":"期限日数","type":"integer","required":true,"description":"承認期限までの日数"},{"name":"警告日数","type":"integer","required":false,"description":"期限前の警告通知を行う日数"},{"name":"エスカレーション日数","type":"integer","required":false,"description":"期限超過後のエスカレーション通知を行う日数"},{"name":"営業日計算フラグ","type":"boolean","required":true,"description":"営業日ベースで計算するかどうか"},{"name":"有効フラグ","type":"boolean","required":true,"description":"設定が有効かどうか"},{"name":"備考","type":"text","required":false,"description":"設定に関する補足説明"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"補助金関連度マスタ","purpose":"申請書類と補助金制度の関連度を管理し、適切な承認フローや処理ルートの決定に使用するマスタテーブル","columns":[{"name":"補助金関連度ID","type":"uuid","required":true,"description":"補助金関連度の一意識別子（主キー）"},{"name":"補助金関連度コード","type":"varchar(100)","required":true,"description":"補助金関連度の業務コード（表示・検索用）"},{"name":"補助金関連度名","type":"varchar(100)","required":true,"description":"補助金関連度の名称"},{"name":"関連度レベル","type":"integer","required":true,"description":"関連度の数値レベル（1:低、2:中、3:高など）"},{"name":"説明","type":"text","required":false,"description":"補助金関連度の詳細説明"},{"name":"表示順","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"マスタデータの有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]}];

window.AIVIC_PAGE_INIT_JS = "js\nfunction(container, apiUrl, tables) {\n  // 業務ロジックのインポート\n  const { \n    validateApplicationInput, \n    classifyDocumentTypeAndRoute, \n    checkApprovalStatusViewPermission,\n    getProgressDataWithAccessControl,\n    identifyStagnantApplications,\n    evaluateSubsidyRelevance,\n    classifyDocumentType\n  } = window.businessLogic || {};\n\n  const tbody = container.querySelector(\"#document-tbody\");\n  const resultCount = container.querySelector(\"#result-count\");\n  \n  // 検索フォーム要素の取得\n  const searchKeyword = container.querySelector('[data-testid=\"search-keyword\"]');\n  const documentTypeSelect = container.querySelector('[data-testid=\"document-type-select\"]');\n  const dateFrom = container.querySelector('[data-testid=\"date-from\"]');\n  const dateTo = container.querySelector('[data-testid=\"date-to\"]');\n  const approvalStatusSelect = container.querySelector('[data-testid=\"approval-status-select\"]');\n  const applicantName = container.querySelector('[data-testid=\"applicant-name\"]');\n  const approverName = container.querySelector('[data-testid=\"approver-name\"]');\n  const processRouteSelect = container.querySelector('[data-testid=\"process-route-select\"]');\n  const subsidyHigh = container.querySelector('[data-testid=\"subsidy-high\"]');\n  const searchButton = container.querySelector('[data-testid=\"search-button\"]');\n  const documentList = container.querySelector('[data-testid=\"document-list\"]');\n\n  // ユーザーマスタを取得（申請者・承認者名の表示用）\n  let users = [];\n  if (tables[0] && tables[0].tableName === \"ユーザー\") {\n    users = tables[0].records || [];\n  }\n  \n  // 申請書類データを取得\n  let documents = [];\n  const documentTableIndex = tables.findIndex(t => t.tableName === \"申請書類\");\n  if (documentTableIndex >= 0) {\n    documents = tables[documentTableIndex].records || [];\n  }\n  \n  // ユーザー名取得関数\n  function getUserName(userId) {\n    const user = users.find(u => u.ユーザーID === userId);\n    return user ? user.ユーザー名 : \"不明\";\n  }\n  \n  // 承認状態のバッジスタイル\n  function getStatusBadge(status) {\n    let bgColor = \"rgba(100,100,100,0.2)\";\n    let textColor = \"#d0e4ff\";\n    \n    switch(status) {\n      case \"申請中\":\n        bgColor = \"rgba(255,193,7,0.2)\";\n        break;\n      case \"承認済\":\n        bgColor = \"rgba(40,167,69,0.2)\";\n        break;\n      case \"却下\":\n        bgColor = \"rgba(220,53,69,0.2)\";\n        break;\n      case \"取下げ\":\n        bgColor = \"rgba(108,117,125,0.2)\";\n        break;\n    }\n    \n    return `<span style=\"background: ${bgColor}; color: ${textColor}; padding: 2px 6px; border-radius: 4px; font-size: 11px;\">${status}</span>`;\n  }\n  \n  // テーブル再描画関数\n  function renderRows(rows) {\n    if (!tbody) return;\n    \n    tbody.innerHTML = rows.map(r => `\n      <tr data-id=\"${r.申請書類ID}\" style=\"border-bottom: 1px solid rgba(255,255,255,0.05);\">\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">\n          <a href=\"#\" class=\"document-link\" data-id=\"${r.申請書類ID}\" style=\"color: var(--primary); text-decoration: none;\">${r.申請書類ID?.substring(0,8) || \"\"}</a>\n        </td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${r.申請種別 || \"\"}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${r.申請日 || \"\"}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${getUserName(r.申請者ID)}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${getStatusBadge(r.承認状態)}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${getUserName(r.承認者ID)}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${r.処理ルート || \"\"}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${r.補助金関連度 === \"高\" ? \"●\" : \"\"}</td>\n      </tr>\n    `).join(\"\");\n    \n    // 文書リンクのクリックイベント\n    tbody.querySelectorAll('.document-link').forEach(link => {\n      link.addEventListener('click', (e) => {\n        e.preventDefault();\n        const docId = e.target.getAttribute('data-id');\n        // 文書詳細画面への遷移処理\n        if (window.showScreen) {\n          window.showScreen('document-detail', { documentId: docId });\n        }\n      });\n    });\n    \n    // 結果件数の更新\n    if (resultCount) {\n      resultCount.textContent = `${rows.length}件`;\n    }\n  }\n  \n  // 検索実行関数\n  function performSearch() {\n    try {\n      // 検索条件の取得\n      const searchConditions = {\n        keyword: searchKeyword?.value || \"\",\n        documentType: documentTypeSelect?.value || \"\",\n        dateFrom: dateFrom?.value || \"\",\n        dateTo: dateTo?.value || \"\",\n        approvalStatus: approvalStatusSelect?.value || \"\",\n        applicantName: applicantName?.value || \"\",\n        approverName: approverName?.value || \"\",\n        processRoute: processRouteSelect?.value || \"\",\n        subsidyHigh: subsidyHigh?.checked || false\n      };\n      \n      // 業務ロジックを使用した検索条件の検証\n      if (validateApplicationInput && searchConditions.keyword) {\n        const validationResult = validateApplicationInput({\n          searchKeyword: searchConditions.keyword\n        });\n        if (!validationResult.isValid) {\n          window.aivicNotify?.error(validationResult.message || \"検索キーワードが不正です\");\n          return;\n        }\n      }\n      \n      // アクセス権限チェック\n      if (checkApprovalStatusViewPermission) {\n        const hasPermission = checkApprovalStatusViewPermission({\n          userId: window.currentUser?.userId,\n          requestedStatus: searchConditions.approvalStatus\n        });\n        if (!hasPermission) {\n          window.aivicNotify?.error(\"この承認状態の文書を閲覧する権限がありません\");\n          return;\n        }\n      }\n      \n      // データの取得とフィルタリング\n      let filteredDocuments = [...documents];\n      \n      // キーワード検索\n      if (searchConditions.keyword) {\n        filteredDocuments = filteredDocuments.filter(doc => \n          (doc.申請書類ID && doc.申請書類ID.includes(searchConditions.keyword)) ||\n          (doc.申請種別 && doc.申請種別.includes(searchConditions.keyword)) ||\n          (doc.備考 && doc.備考.includes(searchConditions.keyword))\n        );\n      }\n      \n      // 文書種別フィルタ\n      if (searchConditions.documentType) {\n        filteredDocuments = filteredDocuments.filter(doc => {\n          if (classifyDocumentType) {\n            const classification = classifyDocumentType({\n              documentType: doc.申請種別,\n              content: doc.内容\n            });\n            return classification.category === searchConditions.documentType;\n          }\n          return doc.申請種別 === searchConditions.documentType;\n        });\n      }\n      \n      // 申請日期間フィルタ\n      if (searchConditions.dateFrom || searchConditions.dateTo) {\n        filteredDocuments = filteredDocuments.filter(doc => {\n          if (!doc.申請日) return false;\n          const docDate = new Date(doc.申請日);\n          const fromDate = searchConditions.dateFrom ? new Date(searchConditions.dateFrom) : null;\n          const toDate = searchConditions.dateTo ? new Date(searchConditions.dateTo) : null;\n          \n          if (fromDate && docDate < fromDate) return false;\n          if (toDate && docDate > toDate) return false;\n          return true;\n        });\n      }\n      \n      // 承認状態フィルタ\n      if (searchConditions.approvalStatus) {\n        filteredDocuments = filteredDocuments.filter(doc => \n          doc.承認状態 === searchConditions.approvalStatus\n        );\n      }\n      \n      // 申請者名フィルタ\n      if (searchConditions.applicantName) {\n        filteredDocuments = filteredDocuments.filter(doc => {\n          const applicantName = getUserName(doc.申請者ID);\n          return applicantName.includes(searchConditions.applicantName);\n        });\n      }\n      \n      // 承認者名フィルタ\n      if (searchConditions.approverName) {\n        filteredDocuments = filteredDocuments.filter(doc => {\n          const approverName = getUserName(doc.承認者ID);\n          return approverName.includes(searchConditions.approverName);\n        });\n      }\n      \n      // 処理ルートフィルタ\n      if (searchConditions.processRoute) {\n        filteredDocuments = filteredDocuments.filter(doc => \n          doc.処理ルート === searchConditions.processRoute\n        );\n      }\n      \n      // 補助金関連度フィルタ\n      if (searchConditions.subsidyHigh) {\n        filteredDocuments = filteredDocuments.filter(doc => {\n          if (evaluateSubsidyRelevance) {\n            const relevance = evaluateSubsidyRelevance({\n              documentType: doc.申請種別,\n              amount: doc.金額,\n              content: doc.内容\n            });\n            return relevance.level === \"高\";\n          }\n          return doc.補助金関連度 === \"高\";\n        });\n      }\n      \n      // 業務ロジックを使用したアクセス制御付きデータ取得\n      if (getProgressDataWithAccessControl) {\n        const accessControlledData = getProgressDataWithAccessControl({\n          userId: window.currentUser?.userId,\n          documents: filteredDocuments\n        });\n        filteredDocuments = accessControlledData.accessibleDocuments || filteredDocuments;\n      }\n      \n      // 結果の表示\n      renderRows(filteredDocuments);\n      \n      // 文書リストの表示\n      if (documentList) {\n        documentList.style.display = 'block';\n      }\n      \n      // 成功通知\n      window.aivicNotify?.success(`${filteredDocuments.length}件の文書が見つかりました`);\n      \n    } catch (error) {\n      console.error('検索エラー:', error);\n      window.aivicNotify?.error('検索中にエラーが発生しました: ' + error.message);\n    }\n  }\n  \n  // 初期化処理\n  function initialize() {\n    // 文書種別選択肢の設定\n    if (documentTypeSelect) {\n      const documentTypes = [...new Set(documents.map(d => d.申請種別).filter(Boolean))];\n      documentTypeSelect.innerHTML = '<option value=\"\">すべて</option>' + \n        documentTypes.map(type => `<option value=\"${type}\">${type}</option>`).join('');\n    }\n    \n    // 承認状態選択肢の設定\n    if (approvalStatusSelect) {\n      const statuses = ['申請中', '承認済', '却下', '取下げ'];\n      approvalStatusSelect.innerHTML = '<option value=\"\">すべて</option>' + \n        statuses.map(status => `<option value=\"${status}\">${status}</option>`).join('');\n    }\n    \n    // 処理ルート選択肢の設定\n    if (processRouteSelect) {\n      const routes = [...new Set(documents.map(d => d.処理ルート).filter(Boolean))];\n      processRouteSelect.innerHTML = '<option value=\"\">すべて</option>' + \n        routes.map(route => `<option value=\"${route}\">${route}</option>`).join('');\n    }\n    \n    // 初期表示（全件表示）\n    renderRows(documents);\n    \n    // 文書リストを表示状態にする\n    if (documentList) {\n      documentList.style.display = 'block';\n    }\n  }\n  \n  // イベントリスナーの設定\n  if (searchButton) {\n    searchButton.addEventListener('click', performSearch);\n  }\n  \n  // Enterキーでの検索\n  [searchKeyword, applicantName, approverName].forEach(input => {\n    if (input) {\n      input.addEventListener('keypress', (e) => {\n        if (e.key === 'Enter') {\n          performSearch();\n        }\n      });\n    }\n  });\n  \n  // 選択肢変更時の自動検索\n  [documentTypeSelect, approvalStatusSelect, processRouteSelect].forEach(select => {\n    if (select) {\n      select.addEventListener('change', performSearch);\n    }\n  });\n  \n  // 日付変更時の自動検索\n  [dateFrom, dateTo].forEach(dateInput => {\n    if (dateInput) {\n      dateInput.addEventListener('change', performSearch);\n    }\n  });\n  \n  // チェックボックス変更時の自動検索\n  if (subsidyHigh) {\n    subsidyHigh.addEventListener('change', performSearch);\n  }\n  \n  // 初期化実行\n  initialize();\n}";
</script>

      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);

      error: function(msg) { show("❌ " + msg, "error"); },

    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";

      list: async function(tableIndex) {

    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
