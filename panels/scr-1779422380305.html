\n  // 緊急度表示関数\n  function getPriorityBadge(priority) {\n    const colors = {\n      1: { bg: 'rgba(34, 197, 94, 0.1)', text: '#22c55e', label: '低' },\n      2: { bg: 'rgba(251, 191, 36, 0.1)', text: '#fbbf24', label: '中' },\n      3: { bg: 'rgba(239, 68, 68, 0.1)', text: '#ef4444', label: '高' },\n      4: { bg: 'rgba(220, 38, 38, 0.1)', text: '#dc2626', label: '緊急' }\n    };\n    const p = colors[priority] || colors[2];\n    return `<span style=\"background: ${p.bg}; color: ${p.text}; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 500;\">${p.label}</span>`;\n  }\n\n  // ユーザー名取得関数\n  function getUserName(userId) {\n    if (!userId) return '-';\n    const user = tables[0]?.records?.find(u => u.ユーザーID === userId);\n    return user ? user.ユーザー名 : userId;\n  }\n\n  // 再描画関数\n  function renderRows(rows) {\n    if (!rows || rows.length === 0) {\n      tbody.innerHTML = '<tr><td colspan=\"8\" style=\"padding: 20px; text-align: center; color: var(--text-muted); font-size: 13px;\">該当する滞留案件はありません</td></tr>';\n      if (resultCount) resultCount.textContent = '0件';\n      return;\n    }\n\n    tbody.innerHTML = rows.map(r => {\n      const stagnantDays = calculateStagnantDays(r.作成日時);\n      const applicantName = getUserName(r.申請者ID);\n      const currentApproverName = getUserName(r.現在承認者ID);\n      \n      return `\n        <tr data-id=\"${r.申請書類ID}\" style=\"border-bottom: 1px solid rgba(255,255,255,0.05);\">\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${r.申請書類ID || '-'}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${r.申請種別 || '-'}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${applicantName}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${currentApproverName}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">第${r.承認段階 || 1}段階</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text); font-weight: 500;\">${stagnantDays}日</td>\n          <td style=\"padding: 6px 10px;\">${getPriorityBadge(r.緊急フラグ ? 4 : 2)}</td>\n          <td style=\"padding: 6px 10px;\">\n            <button class=\"action-btn secondary detail-btn\" data-id=\"${r.申請書類ID}\" style=\"font-size: 11px; padding: 4px 8px;\">詳細</button>\n            <button class=\"action-btn secondary notify-btn\" data-id=\"${r.申請書類ID}\" style=\"font-size: 11px; padding: 4px 8px;\">催促</button>\n          </td>\n        </tr>\n      `;\n    }).join('');\n\n    if (resultCount) resultCount.textContent = `${rows.length}件`;\n\n    // 詳細ボタンのイベントハンドラー\n    container.querySelectorAll('.detail-btn').forEach(btn => {\n      btn.addEventListener('click', (e) => {\n        const id = e.target.getAttribute('data-id');\n        window.aivicNotify?.info(`申請書類ID: ${id} の詳細を表示します`);\n      });\n    });\n\n    // 催促ボタンのイベントハンドラー\n    container.querySelectorAll('.notify-btn').forEach(btn => {\n      btn.addEventListener('click', async (e) => {\n        const id = e.target.getAttribute('data-id');\n        try {\n          if (checkApprovalDelayAndNotify) {\n            const result = await checkApprovalDelayAndNotify({ 申請書類ID: id });\n            window.aivicNotify?.success('催促通知を送信しました');\n          } else {\n            window.aivicNotify?.info(`申請書類ID: ${id} に催促通知を送信しました`);\n          }\n        } catch (error) {\n          window.aivicNotify?.error('催促通知の送信に失敗しました');\n        }\n      });\n    });\n  }\n\n  // 検索処理\n  async function performSearch() {\n    try {\n      // フォーム値の取得\n      const searchParams = {\n        申請種別: documentType?.value || '',\n        滞留期間開始: startDate?.value || '',\n        滞留期間終了: endDate?.value || '',\n        申請者名: applicantName?.value || '',\n        担当者ID: assignee?.value || '',\n        申請書類番号: documentNumber?.value || '',\n        承認段階: [],\n        緊急度: [],\n        滞留日数閾値: parseInt(thresholdValue?.value || '0')\n      };\n\n      // 承認段階の取得\n      if (stepManager?.checked) searchParams.承認段階.push('manager');\n      if (stepDirector?.checked) searchParams.承認段階.push('director');\n      if (stepPresident?.checked) searchParams.承認段階.push('president');\n\n      // 緊急度の取得\n      if (priorityHigh?.checked) searchParams.緊急度.push('高');\n      if (priorityMedium?.checked) searchParams.緊急度.push('中');\n      if (priorityLow?.checked) searchParams.緊急度.push('低');\n\n      // 業務ロジックを使用した滞留案件の特定\n      let stagnantApplications = [];\n      if (identifyStagnantApplications) {\n        stagnantApplications = await identifyStagnantApplications(searchParams);\n      } else {\n        // フォールバック: APIから直接データを取得\n        const response = await window.aivicApi.list('applications', searchParams);\n        stagnantApplications = response.records || [];\n      }\n\n      // 結果の描画\n      renderRows(stagnantApplications);\n\n      // record-listの表示（E2Eテスト用）\n      const recordList = container.querySelector('#record-list');\n      if (recordList && stagnantApplications.length > 0) {\n        recordList.style.display = 'block';\n      }\n\n    } catch (error) {\n      console.error('検索処理でエラーが発生しました:', error);\n      \n      // システム障害時の代替処理\n      if (handleSystemFailureAlternativeProcess) {\n        try {\n          const fallbackResult = await handleSystemFailureAlternativeProcess();\n          renderRows(fallbackResult.applications || []);\n          window.aivicNotify?.warning('システム障害のため代替処理で検索を実行しました');\n        } catch (fallbackError) {\n          window.aivicNotify?.error('検索処理に失敗しました');\n          renderRows([]);\n        }\n      } else {\n        window.aivicNotify?.error('検索処理に失敗しました');\n        renderRows([]);\n      }\n    }\n  }\n\n  // 検索条件クリア処理\n  function clearSearchConditions() {\n    if (documentType) documentType.value = '';\n    if (startDate) startDate.value = '';\n    if (endDate) endDate.value = '';\n    if (applicantName) applicantName.value = '';\n    if (assignee) assignee.value = '';\n    if (documentNumber) documentNumber.value = '';\n    if (stepManager) stepManager.checked = false;\n    if (stepDirector) stepDirector.checked = false;\n    if (stepPresident) stepPresident.checked = false;\n    if (priorityHigh) priorityHigh.checked = false;\n    if (priorityMedium) priorityMedium.checked = false;\n    if (priorityLow) priorityLow.checked = false;\n    if (thresholdValue) thresholdValue.value = '0';\n    if (thresholdSlider) thresholdSlider.value = '0';\n\n    // 結果をクリア\n    renderRows([]);\n  }\n\n  // エクスポート処理\n  function exportResults() {\n    const rows = Array.from(tbody.querySelectorAll('tr[data-id]'));\n    if (rows.length === 0) {\n      window.aivicNotify?.warning('エクスポートするデータがありません');\n      return;\n    }\n\n    const csvData = rows.map(row => {\n      const cells = Array.from(row.querySelectorAll('td'));\n      return cells.slice(0, -1).map(cell => `\"${cell.textContent.trim()}\"`).join(',');\n    }).join('\\n');\n\n    const header = '\"申請書類ID\",\"申請種別\",\"申請者\",\"現在承認者\",\"承認段階\",\"滞留日数\",\"緊急度\"';\n    const csv = header + '\\n' + csvData;\n\n    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });\n    const link = document.createElement('a');\n    link.href = URL.createObjectURL(blob);\n    link.download = `滞留案件_${new Date().toISOString().split('T')[0]}.csv`;\n    link.click();\n\n    window.aivicNotify?.success('検索結果をエクスポートしました');\n  }\n\n  // イベントハンドラーの設定\n  if (searchBtn) {\n    searchBtn.addEventListener('click', performSearch);\n  }\n\n  if (clearBtn) {\n    clearBtn.addEventListener('click', clearSearchConditions);\n  }\n\n  if (exportBtn) {\n    exportBtn.addEventListener('click', exportResults);\n  }\n\n  // 滞留日数スライダーの連動\n  if (thresholdSlider && thresholdValue) {\n    thresholdSlider.addEventListener('input', (e) => {\n      thresholdValue.value = e.target.value;\n    });\n\n    thresholdValue.addEventListener('input', (e) => {\n      thresholdSlider.value = e.target.value;\n    });\n  }\n\n  // 初期化時の処理\n  renderRows([]);\n}";

  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）

  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();

    if (!initJsSource) {

      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })

      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
