<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ハイブリッド申請承認システム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-main: #ffffff;
            --bg-card: #f8fafc;
            --bg-sidebar: #f1f5f9;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-muted: #64748b;
            --text-light: #94a3b8;
            --top-bar-bg: #ffffff;
            --top-bar-border: #e2e8f0;
            --success: #059669;
            --warning: #d97706;
            --danger: #dc2626;
            --radius: 8px;
            --radius-sm: 6px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 13px;
            line-height: 1.4;
            color: var(--text);
            background: var(--bg-main);
        }

        .app-layout {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--top-bar-bg);
        }

        .logo {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }

        .nav-section {
            padding: 12px 0;
        }

        .nav-section-title {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0 16px 8px;
        }

        .nav-item {
            display: block;
            padding: 6px 16px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .nav-item:hover {
            background: rgba(59, 130, 246, 0.08);
            color: var(--primary);
        }

        .nav-item.aivic-active {
            background: rgba(59, 130, 246, 0.12);
            color: var(--primary);
            font-weight: 500;
            border-right: 2px solid var(--primary);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            height: 52px;
            background: var(--top-bar-bg);
            border-bottom: 1px solid var(--top-bar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .breadcrumb {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 500;
        }

        .logout-link {
            font-size: 12px;
            color: var(--text-muted);
            text-decoration: none;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            transition: background 0.15s ease;
        }

        .logout-link:hover {
            background: var(--bg-card);
        }

        .content-area {
            flex: 1;
            overflow: auto;
            padding: 16px 20px;
        }

        .panel-container {
            height: 100%;
            background: var(--bg-main);
        }

        .status-indicator {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .status-pending { background: var(--warning); }
        .status-approved { background: var(--success); }
        .status-rejected { background: var(--danger); }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .badge-primary {
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary);
        }

        .badge-success {
            background: rgba(5, 150, 105, 0.1);
            color: var(--success);
        }

        .badge-warning {
            background: rgba(217, 119, 6, 0.1);
            color: var(--warning);
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            margin-bottom: 12px;
        }

        .card-header {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
            background: var(--bg-main);
            color: var(--text);
        }

        .btn:hover {
            background: var(--bg-card);
            border-color: var(--primary);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .table th,
        .table td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .table th {
            font-weight: 500;
            color: var(--text-muted);
            background: var(--bg-card);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .table tbody tr:hover {
            background: rgba(59, 130, 246, 0.02);
        }

        .loading-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--text-light);
            font-size: 12px;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            
            .content-area {
                padding: 12px 16px;
            }
        }
    </style>

equired":false,"description":"設定に関する補足説明"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"補助金関連度マスタ","purpose":"申請書類と補助金制度の関連度を管理し、適切な承認フローや処理ルートの決定に使用するマスタテーブル","columns":[{"name":"補助金関連度ID","type":"uuid","required":true,"description":"補助金関連度の一意識別子（主キー）"},{"name":"補助金関連度コード","type":"varchar(100)","required":true,"description":"補助金関連度の業務コード（表示・検索用）"},{"name":"補助金関連度名","type":"varchar(100)","required":true,"description":"補助金関連度の名称"},{"name":"関連度レベル","type":"integer","required":true,"description":"関連度の数値レベル（1:低、2:中、3:高など）"},{"name":"説明","type":"text","required":false,"description":"補助金関連度の詳細説明"},{"name":"表示順","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"マスタデータの有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]}];

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  const tbody = container.querySelector('#stagnant-cases-tbody');\n  const thresholdSlider = container.querySelector('#threshold-slider');\n  const thresholdValue = container.querySelector('#threshold-value');\n\n  // スライダー値の表示更新\n  thresholdSlider.addEventListener('input', (e) => {\n    thresholdValue.textContent = e.target.value;\n  });\n\n  // 滞留日数を計算する関数\n  function calculateStagnantDays(createdDate) {\n    const created = new Date(createdDate);\n    const now = new Date();\n    const diffTime = Math.abs(now - created);\n    return Math.ceil(diffTime / (1000 * 60 * 60 * 24));\n  }\n\n  // 緊急度を表示用に変換\n  function getPriorityLabel(priority) {\n    const labels = { 1: '低', 2: '通常', 3: '高', 4: '緊急' };\n    return labels[priority] || '通常';\n  }\n\n  // 緊急度に応じた色を取得\n  function getPriorityColor(priority) {\n    const colors = { \n      1: '#6b7280', \n      2: '#3b82f6', \n      3: '#f59e0b', \n      4: '#ef4444' \n    };\n    return colors[priority] || '#3b82f6';\n  }\n\n  // テーブル再描画関数\n  function renderRows(rows) {\n    tbody.innerHTML = rows.map(r => {\n      const stagnantDays = calculateStagnantDays(r.作成日時 || new Date().toISOString());\n      const priorityLabel = getPriorityLabel(r.優先度);\n      const priorityColor = getPriorityColor(r.優先度);\n      \n      return `\n        <tr data-id=\"${r.id}\" style=\"border-bottom: 1px solid rgba(255,255,255,0.05);\">\n          <td style=\"padding: 6px 10px; font-size: 13px;\">\n            <input type=\"checkbox\" class=\"row-checkbox\" data-id=\"${r.id}\" style=\"accent-color: var(--primary);\">\n          </td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${r.申請書類ID || ''}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${r.申請者名 || ''}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${r.申請種別 || ''}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${r.申請タイトル || ''}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${r.現在承認者名 || ''}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${r.承認段階 || 1}次</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text); font-weight: 600;\">${stagnantDays}日</td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">\n            <span style=\"padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 500; background: ${priorityColor}20; color: ${priorityColor};\">${priorityLabel}</span>\n          </td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">\n            <button class=\"action-btn secondary view-btn\" data-id=\"${r.id}\" onclick=\"window.showScreen('scr-1779422434952')\" style=\"margin-right: 4px;\">詳細</button>\n            <button class=\"action-btn secondary approve-btn\" data-id=\"${r.id}\" onclick=\"window.showScreen('scr-1779422407913')\">承認</button>\n          </td>\n        </tr>\n      `;\n    }).join('');\n  }\n\n  // 初期データ表示\n  renderRows(tables[1]?.records || []);\n\n  // 全選択チェックボックス\n  container.querySelector('#select-all').addEventListener('change', (e) => {\n    const checkboxes = container.querySelectorAll('.row-checkbox');\n    checkboxes.forEach(cb => cb.checked = e.target.checked);\n  });\n\n  // 検索ボタン\n  container.querySelector('#btn-search').addEventListener('click', async () => {\n    const startDate = container.querySelector('#start-date').value;\n    const endDate = container.querySelector('#end-date').value;\n    const documentType = container.querySelector('#document-type').value;\n    const assignee = container.querySelector('#assignee').value;\n    const applicantName = container.querySelector('#applicant-name').value;\n    const documentNumber = container.querySelector('#document-number').value;\n    const threshold = parseInt(container.querySelector('#threshold-slider').value);\n    const selectedSteps = Array.from(container.querySelectorAll('input[type=\"checkbox\"][data-testid^=\"step-\"]:checked')).map(cb => cb.value);\n    const priority = container.querySelector('input[name=\"priority\"]:checked')?.value;\n\n    const rows = await window.aivicApi.list(1);\n    if (!rows) return;\n\n    const filtered = rows.filter(r => {\n      const stagnantDays = calculateStagnantDays(r.作成日時 || new Date().toISOString());\n      \n      // 滞留日数フィルタ\n      if (stagnantDays < threshold) return false;\n      \n      // 日付範囲フィルタ\n      if (startDate && new Date(r.作成日時) < new Date(startDate)) return false;\n      if (endDate && new Date(r.作成日時) > new Date(endDate)) return false;\n      \n      // 文書種別フィルタ\n      if (documentType && r.申請種別 !== documentType) return false;\n      \n      // 担当者フィルタ\n      if (assignee && r.現在承認者名 !== assignee) return false;\n      \n      // 申請者名フィルタ\n      if (applicantName && !r.申請者名?.includes(applicantName)) return false;\n      \n      // 申請書類番号フィルタ\n      if (documentNumber && !r.申請書類ID?.includes(documentNumber)) return false;\n      \n      // 承認ステップフィルタ\n      if (selectedSteps.length > 0 && !selectedSteps.includes(String(r.承認段階))) return false;\n      \n      // 緊急度フィルタ\n      if (priority && String(r.優先度) !== priority) return false;\n      \n      return true;\n    });\n\n    renderRows(filtered);\n  });\n\n  // 条件クリアボタン\n  container.querySelector('#btn-clear').addEventListener('click', () => {\n    container.querySelector('#start-date').value = '';\n    container.querySelector('#end-date').value = '';\n    container.querySelector('#document-type').value = '';\n    container.querySelector('#assignee').value = '';\n    container.querySelector('#applicant-name').value = '';\n    container.querySelector('#document-number').value = '';\n    container.querySelector('#threshold-slider').value = '7';\n    thresholdValue.textContent = '7';\n    container.querySelectorAll('input[type=\"checkbox\"]').forEach(cb => cb.checked = false);\n    container.querySelectorAll('input[type=\"radio\"]').forEach(rb => rb.checked = false);\n    \n    // 全データを再表示\n    window.aivicApi.list(1).then(rows => {\n      if (rows) renderRows(rows);\n    });\n  });\n\n  // CSVエクスポートボタン\n  container.querySelector('#btn-export').addEventListener('click', async () => {\n    const rows = await window.aivicApi.list(1);\n    if (!rows) return;\n\n    const headers = ['申請書類番号', '申請者', '文書種別', '申請タイトル', '現在承認者', '承認段階', '滞留日数', '緊急度', '作成日時'];\n    const csvData = [headers.join(',')];\n    \n    rows.forEach(r => {\n      const stagnantDays = calculateStagnantDays(r.作成日時 || new Date().toISOString());\n      const priorityLabel = getPriorityLabel(r.優先度);\n      const row = [\n        r.申請書類ID || '',\n        r.申請者名 || '',\n        r.申請種別 || '',\n        r.申請タイトル || '',\n        r.現在承認者名 || '',\n        `${r.承認段階 || 1}次`,\n        `${stagnantDays}日`,\n        priorityLabel,\n        r.作成日時 || ''\n      ];\n      csvData.push(row.map(field => `\"${field}\"`).join(','));\n    });\n\n    const csv = '\\uFEFF' + csvData.join('\\n');\n    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });\n    const link = document.createElement('a');\n    link.href = URL.createObjectURL(blob);\n    link.download = 'stagnant_cases.csv';\n    link.click();\n  });\n\n  // 催促通知ボタン\n  container.querySelector('#btn-notify').addEventListener('click', () => {\n    const selectedIds = Array.from(container.querySelectorAll('.row-checkbox:checked')).map(cb => cb.dataset.id);\n    if (selectedIds.length === 0) {\n      alert('通知対象の案件を選択してください。');\n      return;\n    }\n    \n    // 催促通知処理画面に遷移\n    window.showScreen('scr-1779422392638');\n  });\n\n  // 初期データ読み込み\n  window.aivicApi.list(1).then(rows => {\n    if (rows) renderRows(rows);\n  });\n}";
</script>
