window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  const tbody = container.querySelector(\"#progress-tbody\");\n  const totalCountEl = container.querySelector(\"#total-count\");\n  const modal = container.querySelector(\"#progress-modal\");\n  \n  // ユーザーデータの取得（申請者名表示用）\n  let users = [];\n  let documentTypes = [];\n  \n  async function loadReferenceData() {\n    try {\n      users = await window.aivicApi.list(0) || []; // ユーザーテーブル\n      documentTypes = await window.aivicApi.list(2) || []; // 文書種別マスタ\n    } catch (error) {\n      console.error(\"参照データの読み込みに失敗:\", error);\n    }\n  }\n  \n  function getUserName(userId) {\n    const user = users.find(u => u.ユーザーID === userId);\n    return user ? user.氏名 : \"不明\";\n  }\n  \n  function getDocumentTypeName(typeId) {\n    const docType = documentTypes.find(dt => dt.文書種別ID === typeId);\n    return docType ? docType.文書種別名 : \"不明\";\n  }\n  \n  function getStatusBadge(status) {\n    const statusColors = {\n      \"申請中\": \"background: #1e40af; color: #dbeafe;\",\n      \"承認済\": \"background: #16a34a; color: #dcfce7;\",\n      \"却下\": \"background: #dc2626; color: #fecaca;\",\n      \"取下げ\": \"background: #6b7280; color: #f3f4f6;\",\n      \"保留\": \"background: #d97706; color: #fed7aa;\"\n    };\n    const style = statusColors[status] || \"background: #6b7280; color: #f3f4f6;\";\n    return `<span style=\"padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 500; ${style}\">${status}</span>`;\n  }\n  \n  function getProgressBar(currentStep, totalSteps) {\n    const progress = Math.round((currentStep / totalSteps) * 100);\n    return `\n      <div style=\"width: 80px; background: rgba(255,255,255,0.1); border-radius: 10px; height: 6px; position: relative;\">\n        <div style=\"width: ${progress}%; background: var(--primary); border-radius: 10px; height: 100%;\"></div>\n      </div>\n      <span style=\"font-size: 11px; color: var(--text-muted); margin-left: 4px;\">${currentStep}/${totalSteps}</span>\n    `;\n  }\n  \n  function isDelayed(createdDate, currentStep) {\n    const created = new Date(createdDate);\n    const now = new Date();\n    const daysDiff = Math.floor((now - created) / (1000 * 60 * 60 * 24));\n    // 簡易的な遅延判定（3日以上経過している場合）\n    return daysDiff > 3 && currentStep > 0;\n  }\n  \n  function renderRows(rows) {\n    if (!rows || rows.length === 0) {\n      tbody.innerHTML = '<tr><td colspan=\"10\" style=\"text-align: center; padding: 20px; color: var(--text-muted);\">データがありません</td></tr>';\n      totalCountEl.textContent = \"0\";\n      return;\n    }\n    \n    tbody.innerHTML = rows.map(row => {\n      const applicantName = getUserName(row.申請者ID);\n      const docTypeName = getDocumentTypeName(row.申請種別);\n      const currentApproverName = row.現在承認者ID ? getUserName(row.現在承認者ID) : \"-\";\n      const statusBadge = getStatusBadge(row.承認状態);\n      const progressBar = getProgressBar(row.承認段階 || 1, 3); // 仮に3段階とする\n      const delayed = isDelayed(row.作成日時, row.承認段階);\n      const delayedBadge = delayed ? '<span style=\"color: #dc2626; font-size: 11px;\">⚠ 遅延</span>' : \"-\";\n      const createdDate = new Date(row.作成日時).toLocaleDateString('ja-JP');\n      \n      return `\n        <tr data-id=\"${row.申請書類ID}\" style=\"border-bottom: 1px solid rgba(255,255,255,0.05);\">\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${row.申請書類ID?.slice(-8) || \"\"}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${applicantName}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${docTypeName}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${row.申請タイトル || \"\"}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${createdDate}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">${statusBadge}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${currentApproverName}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; display: flex; align-items: center;\">${progressBar}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">${delayedBadge}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">\n            <button class=\"action-btn secondary detail-btn\" data-id=\"${row.申請書類ID}\" style=\"background: transparent; color: var(--text); border: 1px solid rgba(255,255,255,0.18); padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; margin-right: 4px;\">詳細</button>\n            <button class=\"action-btn secondary progress-btn\" data-id=\"${row.申請書類ID}\" style=\"background: transparent; color: var(--text); border: 1px solid rgba(255,255,255,0.18); padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer;\">進捗</button>\n          </td>\n        </tr>\n      `;\n    }).join(\"\");\n    \n    totalCountEl.textContent = rows.length.toString();\n  }\n  \n  async function loadAndRenderData() {\n    try {\n      const applications = await window.aivicApi.list(1) || []; // 申請書類テーブル\n      renderRows(applications);\n    } catch (error) {\n      console.error(\"データの読み込みに失敗:\", error);\n      renderRows([]);\n    }\n  }\n  \n  function filterData() {\n    const applicationId = container.querySelector(\"#search-application-id\").value.trim();\n    const applicantName = container.querySelector(\"#search-applicant-name\").value.trim();\n    const documentType = container.querySelector(\"#filter-document-type\").value;\n    const approvalStatus = container.querySelector(\"#filter-approval-status\").value;\n    const dateFrom = container.querySelector(\"#filter-date-from\").value;\n    const dateTo = container.querySelector(\"#filter-date-to\").value;\n    const delayedOnly = container.querySelector(\"#filter-delayed\").checked;\n    \n    window.aivicApi.list(1).then(applications => {\n      let filtered = applications.filter(app => {\n        // 申請番号フィルター\n        if (applicationId && !app.申請書類ID?.includes(applicationId)) return false;\n        \n        // 申請者名フィルター\n        if (applicantName) {\n          const userName = getUserName(app.申請者ID);\n          if (!userName.includes(applicantName)) return false;\n        }\n        \n        // 文書種別フィルター\n        if (documentType) {\n          const docTypeName = getDocumentTypeName(app.申請種別);\n          if (docTypeName !== documentType) return false;\n        }\n        \n        // 承認状況フィルター\n        if (approvalStatus && app.承認状態 !== approvalStatus) return false;\n        \n        // 申請日フィルター\n        if (dateFrom || dateTo) {\n          const appDate = new Date(app.作成日時);\n          if (dateFrom && appDate < new Date(dateFrom)) return false;\n          if (dateTo && appDate > new Date(dateTo + \"T23:59:59\")) return false;\n        }\n        \n        // 遅延案件フィルター\n        if (delayedOnly && !isDelayed(app.作成日時, app.承認段階)) return false;\n        \n        return true;\n      });\n      \n      renderRows(filtered);\n    });\n  }\n  \n  function exportCSV() {\n    window.aivicApi.list(1).then(applications => {\n      const headers = [\"申請番号\", \"申請者\", \"文書種別\", \"申請タイトル\", \"申請日\", \"承認状況\", \"現在承認者\", \"承認段階\"];\n      const csvContent = [\n        headers.join(\",\"),\n        ...applications.map(app => [\n          app.申請書類ID?.slice(-8) || \"\",\n          getUserName(app.申請者ID),\n          getDocumentTypeName(app.申請種別),\n          app.申請タイトル || \"\",\n          new Date(app.作成日時).toLocaleDateString('ja-JP'),\n          app.承認状態 || \"\",\n          app.現在承認者ID ? getUserName(app.現在承認者ID) : \"\",\n          app.承認段階 || \"\"\n        ].map(field => `\"${field}\"`).join(\",\"))\n      ].join(\"\\n\");\n      \n      const blob = new Blob([\"\\uFEFF\" + csvContent], { type: \"text/csv;charset=utf-8;\" });\n      const link = document.createElement(\"a\");\n      link.href = URL.createObjectURL(blob);\n      link.download = \"progress_report.csv\";\n      link.click();\n    });\n  }\n  \n  async function showProgressModal(applicationId) {\n    try {\n      // 申請書類の詳細を取得\n      const applications = await window.aivicApi.list(1);\n      const application = applications.find(app => app.申請書類ID === applicationId);\n      if (!application) return;\n      \n      // 承認履歴を取得\n      const approvalHistory = await window.aivicApi.list(5) || []; // 承認履歴テーブル\n      const appHistory = approvalHistory.filter(h => h.申請書類ID === applicationId);\n      \n      // モーダル内容を更新\n      container.querySelector(\"#modal-application-id\").textContent = applicationId.slice(-8);\n      \n      // 進捗フローの表示\n      const progressFlow = container.querySelector(\"#progress-flow\");\n      const steps = [\"申請\", \"1次承認\", \"2次承認\", \"完了\"];\n      const currentStep = application.承認段階 || 1;\n      \n      progressFlow.innerHTML = steps.map((step, index) => {\n        const isActive = index < currentStep;\n        const isCurrent = index === currentStep - 1;\n        const style = isActive \n          ? \"background: var(--primary); color: #fff;\" \n          : isCurrent \n            ? \"background: #d97706; color: #fff;\"\n            : \"background: rgba(255,255,255,0.1); color: var(--text-muted);\";\n        \n        return `\n          <div style=\"padding: 6px 12px; border-radius: 16px; font-size: 11px; font-weight: 500; ${style}\">\n            ${step}\n          </div>\n          ${index < steps.length - 1 ? '<div style=\"width: 20px; height: 2px; background: rgba(255,255,255,0.2);\"></div>' : ''}\n        `;\n      }).join(\"\");\n      \n      // 承認履歴の表示\n      const historyContainer = container.querySelector(\"#approval-history\");\n      if (appHistory.length > 0) {\n        historyContainer.innerHTML = appHistory.map(h => {\n          const approverName = getUserName(h.承認者ID);\n          const date = new Date(h.承認日時).toLocaleString('ja-JP');\n          const resultColor = h.承認結果 === \"承認\" ? \"#16a34a\" : h.承認結果 === \"却下\" ? \"#dc2626\" : \"#d97706\";\n          \n          return `\n            <div style=\"padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.1);\">\n              <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;\">\n                <span style=\"font-size: 13px; font-weight: 500; color: var(--text);\">${approverName}</span>\n                <span style=\"font-size: 11px; color: var(--text-muted);\">${date}</span>\n              </div>\n              <div style=\"display: flex; align-items: center; gap: 8px;\">\n                <span style=\"padding: 2px 6px; border-radius: 8px; font-size: 10px; font-weight: 500; background: ${resultColor}; color: #fff;\">${h.承認結果}</span>\n                ${h.承認コメント ? `<span style=\"font-size: 12px; color: var(--text-muted);\">${h.承認コメント}</span>` : ''}\n              </div>\n            </div>\n          `;\n        }).join(\"\");\n      } else {\n        historyContainer.innerHTML = '<div style=\"text-align: center; color: var(--text-muted); font-size: 12px;\">承認履歴がありません</div>';\n      }\n      \n      modal.style.display = \"block\";\n    } catch (error) {\n      console.error(\"進捗詳細の取得に失敗:\", error);\n    }\n  }\n  \n  // イベントリスナーの設定\n  container.querySelector(\"#btn-search\").addEventListener(\"click\", filterData);\n  container.querySelector(\"#btn-export\").addEventListener(\"click\", exportCSV);\n  \n  container.querySelector(\"#close-modal\").addEventListener(\"click\", () => {\n    modal.style.display = \"none\";\n  });\n  \n  modal.addEventListener(\"click\", (e) => {\n    if (e.target === modal) {\n      modal.style.display = \"none\";\n    }\n  });\n  \n  // 行レベル操作のイベントデリゲーション\n  container.addEventListener(\"click\", async (e) => {\n    const detailBtn = e.target.closest(\".detail-btn\");\n    const progressBtn = e.target.closest(\".progress-btn\");\n    \n    if (detailBtn) {\n      const applicationId = detailBtn.dataset.id;\n      window.showScreen(\"scr-1779349647621\"); // 申請書類確認画面\n    }\n    \n    if (progressBtn) {\n      const applicationId = progressBtn.dataset.id;\n      showProgressModal(applicationId);\n    }\n  });\n  \n  // 初期化\n  loadReferenceData().then(() => {\n    loadAndRenderData();\n  });\n}";
</script>

    function ensureContainer() {

      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");

    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||

    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
