<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ハイブリッド申請承認システム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-main: #ffffff;
            --bg-card: #f8fafc;
            --bg-sidebar: #f1f5f9;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-muted: #64748b;
            --text-light: #94a3b8;
            --top-bar-bg: #ffffff;
            --top-bar-border: #e2e8f0;
            --success: #059669;
            --warning: #d97706;
            --danger: #dc2626;
            --radius: 8px;
            --radius-sm: 6px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 13px;
            line-height: 1.4;
            color: var(--text);
            background: var(--bg-main);
        }

        .app-layout {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--top-bar-bg);
        }

        .logo {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }

        .nav-section {
            padding: 12px 0;
        }

        .nav-section-title {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0 16px 8px;
        }

        .nav-item {
            display: block;
            padding: 6px 16px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .nav-item:hover {
            background: rgba(59, 130, 246, 0.08);
            color: var(--primary);
        }

        .nav-item.aivic-active {
            background: rgba(59, 130, 246, 0.12);
            color: var(--primary);
            font-weight: 500;
            border-right: 2px solid var(--primary);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            height: 52px;
            background: var(--top-bar-bg);
            border-bottom: 1px solid var(--top-bar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .breadcrumb {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 500;
        }

        .logout-link {
            font-size: 12px;
            color: var(--text-muted);
            text-decoration: none;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            transition: background 0.15s ease;
        }

        .logout-link:hover {
            background: var(--bg-card);
        }

        .content-area {
            flex: 1;
            overflow: auto;
            padding: 16px 20px;
        }

        .panel-container {
            height: 100%;
            background: var(--bg-main);
        }

        .status-indicator {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .status-pending { background: var(--warning); }
        .status-approved { background: var(--success); }
        .status-rejected { background: var(--danger); }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .badge-primary {
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary);
        }

        .badge-success {
            background: rgba(5, 150, 105, 0.1);
            color: var(--success);
        }

        .badge-warning {
            background: rgba(217, 119, 6, 0.1);
            color: var(--warning);
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            margin-bottom: 12px;
        }

        .card-header {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
            background: var(--bg-main);
            color: var(--text);
        }

        .btn:hover {
            background: var(--bg-card);
            border-color: var(--primary);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .table th,
        .table td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .table th {
            font-weight: 500;
            color: var(--text-muted);
            background: var(--bg-card);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .table tbody tr:hover {
            background: rgba(59, 130, 246, 0.02);
        }

        .loading-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--text-light);
            font-size: 12px;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            
            .content-area {
                padding: 12px 16px;
            }
        }
    </style>

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let currentFile = null;\n  let analysisResult = null;\n\n  // ログ出力関数\n  function addLog(message) {\n    const logArea = container.querySelector('#processing-log');\n    const timestamp = new Date().toLocaleTimeString();\n    logArea.innerHTML += `\\n[${timestamp}] ${message}`;\n    logArea.scrollTop = logArea.scrollHeight;\n  }\n\n  // ファイルアップロード処理\n  const uploadArea = container.querySelector('#upload-area');\n  const fileInput = container.querySelector('#file-input');\n  const fileInfo = container.querySelector('#file-info');\n\n  // ドラッグ＆ドロップ\n  uploadArea.addEventListener('dragover', (e) => {\n    e.preventDefault();\n    uploadArea.style.borderColor = 'var(--primary)';\n  });\n\n  uploadArea.addEventListener('dragleave', (e) => {\n    e.preventDefault();\n    uploadArea.style.borderColor = 'rgba(255,255,255,0.18)';\n  });\n\n  uploadArea.addEventListener('drop', (e) => {\n    e.preventDefault();\n    uploadArea.style.borderColor = 'rgba(255,255,255,0.18)';\n    const files = e.dataTransfer.files;\n    if (files.length > 0) {\n      handleFileSelect(files[0]);\n    }\n  });\n\n  // ファイル選択\n  fileInput.addEventListener('change', (e) => {\n    if (e.target.files.length > 0) {\n      handleFileSelect(e.target.files[0]);\n    }\n  });\n\n  // ファイル処理\n  function handleFileSelect(file) {\n    currentFile = file;\n    fileInfo.textContent = `選択ファイル: ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;\n    addLog(`ファイル選択: ${file.name}`);\n    \n    // プレビュー表示\n    const preview = container.querySelector('#document-preview');\n    if (file.type.startsWith('image/')) {\n      const reader = new FileReader();\n      reader.onload = (e) => {\n        preview.innerHTML = `<img src=\"${e.target.result}\" style=\"max-width: 100%; max-height: 100%; object-fit: contain;\">`;\n      };\n      reader.readAsDataURL(file);\n    } else {\n      preview.innerHTML = `<div style=\"color: var(--text-muted);\">${file.name}<br>プレビュー対応形式: 画像ファイル</div>`;\n    }\n\n    // 自動解析実行\n    performAnalysis(file);\n  }\n\n  // 文書解析処理\n  async function performAnalysis(file) {\n    addLog('文書解析を開始...');\n    \n    // シミュレーション: 実際のOCR/AI解析の代わり\n    setTimeout(() => {\n      // ファイル名から文書種別を推測\n      const fileName = file.name.toLowerCase();\n      let docType = 'unknown';\n      let confidence = 0.85;\n      let subsidyRelevance = '低';\n      \n      if (fileName.includes('経費') || fileName.includes('expense')) {\n        docType = '経費申請書';\n        confidence = 0.92;\n        subsidyRelevance = '低';\n      } else if (fileName.includes('休暇') || fileName.includes('leave')) {\n        docType = '休暇申請書';\n        confidence = 0.88;\n        subsidyRelevance = '無';\n      } else if (fileName.includes('補助金') || fileName.includes('subsidy')) {\n        docType = '補助金申請書';\n        confidence = 0.95;\n        subsidyRelevance = '高';\n      } else if (fileName.includes('購買') || fileName.includes('purchase')) {\n        docType = '購買申請書';\n        confidence = 0.87;\n        subsidyRelevance = '中';\n      } else {\n        docType = '経費申請書';\n        confidence = 0.75;\n        subsidyRelevance = '低';\n      }\n\n      analysisResult = {\n        docType,\n        confidence,\n        subsidyRelevance,\n        ocrText: `申請者: 田中太郎\\n部署: 営業部\\n申請日: 2024年1月15日\\n件名: ${docType}\\n金額: 50,000円\\n用途: 業務関連費用\\n承認者: 佐藤部長`,\n        keywords: ['申請', '承認', '金額', '業務', '部署', docType.replace('書', '')]\n      };\n\n      // 結果表示\n      container.querySelector('#detected-type').textContent = docType;\n      container.querySelector('#confidence-score').textContent = `${(confidence * 100).toFixed(1)}%`;\n      container.querySelector('#subsidy-relevance').textContent = subsidyRelevance;\n      container.querySelector('#ocr-text').value = analysisResult.ocrText;\n      \n      // キーワード表示\n      const keywordsList = container.querySelector('#keywords-list');\n      keywordsList.innerHTML = analysisResult.keywords.map(kw => \n        `<span style=\"display: inline-block; background: var(--primary); color: #fff; padding: 2px 6px; margin: 2px; border-radius: 4px; font-size: 11px;\">${kw}</span>`\n      ).join('');\n\n      // 承認フロー設定\n      updateApprovalFlow(docType);\n      \n      addLog(`解析完了: ${docType} (信頼度: ${(confidence * 100).toFixed(1)}%)`);\n    }, 2000);\n  }\n\n  // 承認フロー更新\n  function updateApprovalFlow(docType) {\n    const flowDisplay = container.querySelector('#approval-flow');\n    let flowText = '';\n    \n    switch (docType) {\n      case '経費申請書':\n        flowText = '1. 直属上司 → 2. 部長 → 3. 経理部';\n        break;\n      case '休暇申請書':\n        flowText = '1. 直属上司 → 2. 人事部';\n        break;\n      case '補助金申請書':\n        flowText = '1. 部長 → 2. 事業部長 → 3. 役員 → 4. 社長';\n        break;\n      case '購買申請書':\n        flowText = '1. 直属上司 → 2. 部長 → 3. 購買部';\n        break;\n      default:\n        flowText = '1. 直属上司 → 2. 部長';\n    }\n    \n    flowDisplay.textContent = flowText;\n  }\n\n  // 手動選択変更\n  container.querySelector('#manual-type-select').addEventListener('change', (e) => {\n    if (e.target.value) {\n      const typeNames = {\n        'expense-report': '経費申請書',\n        'leave-request': '休暇申請書',\n        'purchase-request': '購買申請書',\n        'subsidy-application': '補助金申請書',\n        'contract-approval': '契約承認申請',\n        'budget-request': '予算申請書'\n      };\n      const selectedType = typeNames[e.target.value];\n      container.querySelector('#detected-type').textContent = selectedType;\n      updateApprovalFlow(selectedType);\n      addLog(`手動選択: ${selectedType}`);\n    } else if (analysisResult) {\n      container.querySelector('#detected-type').textContent = analysisResult.docType;\n      updateApprovalFlow(analysisResult.docType);\n      addLog('自動判別結果に戻しました');\n    }\n  });\n\n  // 判別結果確定\n  container.querySelector('#btn-confirm').addEventListener('click', async () => {\n    if (!currentFile || !analysisResult) {\n      alert('ファイルを選択し、解析を完了してください');\n      return;\n    }\n\n    const finalType = container.querySelector('#detected-type').textContent;\n    const confidence = container.querySelector('#confidence-score').textContent;\n    \n    addLog(`判別結果確定: ${finalType}`);\n    \n    // 申請書類として保存\n    const documentData = {\n      申請種別: finalType,\n      申請タイトル: `${finalType} - ${currentFile.name}`,\n      申請内容: analysisResult.ocrText,\n      承認状態: '申請中',\n      承認段階: 1,\n      緊急フラグ: false,\n      添付ファイル有無: true,\n      申請者ID: 'current-user-id', // 実際は認証情報から取得\n      作成者ID: 'current-user-id'\n    };\n\n    const saved = await window.aivicApi.save(1, documentData); // tables[1] = 申請書類\n    if (saved) {\n      addLog('申請書類として登録完了');\n      alert('文書種別判別が完了し、申請書類として登録されました');\n      window.showScreen('scr-1779422241190'); // 承認フロー進捗管理画面へ\n    }\n  });\n\n  // 再判別実行\n  container.querySelector('#btn-reanalyze').addEventListener('click', () => {\n    if (!currentFile) {\n      alert('ファイルを選択してください');\n      return;\n    }\n    \n    // 結果をクリア\n    container.querySelector('#detected-type').textContent = '-';\n    container.querySelector('#confidence-score').textContent = '-';\n    container.querySelector('#subsidy-relevance').textContent = '-';\n    container.querySelector('#ocr-text').value = '';\n    container.querySelector('#keywords-list').innerHTML = '<div style=\"color: var(--text-muted); font-size: 12px;\">解析中...</div>';\n    container.querySelector('#approval-flow').textContent = '-';\n    container.querySelector('#manual-type-select').value = '';\n    \n    addLog('再判別を開始...');\n    performAnalysis(currentFile);\n  });\n\n  addLog('文書種別判別システム初期化完了');\n}";
</script>

    <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();
