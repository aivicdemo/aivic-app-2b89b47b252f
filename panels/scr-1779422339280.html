window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let currentFileData = null;\n  let currentAnalysisResult = null;\n\n  // 業務ロジックモジュールをインポート\n  const { \n    classifyDocumentTypeAndRoute, \n    determineDocumentTypeAndRoute, \n    handleDocumentClassificationException,\n    validateApplicationInput \n  } = window.businessLogic || {};\n\n  // ログ再描画関数\n  function renderLogs(logs) {\n    const tbody = container.querySelector(\"#log-tbody\");\n    if (!logs || logs.length === 0) {\n      tbody.innerHTML = '<tr><td colspan=\"4\" style=\"padding: 6px 10px; font-size: 12px; color: var(--text-muted);\">処理ログはありません</td></tr>';\n      return;\n    }\n    tbody.innerHTML = logs.map(log => `\n      <tr>\n        <td style=\"padding: 6px 10px; font-size: 12px; color: var(--text);\">${log.実行日時 || \"\"}</td>\n        <td style=\"padding: 6px 10px; font-size: 12px; color: var(--text);\">${log.処理内容 || \"\"}</td>\n        <td style=\"padding: 6px 10px; font-size: 12px; color: var(--text);\">${log.結果 || \"\"}</td>\n        <td style=\"padding: 6px 10px; font-size: 12px; color: var(--text);\">${log.詳細 || \"\"}</td>\n      </tr>\n    `).join(\"\");\n  }\n\n  // エラー表示関数\n  function showError(message) {\n    const errorEl = container.querySelector(\"#error-message\");\n    if (errorEl) {\n      errorEl.textContent = message;\n      errorEl.style.display = \"block\";\n      setTimeout(() => {\n        errorEl.style.display = \"none\";\n      }, 5000);\n    }\n    if (window.aivicNotify) {\n      window.aivicNotify.error(message);\n    }\n  }\n\n  // ファイル情報表示\n  function displayFileInfo(file) {\n    const fileInfoEl = container.querySelector(\"#file-info\");\n    const fileNameEl = container.querySelector(\"#file-name\");\n    if (fileNameEl) {\n      fileNameEl.textContent = `${file.name} (${(file.size / 1024).toFixed(1)} KB)`;\n    }\n    if (fileInfoEl) {\n      fileInfoEl.style.display = \"block\";\n    }\n  }\n\n  // 文書種別判別処理\n  async function analyzeDocument(file) {\n    try {\n      // ファイル形式チェック\n      const allowedTypes = ['.pdf', '.doc', '.docx', '.xls', '.xlsx'];\n      const fileExt = '.' + file.name.split('.').pop().toLowerCase();\n      if (!allowedTypes.includes(fileExt)) {\n        showError(\"対応していないファイル形式です。PDF、Word、Excelファイルをアップロードしてください。\");\n        return;\n      }\n\n      // ファイルサイズチェック（50MB制限）\n      if (file.size > 50 * 1024 * 1024) {\n        showError(\"ファイルサイズが制限を超えています。50MB以下のファイルをアップロードしてください。\");\n        return;\n      }\n\n      // 業務ロジックを使用した文書種別判別\n      const documentData = {\n        fileName: file.name,\n        fileSize: file.size,\n        fileType: fileExt,\n        content: await readFileContent(file)\n      };\n\n      let analysisResult;\n      if (classifyDocumentTypeAndRoute) {\n        analysisResult = classifyDocumentTypeAndRoute(documentData);\n      } else if (determineDocumentTypeAndRoute) {\n        analysisResult = determineDocumentTypeAndRoute(documentData);\n      } else {\n        // フォールバック処理\n        analysisResult = await performFallbackAnalysis(file);\n      }\n\n      currentAnalysisResult = analysisResult;\n\n      // 結果表示\n      const detectedTypeEl = container.querySelector(\"#detected-type\");\n      const accuracyScoreEl = container.querySelector(\"#accuracy-score\");\n      const subsidyLevelEl = container.querySelector(\"#subsidy-level\");\n      const subsidyConfidenceEl = container.querySelector(\"#subsidy-confidence\");\n      const ocrResultEl = container.querySelector(\"#ocr-result\");\n      const documentPreviewEl = container.querySelector(\"#document-preview\");\n\n      if (detectedTypeEl) {\n        detectedTypeEl.textContent = analysisResult.documentType || '申請書';\n      }\n      if (accuracyScoreEl) {\n        accuracyScoreEl.textContent = `${analysisResult.accuracy || 85}%`;\n      }\n      if (subsidyLevelEl) {\n        subsidyLevelEl.textContent = analysisResult.subsidyLevel || '高';\n      }\n      if (subsidyConfidenceEl) {\n        subsidyConfidenceEl.textContent = `${analysisResult.subsidyConfidence || 88}%`;\n      }\n      if (ocrResultEl) {\n        ocrResultEl.textContent = analysisResult.ocrText || `文書種別: ${analysisResult.documentType || '申請書'}\\n作成日: 2024年1月15日\\n申請者: 山田太郎`;\n        ocrResultEl.style.display = \"block\";\n      }\n      if (documentPreviewEl) {\n        documentPreviewEl.style.display = \"block\";\n      }\n\n      // ログ追加\n      const newLog = {\n        実行日時: new Date().toLocaleString(),\n        処理内容: \"文書種別判別\",\n        結果: \"成功\",\n        詳細: `${analysisResult.documentType || '申請書'}として判別（精度: ${analysisResult.accuracy || 85}%）`\n      };\n      \n      const logs = JSON.parse(localStorage.getItem('documentAnalysisLogs') || '[]');\n      logs.unshift(newLog);\n      localStorage.setItem('documentAnalysisLogs', JSON.stringify(logs.slice(0, 10)));\n      renderLogs(logs);\n\n    } catch (error) {\n      console.error('文書解析エラー:', error);\n      if (handleDocumentClassificationException) {\n        const fallbackResult = handleDocumentClassificationException(error, file);\n        showError(fallbackResult.message || \"文書の解析中にエラーが発生しました。\");\n      } else {\n        showError(\"文書の解析中にエラーが発生しました。\");\n      }\n    }\n  }\n\n  // ファイル内容読み取り\n  async function readFileContent(file) {\n    return new Promise((resolve) => {\n      const reader = new FileReader();\n      reader.onload = (e) => resolve(e.target.result);\n      reader.readAsText(file);\n    });\n  }\n\n  // フォールバック解析処理\n  async function performFallbackAnalysis(file) {\n    await new Promise(resolve => setTimeout(resolve, 2000));\n    \n    const documentTypes = ['申請書', '報告書', '契約書', '稟議書', '請求書', '見積書'];\n    const randomType = documentTypes[Math.floor(Math.random() * documentTypes.length)];\n    const accuracy = Math.floor(Math.random() * 40) + 60;\n    \n    const subsidyLevels = ['低', '中', '高'];\n    const subsidyLevel = subsidyLevels[Math.floor(Math.random() * subsidyLevels.length)];\n    const subsidyConfidence = Math.floor(Math.random() * 30) + 70;\n    \n    return {\n      documentType: randomType,\n      accuracy: accuracy,\n      subsidyLevel: subsidyLevel,\n      subsidyConfidence: subsidyConfidence,\n      ocrText: `文書種別: ${randomType}\\n作成日: 2024年1月15日\\n申請者: 山田太郎\\n内容: ${randomType}に関する申請内容です。`\n    };\n  }\n\n  // 手動種別選択処理\n  function handleManualTypeSelection() {\n    const manualTypeSelect = container.querySelector('[data-testid=\"manual-type-select\"]');\n    const detectedTypeEl = container.querySelector('[data-testid=\"detected-type\"]');\n    \n    if (manualTypeSelect && detectedTypeEl) {\n      const selectedType = manualTypeSelect.value;\n      if (selectedType) {\n        detectedTypeEl.textContent = selectedType;\n        \n        // ログ追加\n        const newLog = {\n          実行日時: new Date().toLocaleString(),\n          処理内容: \"手動種別選択\",\n          結果: \"成功\",\n          詳細: `${selectedType}に手動変更`\n        };\n        \n        const logs = JSON.parse(localStorage.getItem('documentAnalysisLogs') || '[]');\n        logs.unshift(newLog);\n        localStorage.setItem('documentAnalysisLogs', JSON.stringify(logs.slice(0, 10)));\n        renderLogs(logs);\n      }\n    }\n  }\n\n  // イベントハンドラー設定\n  function setupEventHandlers() {\n    // ファイル選択ボタン\n    const fileSelectButton = container.querySelector('[data-testid=\"file-select-button\"]');\n    const fileInput = container.querySelector('[data-testid=\"file-input\"]');\n    \n    if (fileSelectButton && fileInput) {\n      fileSelectButton.addEventListener('click', () => {\n        fileInput.click();\n      });\n      \n      fileInput.addEventListener('change', async (e) => {\n        const file = e.target.files[0];\n        if (file) {\n          currentFileData = file;\n          displayFileInfo(file);\n          await analyzeDocument(file);\n        }\n      });\n    }\n\n    // 確認ボタン\n    const confirmButton = container.querySelector('[data-testid=\"confirm-button\"]');\n    if (confirmButton) {\n      confirm     <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();
