window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let allApplications = [];\n  let allUsers = [];\n  let allRoutes = [];\n  let sortColumn = null;\n  let sortDirection = 'asc';\n\n  // ユーザー情報とルート情報を取得\n  async function loadRelatedData() {\n    try {\n      allUsers = await window.aivicApi.list(0) || []; // ユーザー\n      allRoutes = await window.aivicApi.list(7) || []; // 処理ルート\n    } catch (error) {\n      console.error('関連データの取得に失敗:', error);\n    }\n  }\n\n  // ユーザー名を取得\n  function getUserName(userId) {\n    const user = allUsers.find(u => u.ユーザーID === userId);\n    return user ? user.ユーザー名 : '';\n  }\n\n  // 優先度ラベルを取得\n  function getPriorityLabel(priority) {\n    const labels = { 1: '低', 2: '通常', 3: '高', 4: '緊急' };\n    return labels[priority] || '通常';\n  }\n\n  // 優先度の色を取得\n  function getPriorityColor(priority) {\n    const colors = {\n      1: '#6b7280',\n      2: '#3b82f6',\n      3: '#f59e0b',\n      4: '#ef4444'\n    };\n    return colors[priority] || '#3b82f6';\n  }\n\n  // 進捗率を計算\n  function calculateProgress(applicationId) {\n    const route = allRoutes.find(r => r.申請書類ID === applicationId);\n    if (!route) return 0;\n    \n    // 簡易的な進捗計算（実際の承認ステップ数に基づく）\n    const totalSteps = 3; // 仮定\n    const currentStep = route.現在ステップ番号 || 1;\n    \n    if (route.処理状況 === '承認済み') return 100;\n    if (route.処理状況 === '却下' || route.処理状況 === '取下げ') return 0;\n    \n    return Math.min(Math.round((currentStep / totalSteps) * 100), 90);\n  }\n\n  // 遅延日数を計算\n  function calculateDelayDays(createdAt, status) {\n    if (status === '承認済' || status === '却下' || status === '取下げ') return 0;\n    \n    const created = new Date(createdAt);\n    const now = new Date();\n    const diffTime = now - created;\n    const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));\n    \n    // 3日を超えたら遅延とみなす\n    return Math.max(0, diffDays - 3);\n  }\n\n  // 進捗バーを生成\n  function createProgressBar(progress, status) {\n    const color = status === '承認済' ? '#10b981' : \n x; color: var(--text);\">${app.申請タイトル || ''}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${app.作成日時 ? new Date(app.作成日時).toLocaleDateString() : ''}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">\n            <span style=\"padding: 2px 6px; border-radius: 4px; font-size: 11px; background: ${app.承認状態 === '承認済' ? 'rgba(16, 185, 129, 0.2)' : app.承認状態 === '却下' ? 'rgba(239, 68, 68, 0.2)' : 'rgba(59, 130, 246, 0.2)'}; color: var(--text);\">\n              ${app.承認状態 || '申請中'}\n            </span>\n          </td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${currentApproverName}</td>\n          <td style=\"padding: 6px 10px;\">${createProgressBar(progress, app.承認状態)}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">\n            <span style=\"padding: 2px 6px; border-radius: 4px; font-size: 11px; background: rgba(${priorityColor === '#ef4444' ? '239, 68, 68' : priorityColor === '#f59e0b' ? '245, 158, 11' : priorityColor === '#3b82f6' ? '59, 130, 246' : '107, 114, 128'}, 0.2); color: var(--text);\">\n              ${getPriorityLabel(app.優先度 || 2)}\n            </span>\n          </td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: ${isDelayed ? '#ef4444' : 'var(--text)'};\">\n            ${isDelayed ? `${delayDays}日` : '-'}\n            ${isDelayed ? '<span style=\"margin-left: 4px;\">⚠️</span>' : ''}\n          </td>\n          <td style=\"padding: 6px 10px;\">\n            <button class=\"action-btn secondary detail-btn\" data-id=\"${app.申請書類ID}\" style=\"font-size: 11px; padding: 4px 8px;\">案件詳細</button>\n          </td>\n        </tr>\n      `;\n    }).join('');\n  }\n\n  // フィルター処理\n  function applyFilters() {\n    const documentType = container.querySelector('#filter-document-type').value;\n    const approvalStatus = container.querySelector('#filter-approval-status').value;\n    const applicantName = container.querySelector('#search-ap       aVal = a.優先度 || 2;\n          bVal = b.優先度 || 2;\n        }\n        \n        if (typeof aVal === 'string') {\n          aVal = aVal.toLowerCase();\n          bVal = bVal.toLowerCase();\n        }\n        \n        if (aVal < bVal) return sortDirection === 'asc' ? -1 : 1;\n        if (aVal > bVal) return sortDirection === 'asc' ? 1 : -1;\n        return 0;\n      });\n    }\n    \n    renderRows(filtered);\n  }\n\n  // CSVエクスポート\n  function exportCSV() {\n    const headers = ['申請ID', '申請者', '申請種別', '申請タイトル', '申請日', '承認状態', '現在承認者', '進捗率', '優先度', '遅延日数'];\n    const rows = allApplications.map(app => [\n      app.申請書類ID?.substring(0, 8) || '',\n      getUserName(app.申請者ID),\n      app.申請種別 || '',\n      app.申請タイトル || '',\n      app.作成日時 ? new Date(app.作成日時).toLocaleDateString() : '',\n      app.承認状態 || '申請中',\n      getUserName(app.現在承認者ID),\n      calculateProgress(app.申請書類ID) + '%',\n      getPriorityLabel(app.優先度 || 2),\n      calculateDelayDays(app.作成日時, app.承認状態) + '日'\n    ]);\n    \n    const csvContent = '\\uFEFF' + [headers, ...rows].map(row => \n      row.map(field => `\"${String(field).replace(/\"/g, '\"\"')}\"`).join(',')\n    ).join('\\n');\n    \n    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });\n    const link = document.createElement('a');\n    link.href = URL.createObjectURL(blob);\n    link.download = `承認フロー進捗_${new Date().toISOString().split('T')[0]}.csv`;\n    link.click();\n  }\n\n  // 初期化\n  async function initialize() {\n    await loadRelatedData();\n    \n    try {\n      allApplications = await window.aivicApi.list(1) || tables[1]?.records || [];\n    } catch (error) {\n      console.error('申請データの取得に失敗:', error);\n      allApplications = tables[1]?.records || [];\n    }\n    \n    renderRows(allApplications);\n  }\n\n  // イベントリスナー\n  container.querySelector('#btn-search').addEventListener('click', applyFilters);\n  \n  container.querySelector('#btn-clear').addEventListener('click', () => {\n    container.querySelector('#filter-document-type').value = '';\n    container.querySelector('#filter-approval-status').value = '';\n    container.querySelector('#search-applicant').value = '';\n    container.querySelector('#search-approver').value = '';\n    container.querySelector('#filter-start-date').value = '';\n    container.querySelector('#filter-end-date').value = '';\n    container.querySelector('#error-message').style.display = 'none';\n    renderRows(allApplications);\n  });\n  \n  container.querySelector('#btn-csv-export').addEventListener('click', exportCSV);\n  \n  container.querySelector('#btn-delay-check').addEventListener('click', () => {\n    window.showScreen(\"scr-1779422271790\");\n  });\n  \n  container.querySelector('#btn-route-change').addEventListener('click', () => {\n    window.showScreen(\"scr-1779422283293\");\n  });\n  \n  // ソート機能\n  container.addEventListener('click', (e) => {\n    const sortHeader = e.target.closest('[data-sort]');\n    if (sortHeader) {\n      const column = sortHeader.dataset.sort;\n      if (sortColumn === column) {\n        sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';\n      } else {\n        sortColumn = column;\n        sortDirection = 'asc';\n      }\n      applyFilters();\n    }\n    \n    // 案件詳細ボタン\n    const detailBtn = e.target.closest('.detail-btn');\n    if (detailBtn) {\n      window.showScreen(\"scr-1779422369173\");\n    }\n  });\n\n  // ネットワークエラーハンドリング\n  window.addEventListener('offline', () => {\n    const errorMessage = container.querySelector('#error-message');\n    errorMessage.textContent = 'ネットワークに接続できません。接続を確認してから再試行してください。';\n    errorMessage.style.display = 'block';\n  });\n\n  // 初期化実行\n  initialize();\n}";

    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
