window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let allApplications = [];\n  let allUsers = [];\n  let allSteps = [];\n  let allRoutes = [];\n  let sortOrder = { column: null, direction: 'asc' };\n\n  // ユーザー情報とステップ情報を取得\n  async function loadRelatedData() {\n    try {\n      allUsers = await window.aivicApi.list(0) || []; // ユーザー\n      allSteps = await window.aivicApi.list(4) || []; // 承認ステップ\n      allRoutes = await window.aivicApi.list(7) || []; // 処理ルート\n    } catch (error) {\n      console.error('関連データの取得に失敗:', error);\n    }\n  }\n\n  // ユーザー名を取得\n  function getUserName(userId) {\n    const user = allUsers.find(u => u.ユーザーID === userId);\n    return user ? user.ユーザー名 : '';\n  }\n\n  // 現在の承認者を取得\n  function getCurrentApprover(applicationId) {\n    const route = allRoutes.find(r => r.申請書類ID === applicationId);\n    if (route && route.現在承認者ID) {\n      return getUserName(route.現在承認者ID);\n    }\n    return '';\n  }\n\n  // 進捗率を計算\n  function calculateProgress(applicationId) {\n    const steps = allSteps.filter(s => s.申請書類ID === applicationId);\n    if (steps.length === 0) return 0;\n    \n    const completedSteps = steps.filter(s => s.承認状態 === '承認済').length;\n    return Math.round((completedSteps / steps.length) * 100);\n  }\n\n  // 遅延日数を計算\n  function calculateDelayDays(createdAt, status) {\n    if (status === '承認済' || status === '却下' || status === '取下げ') return 0;\n    \n    const created = new Date(createdAt);\n    const now = new Date();\n    const diffTime = now - created;\n    const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));\n    \n    // 3日以上経過していれば遅延とみなす\n    return diffDays > 3 ? diffDays - 3 : 0;\n  }\n\n  // 優先度の表示\n  function getPriorityDisplay(priority) {\n    const priorities = {\n      1: { text: '低', color: '#6b7280' },\n      2: { text: '通常', color: '#3b82f6' },\n      3: { text: '高', color: '#f59e0b' },\n      4: { text: '緊急', color: '#ef4444' }\n    };\n    const p = priorities[priority] || priorities[2];\n    return `<span style=\"color: ${p.color}; font-weight: 500;\">${p.text}</span>`;\n  }\n\n  // 承認状況の表示\n  function getStatusDisplay(status) {\n    const statusColors = {\n      '申請中': '#3b82f6',\n      '承認待ち': '#f59e0b', \n      '承認済': '#10b981',\n      '却下': '#ef4444',\n      '取下げ': '#6b7280'\n    };\n    const color = statusColors[status] || '#6b7280';\n    return `<span style=\"color: ${color}; font-weight: 500;\">${status}</span>`;\n  }\n\n  // 進捗バーの表示\n  function getProgressBar(progress) {\n    return `\n      <div style=\"width: 80px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; position: relative;\">\n        <div style=\"width: ${progress}%; height: 100%; background: var(--primary); border-radius: 3px;\"></div>\n      </div>\n      <span style=\"font-size: 11px; color: var(--text-muted); margin-left: 4px;\">${progress}%</span>\n    `;\n  }\n\n  // テーブル行を再描画\n  function renderRows(applications) {\n    const tbody = container.querySelector('#applications-tbody');\n    const noDataMessage = container.querySelector('#no-data-message');\n    \n    if (!applications || applications.length === 0) {\n      tbody.innerHTML = '';\n      noDataMessage.style.display = 'block';\n      return;\n    }\n    \n    noDataMessage.style.display = 'none';\n    \n    tbody.innerHTML = applications.map(app => {\n      const applicantName = getUserName(app.申請者ID);\n      const currentApprover = getCurrentApprover(app.申請書類ID);\n      const progress = calculateProgress(app.申請書類ID);\n      const delayDays = calculateDelayDays(app.作成日時, app.承認状態);\n      const isDelayed = delayDays > 0;\n      \n      // 処理ルートから優先度を取得\n      const route = allRoutes.find(r => r.申請書類ID === app.申請書類ID);\n      const priority = route ? route.優先度 : 2;\n      \n      return `\n        <tr data-id=\"${app.申請書類ID}\" style=\"${isDelayed ? 'background: rgba(239, 68, 68, 0.1);' : ''}\" class=\"application-row\">\n          <td style=\"padding: 6px 10px; font-size: 13px;\">\n            <a href=\"#\" class=\"detail-link\" data-id=\"${app.申請書類ID}\" style=\"color: var(--primary); text-decoration: none;\">${app.申請書類ID.substring(0, 8)}</a>\n          </td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">${applicantName}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">${app.申請種別 || ''}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">${app.申請タイトル || ''}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">${new Date(app.作成日時).toLocaleDateString('ja-JP')}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">${getStatusDisplay(app.承認状態)}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">${currentApprover}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; display: flex; align-items: center;\">${getProgressBar(progress)}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">${getPriorityDisplay(priority)}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">\n            ${delayDays > 0 ? `<span style=\"color: #ef4444; font-weight: 500;\">${delayDays}日</span>` : '-'}\n          </td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">\n            <button class=\"action-btn secondary detail-btn\" data-id=\"${app.申請書類ID}\" style=\"font-size: 11px; padding: 4px 8px;\">案件詳細</button>\n          </td>\n        </tr>\n      `;\n    }).join('');\n  }\n\n  // 検索・フィルター処理\n  function filterApplications() {\n    const documentType = container.querySelector('#filter-document-type').value;\n    const approvalStatus = container.querySelector('#filter-approval-status').value;\n    const startDate = container.querySelector('#filter-start-date').value;\n    const endDate = container.querySelector('#filter-end-date').value;\n    const applicantName = container.querySelector('#filter-applicant').value.trim();\n    const approverName = container.querySelector('#filter-approver').value.trim();\n\n    let filtered = allApplications.filter(app => {\n      // 文書種別フィルター\n      if (documentType && app.申請種別 !== documentType) return false;\n      \n      // 承認状況フィルター\n      if (approvalStatus && app.承認状態 !== approvalStatus) return false;\n      \n      // 申請日フィルター\n      const appDate = new Date(app.作成日時).toISOString().split('T')[0];\n      if (startDate && appDate < startDate) return false;\n      if (endDate && appDate > endDate) return false;\n      \n      // 申請者名フィルター\n      if (applicantName) {\n        const userName = getUserName(app.申請者ID);\n        if (!userName.includes(applicantName)) return false;\n      }\n      \n      // 承認者名フィルター\n      if (approverName) {\n        const currentApprover = getCurrentApprover(app.申請書類ID);\n        if (!currentApprover.includes(approverName)) return false;\n      }\n      \n      return true;\n    });\n\n    renderRows(filtered);\n  }\n\n  // ソート処理\n  function sortApplications(column) {\n    if (sortOrder.column === column) {\n      sortOrder.direction = sortOrder.direction === 'asc' ? 'desc' : 'asc';\n    } else {\n      sortOrder.column = column;\n      sortOrder.direction = 'asc';\n    }\n\n    const sorted = [...allApplications].sort((a, b) => {\n      let aVal, bVal;\n      \n      if (column === '優先度') {\n        const routeA = allRoutes.find(r => r.申請書類ID === a.申請書類ID);\n        const routeB = allRoutes.find(r => r.申請書類ID === b.申請書類ID);\n        aVal = routeA ? routeA.優先度 : 2;\n        bVal = routeB ? routeB.優先度 : 2;\n      } else {\n        aVal = a[column] || '';\n        bVal = b[column] || '';\n      }\n\n      if (sortOrder.direction === 'asc') {\n        return aVal > bVal ? 1 : -1;\n      } else {\n        return aVal < bVal ? 1 : -1;\n      }\n    });\n\n    allApplications = sorted;\n    filterApplications();\n  }\n\n  // エラー表示\n  function showError(message) {\n    const errorDiv = container.querySelector('#error-message');\n    const errorText = container.querySelector('#error-text');\n    errorText.textContent = message;\n    errorDiv.style.display = 'block';\n    setTimeout(() => {\n      errorDiv.style.display = 'none';\n    }, 5000);\n  }\n\n  // バリデーション\n  function validateDateRange() {\n    const startDate = container.querySelector('#filter-start-date').value;\n    const endDate = container.querySelector('#filter-end-date').value;\n    \n    if (startDate && endDate && startDate > endDate) {\n      showError('開始日は終了日より前の日付を入力してください');\n      return false;\n    }\n    return true;\n  }\n\n  // 特殊文字チェック\n  function containsSpecialChars(str) {\n    const specialChars = /[<>'\"&]/;\n    return specialChars.test(str);\n  }\n\n  // CSVエクスポート\n  function exportToCSV() {\n    const headers = ['申請ID', '申請者', '申請種別', '申請タイトル', '申請日', '承認状況', '現在承認者', '進捗率', '優先度', '遅延日数'];\n    const csvContent = [\n      '\\uFEFF' + headers.join(','),\n      ...allApplications.map(app => {\n        const applicantName = getUserName(app.申請者ID);\n        const currentApprover = getCurrentApprover(app.申請書類ID);\n        const progress = calculateProgress(app.申請書類ID);\n        const delayDays = calculateDelayDays(app.作成日時, app.承認状態);\n        const route = allRoutes.find(r => r.申請書類ID === app.申請書類ID);\n        const priority = route ? route.優先度 : 2;\n        const priorityText = ['', '低', '通常', '高', '緊急'][priority] || '通常';\n        \n        return [\n          app.申請書類ID,\n          applicantName,\n          app.申請種別 || '',\n          `\"${(app.申請タイトル || '').replace(/\"/g, '\"\"')}\"`,\n          new Date(app.作成日時).toLocaleDateString('ja-JP'),\n          app.承認状態,\n          currentApprover,\n          `${progress}%`,\n          priorityText,\n          delayDays > 0 ? `${delayDays}日` : '-'\n        ].join(',');\n      })\n    ].join('\\n');\n\n    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });\n    const link = document.createElement('a');\n    link.href = URL.createObjectURL(blob);\n    link.download = `承認フロー進捗_${new Date().toISOString().split('T')[0]}.csv`;\n    link.click();\n  }\n\n  // 初期データ読み込み\n  async function loadData() {\n    try {\n      await loadRelatedData();\n      allApplications = await window.aivicApi.list(1) || []; // 申請書類\n      renderRows(allApplications);\n    } catch (error) {\n      console.error('データの読み込みに失敗:', error);\n      showError('データの読み込みに失敗しました');\n    }\n  }\n\n  // イベントリスナー設定\n  container.querySelector('#btn-search').addEventListener('click', () => {\n    if (!validateDateRange()) return;\n    \n    const applicantName = container.querySelector('#filter-applicant').value.trim();\n    const approverName = container.querySelector('#filter-approver').value.trim();\n    \n    if (containsSpecialChars(applicantName)) {\n      showError('申請者名に使用できない文字が含まれています');\n      return;\n    }\n    \n    if (containsSpecialChars(approverName)) {\n      showError('承認者名に使用できない文字が含まれています');\n      return;\n    }\n    \n    filterApplications();\n  });\n\n  container.querySelector('#btn-clear').addEventListener('click', () => {\n    container.querySelector('#filter-document-type').value = '';\n    container.querySelector('#filter-approval-status').value = '';\n    container.querySelector('#filter-start-date').value = '';\n    container.querySelector('#filter-end-date').value = '';\n    container.querySelector('#filter-applicant').value = '';\n    container.querySelector('#filter-approver').value = '';\n    renderRows(allApplications);\n  });\n\n  container.querySelector('#btn-csv-export').addEventListener('click', exportToCSV);\n\n  container.querySelector('#btn-delay-check').addEventListener('click', () => {\n    window.showScreen(\"scr-1779422271790\");\n  });\n\n  container.querySelector('#btn-route-change').addEventListener('click', () => {\n    window.showScreen(\"scr-1779422283293\");\n  });\n\n  // ソートイベント\n  container.addEventListener('click', (e) => {\n    const sortHeader = e.target.closest('[data-sort]');\n    if (sortHeader) {\n      const column = sortHeader.dataset.sort;\n      sortApplications(column);\n    }\n\n    const detailBtn = e.target.closest('.detail-btn');\n    const detailLink = e.target.closest('.detail-link');\n    if (detailBtn || detailLink) {\n      e.preventDefault();\n      window.showScreen(\"scr-1779422369173\");\n    }\n  });\n\n  // 初期化\n  loadData();\n}";

    <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();
