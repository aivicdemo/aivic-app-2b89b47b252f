window.AIVIC_PAGE_INIT_JS = "js\nfunction(container, apiUrl, tables) {\n  // 業務ロジックモジュールのインポート（実際の環境では適切にインポート）\n  const { \n    validateApplicationInput,\n    classifyDocumentTypeAndRoute,\n    determineDocumentTypeAndRoute,\n    determineProcessingRoute,\n    handleDocumentClassificationException,\n    checkComplianceAndDetermineRoute\n  } = window.businessLogic || {};\n\n  const {\n    updateDocumentClassificationStandards,\n    migrateExistingDataToNewClassification,\n    analyzeRegulationImpactScope\n  } = window.businessLogicExtended || {};\n\n  let editingId = null;\n  let currentData = [];\n\n  // 1. 再描画関数の定義\n  function renderRows(rows) {\n    const tbody = container.querySelector(\"#classification-tbody\");\n    if (!tbody) return;\n    \n    currentData = rows || [];\n    tbody.innerHTML = rows.map(r => `\n      <tr data-id=\"${r.id}\" style=\"border-bottom: 1px solid rgba(255,255,255,0.02);\">\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${r.分類基準名 || \"\"}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${r.文書種別 || \"\"}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">\n          <span style=\"padding: 2px 6px; border-radius: 4px; font-size: 11px; background: ${r.補助金関連度レベル === 3 ? '#ff6a00' : r.補助金関連度レベル === 2 ? '#ffa500' : '#888'}; color: #fff;\">\n            ${r.補助金関連度レベル === 3 ? '高' : r.補助金関連度レベル === 2 ? '中' : '低'}\n          </span>\n        </td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${r.処理ルート || \"\"}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text); text-align: center;\">${r.優先度 || 1}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">\n          <span style=\"padding: 2px 6px; border-radius: 4px; font-size: 11px; background: ${r.有効フラグ ? 'var(--primary)' : '#666'}; color: #fff;\">\n            ${r.有効フラグ ? '有効' : '無効'}\n          </span>\n        </td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">\n          ${r.適用開始日 ? new Date(r.適用開始日).toLocaleDateString() : \"\"} 〜 ${r.適用終了日 ? new Date(r.適用終了日).toLocaleDateString() : \"\"}\n        </td>\n        <td style=\"padding: 6px 10px;\">\n          <button class=\"action-btn secondary edit-btn\" data-id=\"${r.id}\" style=\"margin-right: 4px;\">編集</button>\n          <button class=\"action-btn secondary delete-btn\" data-id=\"${r.id}\">削除</button>\n        </td>\n      </tr>\n    `).join(\"\");\n\n    // 編集・削除ボタンのイベントリスナー追加\n    tbody.querySelectorAll('.edit-btn').forEach(btn => {\n      btn.addEventListener('click', handleEdit);\n    });\n    tbody.querySelectorAll('.delete-btn').forEach(btn => {\n      btn.addEventListener('click', handleDelete);\n    });\n  }\n\n  // 2. 初期データ描画\n  async function loadInitialData() {\n    try {\n      const rows = await window.aivicApi.list(9);\n      if (rows) {\n        renderRows(rows);\n      }\n    } catch (error) {\n      window.aivicNotify.error('データの読み込みに失敗しました');\n    }\n  }\n\n  // 3. 新規作成処理\n  function handleNew() {\n    editingId = null;\n    showEditForm();\n  }\n\n  // 4. 編集処理\n  function handleEdit(event) {\n    const id = event.target.getAttribute('data-id');\n    editingId = id;\n    const record = currentData.find(r => r.id == id);\n    if (record) {\n      showEditForm(record);\n    }\n  }\n\n  // 5. 削除処理\n  async function handleDelete(event) {\n    const id = event.target.getAttribute('data-id');\n    if (confirm('この分類基準を削除しますか？')) {\n      try {\n        await window.aivicApi.delete(9, id);\n        window.aivicNotify.success('削除完了');\n        loadInitialData();\n      } catch (error) {\n        window.aivicNotify.error('削除に失敗しました');\n      }\n    }\n  }\n\n  // 6. 編集フォーム表示\n  function showEditForm(record = null) {\n    const formHtml = `\n      <div class=\"edit-form\" style=\"background: var(--surface); padding: 20px; border-radius: 8px; margin: 16px 0;\">\n        <h3>${record ? '分類基準編集' : '新規分類基準作成'}</h3>\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 16px 0;\">\n          <div>\n            <label>分類基準名</label>\n            <input type=\"text\" data-testid=\"classification-name\" id=\"input-name\" value=\"${record?.分類基準名 || ''}\" style=\"width: 100%; padding: 8px; margin-top: 4px;\">\n          </div>\n          <div>\n            <label>文書種別</label>\n            <select id=\"select-document-type\" style=\"width: 100%; padding: 8px; margin-top: 4px;\">\n              <option value=\"\">選択してください</option>\n              <option value=\"申請書\" ${record?.文書種別 === '申請書' ? 'selected' : ''}>申請書</option>\n              <option value=\"報告書\" ${record?.文書種別 === '報告書' ? 'selected' : ''}>報告書</option>\n              <option value=\"契約書\" ${record?.文書種別 === '契約書' ? 'selected' : ''}>契約書</option>\n            </select>\n          </div>\n          <div>\n            <label>処理ルート</label>\n            <select data-testid=\"processing-route-select\" id=\"select-processing-route\" style=\"width: 100%; padding: 8px; margin-top: 4px;\">\n              <option value=\"\">選択してください</option>\n              <option value=\"標準承認ルート\" ${record?.処理ルート === '標準承認ルート' ? 'selected' : ''}>標準承認ルート</option>\n              <option value=\"緊急承認ルート\" ${record?.処理ルート === '緊急承認ルート' ? 'selected' : ''}>緊急承認ルート</option>\n              <option value=\"特別承認ルート\" ${record?.処理ルート === '特別承認ルート' ? 'selected' : ''}>特別承認ルート</option>\n            </select>\n          </div>\n          <div>\n            <label>優先度</label>\n            <input type=\"number\" id=\"input-priority\" value=\"${record?.優先度 || 1}\" min=\"1\" max=\"10\" style=\"width: 100%; padding: 8px; margin-top: 4px;\">\n          </div>\n          <div>\n            <label>適用開始日</label>\n            <input type=\"date\" data-testid=\"start-date\" id=\"input-start-date\" value=\"${record?.適用開始日 ? new Date(record.適用開始日).toISOString().split('T')[0] : ''}\" style=\"width: 100%; padding: 8px; margin-top: 4px;\">\n          </div>\n          <div>\n            <label>適用終了日</label>\n            <input type=\"date\" id=\"input-end-date\" value=\"${record?.適用終了日 ? new Date(record.適用終了日).toISOString().split('T')[0] : ''}\" style=\"width: 100%; padding: 8px; margin-top: 4px;\">\n          </div>\n        </div>\n        <div style=\"margin: 16px 0;\">\n          <label>キーワード条件</label>\n          <textarea data-testid=\"keyword-conditions\" id=\"input-keywords\" style=\"width: 100%; padding: 8px; margin-top: 4px; height: 80px;\">${record?.キーワード条件 || ''}</textarea>\n        </div>\n        <div style=\"margin: 16px 0;\">\n          <label>\n            <input type=\"checkbox\" data-testid=\"active-toggle\" id=\"checkbox-active\" ${record?.有効フラグ !== false ? 'checked' : ''}>\n            有効\n          </label>\n        </div>\n        <div style=\"display: flex; gap: 8px; margin-top: 20px;\">\n          <button data-testid=\"save-button\" id=\"btn-save\" class=\"action-btn primary\">保存</button>\n          <button data-testid=\"preview-button\" id=\"btn-preview\" class=\"action-btn secondary\">プレビュー</button>\n          <button id=\"btn-cancel\" class=\"action-btn secondary\">キャンセル</button>\n        </div>\n        <div id=\"preview-content\" style=\"margin-top: 16px; padding: 12px; background: var(--background); border-radius: 4px; display: none;\"></div>\n      </div>\n    `;\n\n    const existingForm = container.querySelector('.edit-form');\n    if (existingForm) {\n      existingForm.remove();\n    }\n\n    const listContainer = container.querySelector('[data-testid=\"classification-list\"]') || container.querySelector('table').parentElement;\n    listContainer.insertAdjacentHTML('beforebegin', formHtml);\n\n    // フォームイベントリスナー追加\n    const form = container.querySelector('.edit-form');\n    form.querySelector('#btn-save').addEventListener('click', handleSave);\n    form.querySelector('#btn-preview').addEventListener('click', handlePreview);\n    form.querySelector('#btn-cancel').addEventListener('click', () => form.remove());\n  }\n\n  // 7. 保存処理\n  async function handleSave() {\n    try {\n      const formData = getFormData();\n      \n      // バリデーション\n      if (!formData.分類基準名) {\n        window.aivicNotify.error('分類基準名を入力してください');\n        return;\n      }\n\n      // 業務ロジック呼び出し - 入力値検証\n      if (validateApplicationInput) {\n        const validationResult = validateApplicationInput(formData);\n        if (!validationResult.isValid) {\n          window.aivicNotify.error(validationResult.message || '入力値に問題があります');\n          return;\n        }\n      }\n\n      // 業務ロジック呼び出し - 文書分類とルート決定\n      if (determineProcessingRoute) {\n        const routeResult = determineProcessingRoute({\n          documentType: formData.文書種別,\n          keywords: formData.キーワード条件,\n          priority: formData.優先度\n        });\n        if (routeResult.route) {\n          formData.処理ルート = routeResult.route;\n        }\n      }\n\n      // 重複チェック\n      if (!editingId) {\n        const existing = currentData.find(r => r.分類基準名 === formData.分類基準名);\n        if (existing) {\n          window.aivicNotify.error('既存の分類基準名と重複しています');\n          return;\n        }\n      }\n\n      // 保存実行\n      let result;\n      if (editingId) {\n        result = await window.aivicApi.update(9, editingId, formData);\n      } else {\n        result = await window.aivicApi.save(9, formData);\n      }\n\n      if (result) {\n        // 業務ロジック呼び出し - 分類基準更新後の処理\n        if (updateDocumentClassificationStandards) {\n          updateDocumentClassificationStandards(formData);\n        }\n\n        window.aivicNotify.success('分類基準を保存しました');\n        container.querySelector('.edit-form').remove();\n        loadInitialData();\n      }\n    } catch (error) {\n      window.aivicNotify.error('保存に失敗しました');\n    }\n  }\n\n  // 8. プレビュー処理\n  function handlePreview() {\n    const formData = getFormData();\n    const previewContent = container.querySelector('#preview-content');\n    \n    let previewHtml = '<h4>設定内容プレビュー</h4>';\n    previewHtml += `<p><strong>分類基準名:</strong> ${formData.分類基準名 || '未設定'}</p>`;\n    previewHtml += `<p><strong>文書種別:</strong> ${formData.文書種別 || '未設定'}</p>`;\n    previewHtml += `<p><strong>処理ルート:</strong> ${formData.処理ルート || '未設定'}</p>`;\n    previewHtml += `<p><strong>キーワード条件:</strong> ${formData.キーワード条件 || '未設定'}</p>`;\n    previewHtml += `<p><strong>優先度:</strong> ${formData.優先度}</p>`;\n    previewHtml += `<p><strong>有効状態:</strong> ${formData.有効フラグ ? '有効' : '無効'}</p>`;\n\n    previewContent.innerHTML = previewHtml;\n    previewContent.style.display = 'block';\n  }\n\n  // 9. フォームデータ取得\n  function getFormData() {\n    const form = container.querySelector('.edit-form');\n    return {\n      分類基準名: form.querySelector('#input-name').value,\n      文書種別: form.querySelector('#select-document-type').value,\n      処理ルート: form.querySelector('#select-processing-route').value,\n      優先度: parseInt(form.querySelector('#input-priority').value) || 1,\n      適用開始日: form.querySelector('#input-start-date').value,\n      適用終了日: form.querySelector('#input-end-date').value,\n      キーワード条件: form.querySelector('#input-keywords').value,\n      有効フラグ: form.querySelector('#checkbox-active').checked,\n      補助金関連度レベル: 2 // デフォルト値\n    };\n  }\n\n  // 10. 検索機能\n  async function handleSearch() {\n    try {\n      const keyword = container.querySelector(\"#input-search\")?.value.trim() || \n                     container.querySelector('[data-testid=\"search-input\"]')?.value.trim() || '';\n      \n      const rows = await window.aivicApi.list(9);\n      if (rows) {\n        const filtered = keyword ? rows.filter(r => \n          JSON.stringify(r).toLowerCase().includes(keyword.toLowerCase())\n        ) : rows;\n        renderRows(filtered);\n      }\n    } catch (error) {\n      window.aivicNotify.error('検索に失敗しました');\n    }\n  }\n\n  // 11. CSVエクスポート\n  async function handleExport() {\n    try {\n      const rows = await window.aivicApi.list(9);\n      if (!rows) return;\n      \n      const headers = [\"分類基準名\", \"文書種別\", \"補助金関連度\", \"処理ルート\", \"優先度\", \"有効状態\", \"適用開始日\", \"適用終了日\"];\n      const csvContent = \"\\uFEFF\" + [\n        headers.join(\",\"),\n        ...rows.map(r => [\n          `\"${r.分類基準名 || \"\"}\"`,\n          `\"${r.文書種別 || \"\"}\"`,\n          `\"${r.補助金関連度レベル === 3 ? '高' : r.補助金関連度レベル === 2 ? '中' : '低'}\"`,\n          `\"${r.処理ルート || \"\"}\"`,\n          r.優先度 || 1,\n          r.有効フラグ ? \"有効\" : \"無効\",\n          `\"${r.適用開始日 ? new Date(r.適用開始日).toLocaleDateString() : \"\"}\"`,\n          `\"${r.適用終了日 ? new Date(r.適用終了日).toLocaleDateString() : \"\"}\"`\n        ].join(\",\"))\n      ].join(\"\\n\");\n\n      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });\n      const link = document.createElement(\"a\");\n      link.href = URL.createObjectURL(blob);\n      link.download = `分類基準設定_${new Date().toISOString().split('T')[0]}.csv`;\n      link.click();\n    } catch (error) {\n      window.aivicNotify.error('エクスポートに失敗しました');\n    }\n  }\n\n  // 12. イベントリスナー設定\n  function setupEventListeners() {\n    // 新規作成ボタン\n    const newBtn = container.querySelector('[data-testid=\"new-button\"]');\n    if (newBtn) {\n      newBtn.addEventListener('click', handleNew);\n    }\n\n    // 検索ボタン\n    const searchBtn = container.querySelector(\"#btn-search\") || container.querySelector('[data-testid=\"search-button\"]');\n    if (searchBtn) {\n      searchBtn.addEventListener('click', handleSearch);\n    }\n\n    // エクスポートボタン\n    const exportBtn = container.querySelector(\"#btn-export\") || container.querySelector('[data-testid=\"export-button\"]');\n    if (exportBtn) {\n      exportBtn.addEventListener('click', handleExport);\n    }\n\n    // 検索入力でEnterキー\n    const searchInput = container.querySelector(\"#input-search\") || container.querySelector('[data-testid=\"search-input\"]');\n    if (searchInput) {\n      searchInput.addEventListener('keypress', (e) => {\n        if (e.key === 'Enter') {\n          handleSearch();\n        }\n      });\n    }\n  }\n\n  // 13. 初期化実行\n  loadInitialData();\n  setupEventListeners();\n\n  // テスト用のグローバル参照\n  window.classificationScreen = {\n    loadData: loadInitialData,\n    handleNew,\n    handleSearch,\n    handleExport\n  };\n}";
</script>

    <style>

            margin-bottom: 16px;
        }

        .card-header {

            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        .card-body {
            padding: 16px;
        }

        .table-container {
            overflow-x: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th {
            text-align: left;
            padding: 8px 12px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;

        }

        .data-table td {

      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
