window.AIVIC_PAGE_INIT_JS = "js\nfunction(container, apiUrl, tables) {\n  // 業務ロジックのインポート（実際の環境では適切にインポート）\n  const { \n    validateApplicationInput,\n    classifyDocumentTypeAndRoute,\n    determineDocumentTypeAndRoute,\n    determineProcessingRoute,\n    handleDocumentClassificationException,\n    validateApplicationBeforeSubmission,\n    updateDocumentClassificationStandards,\n    migrateExistingDataToNewClassification\n  } = window.businessLogic || {};\n\n  let editingId = null;\n  \n  // 1. 再描画関数の定義\n  function renderRows(rows) {\n    const tbody = container.querySelector('#criteria-tbody');\n    if (!tbody) return;\n    \n    tbody.innerHTML = rows.map(r => `\n      <tr data-id=\"${r.id}\">\n        <td>${r.分類基準名 || ''}</td>\n        <td>${r.文書種別 || ''}</td>\n        <td>${getRelevanceText(r.補助金関連度)}</td>\n        <td>${r.処理ルート || ''}</td>\n        <td>${r.優先度 || ''}</td>\n        <td>\n          <span style=\"padding: 2px 6px; border-radius: 4px; font-size: 11px; ${r.有効フラグ ? 'background: rgba(34, 197, 94, 0.2); color: #22c55e;' : 'background: rgba(239, 68, 68, 0.2); color: #ef4444;'}\">\n            ${r.有効フラグ ? '有効' : '無効'}\n          </span>\n        </td>\n        <td>${r.適用開始日 ? new Date(r.適用開始日).toLocaleDateString('ja-JP') : ''}</td>\n        <td>\n          <button class=\"action-btn secondary edit-btn\" data-id=\"${r.id}\" style=\"margin-right: 4px;\">編集</button>\n          <button class=\"action-btn secondary delete-btn\" data-id=\"${r.id}\">削除</button>\n        </td>\n      </tr>\n    `).join('');\n\n    // 編集・削除ボタンのイベントハンドラを再設定\n    attachRowEventHandlers();\n  }\n\n  function getRelevanceText(level) {\n    switch(level) {\n      case 1: return '低';\n      case 2: return '中';\n      case 3: return '高';\n      default: return '';\n    }\n  }\n\n  function attachRowEventHandlers() {\n    // 編集ボタン\n    container.querySelectorAll('.edit-btn').forEach(btn => {\n      btn.addEventListener('click', async (e) => {\n        const id = e.target.getAttribute('data-id');\n        await handleEdit(id);\n      });\n    });\n\n    // 削除ボタン\n    container.querySelectorAll('.delete-btn').forEach(btn => {\n      btn.addEventListener('click', async (e) => {\n        const id = e.target.getAttribute('data-id');\n        await handleDelete(id);\n      });\n    });\n  }\n\n  // 2. 初期データ読み込み\n  async function loadInitialData() {\n    try {\n      const rows = await window.aivicApi.list(0);\n      if (rows) {\n        renderRows(rows);\n      }\n    } catch (error) {\n      window.aivicNotify.error('データの読み込みに失敗しました');\n    }\n  }\n\n  // 3. 検索機能\n  async function handleSearch() {\n    try {\n      const keyword = container.querySelector('[data-testid=\"search-input\"]')?.value || \n                     container.querySelector('#input-search')?.value || '';\n      const statusFilter = container.querySelector('#filter-status')?.value || '';\n      \n      const rows = await window.aivicApi.list(0);\n      if (!rows) return;\n      \n      const filtered = rows.filter(r => {\n        const matchKeyword = !keyword || (r.分類基準名 && r.分類基準名.includes(keyword));\n        const matchStatus = !statusFilter || r.有効フラグ.toString() === statusFilter;\n        return matchKeyword && matchStatus;\n      });\n      \n      renderRows(filtered);\n    } catch (error) {\n      window.aivicNotify.error('検索処理でエラーが発生しました');\n    }\n  }\n\n  // 4. CSVエクスポート\n  async function handleCsvExport() {\n    try {\n      const rows = await window.aivicApi.list(0);\n      if (!rows) return;\n      \n      const headers = ['分類基準名', '文書種別', '補助金関連度', 'キーワード条件', '処理ルート', '優先度', '有効フラグ', '適用開始日', '適用終了日'];\n      const csvContent = '\\uFEFF' + [\n        headers.join(','),\n        ...rows.map(r => [\n          `\"${r.分類基準名 || ''}\"`,\n          `\"${r.文書種別 || ''}\"`,\n          getRelevanceText(r.補助金関連度),\n          `\"${r.キーワード条件 || ''}\"`,\n          `\"${r.処理ルート || ''}\"`,\n          r.優先度 || '',\n          r.有効フラグ ? '有効' : '無効',\n          r.適用開始日 ? new Date(r.適用開始日).toLocaleDateString('ja-JP') : '',\n          r.適用終了日 ? new Date(r.適用終了日).toLocaleDateString('ja-JP') : ''\n        ].join(','))\n      ].join('\\n');\n      \n      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });\n      const link = document.createElement('a');\n      link.href = URL.createObjectURL(blob);\n      link.download = '分類基準一覧.csv';\n      link.click();\n    } catch (error) {\n      window.aivicNotify.error('CSVエクスポートに失敗しました');\n    }\n  }\n\n  // 5. 新規作成\n  function handleCreate() {\n    editingId = null;\n    clearForm();\n    showModal();\n  }\n\n  // 6. 編集\n  async function handleEdit(id) {\n    try {\n      const rows = await window.aivicApi.list(0);\n      const item = rows?.find(r => r.id.toString() === id.toString());\n      if (!item) {\n        window.aivicNotify.error('編集対象が見つかりません');\n        return;\n      }\n\n      editingId = id;\n      populateForm(item);\n      showModal();\n    } catch (error) {\n      window.aivicNotify.error('編集データの取得に失敗しました');\n    }\n  }\n\n  // 7. 削除\n  async function handleDelete(id) {\n    if (!confirm('この分類基準を削除しますか？')) return;\n    \n    try {\n      await window.aivicApi.delete(0, { id });\n      window.aivicNotify.success('削除完了');\n      loadInitialData();\n    } catch (error) {\n      window.aivicNotify.error('削除に失敗しました');\n    }\n  }\n\n  // 8. 保存\n  async function handleSave() {\n    try {\n      const formData = getFormData();\n      \n      // バリデーション（業務ロジック使用）\n      if (validateApplicationInput && !validateApplicationInput(formData)) {\n        container.querySelector('[data-testid=\"error-message\"]').style.display = 'block';\n        container.querySelector('[data-testid=\"error-message\"]').textContent = '分類基準名は必須です';\n        return;\n      }\n\n      // 文書分類の決定（業務ロジック使用）\n      if (classifyDocumentTypeAndRoute) {\n        const classification = classifyDocumentTypeAndRoute(formData);\n        formData.処理ルート = classification.route;\n      }\n\n      if (determineProcessingRoute) {\n        formData.処理ルート = determineProcessingRoute(formData);\n      }\n\n      // 保存処理\n      if (editingId) {\n        await window.aivicApi.update(0, { ...formData, id: editingId });\n        window.aivicNotify.success('更新完了');\n      } else {\n        await window.aivicApi.save(0, formData);\n        window.aivicNotify.success('登録完了');\n      }\n\n      hideModal();\n      loadInitialData();\n    } catch (error) {\n      window.aivicNotify.error('保存に失敗しました');\n    }\n  }\n\n  // 9. プレビュー\n  function handlePreview() {\n    try {\n      const formData = getFormData();\n      const previewContent = container.querySelector('#preview-content');\n      if (previewContent) {\n        previewContent.innerHTML = `\n          <div>文書種別: ${formData.文書種別}</div>\n          <div>処理ルート: ${formData.処理ルート}</div>\n          <div>補助金関連度: ${getRelevanceText(formData.補助金関連度)}</div>\n          <div>優先度: ${formData.優先度}</div>\n        `;\n      }\n    } catch (error) {\n      window.aivicNotify.error('プレビュー表示に失敗しました');\n    }\n  }\n\n  // 10. 有効無効切り替え\n  async function handleActiveToggle(id, currentStatus) {\n    try {\n      await window.aivicApi.update(0, { id, 有効フラグ: !currentStatus });\n      loadInitialData();\n    } catch (error) {\n      window.aivicNotify.error('状態の更新に失敗しました');\n    }\n  }\n\n  // ユーティリティ関数\n  function getFormData() {\n    return {\n      分類基準名: container.querySelector('[data-testid=\"criteria-name-input\"]')?.value || '',\n      文書種別: container.querySelector('[data-testid=\"document-type-select\"]')?.value || '',\n      補助金関連度: getSelectedRelevance(),\n      キーワード条件: container.querySelector('[data-testid=\"keywords-input\"]')?.value || '',\n      処理ルート: container.querySelector('[data-testid=\"route-select\"]')?.value || '',\n      優先度: parseInt(container.querySelector('[data-testid=\"priority-slider\"]')?.value || '0'),\n      適用開始日: container.querySelector('[data-testid=\"start-date-input\"]')?.value || '',\n      適用終了日: container.querySelector('[data-testid=\"end-date-input\"]')?.value || '',\n      有効フラグ: true\n    };\n  }\n\n  function getSelectedRelevance() {\n    if (container.querySelector('[data-testid=\"relevance-high\"]')?.checked) return 3;\n    if (container.querySelector('[data-testid=\"relevance-medium\"]')?.checked) return 2;\n    if (container.querySelector('[data-testid=\"relevance-low\"]')?.checked) return 1;\n    return 1;\n  }\n\n  function populateForm(item) {\n    const criteriaNameInput = container.querySelector('[data-testid=\"criteria-name-input\"]');\n    if (criteriaNameInput) criteriaNameInput.value = item.分類基準名 || '';\n    \n    const documentTypeSelect = container.querySelector('[data-testid=\"document-type-select\"]');\n    if (documentTypeSelect) documentTypeSelect.value = item.文書種別 || '';\n    \n    const keywordsInput = container.querySelector('[data-testid=\"keywords-input\"]');\n    if (keywordsInput) keywordsInput.value = item.キーワード条件 || '';\n    \n    const routeSelect = container.querySelector('[data-testid=\"route-select\"]');\n    if (routeSelect) routeSelect.value = item.処理ルート || '';\n    \n    const prioritySlider = container.querySelector('[data-testid=\"priority-slider\"]');\n    if (prioritySlider) prioritySlider.value = item.優先度 || '0';\n    \n    const startDateInput = container.querySelector('[data-testid=\"start-date-input\"]');\n    if (startDateInput && item.適用開始日) {\n      startDateInput.value = new Date(item.適用開始日).toISOString().split('T')[0];\n    }\n\n    // 関連度ラジオボタン\n    const relevanceLevel = item.補助金関連度 || 1;\n    const relevanceRadios = {\n      1: container.querySelector('[data-testid=\"relevance-low\"]'),\n      2: container.querySelector('[data-testid=\"relevance-medium\"]'),\n      3: container.querySelector('[data-testid=\"relevance-high\"]')\n    };\n    Object.values(relevanceRadios).forEach(radio => {\n      if (radio) radio.checked = false;\n    });\n    if (relevanceRadios[relevanceLevel]) {\n      relevanceRadios[relevanceLevel].checked = true;\n    }\n  }\n\n  function clearForm() {\n    const inputs = container.querySelectorAll('input, select, textarea');\n    inputs.forEach(input => {\n      if (input.type === 'checkbox' || input.type === 'radio') {\n        input.checked = false;\n      } else {\n        input.value = '';\n      }\n    });\n    \n    // エラーメッセージを非表示\n    const errorMessage = container.querySelector('[data-testid=\"error-message\"]');\n    if (errorMessage) errorMessage.style.display = 'none';\n  }\n\n  function showModal() {\n    const modal = container.querySelector('#criteria-modal');\n    if (modal) modal.style.display = 'block';\n  }\n\n  function hideModal() {\n    const modal = container.querySelector('#criteria-modal');\n    if (modal) modal.style.display = 'none';\n  }\n\n  // イベントハンドラの設定\n  function setupEventHandlers() {\n    // 検索ボタン\n    const searchBtn = container.querySelector('[data-testid=\"search-button\"]') || \n                     container.querySelector('#btn-search');\n    if (searchBtn) {\n      searchBtn.addEventListener('click', handleSearch);\n    }\n\n    // CSVエクスポートボタン\n    const csvExportBtn = container.querySelector('[data-testid=\"csv-export-button\"]') || \n                        container.querySelector('#btn-csv-export');\n    if (csvExportBtn) {\n      csvExportBtn.addEventListener('click', handleCsvExport);\n    }\n\n    // 新規作成ボタン\n    const createBtn = container.querySelector('[data-testid=\"create-button\"]');\n    if (createBtn) {\n      createBtn.addEventListener('click', handleCreate);\n    }\n\n    // 保存ボタン\n    const saveBtn = container.querySelector('[data-testid=\"save-button\"]');\n    if (saveBtn) {\n      saveBtn.addEventListener('click', handleSave);\n    }\n\n    // プレビューボタン\n    const previewBtn = container.querySelector('[data-testid=\"preview-button\"]');\n    if (previewBtn) {\n      previewBtn.addEventListener('click', handlePreview);\n    }\n\n    // 有効無効スイッチ\n    const activeSwitches = container.querySelectorAll('[data-testid=\"active-switch\"]');\n    activeSwitches.forEach(switchEl => {\n      switchEl.addEventListener('click', (e) => {\n        const row = e.target.closest('tr');\n        const id = row?.getAttribute('data-id');\n        const currentStatus = e.target.checked;\n        if (id) {\n          handleActiveToggle(id, !currentStatus);\n        }\n      });\n    });\n\n    // モーダル閉じるボタン\n    const closeBtn = container.querySelector('.modal-close');\n    if (closeBtn) {\n      closeBtn.addEventListener('click', hideModal);\n    }\n\n    // キャンセルボタン\n    const cancelBtn = container.querySelector('[data-testid=\"cancel-button\"]');\n    if (cancelBtn) {\n      cancelBtn.addEventListener('click', hideModal);\n    }\n  }\n\n  // 初期化処理\n  loadInitialData();\n  setupEventHandlers();\n}";
</script>

      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }

      error: function(msg) { show("❌ " + msg, "error"); },

    function q(i) {

      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }

      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }

      },

    if (currentName === (encodeURIComponent(screenId) + '.html') ||

    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {

      // ボタンクリック等のユーザー操作は ready 後なので影響しない。

  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    // **content 要素の hidden 強制除去（2026-05-24 Playwright 大量 fail 対応）**:
    // AI が生成した panel HTML には class="hidden" / hidden 属性 / style="display:none"
    // が content 要素（#xxx-tbody / #xxx-list / [data-testid="error-message"] 等）に付いて
    // いることがある。それを Playwright が toBeVisible() で待ち続けて timeout する事故が頻発。
    //
    // ポリシー: panel コンテナ配下の全要素について以下を実行:
    //   - class="hidden" / display:none / hidden 属性を **content 要素では除去**
    //   - **modal 系**（.modal, .modal-backdrop, [role="dialog"], [data-modal] 等）は除外
    //     （これらは仕様上初期非表示が正しい）
    var isModalLike = function(el) {
      if (!el || !el.classList) return false;
      var cn = String(el.className || "");
      if (/modal|dialog|overlay|popup|dropdown|tooltip/i.test(cn)) return true;
      var role = el.getAttribute && el.getAttribute("role");
      if (role === "dialog" || role === "alertdialog" || role === "tooltip" || role === "menu") return true;
      if (el.hasAttribute && (el.hasAttribute("data-modal") || el.hasAttribute("data-dropdown") || el.hasAttribute("data-popup"))) return true;
      return false;
    };
    var unhideContentElements = function(root) {
      var all = root.querySelectorAll('.hidden, [hidden], [style*="display:none"], [style*="display: none"]');
      for (var k = 0; k < all.length; k++) {
        var el = all[k];
        // modal 系は触らない
        if (isModalLike(el)) continue;
        // parent chain で modal 内なら触らない
        var p = el.parentElement;
        var insideModal = false;
        while (p && p !== root) {
          if (isModalLike(p)) { insideModal = true; break; }
          p = p.parentElement;
        }
        if (insideModal) continue;
        // 除去
        el.classList.remove('hidden');
        el.removeAttribute('hidden');
        if (el.style && el.style.display === 'none') el.style.display = '';
      }
    };
    try { unhideContentElements(container); } catch (e) { console.warn('[aivic] unhideContent failed:', e); }

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
