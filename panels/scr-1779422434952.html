<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ハイブリッド申請承認システム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-main: #ffffff;
            --bg-card: #f8fafc;
            --bg-sidebar: #f1f5f9;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-muted: #64748b;
            --text-light: #94a3b8;
            --top-bar-bg: #ffffff;
            --top-bar-border: #e2e8f0;
            --success: #059669;
            --warning: #d97706;
            --danger: #dc2626;
            --radius: 8px;
            --radius-sm: 6px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 13px;
            line-height: 1.4;
            color: var(--text);
            background: var(--bg-main);
        }

        .app-layout {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--top-bar-bg);
        }

        .logo {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }

        .nav-section {
            padding: 12px 0;
        }

        .nav-section-title {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0 16px 8px;
        }

        .nav-item {
            display: block;
            padding: 6px 16px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .nav-item:hover {
            background: rgba(59, 130, 246, 0.08);
            color: var(--primary);
        }

        .nav-item.aivic-active {
            background: rgba(59, 130, 246, 0.12);
            color: var(--primary);
            font-weight: 500;
            border-right: 2px solid var(--primary);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            height: 52px;
            background: var(--top-bar-bg);
            border-bottom: 1px solid var(--top-bar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .breadcrumb {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 500;
        }

        .logout-link {
            font-size: 12px;
            color: var(--text-muted);
            text-decoration: none;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            transition: background 0.15s ease;
        }

        .logout-link:hover {
            background: var(--bg-card);
        }

        .content-area {
            flex: 1;
            overflow: auto;
            padding: 16px 20px;
        }

        .panel-container {
            height: 100%;
            background: var(--bg-main);
        }

        .status-indicator {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .status-pending { background: var(--warning); }
        .status-approved { background: var(--success); }
        .status-rejected { background: var(--danger); }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .badge-primary {
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary);
        }

        .badge-success {
            background: rgba(5, 150, 105, 0.1);
            color: var(--success);
        }

        .badge-warning {
            background: rgba(217, 119, 6, 0.1);
            color: var(--warning);
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            margin-bottom: 12px;
        }

        .card-header {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
            background: var(--bg-main);
            color: var(--text);
        }

        .btn:hover {
            background: var(--bg-card);
            border-color: var(--primary);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .table th,
        .table td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .table th {
            font-weight: 500;
            color: var(--text-muted);
            background: var(--bg-card);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .table tbody tr:hover {
            background: rgba(59, 130, 246, 0.02);
        }

        .loading-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--text-light);
            font-size: 12px;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            
            .content-area {
                padding: 12px 16px;
            }
        }
    </style>

id","required":true,"description":"適用される承認フロー定義への外部キー"},{"name":"現在ステップ番号","type":"integer","required":true,"description":"現在処理中の承認ステップ番号"},{"name":"現在承認者ID","type":"uuid","required":false,"description":"現在の承認担当者のユーザーID"},{"name":"処理状況","type":"varchar(100)","required":true,"description":"処理の現在状況（申請中/承認待ち/承認済み/差戻し/却下/取下げ）"},{"name":"開始日時","type":"timestamp","required":true,"description":"処理ルートの開始日時"},{"name":"完了日時","type":"timestamp","required":false,"description":"処理ルートの完了日時"},{"name":"期限日時","type":"timestamp","required":false,"description":"処理完了の期限日時"},{"name":"優先度","type":"integer","required":true,"description":"処理の優先度（1:低 2:通常 3:高 4:緊急）"},{"name":"自動処理フラグ","type":"boolean","required":true,"description":"自動処理対象かどうかのフラグ"},{"name":"備考","type":"text","required":false,"description":"処理ルートに関する備考・メモ"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"遅延検知設定","purpose":"申請承認プロセスにおける遅延を検知するための設定を管理し、承認ステップごとの期限や通知タイミングを定義する","columns":[{"name":"遅延検知設定ID","type":"uuid","required":true,"description":"遅延検知設定の一意識別子（主キー）"},{"name":"文書種別ID","type":"uuid","required":true,"description":"文書種別マスタへの外部キー"},{"name":"承認ステップID","type":"uuid","required":false,"description":"承認ステップへの外部キー（全ステップ共通の場合はNULL）"},{"name":"設定名","type":"varchar(100)","required":true,"description":"遅延検知設定の名称"},{"name":"期限日数","type":"integer","required":true,"description":"承認期限までの日数"},{"name":"警告日数","type":"integer","required":false,"description":"期限前の警告通知を行う日数"},{"name":"エスカレーション日数","type":"integer","required":false,"description":"期限超過後のエスカレーション通知を行う日数"},{"name":"営業日計算フラグ","type":"boolean","required":true,"description":"営業日ベースで計算するかどうか"},{"name":"有効フラグ","type":"boolean","required":true,"description":"設定が有効かどうか"},{"name":"備考","type":"text","required":false,"description":"設定に関する補足説明"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"補助金関連度マスタ","purpose":"申請書類と補助金制度の関連度を管理し、適切な承認フローや処理ルートの決定に使用するマスタテーブル","columns":[{"name":"補助金関連度ID","type":"uuid","required":true,"description":"補助金関連度の一意識別子（主キー）"},{"name":"補助金関連度コード","type":"varchar(100)","required":true,"description":"補助金関連度の業務コード（表示・検索用）"},{"name":"補助金関連度名","type":"varchar(100)","required":true,"description":"補助金関連度の名称"},{"name":"関連度レベル","type":"integer","required":true,"description":"関連度の数値レベル（1:低、2:中、3:高など）"},{"name":"説明","type":"text","required":false,"description":"補助金関連度の詳細説明"},{"name":"表示順","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"マスタデータの有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]}];

window.AIVIC_PAGE_INIT_JS = "js\nfunction(container, apiUrl, tables) {\n  // 業務ロジックのインポート\n  const { \n    checkApprovalStatusViewPermission, \n    getProgressDataWithAccessControl,\n    validateApplicationInput,\n    classifyDocumentTypeAndRoute,\n    determineApprovalHierarchy\n  } = window.businessLogic || {};\n\n  // 申請書類データの表示\n  function displayApplicationData() {\n    const applications = tables[0]?.records || [];\n    const users = tables[1]?.records || [];\n    const documentTypes = tables[2]?.records || [];\n    const attachments = tables[3]?.records || [];\n    \n    if (applications.length > 0) {\n      const app = applications[0];\n      const applicant = users.find(u => u.id === app.申請者ID) || {};\n      const docType = documentTypes.find(d => d.id === app.申請種別) || {};\n      \n      // 閲覧権限チェック\n      if (checkApprovalStatusViewPermission) {\n        const hasPermission = checkApprovalStatusViewPermission({\n          userId: window.currentUser?.id,\n          applicationId: app.id,\n          userRole: window.currentUser?.role\n        });\n        if (!hasPermission.isValid) {\n          window.aivicNotify.error('この申請書類を閲覧する権限がありません');\n          return;\n        }\n      }\n      \n      // 基本情報の表示\n      const applicationIdEl = container.querySelector(\"#application-id\");\n      if (applicationIdEl) {\n        applicationIdEl.textContent = app.id?.substring(0, 8) || \"-\";\n      }\n      \n      const applicationDateEl = container.querySelector(\"#application-date\");\n      if (applicationDateEl) {\n        applicationDateEl.textContent = app.作成日時 ? new Date(app.作成日時).toLocaleString('ja-JP') : \"-\";\n      }\n      \n      const applicantNameEl = container.querySelector(\"#applicant-name\");\n      if (applicantNameEl) {\n        applicantNameEl.textContent = applicant.ユーザー名 || \"-\";\n      }\n      \n      const applicantDeptEl = container.querySelector(\"#applicant-dept\");\n      if (applicantDeptEl) {\n        applicantDeptEl.textContent = applicant.所属部署 || \"-\";\n      }\n      \n      const documentTypeEl = container.querySelector(\"#document-type\");\n      if (documentTypeEl) {\n        documentTypeEl.textContent = docType.文書種別名 || app.申請種別 || \"-\";\n      }\n      \n      // 承認状態の表示\n      const statusEl = container.querySelector(\"#approval-status\");\n      if (statusEl) {\n        const status = app.承認状態 || \"申請中\";\n        statusEl.textContent = status;\n        \n        // ステータス別の色分け\n        if (status === \"承認済\") {\n          statusEl.style.background = \"rgba(0,200,100,0.15)\";\n          statusEl.style.color = \"#00c864\";\n        } else if (status === \"却下\" || status === \"差戻し\") {\n          statusEl.style.background = \"rgba(255,100,100,0.15)\";\n          statusEl.style.color = \"#ff6464\";\n        } else if (status === \"保留\") {\n          statusEl.style.background = \"rgba(255,200,0,0.15)\";\n          statusEl.style.color = \"#ffc800\";\n        }\n      }\n      \n      // 申請内容の表示\n      const applicationTitleEl = container.querySelector(\"#application-title\");\n      if (applicationTitleEl) {\n        applicationTitleEl.textContent = app.申請タイトル || \"-\";\n      }\n      \n      const applicationContentEl = container.querySelector(\"#application-content\");\n      if (applicationContentEl) {\n        applicationContentEl.textContent = app.申請内容 || \"-\";\n      }\n      \n      const applicationAmountEl = container.querySelector(\"#application-amount\");\n      if (applicationAmountEl) {\n        applicationAmountEl.textContent = app.申請金額 ? `¥${app.申請金額.toLocaleString()}` : \"-\";\n      }\n      \n      const startDateEl = container.querySelector(\"#start-date\");\n      if (startDateEl) {\n        startDateEl.textContent = app.申請開始日 ? new Date(app.申請開始日).toLocaleDateString('ja-JP') : \"-\";\n      }\n      \n      const endDateEl = container.querySelector(\"#end-date\");\n      if (endDateEl) {\n        endDateEl.textContent = app.申請終了日 ? new Date(app.申請終了日).toLocaleDateString('ja-JP') : \"-\";\n      }\n      \n      // 添付ファイル一覧の表示\n      renderAttachmentList(attachments.filter(att => att.申請ID === app.id));\n    }\n  }\n\n  // 添付ファイル一覧の表示\n  function renderAttachmentList(attachments) {\n    const attachmentListEl = container.querySelector(\"#attachment-list\");\n    if (!attachmentListEl) return;\n    \n    if (attachments.length === 0) {\n      attachmentListEl.innerHTML = '<div style=\"padding: 12px; text-align: center; color: var(--text-muted);\">添付ファイルがありません</div>';\n      return;\n    }\n    \n    attachmentListEl.innerHTML = attachments.map(att => `\n      <div style=\"display: flex; align-items: center; justify-content: space-between; padding: 8px; border: 1px solid var(--border); border-radius: 4px; margin-bottom: 4px;\">\n        <div>\n          <span style=\"font-weight: 500;\">${att.ファイル名 || 'ファイル'}</span>\n          <span style=\"color: var(--text-muted); margin-left: 8px;\">(${att.ファイルサイズ || '0KB'})</span>\n        </div>\n        <div style=\"display: flex; gap: 4px;\">\n          <button class=\"action-btn secondary\" onclick=\"previewFile('${att.id}')\" style=\"font-size: 12px; padding: 4px 8px;\">プレビュー</button>\n          <button class=\"action-btn secondary\" onclick=\"downloadFile('${att.id}', '${att.ファイル名}')\" style=\"font-size: 12px; padding: 4px 8px;\">ダウンロード</button>\n        </div>\n      </div>\n    `).join('');\n  }\n\n  // 承認履歴の表示\n  function renderApprovalHistory() {\n    const histories = tables[4]?.records || [];\n    const users = tables[1]?.records || [];\n    const tbody = container.querySelector(\"#approval-history-tbody\");\n    \n    if (!tbody) return;\n    \n    if (histories.length === 0) {\n      tbody.innerHTML = '<tr><td colspan=\"4\" style=\"padding: 12px; text-align: center; color: var(--text-muted);\">承認履歴がありません</td></tr>';\n      return;\n    }\n    \n    tbody.innerHTML = histories.map(h => {\n      const approver = users.find(u => u.id === h.承認者ID) || {};\n      const result = h.承認結果 || \"申請\";\n      let resultBadge = \"\";\n      \n      if (result === \"承認\") {\n        resultBadge = `<span style=\"padding: 2px 6px; border-radius: 3px; font-size: 10px; background: rgba(0,200,100,0.15); color: #00c864;\">${result}</span>`;\n      } else if (result === \"却下\" || result === \"差戻し\") {\n        resultBadge = `<span style=\"padding: 2px 6px; border-radius: 3px; font-size: 10px; background: rgba(255,100,100,0.15); color: #ff6464;\">${result}</span>`;\n      } else {\n        resultBadge = `<span style=\"padding: 2px 6px; border-radius: 3px; font-size: 10px; background: rgba(100,100,100,0.15); color: #666;\">${result}</span>`;\n      }\n      \n      return `\n        <tr>\n          <td style=\"padding: 8px;\">${h.処理日時 ? new Date(h.処理日時).toLocaleString('ja-JP') : \"-\"}</td>\n          <td style=\"padding: 8px;\">${approver.ユーザー名 || \"-\"}</td>\n          <td style=\"padding: 8px;\">${resultBadge}</td>\n          <td style=\"padding: 8px;\">${h.コメント || \"-\"}</td>\n        </tr>\n      `;\n    }).join('');\n  }\n\n  // 承認フロー進捗の表示\n  function renderApprovalFlow() {\n    const flowEl = container.querySelector(\"#approval-flow\");\n    if (!flowEl) return;\n    \n    const applications = tables[0]?.records || [];\n    if (applications.length === 0) return;\n    \n    const app = applications[0];\n    \n    // 業務ロジックで承認階層を取得\n    let approvalHierarchy = [];\n    if (determineApprovalHierarchy) {\n      try {\n        const hierarchyResult = determineApprovalHierarchy({\n          applicationAmount: app.申請金額,\n          documentType: app.申請種別,\n          applicantDepartment: app.申請者部署,\n          urgencyLevel: app.緊急度\n        });\n        if (hierarchyResult.isValid) {\n          approvalHierarchy = hierarchyResult.hierarchy || [];\n        }\n      } catch (error) {\n        console.error('承認階層取得エラー:', error);\n      }\n    }\n    \n    // 承認フロー表示\n    flowEl.innerHTML = approvalHierarchy.map((step, index) => `\n      <div style=\"display: flex; align-items: center; margin-bottom: 8px;\">\n        <div style=\"width: 24px; height: 24px; border-radius: 50%; background: ${step.completed ? '#00c864' : '#ddd'}; color: white; display: flex; align-items: center; justify-content: center; font-size: 12px; margin-right: 8px;\">\n          ${index + 1}\n        </div>\n        <div>\n          <div style=\"font-weight: 500;\">${step.approverName || step.role}</div>\n          <div style=\"font-size: 12px; color: var(--text-muted);\">${step.department || ''}</div>\n        </div>\n      </div>\n    `).join('');\n  }\n\n  // ファイルプレビュー\n  window.previewFile = function(fileId) {\n    // プレビュー機能の実装\n    window.open(`/api/files/${fileId}/preview`, '_blank');\n  };\n\n  // ファイルダウンロード\n  window.downloadFile = function(fileId, fileName) {\n    const link = document.createElement('a');\n    link.href = `/api/files/${fileId}/download`;\n    link.download = fileName;\n    document.body.appendChild(link);\n    link.click();\n    document.body.removeChild(link);\n  };\n\n  // 戻るボタンのイベントハンドラ\n  const backBtn = container.querySelector(\"#btn-back\");\n  if (backBtn) {\n    backBtn.addEventListener('click', function() {\n      history.back();\n    });\n  }\n\n  // 承認ボタンのイベントハンドラ\n  const approveBtn = container.querySelector(\"#btn-approve\");\n  if (approveBtn) {\n    approveBtn.addEventListener('click', function() {\n      const applications = tables[0]?.records || [];\n      if (applications.length === 0) return;\n      \n      const app = applications[0];\n      const comment = container.querySelector(\"#approval-comment\")?.value || '';\n      \n      // 承認処理\n      window.aivicApi.save('approval_histories', {\n        申請ID: app.id,\n        承認者ID: window.currentUser?.id,\n        承認結果: '承認',\n        コメント: comment,\n        処理日時: new Date().toISOString()\n      }).then(() => {\n        window.aivicNotify.success('承認しました');\n        location.reload();\n      }).catch(error => {\n        window.aivicNotify.error('承認処理に失敗しました');\n        console.error(error);\n      });\n    });\n  }\n\n  // 却下ボタンのイベントハンドラ\n  const rejectBtn = container.querySelector(\"#btn-reject\");\n  if (rejectBtn) {\n    rejectBtn.addEventListener('click', function() {\n      const applications = tables[0]?.records || [];\n      if (applications.length === 0) return;\n      \n      const app = applications[0];\n      const comment = container.querySelector(\"#approval-comment\")?.value || '';\n      \n      if (!comment.trim()) {\n        window.aivicNotify.error('却下理由を入力してください');\n        return;\n      }\n      \n      // 却下処理\n      window.aivicApi.save('approval_histories', {\n        申請ID: app.id,\n        承認者ID: window.currentUser?.id,\n        承認結果: '却下',\n        コメント: comment,\n        処理日時: new Date().toISOString()\n      }).then(() => {\n        window.aivicNotify.success('却下しました');\n        location.reload();\n      }).catch(error => {\n        window.aivicNotify.error('却下処理に失敗しました');\n        console.error(error);\n      });\n    });\n  }\n\n  // 差戻しボタンのイベントハンドラ\n  const returnBtn = container.querySelector(\"#btn-return\");\n  if (returnBtn) {\n    returnBtn.addEventListener('click', function() {\n      const applications = tables[0]?.records || [];\n      if (applications.length === 0) return;\n      \n      const app = applications[0];\n      const comment = container.querySelector(\"#approval-comment\")?.value || '';\n      \n      if (!comment.trim()) {\n        window.aivicNotify.error('差戻し理由を入力してください');\n        return;\n      }\n      \n      // 差戻し処理\n      window.aivicApi.save('approval_histories', {\n        申請ID: app.id,\n        承認者ID: window.currentUser?.id,\n        承認結果: '差戻し',\n        コメント: comment,\n        処理日時: new Date().toISOString()\n      }).then(() => {\n        window.aivicNotify.success('差戻ししました');\n        location.reload();\n      }).catch(error => {\n        window.aivicNotify.error('差戻し処理に失敗しました');\n        console.error(error);\n      });\n    });\n  }\n\n  // 初期化処理\n  displayApplicationData();\n  renderApprovalHistory();\n  renderApprovalFlow();\n}";
</script>

    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
