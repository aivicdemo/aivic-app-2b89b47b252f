window.AIVIC_PAGE_INIT_JS = "javascript\nfunction(container, apiUrl, tables) {\n  // 業務ロジックのインポート（実際の実装では適切にインポート）\n  const { \n    handleSystemFailureAlternativeProcess, \n    checkApprovalStatusViewPermission,\n    setApprovalDeadline,\n    identifyStagnantApplications,\n    determinePriorityForReminder,\n    checkApprovalDelayAndNotify,\n    validateApplicationInput,\n    determineApprovalHierarchy,\n    determineNextApprover,\n    processUrgentApplicationPriority,\n    handleApproverAbsenceSubstitution,\n    determineNotificationTargets\n  } = window.businessLogic || {};\n\n  let allApplications = [];\n  let filteredApplications = [];\n  let currentFilter = '';\n\n  // 初期データ読み込み\n  async function loadApplications() {\n    try {\n      const response = await window.aivicApi.list('applications', {});\n      if (response && response.data) {\n        allApplications = response.data;\n        filteredApplications = [...allApplications];\n        \n        // 遅延チェックと通知\n        if (checkApprovalDelayAndNotify) {\n          allApplications.forEach(app => {\n            try {\n              checkApprovalDelayAndNotify(app);\n            } catch (error) {\n              console.warn('遅延チェック処理でエラー:', error);\n            }\n          });\n        }\n        \n        renderApplications(filteredApplications);\n        updateProgressDisplay();\n      }\n    } catch (error) {\n      console.error('申請データの読み込みに失敗:', error);\n      \n      // システム障害時の代替処理\n      if (handleSystemFailureAlternativeProcess) {\n        try {\n          const fallbackData = handleSystemFailureAlternativeProcess();\n          if (fallbackData) {\n            allApplications = fallbackData;\n            filteredApplications = [...allApplications];\n            renderApplications(filteredApplications);\n          }\n        } catch (fallbackError) {\n          window.aivicNotify?.error('データの読み込みに失敗しました');\n        }\n      } else {\n        window.aivicNotify?.error('申請データの読み込みに失敗しました');\n      }\n    }\n  }\n\n  // テーブル再描画関数\n  function renderApplications(applications) {\n    const tbody = container.querySelector('#applications-tbody');\n    if (!tbody) return;\n    \n    if (!applications || applications.length === 0) {\n      tbody.innerHTML = '<tr><td colspan=\"11\" style=\"text-align: center; padding: 20px; color: var(--text-muted);\">該当する申請が見つかりません</td></tr>';\n      return;\n    }\n\n    tbody.innerHTML = applications.map(app => {\n      const isDelayed = new Date(app.処理予定日 || app.期限日時) < new Date() && !['承認済', '却下'].includes(app.承認状態);\n      const statusClass = getStatusClass(app.承認状態);\n      const priorityClass = getPriorityClass(app.優先度);\n      \n      return `\n        <tr data-id=\"${app.申請書類ID}\" ${isDelayed ? 'class=\"delay-alert\"' : ''}>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">${app.申請書類ID?.substring(0, 8) || ''}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\" title=\"${app.申請タイトル || ''}\">${app.申請タイトル || ''}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">${app.申請者名 || ''}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">${app.申請種別 || ''}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">${formatDate(app.作成日時)}</td>\n          <td style=\"padding: 6px 10px;\"><span class=\"status-badge ${statusClass}\">${app.承認状態 || ''}</span></td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">${app.現在承認者名 || '-'}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">${formatDate(app.処理予定日) || '-'}</td>\n          <td style=\"padding: 6px 10px;\"><span class=\"${priorityClass}\">${getPriorityText(app.優先度)}</span></td>\n          <td style=\"padding: 6px 10px;\">${renderProgress(app.承認段階, app.総承認段数)}</td>\n          <td style=\"padding: 6px 10px;\">\n            <button class=\"action-btn secondary detail-btn\" data-id=\"${app.申請書類ID}\" style=\"font-size: 11px; padding: 4px 8px;\">詳細</button>\n          </td>\n        </tr>\n      `;\n    }).join('');\n\n    // 詳細ボタンのイベントハンドラーを追加\n    tbody.querySelectorAll('.detail-btn').forEach(btn => {\n      btn.addEventListener('click', handleDetailClick);\n    });\n  }\n\n  function getStatusClass(status) {\n    const statusMap = {\n      '申請中': 'status-pending',\n      '承認中': 'status-approving', \n      '承認済': 'status-approved',\n      '差戻し': 'status-returned',\n      '却下': 'status-rejected'\n    };\n    return statusMap[status] || 'status-pending';\n  }\n\n  function getPriorityClass(priority) {\n    if (priority >= 4) return 'priority-high';\n    if (priority >= 3) return 'priority-medium';\n    return 'priority-low';\n  }\n\n  function getPriorityText(priority) {\n    if (priority >= 4) return '緊急';\n    if (priority >= 3) return '高';\n    if (priority >= 2) return '中';\n    return '低';\n  }\n\n  function renderProgress(current, total) {\n    if (!total) return '-';\n    const percentage = Math.round((current / total) * 100);\n    return `\n      <div style=\"display: flex; align-items: center; gap: 4px;\">\n        <div style=\"width: 60px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; overflow: hidden;\">\n          <div style=\"width: ${percentage}%; height: 100%; background: var(--primary); transition: width 0.3s;\"></div>\n        </div>\n        <span style=\"font-size: 11px; color: var(--text-muted);\">${current}/${total}</span>\n      </div>\n    `;\n  }\n\n  function formatDate(dateStr) {\n    if (!dateStr) return '';\n    try {\n      const date = new Date(dateStr);\n      return date.toLocaleDateString('ja-JP', {\n        year: 'numeric',\n        month: '2-digit',\n        day: '2-digit'\n      });\n    } catch {\n      return dateStr;\n    }\n  }\n\n  // 進捗表示の更新\n  function updateProgressDisplay() {\n    const approvalFlow = container.querySelector('#approval-flow');\n    const currentApprover = container.querySelector('#current-approver');\n    \n    if (filteredApplications.length > 0) {\n      const currentApp = filteredApplications[0]; // 最初の申請を例として使用\n      \n      if (approvalFlow) {\n        approvalFlow.innerHTML = `${currentApp.承認段階 || 1}/${currentApp.総承認段数 || 3}`;\n      }\n      \n      if (currentApprover) {\n        currentApprover.textContent = currentApp.現在承認者名 || '未設定';\n      }\n    }\n  }\n\n  // 詳細表示処理\n  async function handleDetailClick(event) {\n    const applicationId = event.target.getAttribute('data-id');\n    if (!applicationId) return;\n\n    try {\n      // 権限チェック\n      if (checkApprovalStatusViewPermission) {\n        const hasPermission = checkApprovalStatusViewPermission(applicationId);\n        if (!hasPermission) {\n          window.aivicNotify?.error('この申請の詳細を表示する権限がありません');\n          return;\n        }\n      }\n\n      const response = await window.aivicApi.list('applications', { id: applicationId });\n      const application = response?.data?.[0];\n      \n      if (!application) {\n        window.aivicNotify?.error('申請データが見つかりません');\n        return;\n      }\n\n      showDetailModal(application);\n    } catch (error) {\n      console.error('詳細表示エラー:', error);\n      window.aivicNotify?.error('詳細情報の取得に失敗しました');\n    }\n  }\n\n  // 詳細モーダル表示\n  function showDetailModal(application) {\n    let modal = container.querySelector('#detail-modal');\n    if (!modal) {\n      modal = document.createElement('div');\n      modal.id = 'detail-modal';\n      modal.style.cssText = `\n        position: fixed; top: 0; left: 0; width: 100%; height: 100%; \n        background: rgba(0,0,0,0.5); display: flex; align-items: center; \n        justify-content: center; z-index: 1000;\n      `;\n      document.body.appendChild(modal);\n    }\n\n    modal.innerHTML = `\n      <div id=\"detail-content\" style=\"background: white; padding: 20px; border-radius: 8px; max-width: 800px; max-height: 80vh; overflow-y: auto;\">\n        <h3>申請詳細</h3>\n        <div style=\"margin: 16px 0;\">\n          <strong>申請ID:</strong> ${application.申請書類ID}<br>\n          <strong>申請タイトル:</strong> ${application.申請タイトル}<br>\n          <strong>申請者:</strong> ${application.申請者名}<br>\n          <strong>申請種別:</strong> ${application.申請種別}<br>\n          <strong>ステータス:</strong> ${application.承認状態}<br>\n          <strong>現在承認者:</strong> ${application.現在承認者名 || '-'}\n        </div>\n        \n        <h4>承認履歴</h4>\n        <table style=\"width: 100%; border-collapse: collapse;\">\n          <thead>\n            <tr style=\"background: #f5f5f5;\">\n              <th style=\"padding: 8px; border: 1px solid #ddd;\">承認者</th>\n              <th style=\"padding: 8px; border: 1px solid #ddd;\">承認結果</th>\n              <th style=\"padding: 8px; border: 1px solid #ddd;\">承認日時</th>\n              <th style=\"padding: 8px; border: 1px solid #ddd;\">コメント</th>\n            </tr>\n          </thead>\n          <tbody id=\"approval-history-tbody\">\n            ${(application.承認履歴 || []).map(history => `\n              <tr>\n                <td style=\"padding: 8px; border: 1px solid #ddd;\">${history.承認者名}</td>\n                <td style=\"padding: 8px; border: 1px solid #ddd;\">${history.承認結果}</td>\n                <td style=\"padding: 8px; border: 1px solid #ddd;\">${formatDate(history.承認日時)}</td>\n                <td style=\"padding: 8px; border: 1px solid #ddd;\">${history.コメント || '-'}</td>\n              </tr>\n            `).join('')}\n          </tbody>\n        </table>\n        \n        <div style=\"margin-top: 20px; text-align: right;\">\n          <button class=\"action-btn secondary\" onclick=\"this.closest('#detail-modal').style.display='none'\">閉じる</button>\n        </div>\n      </div>\n    `;\n\n    modal.style.display = 'flex';\n  }\n\n  // タブフィルター処理\n  function handleTabFilter(status) {\n    currentFilter = status;\n    \n    // タブのアクティブ状態を更新\n    container.querySelectorAll('[data-testid^=\"tab-\"]').forEach(tab => {\n      tab.classList.remove('active');\n    });\n    \n    const activeTab = container.querySelector(`[data-testid=\"tab-${status}\"]`);\n    if (activeTab) {\n      activeTab.classList.add('active');\n    }\n\n    // データフィルタリング\n    if (status === 'all') {\n      filteredApplications = [...allApplications];\n    } else {\n      const statusMap = {\n        'pending': '申請中',\n        'approving': '承認中',\n        'approved': '承認済',\n        'returned': '差戻し',\n        'rejected': '却下'\n      };\n      \n      filteredApplications = allApplications.filter(app => \n        app.承認状態 === statusMap[status]\n      );\n    }\n    \n    renderApplications(filteredApplications);\n  }\n\n  // 文書種別フィルター処理\n  function handleDocumentTypeFilter() {\n    const filterSelect = container.querySelector('[data-testid=\"document-type-filter\"]');\n    const searchButton = container.querySelector('[data-testid=\"search-button\"]');\n    \n    if (!filterSelect || !searchButton) return;\n\n    const selectedType = filterSelect.value;\n    \n    if (selectedType === '' || selectedType === 'all') {\n      filteredApplications = [...allApplications];\n    } else {\n      filteredApplications = allApplications.filter(app => \n        app.申請種別 === selectedType\n      );\n    }\n    \n    renderApplications(filteredApplications);\n  }\n\n  // CSVエクスポート処理\n  async function handleCsvExport() {\n    try {\n      const csvData = filteredApplications.map(app => ({\n        申請ID: app.申請書類ID,\n        申請タイトル: app.申請タイトル,\n        申請者: app.申請者名,\n        申請種別: app.申請種別,\n        申請日: formatDate(app.作成日時),\n        ステータス: app.承認状態,\n        現在承認者: app.現在承認者名 || '',\n        処理予定日: formatDate(app.処理予定日) || '',\n        優先度: getPriorityText(app.優先度)\n      }));\n\n      const csvContent = [\n        Object.keys(csvData[0] || {}).join(','),\n        ...csvData.map(row => Object.values(row).join(','))\n      ].join('\\n');\n\n      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });\n      const link = document.createElement('a');\n      link.href = URL.createObjectURL(blob);\n      link.download = `申請進捗_${new Date().toISOString().split('T')[0]}.csv`;\n      link.click();\n      \n      window.aivicNotify?.success('CSVファイルをダウンロードしました');\n    } catch (error) {\n      console.error('CSVエクスポートエラー:', error);\n      window.aivicNotify?.error('CSVエクスポートに失敗しました');\n    }\n  }\n\n  // 承認処理\n  async function handleApproval(applicationId) {\n    try {\n      const application = allApplications.find(app => app.申請書類ID === applicationId);\n      if (!application) {\n        window.aivicNotify?.error('申請データが見つかりません');\n        return;\n      }\n\n      // 次の承認者を決定\n      let nextApprover = null;\n      if (determineNextApprover) {\n        nextApprover = determineNextApprover(application);\n      }\n\n      // 承認処理の実行\n      const updateData = {\n        承認状態: nextApprover ? '承認中' : '承認済',\n        承認段階: (application.承認段階 || 1) + 1,\n        現在承認者名: nextApprover?.name || null,\n        最終更新日時: new Date().toISOString()\n      };\n\n      await window.aivicApi.update('applications', applicationId, updateData);\n      \n      // データを再読み込み\n      await loadApplications();\n      \n      window.aivicNotify?.success('承認処理が完了しました');\n    } catch (error) {\n      console.error('承認処理エラー:', error);\n      window.aivicNotify?.error('承認処理に失敗しました');\n    }\n  }\n\n  // イベントハンドラーの設定\n  function setupEventHandlers() {\n    // CSVエクスポートボタン\n    const csvExportBtn = container.querySelector('#btn-csv-export');\n    if (csvExportBtn) {\n      csvExportBtn.addEventListener('click', handleCsvExport);\n    }\n\n    // タブフィルター\n    const tabs = container.querySelectorAll('[data-testid^=\"tab-\"]');\n    tabs.forEach(tab => {\n      tab.addEventListener('click', () => {\n        const status = tab.getAttribute('data-testid').replace('tab-', '');\n        handleTabFilter(status);\n      });\n    });\n\n    // 文書種別フィルター\n    const searchButton = container.querySelector('[data-testid=\"search-button\"]');\n    if (searchButton) {\n      searchButton.addEventListener('click', handleDocumentTypeFilter);\n    }\n\n    const documentTypeFilter = container.querySelector('[data-testid=\"document-type-filter\"]');\n    if (documentTypeFilter) {\n      documentTypeFilter.addEventListener('change', handleDocumentTypeFilter);\n    }\n\n    // 承認ボタン（もし存在する場合）\n    const approvalButtons = container.querySelectorAll('button:has-text(\"承認\")');\n    approvalButtons.forEach(btn => {\n      btn.addEventListener('click', (event) => {\n        const applicationId = event.target.closest('tr')?.getAttribute('data-id');\n        if (applicationId) {\n          handleApproval(applicationId);\n        }\n      });\n    });\n  }\n\n  // 初期化処理\n  async function initialize() {\n    try {\n      setupEventHandlers();\n      await loadApplications();\n      \n      // デフォルトで「すべて」タブをアクティブに\n      const allTab = container.querySelector('[data-testid=\"tab-all\"]');\n      if (allTab) {\n        allTab.classList.add('active');\n      }\n    } catch (error) {\n      console.error('初期化エラー:', error);\n      window.aivicNotify?.error('画面の初期化に失敗しました');\n    }\n  }\n\n  // 初期化実行\n  initialize();\n\n  // 外部から呼び出し可能な関数を返す\n  return {\n    refresh: loadApplications,\n    filter: handleTabFilter,\n    export: handleCsvExport\n  };\n}";
</script>

    <style>
        :root {
            --primary: #ff6b9d;
            --primary-hover: #e55a8a;

        }

        }

            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

        }

        .app-layout {
            display: flex;

        }

        .sidebar {

            border-right: 1px solid var(--border);
            overflow-y: auto;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--top-bar-bg);
        }

        .logo {
            font-size: 15px;
            font-weight: 600;
            color: var(--primary);
        }

        .nav-section {
            padding: 8px 0;
        }

        .nav-section-title {
            padding: 8px 16px 6px;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-item {
            display: block;
            padding: 8px 16px;
            color: var(--text-muted);

            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .nav-item:hover {
            background: rgba(255, 107, 157, 0.08);
            color: var(--text);
        }

        .nav-item.aivic-active {
            background: rgba(255, 107, 157, 0.12);
            color: var(--primary);
            font-weight: 500;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            height: 52px;
            background: var(--top-bar-bg);

            flex-shrink: 0;

            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 6px;
            background: var(--bg-card);
            border: 1px solid var(--border);
        }

        .user-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            color: white;
        }

        .logout-link {

            font-size: 12px;
        }

            overflow-y: auto;

        }

            margin-bottom: 20px;

            padding: 16px;

            justify-content: between;
            margin-bottom: 12px;

        .stat-title {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 4px;
        }

        .stat-change {
            font-size: 11px;
            font-weight: 500;
        }

            color: var(--success);
        }

            color: var(--danger);
        }

            margin-bottom: 16px;
        }

        .card-header {
            padding: 14px 16px;

            align-items: center;
            justify-content: space-between;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        .card-body {
            padding: 16px;
        }

        .table-container {
            overflow-x: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th {
            text-align: left;
            padding: 8px 12px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
        }

        .data-table td {

            font-size: 13px;
            border-bottom: 1px solid var(--border);
        }

        .status-badge {

            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
        }

        .status-pending {
            background: rgba(251, 191, 36, 0.15);
            color: var(--warning);
        }

            background: rgba(74, 222, 128, 0.15);
            color: var(--success);
        }

        .status-rejected {
            background: rgba(248, 113, 113, 0.15);
            color: var(--danger);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            border: 1px solid;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
