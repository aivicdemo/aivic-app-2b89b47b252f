<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ハイブリッド申請承認システム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-main: #ffffff;
            --bg-card: #f8fafc;
            --bg-sidebar: #f1f5f9;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-muted: #64748b;
            --text-light: #94a3b8;
            --top-bar-bg: #ffffff;
            --top-bar-border: #e2e8f0;
            --success: #059669;
            --warning: #d97706;
            --danger: #dc2626;
            --radius: 8px;
            --radius-sm: 6px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 13px;
            line-height: 1.4;
            color: var(--text);
            background: var(--bg-main);
        }

        .app-layout {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--top-bar-bg);
        }

        .logo {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }

        .nav-section {
            padding: 12px 0;
        }

        .nav-section-title {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0 16px 8px;
        }

        .nav-item {
            display: block;
            padding: 6px 16px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .nav-item:hover {
            background: rgba(59, 130, 246, 0.08);
            color: var(--primary);
        }

        .nav-item.aivic-active {
            background: rgba(59, 130, 246, 0.12);
            color: var(--primary);
            font-weight: 500;
            border-right: 2px solid var(--primary);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            height: 52px;
            background: var(--top-bar-bg);
            border-bottom: 1px solid var(--top-bar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .breadcrumb {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 500;
        }

        .logout-link {
            font-size: 12px;
            color: var(--text-muted);
            text-decoration: none;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            transition: background 0.15s ease;
        }

        .logout-link:hover {
            background: var(--bg-card);
        }

        .content-area {
            flex: 1;
            overflow: auto;
            padding: 16px 20px;
        }

        .panel-container {
            height: 100%;
            background: var(--bg-main);
        }

        .status-indicator {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .status-pending { background: var(--warning); }
        .status-approved { background: var(--success); }
        .status-rejected { background: var(--danger); }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .badge-primary {
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary);
        }

        .badge-success {
            background: rgba(5, 150, 105, 0.1);
            color: var(--success);
        }

        .badge-warning {
            background: rgba(217, 119, 6, 0.1);
            color: var(--warning);
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            margin-bottom: 12px;
        }

        .card-header {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
            background: var(--bg-main);
            color: var(--text);
        }

        .btn:hover {
            background: var(--bg-card);
            border-color: var(--primary);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .table th,
        .table td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .table th {
            font-weight: 500;
            color: var(--text-muted);
            background: var(--bg-card);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .table tbody tr:hover {
            background: rgba(59, 130, 246, 0.02);
        }

        .loading-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--text-light);
            font-size: 12px;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            
            .content-area {
                padding: 12px 16px;
            }
        }
    </style>

id","required":true,"description":"適用される承認フロー定義への外部キー"},{"name":"現在ステップ番号","type":"integer","required":true,"description":"現在処理中の承認ステップ番号"},{"name":"現在承認者ID","type":"uuid","required":false,"description":"現在の承認担当者のユーザーID"},{"name":"処理状況","type":"varchar(100)","required":true,"description":"処理の現在状況（申請中/承認待ち/承認済み/差戻し/却下/取下げ）"},{"name":"開始日時","type":"timestamp","required":true,"description":"処理ルートの開始日時"},{"name":"完了日時","type":"timestamp","required":false,"description":"処理ルートの完了日時"},{"name":"期限日時","type":"timestamp","required":false,"description":"処理完了の期限日時"},{"name":"優先度","type":"integer","required":true,"description":"処理の優先度（1:低 2:通常 3:高 4:緊急）"},{"name":"自動処理フラグ","type":"boolean","required":true,"description":"自動処理対象かどうかのフラグ"},{"name":"備考","type":"text","required":false,"description":"処理ルートに関する備考・メモ"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"遅延検知設定","purpose":"申請承認プロセスにおける遅延を検知するための設定を管理し、承認ステップごとの期限や通知タイミングを定義する","columns":[{"name":"遅延検知設定ID","type":"uuid","required":true,"description":"遅延検知設定の一意識別子（主キー）"},{"name":"文書種別ID","type":"uuid","required":true,"description":"文書種別マスタへの外部キー"},{"name":"承認ステップID","type":"uuid","required":false,"description":"承認ステップへの外部キー（全ステップ共通の場合はNULL）"},{"name":"設定名","type":"varchar(100)","required":true,"description":"遅延検知設定の名称"},{"name":"期限日数","type":"integer","required":true,"description":"承認期限までの日数"},{"name":"警告日数","type":"integer","required":false,"description":"期限前の警告通知を行う日数"},{"name":"エスカレーション日数","type":"integer","required":false,"description":"期限超過後のエスカレーション通知を行う日数"},{"name":"営業日計算フラグ","type":"boolean","required":true,"description":"営業日ベースで計算するかどうか"},{"name":"有効フラグ","type":"boolean","required":true,"description":"設定が有効かどうか"},{"name":"備考","type":"text","required":false,"description":"設定に関する補足説明"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"補助金関連度マスタ","purpose":"申請書類と補助金制度の関連度を管理し、適切な承認フローや処理ルートの決定に使用するマスタテーブル","columns":[{"name":"補助金関連度ID","type":"uuid","required":true,"description":"補助金関連度の一意識別子（主キー）"},{"name":"補助金関連度コード","type":"varchar(100)","required":true,"description":"補助金関連度の業務コード（表示・検索用）"},{"name":"補助金関連度名","type":"varchar(100)","required":true,"description":"補助金関連度の名称"},{"name":"関連度レベル","type":"integer","required":true,"description":"関連度の数値レベル（1:低、2:中、3:高など）"},{"name":"説明","type":"text","required":false,"description":"補助金関連度の詳細説明"},{"name":"表示順","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"マスタデータの有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]}];

window.AIVIC_PAGE_INIT_JS = "js\nfunction(container, apiUrl, tables) {\n  // 業務ロジックのインポート\n  const { \n    getProgressDataWithAccessControl, \n    checkApprovalStatusViewPermission,\n    identifyStagnantApplications,\n    processUrgentApplicationPriority,\n    determinePriorityForReminder,\n    handleSystemFailureAlternativeProcess\n  } = window.businessLogic || {};\n\n  const tbody = container.querySelector(\"#tbody-progress\");\n  const modal = container.querySelector(\"#modal-flow\");\n  const backButton = container.querySelector(\"#btn-back\");\n  const searchInput = container.querySelector('[data-testid=\"search-input\"]');\n  const doctypeFilter = container.querySelector('[data-testid=\"doctype-filter\"]');\n  const progressList = container.querySelector('[data-testid=\"progress-list\"]');\n  const closeModalButton = container.querySelector(\"#btn-close-modal\");\n  const flowContent = container.querySelector(\"#flow-content\");\n  const approvalHistory = container.querySelector(\"#approval-history\");\n  const historyList = container.querySelector(\"#history-list\");\n  \n  // ユーザー名取得用のマップ\n  let userMap = {};\n  let docTypeMap = {};\n  let currentApplications = [];\n  let filteredApplications = [];\n  \n  // 初期化時にユーザーと文書種別のマップを作成\n  if (tables[0]) {\n    tables[0].records.forEach(user => {\n      userMap[user.id] = user.ユーザー名 || user.user_name || 'Unknown';\n    });\n  }\n  if (tables[2]) {\n    tables[2].records.forEach(docType => {\n      docTypeMap[docType.id] = docType.文書種別名 || docType.document_type_name || 'Unknown';\n    });\n  }\n\n  // 優先度表示用\n  function getPriorityBadge(priority) {\n    const colors = {\n      1: { bg: 'rgba(34, 197, 94, 0.1)', color: '#22c55e', text: '低' },\n      2: { bg: 'rgba(59, 130, 246, 0.1)', color: '#3b82f6', text: '通常' },\n      3: { bg: 'rgba(245, 158, 11, 0.1)', color: '#f59e0b', text: '高' },\n      4: { bg: 'rgba(239, 68, 68, 0.1)', color: '#ef4444', text: '緊急' }\n    };\n    const p = colors[priority] || colors[2];\n    return `<span style=\"background: ${p.bg}; color: ${p.color}; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 500;\">${p.text}</span>`;\n  }\n\n  // 承認状態バッジ\n  function getStatusBadge(status) {\n    const colors = {\n      '申請中': { bg: 'rgba(59, 130, 246, 0.1)', color: '#3b82f6' },\n      '承認済': { bg: 'rgba(34, 197, 94, 0.1)', color: '#22c55e' },\n      '却下': { bg: 'rgba(239, 68, 68, 0.1)', color: '#ef4444' },\n      '差戻し': { bg: 'rgba(245, 158, 11, 0.1)', color: '#f59e0b' },\n      '取下げ': { bg: 'rgba(156, 163, 175, 0.1)', color: '#9ca3af' }\n    };\n    const s = colors[status] || colors['申請中'];\n    return `<span style=\"background: ${s.bg}; color: ${s.color}; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 500;\">${status}</span>`;\n  }\n\n  // 進捗バー生成\n  function getProgressBar(currentStep, totalSteps) {\n    const progress = Math.round((currentStep / totalSteps) * 100);\n    return `\n      <div style=\"width: 80px; background: rgba(255,255,255,0.1); border-radius: 4px; height: 6px; position: relative;\">\n        <div style=\"width: ${progress}%; background: var(--primary); border-radius: 4px; height: 100%;\"></div>\n      </div>\n    `;\n  }\n\n  // 遅延チェック\n  function isDelayed(deadline) {\n    if (!deadline) return false;\n    const now = new Date();\n    const deadlineDate = new Date(deadline);\n    return deadlineDate < now;\n  }\n\n  // 承認フローモーダル表示\n  function showApprovalFlow(applicationId) {\n    try {\n      const application = currentApplications.find(app => app.id === applicationId);\n      if (!application) {\n        window.aivicNotify.error('申請データが見つかりません');\n        return;\n      }\n\n      // 承認フロー表示\n      const flowSteps = application.approval_flow || [];\n      const currentStepIndex = application.current_step || 0;\n      \n      let flowHtml = '<div class=\"approval-flow\">';\n      flowSteps.forEach((step, index) => {\n        const isActive = index === currentStepIndex;\n        const isCompleted = index < currentStepIndex;\n        const stepClass = isActive ? 'progress-step active' : isCompleted ? 'progress-step completed' : 'progress-step';\n        \n        flowHtml += `\n          <div class=\"${stepClass}\">\n            <div class=\"step-number\">${index + 1}</div>\n            <div class=\"step-info\">\n              <div class=\"step-title\">${step.title || '承認ステップ'}</div>\n              <div class=\"step-approver\">${userMap[step.approver_id] || 'Unknown'}</div>\n            </div>\n          </div>\n        `;\n      });\n      flowHtml += '</div>';\n      \n      if (flowContent) {\n        flowContent.innerHTML = flowHtml;\n      }\n\n      // 承認履歴表示\n      const history = application.approval_history || [];\n      let historyHtml = '';\n      history.forEach(item => {\n        historyHtml += `\n          <div class=\"history-item\">\n            <div class=\"history-date\">${new Date(item.created_at).toLocaleString()}</div>\n            <div class=\"history-action\">${item.action}</div>\n            <div class=\"history-user\">${userMap[item.user_id] || 'Unknown'}</div>\n            <div class=\"history-comment\">${item.comment || ''}</div>\n          </div>\n        `;\n      });\n      \n      if (historyList) {\n        historyList.innerHTML = historyHtml;\n      }\n\n      if (modal) {\n        modal.style.display = 'block';\n      }\n    } catch (error) {\n      console.error('承認フロー表示エラー:', error);\n      window.aivicNotify.error('承認フローの表示に失敗しました');\n    }\n  }\n\n  // 申請詳細表示\n  function showApplicationDetail(applicationId) {\n    try {\n      const application = currentApplications.find(app => app.id === applicationId);\n      if (!application) {\n        window.aivicNotify.error('申請データが見つかりません');\n        return;\n      }\n\n      // 詳細画面のHTMLを生成\n      const detailHtml = `\n        <div class=\"card-header\">\n          <h2>申請詳細</h2>\n          <button class=\"action-btn secondary\" onclick=\"history.back()\">戻る</button>\n        </div>\n        <div class=\"card-body\">\n          <div class=\"detail-section\">\n            <h3>基本情報</h3>\n            <div class=\"detail-row\">\n              <label>申請ID:</label>\n              <span>${application.id}</span>\n            </div>\n            <div class=\"detail-row\">\n              <label>申請タイトル:</label>\n              <span>${application.title}</span>\n            </div>\n            <div class=\"detail-row\">\n              <label>申請者:</label>\n              <span>${userMap[application.applicant_id] || 'Unknown'}</span>\n            </div>\n            <div class=\"detail-row\">\n              <label>申請種別:</label>\n              <span>${docTypeMap[application.document_type_id] || 'Unknown'}</span>\n            </div>\n            <div class=\"detail-row\">\n              <label>優先度:</label>\n              <span>${getPriorityBadge(application.priority)}</span>\n            </div>\n            <div class=\"detail-row\">\n              <label>期限日:</label>\n              <span>${application.deadline ? new Date(application.deadline).toLocaleDateString() : '-'}</span>\n            </div>\n          </div>\n        </div>\n      `;\n\n      // 新しい画面として表示\n      container.innerHTML = detailHtml;\n    } catch (error) {\n      console.error('申請詳細表示エラー:', error);\n      window.aivicNotify.error('申請詳細の表示に失敗しました');\n    }\n  }\n\n  // テーブル更新\n  function updateTable() {\n    if (!tbody) return;\n\n    try {\n      let html = '';\n      filteredApplications.forEach(app => {\n        const delayed = isDelayed(app.deadline);\n        const rowClass = delayed ? 'delayed' : '';\n        const delayIcon = delayed ? '⚠ 遅延' : '';\n        \n        html += `\n          <tr class=\"${rowClass}\">\n            <td>${app.id}</td>\n            <td>${docTypeMap[app.document_type_id] || 'Unknown'}</td>\n            <td>${app.title} ${delayIcon}</td>\n            <td>${userMap[app.applicant_id] || 'Unknown'}</td>\n            <td>${getProgressBar(app.current_step || 0, app.total_steps || 1)}</td>\n            <td>${userMap[app.current_approver_id] || '-'}</td>\n            <td>${getPriorityBadge(app.priority)}</td>\n            <td>${app.deadline ? new Date(app.deadline).toLocaleDateString() : '-'}</td>\n            <td>\n              <button class=\"action-btn primary btn-detail\" data-id=\"${app.id}\">詳細</button>\n              <button class=\"action-btn secondary btn-flow\" data-id=\"${app.id}\">フロー</button>\n            </td>\n          </tr>\n        `;\n      });\n      tbody.innerHTML = html;\n\n      // ボタンイベント設定\n      tbody.querySelectorAll('.btn-detail').forEach(btn => {\n        btn.addEventListener('click', (e) => {\n          const id = parseInt(e.target.dataset.id);\n          showApplicationDetail(id);\n        });\n      });\n\n      tbody.querySelectorAll('.btn-flow').forEach(btn => {\n        btn.addEventListener('click', (e) => {\n          const id = parseInt(e.target.dataset.id);\n          showApprovalFlow(id);\n        });\n      });\n    } catch (error) {\n      console.error('テーブル更新エラー:', error);\n      window.aivicNotify.error('テーブルの更新に失敗しました');\n    }\n  }\n\n  // フィルタリング\n  function applyFilters() {\n    try {\n      const searchTerm = searchInput ? searchInput.value.toLowerCase() : '';\n      const selectedDocType = doctypeFilter ? doctypeFilter.value : '';\n\n      filteredApplications = currentApplications.filter(app => {\n        const matchesSearch = !searchTerm || \n          app.title.toLowerCase().includes(searchTerm) ||\n          (userMap[app.applicant_id] || '').toLowerCase().includes(searchTerm);\n        \n        const matchesDocType = !selectedDocType || \n          app.document_type_id.toString() === selectedDocType;\n\n        return matchesSearch && matchesDocType;\n      });\n\n      updateTable();\n    } catch (error) {\n      console.error('フィルタリングエラー:', error);\n      window.aivicNotify.error('フィルタリングに失敗しました');\n    }\n  }\n\n  // データ読み込み\n  async function loadProgressData() {\n    try {\n      // 業務ロジックを使用してアクセス制御付きでデータ取得\n      if (getProgressDataWithAccessControl) {\n        const currentUser = window.currentUser || { id: 1, role: 'user' };\n        const progressData = await getProgressDataWithAccessControl(currentUser, tables);\n        currentApplications = progressData.applications || [];\n      } else {\n        // フォールバック: 直接APIから取得\n        const response = await window.aivicApi.list('applications');\n        currentApplications = response.records || [];\n      }\n\n      // 停滞申請の特定\n      if (identifyStagnantApplications) {\n        const stagnantApps = identifyStagnantApplications(currentApplications);\n        stagnantApps.forEach(app => {\n          const index = currentApplications.findIndex(a => a.id === app.id);\n          if (index !== -1) {\n            currentApplications[index] = { ...currentApplications[index], isStagnant: true };\n          }\n        });\n      }\n\n      // 緊急申請の優先度処理\n      if (processUrgentApplicationPriority) {\n        currentApplications = currentApplications.map(app => {\n          if (app.is_urgent) {\n            return processUrgentApplicationPriority(app);\n          }\n          return app;\n        });\n      }\n\n      filteredApplications = [...currentApplications];\n      updateTable();\n    } catch (error) {\n      console.error('データ読み込みエラー:', error);\n      \n      // システム障害時の代替処理\n      if (handleSystemFailureAlternativeProcess) {\n        try {\n          const alternativeData = handleSystemFailureAlternativeProcess();\n          currentApplications = alternativeData.applications || [];\n          filteredApplications = [...currentApplications];\n          updateTable();\n          window.aivicNotify.warning('システム障害のため代替データを表示しています');\n        } catch (altError) {\n          window.aivicNotify.error('データの読み込みに失敗しました');\n        }\n      } else {\n        window.aivicNotify.error('データの読み込みに失敗しました');\n      }\n    }\n  }\n\n  // イベントリスナー設定\n  if (backButton) {\n    backButton.addEventListener('click', () => {\n      window.showScreen('application-list');\n    });\n  }\n\n  if (searchInput) {\n    searchInput.addEventListener('input', applyFilters);\n  }\n\n  if (doctypeFilter) {\n    doctypeFilter.addEventListener('change', applyFilters);\n  }\n\n  if (closeModalButton) {\n    closeModalButton.addEventListener('click', () => {\n      if (modal) {\n        modal.style.display = 'none';\n      }\n    });\n  }\n\n  // モーダル外クリックで閉じる\n  if (modal) {\n    modal.addEventListener('click', (e) => {\n      if (e.target === modal) {\n        modal.style.display = 'none';\n      }\n    });\n  }\n\n  // 初期データ読み込み\n  loadProgressData();\n}";
</script>

    <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();
