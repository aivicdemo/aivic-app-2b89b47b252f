nst i = Math.floor(Math.log(bytes) / Math.log(k));\n    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];\n  }\n\n  // ファイル検証関数\n  function validateFile(file) {\n    const maxSize = 10 * 1024 * 1024; // 10MB\n    const allowedTypes = [\n      'application/pdf', \n      'application/msword', \n      'application/vnd.openxmlformats-officedocument.wordprocessingml.document', \n      'application/vnd.ms-excel', \n      'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'\n    ];\n\n    if (!allowedTypes.includes(file.type)) {\n      throw new Error('サポートされていないファイル形式です。PDF、Word、Excelファイルのみアップロード可能です。');\n    }\n\n    if (file.size > maxSize) {\n      throw new Error('ファイルサイズが10MBを超えています。');\n    }\n\n    return true;\n  }\n\n  // ファイル表示更新\n  function updateFileDisplay(file) {\n    if (fileName) fileName.textContent = file.name;\n    if (fileSize) fileSize.textContent = formatFileSize(file.size);\n    \n    if (uploadPlaceholder) uploadPlaceholder.style.display = 'none';\n    if (uploadPreview) uploadPreview.style.display = 'block';\n  }\n\n  // 判定結果表示更新\n  function updateJudgmentDisplay(result) {\n    if (autoJudgmentResult) {\n      autoJudgmentResult.textContent = result.documentType || '不明';\n    }\n    \n    const accuracy = result.accuracy || 0;\n    const subsidyScore = result.subsidyScore || 0;\n    \n    if (accuracyText) accuracyText.textContent = accuracy;\n    if (subsidyScoreText) subsidyScoreText.textContent = subsidyScore;\n    \n    if (accuracyBar) {\n      accuracyBar.style.width = accuracy + '%';\n      if (accuracy >= 80) {\n        accuracyBar.style.backgroundColor = 'green';\n      } else if (accuracy >= 60) {\n        accuracyBar.style.backgroundColor = 'orange';\n      } else {\n        accuracyBar.style.backgroundColor = 'red';\n      }\n    }\n    \n    if (subsidyScoreBar) {\n      subsidyScoreBar.style.width = subsidyScore + '%';\n    }\n  }\n\n  // ファイル選択処理\n  function handleFileSelect() {\n    if (fileInput) {\n      fileInput.click();\n    }\n  }\n\n  // ファイル変更処理\n  function handleFileChange(event) {\n    const file = event.target.files[0];\n    if (!file) return;\n\n    try {\n      validateFile(file);\n      currentFile = file;\n      updateFileDisplay(file);\n      showSuccess('ファイルが正常にアップロードされました');\n    } catch (error) {\n      showError(error.message);\n      if (fileInput) fileInput.value = '';\n    }\n  }\n\n  // 文書種別判定実行\n  async function executeJudgment() {\n    if (!currentFile) {\n      showError('ファイルを選択してください');\n      return;\n    }\n\n    try {\n      // 業務ロジックを使用した文書分類\n      const fileContent = await readFileContent(currentFile);\n      const classificationInput = {\n        fileName: currentFile.name,\n        fileType: currentFile.type,\n        content: fileContent\n      };\n\n      let result;\n      if (classifyDocumentTypeAndRoute) {\n        result = classifyDocumentTypeAndRoute(classificationInput);\n      } else {\n        // フォールバック処理\n        result = mockDocumentClassification(currentFile);\n      }\n\n      currentJudgment = result;\n      updateJudgmentDisplay(result);\n      showSuccess('文書種別判定が完了しました');\n\n    } catch (error) {\n      if (handleDocumentClassificationException) {\n        const fallbackResult = handleDocumentClassificationException(error, currentFile);\n        currentJudgment = fallbackResult;\n        updateJudgmentDisplay(fallbackResult);\n      }\n      showError('判定処理中にエラーが発生しました: ' + error.message);\n    }\n  }\n\n  // ファイル内容読み取り\n  function readFileContent(file) {\n    return new Promise((resolve, reject) => {\n      const reader = new FileReader();\n      reader.onload = (e) => resolve(e.target.result);\n      reader.onerror = (e) => reject(new Error('ファイル読み取りエラー'));\n      reader.readAsText(file);\n    });\n  }\n\n  // モック文書分類（業務ロジックが利用できない場合）\n  function mockDocumentClassification(file) {\n    const fileName = file.name.toLowerCase();\n    let documentType = '不明';\n    let accuracy = 50;\n    let subsidyScore = 30;\n\n    if (fileName.includes('補助金') || fileName.includes('subsidy')) {\n      documentType = '補助金申請書';\n      accuracy = 85;\n      subsidyScore = 92;\n    } else if (fileName.includes('経費') || fileName.includes('expense')) {\n      documentType = '経費申請書';\n      accuracy = 78;\n      subsidyScore = 45;\n    } else if (fileName.includes('科研費') || fileName.includes('grant')) {\n      documentType = '科研費申請書';\n      accuracy = 82;\n      subsidyScore = 78;\n    }\n\n    return { documentType, accuracy, subsidyScore };\n  }\n\n  // 再判定処理\n  async function reExecuteJudgment() {\n    await executeJudgment();\n  }\n\n  // 結果確定処理\n  async function confirmResult() {\n    try {\n      const selectedType = documentTypeSelect ? documentTypeSelect.value : null;\n      const finalType = selectedType || (currentJudgment ? currentJudgment.documentType : null);\n\n      if (!finalType) {\n        showError('文書種別を選択してください');\n        return;\n      }\n\n      // 業務ロジックによる受理可否判定\n      if (determineDocumentAcceptanceEligibility) {\n        const eligibility = determineDocumentAcceptanceEligibility({\n          documentType: finalType,\n          file: currentFile\n        });\n        \n        if (!eligibility.acceptable) {\n          showError('この文書は受理できません: ' + eligibility.reason);\n          return;\n        }\n      }\n\n      // データ保存\n      if (window.aivicApi && window.aivicApi.save) {\n        await window.aivicApi.save('document_classifications', {\n          fileName: currentFile.name,\n          documentType: finalType,\n          accuracy: currentJudgment ? currentJudgment.accuracy : 0,\n          subsidyScore: currentJudgment ? currentJudgment.subsidyScore : 0,\n          timestamp: new Date().toISOString()\n        });\n      }\n\n      showSuccess('文書種別が設定されました');\n      loadHistory();\n\n    } catch (error) {\n      showError('結果確定中にエラーが発生しました: ' + error.message);\n    }\n  }\n\n  // 承認フロー確認\n  function checkApprovalFlow() {\n    if (window.showScreen) {\n      window.showScreen('scr-1779422354662');\n    } else {\n      window.location.href = '/panels/scr-1779422354662.html';\n    }\n  }\n\n  // 文書種別マスタ参照\n  function openMasterReference() {\n    window.open('/panels/document-type-master.html', '_blank');\n  }\n\n  // デジタル化処理\n  async function executeDigitization() {\n    if (!currentFile) {\n      showError('ファイルを選択してください');\n      return;\n    }\n\n    try {\n      // 業務ロジックによるデジタル化適格性判定\n      if (determineDigitalizationEligibility) {\n        const eligibility = determineDigitalizationEligibility({\n          file: currentFile,\n          documentType: currentJudgment ? currentJudgment.documentType : null\n        });\n        \n        if (!eligibility.eligible) {\n          showError('このファイルはデジタル化できません: ' + eligibility.reason);\n          return;\n        }\n      }\n\n      showSuccess('デジタル化処理を開始しました');\n    } catch (error) {\n      showError('デジタル化処理中にエラーが発生しました: ' + error.message);\n    }\n  }\n\n  // プレビュー表示\n  async function showPreview() {\n    if (!currentFile) {\n      showError('ファイルを選択してください');\n      return;\n    }\n\n    try {\n      const content = await readFileContent(currentFile);\n      if (documentPreview) {\n        documentPreview.textContent = content.substring(0, 1000) + (content.length > 1000 ? '...' : '');\n      }\n      if (previewPanel) {\n        previewPanel.style.display = 'block';\n      }\n    } catch (error) {\n      showError('プレビュー表示中にエラーが発生しました: ' + error.message);\n    }\n  }\n\n  // プレビュー閉じる\n  function closePreview() {\n    if (previewPanel) {\n      previewPanel.style.display = 'none';\n    }\n  }\n\n  // 履歴読み込み\n  async function loadHistory() {\n    try {\n      if (window.aivicApi && window.aivicApi.list && historyTbody) {\n        const history = await window.aivicApi.list('document_classifications');\n        historyTbody.innerHTML = '';\n        \n        history.forEach(item => {\n          const row = document.createElement('tr');\n          row.innerHTML = `\n            <td>${item.fileName || ''}</td>\n            <td>${item.documentType || ''}</td>\n            <td>${item.accuracy || 0}%</td>\n            <td>${item.subsidyScore || 0}%</td>\n            <td>${item.timestamp ? new Date(item.timestamp).toLocaleString() : ''}</td>\n          `;\n          historyTbody.appendChild(row);\n        });\n      }\n    } catch (error) {\n      console.error('履歴読み込みエラー:', error);\n    }\n  }\n\n  // タブ切り替え\n  function switchTab(targetTab) {\n    tabBtns.forEach(btn => btn.classList.remove('active'));\n    tabPanels.forEach(panel => panel.classList.remove('active'));\n    \n    const targetBtn = container.querySelector(`[data-tab=\"${targetTab}\"]`);\n    const targetPanel = container.querySelector(`#${targetTab}`);\n    \n    if (targetBtn) targetBtn.classList.add('active');\n    if (targetPanel) targetPanel.classList.add('active');\n  }\n\n  // イベントリスナーの設定\n  if (fileInput) {\n    fileInput.addEventListener('change', handleFileChange);\n  }\n\n  // ボタンイベント（複数の要素に対応）\n  [btnFileSelect, fileSelectBtn].forEach(btn => {\n    if (btn) btn.addEventListener('click', handleFileSelect);\n  });\n\n  [btnExecuteJudgment, executeJudgmentBtn].forEach(btn => {\n    if (btn) btn.addEventListener('click', executeJudgment);\n  });\n\n  if (btnReJudgment) {\n    btnReJudgment.addEventListener('click', reExecuteJudgment);\n  }\n\n  [btnConfirmResult, confirmResultBtn].forEach(btn => {\n    if (btn) btn.addEventListener('click', confirmResult);\n  });\n\n  [btnApprovalFlow, approvalFlowCheckBtn].forEach(btn => {\n    if (btn) btn.addEventListener('click', checkApprovalFlow);\n  });\n\n  if (btnMasterRef) {\n    btnMasterRef.addEventListener('click', openMasterReference);\n  }\n\n  if (btnDigitization) {\n    btnDigitization.addEventListener('click', executeDigitization);\n  }\n\n  // プレビューボタン\n  const previewBtn = container.querySelector('button:has-text(\"プレビュー\")') || \n                     container.querySelector('[data-testid=\"preview-btn\"]');\n  if (previewBtn) {\n    previewBtn.addEventListener('click', showPreview);\n  }\n\n  if (previewCloseBtn) {\n    previewCloseBtn.addEventListener('click', closePreview);\n  }\n\n  // タブイベント\n  tabBtns.forEach(btn => {\n    btn.addEventListener('click', () => {\n      const targetTab = btn.getAttribute('data-tab');\n      if (targetTab) switchTab(targetTab);\n    });\n  });\n\n  // ドラッグ&ドロップ\n  if (uploadArea) {\n    uploadArea.addEventListener('dragover', (e) => {\n      e.preventDefault();\n      uploadArea.classList.add('drag-over');\n    });\n\n    uploadArea.addEventListener('dragleave', () => {\n      uploadArea.classList.remove('drag-over');\n    });\n\n    uploadArea.addEventListener('drop', (e) => {\n      e.preventDefault();\n      uploadArea.classList.remove('drag-over');\n      \n      const files = e.dataTransfer.files;\n      if (files.length > 0) {\n        const file = files[0];\n        try {\n          validateFile(file);\n          currentFile = file;\n          updateFileDisplay(file);\n          showSuccess('ファイルが正常にアップロードされました');\n        } catch (error) {\n          showError(error.message);\n        }\n      }\n    });\n  }\n\n  // 初期化処理\n  loadHistory();\n  \n  // デフォルトタブの設定\n  if (tabBtns.length > 0) {\n    switchTab(tabBtns[0].getAttribute('data-tab') || 'upload');\n  }\n}";

    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    // **content 要素の hidden 強制除去（2026-05-24 Playwright 大量 fail 対応）**:
    // AI が生成した panel HTML には class="hidden" / hidden 属性 / style="display:none"
    // が content 要素（#xxx-tbody / #xxx-list / [data-testid="error-message"] 等）に付いて
    // いることがある。それを Playwright が toBeVisible() で待ち続けて timeout する事故が頻発。
    //
    // ポリシー: panel コンテナ配下の全要素について以下を実行:
    //   - class="hidden" / display:none / hidden 属性を **content 要素では除去**
    //   - **modal 系**（.modal, .modal-backdrop, [role="dialog"], [data-modal] 等）は除外
    //     （これらは仕様上初期非表示が正しい）
    var isModalLike = function(el) {
      if (!el || !el.classList) return false;
      var cn = String(el.className || "");
      if (/modal|dialog|overlay|popup|dropdown|tooltip/i.test(cn)) return true;
      var role = el.getAttribute && el.getAttribute("role");
      if (role === "dialog" || role === "alertdialog" || role === "tooltip" || role === "menu") return true;
      if (el.hasAttribute && (el.hasAttribute("data-modal") || el.hasAttribute("data-dropdown") || el.hasAttribute("data-popup"))) return true;
      return false;
    };
    var unhideContentElements = function(root) {
      var all = root.querySelectorAll('.hidden, [hidden], [style*="display:none"], [style*="display: none"]');
      for (var k = 0; k < all.length; k++) {
        var el = all[k];
        // modal 系は触らない
        if (isModalLike(el)) continue;
        // parent chain で modal 内なら触らない
        var p = el.parentElement;
        var insideModal = false;
        while (p && p !== root) {
          if (isModalLike(p)) { insideModal = true; break; }
          p = p.parentElement;
        }
        if (insideModal) continue;
        // 除去
        el.classList.remove('hidden');
        el.removeAttribute('hidden');
        if (el.style && el.style.display === 'none') el.style.display = '';
      }
    };
    try { unhideContentElements(container); } catch (e) { console.warn('[aivic] unhideContent failed:', e); }

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
