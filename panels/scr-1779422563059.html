ize: 12px; color: var(--text);\">${record.文書名 || ''}</td>\n        <td style=\"padding: 6px 10px; font-size: 12px; color: var(--text);\">${record.判定結果 || ''}</td>\n        <td style=\"padding: 6px 10px; font-size: 12px; color: var(--text);\">${record.判定精度 || ''}%</td>\n        <td style=\"padding: 6px 10px; font-size: 12px; color: var(--text);\">${record.判定者名 || ''}</td>\n      </tr>\n    `).join('');\n  }\n\n  // エラーメッセージ表示\n  function showError(message) {\n    if (window.aivicNotify && window.aivicNotify.error) {\n      window.aivicNotify.error(message);\n    }\n    if (errorMessage) {\n      errorMessage.textContent = message;\n      errorMessage.style.display = 'block';\n      setTimeout(() => {\n        errorMessage.style.display = 'none';\n      }, 5000);\n    }\n  }\n\n  // 判定精度の更新\n  function updateAccuracy(percentage) {\n    const bar = accuracyBar;\n    const percentageElement = accuracyPercentageTestId || accuracyPercentage;\n    \n    if (bar) {\n      bar.style.width = percentage + '%';\n    }\n    if (percentageElement) {\n      percentageElement.textContent = percentage + '%';\n    }\n    \n    // 精度に応じた色の変更\n    if (bar) {\n      if (percentage >= 80) {\n        bar.style.backgroundColor = '#10b981';\n      } else if (percentage >= 60) {\n        bar.style.backgroundColor = '#f59e0b';\n      } else {\n        bar.style.backgroundColor = '#ef4444';\n      }\n    }\n  }\n\n  // 補助金スコアの更新\n  function updateSubsidyScore(score) {\n    const scoreElement = subsidyScoreTestId || subsidyScore;\n    if (scoreElement) {\n      scoreElement.textContent = score;\n      scoreElement.style.display = 'block';\n    }\n  }\n\n  // ファイルアップロード処理\n  async function handleFileUpload() {\n    const fileInput = fileUploadTestId || fileUpload;\n    if (!fileInput || !fileInput.files || fileInput.files.length === 0) {\n      showError('ファイルを選択してください');\n      return;\n    }\n\n    const file = fileInput.files[0];\n    currentFile = file;\n\n    try {\n      // ファイルをBase64に変換\n      const fileContent = await new Promise((resolve, reject) => {\n        const reader = new FileReader();\n        reader.onload = () => resolve(reader.result);\n        reader.onerror = reject;\n        reader.readAsDataURL(file);\n      });\n\n      // APIでファイルアップロード\n      if (window.aivicApi && window.aivicApi.save) {\n        const uploadResult = await window.aivicApi.save('documents', {\n          fileName: file.name,\n          fileContent: fileContent,\n          fileSize: file.size,\n          mimeType: file.type,\n          uploadDate: new Date().toISOString()\n        });\n\n        if (uploadResult.success) {\n          // アップロード成功の表示更新\n          const cardElement = container.querySelector('.card');\n          if (cardElement && !cardElement.textContent.includes('アップロード')) {\n            const uploadStatus = document.createElement('div');\n            uploadStatus.textContent = 'アップロード完了';\n            uploadStatus.style.color = '#10b981';\n            uploadStatus.style.fontSize = '12px';\n            uploadStatus.style.marginTop = '8px';\n            cardElement.appendChild(uploadStatus);\n          }\n        }\n      }\n    } catch (error) {\n      showError('ファイルアップロードに失敗しました: ' + error.message);\n    }\n  }\n\n  // 自動判定処理\n  async function handleAutoDetection() {\n    if (!currentFile) {\n      showError('まずファイルをアップロードしてください');\n      return;\n    }\n\n    try {\n      // ファイル内容を読み取り\n      const fileText = await new Promise((resolve, reject) => {\n        const reader = new FileReader();\n        reader.onload = () => resolve(reader.result);\n        reader.onerror = reject;\n        reader.readAsText(currentFile);\n      });\n\n      // 業務ロジックを使用して文書種別を判定\n      let detectionResult;\n      if (classifyDocumentTypeAndRoute) {\n        detectionResult = classifyDocumentTypeAndRoute({\n          fileName: currentFile.name,\n          fileContent: fileText,\n          fileSize: currentFile.size\n        });\n      } else {\n        // フォールバック処理\n        detectionResult = {\n          documentType: currentFile.name.includes('補助金') ? '補助金申請書' : \n                       currentFile.name.includes('科研費') ? '科研費申請書' : '一般申請書',\n          accuracy: Math.floor(Math.random() * 40) + 60, // 60-99%\n          subsidyScore: Math.floor(Math.random() * 100)\n        };\n      }\n\n      currentDetectionResult = detectionResult;\n\n      // 結果を画面に反映\n      const resultElement = autoDetectionResultTestId || autoDetectionResult;\n      if (resultElement) {\n        resultElement.textContent = detectionResult.documentType || '判定結果';\n        resultElement.style.display = 'block';\n      }\n\n      // 精度を更新\n      updateAccuracy(detectionResult.accuracy || 75);\n\n      // 補助金スコアを更新\n      updateSubsidyScore(detectionResult.subsidyScore || 0);\n\n      // 文書種別選択肢を自動選択\n      const selectElement = documentTypeSelectTestId || documentTypeSelect;\n      if (selectElement && detectionResult.documentType) {\n        selectElement.value = detectionResult.documentType;\n      }\n\n    } catch (error) {\n      if (handleDocumentClassificationException) {\n        const fallbackResult = handleDocumentClassificationException(error);\n        showError(fallbackResult.message || '自動判定に失敗しました');\n      } else {\n        showError('自動判定に失敗しました: ' + error.message);\n      }\n    }\n  }\n\n  // プレビュー表示処理\n  async function handlePreview() {\n    if (!currentFile) {\n      showError('まずファイルをアップロードしてください');\n      return;\n    }\n\n    try {\n      const previewElement = documentPreviewTestId || documentPreview;\n      if (previewElement) {\n        if (currentFile.type === 'application/pdf') {\n          previewElement.innerHTML = '<div style=\"padding: 10px; background: #f5f5f5; border-radius: 4px;\">PDF文書: ' + currentFile.name + '</div>';\n        } else {\n          const fileText = await new Promise((resolve, reject) => {\n            const reader = new FileReader();\n            reader.onload = () => resolve(reader.result);\n            reader.onerror = reject;\n            reader.readAsText(currentFile);\n          });\n          previewElement.innerHTML = '<div style=\"padding: 10px; background: #f5f5f5; border-radius: 4px; max-height: 200px; overflow-y: auto;\">' + \n                                   (fileText.substring(0, 500) + (fileText.length > 500 ? '...' : '')) + '</div>';\n        }\n        previewElement.style.display = 'block';\n      }\n    } catch (error) {\n      showError('プレビュー表示に失敗しました: ' + error.message);\n    }\n  }\n\n  // 承認フロー確認処理\n  function handleConfirmFlow() {\n    try {\n      // 承認フロー確認画面への遷移処理\n      const contentArea = document.querySelector('.content-area');\n      if (contentArea) {\n        contentArea.style.display = 'block';\n      }\n\n      // パンくずリストの更新\n      const breadcrumb = document.querySelector('.breadcrumb');\n      if (breadcrumb) {\n        if (!breadcrumb.textContent.includes('文書種別判定')) {\n          breadcrumb.textContent += ' > 文書種別判定';\n        }\n      }\n\n      // 業務ロジックで承認フローを決定\n      if (determineDocumentTypeAndRoute && currentDetectionResult) {\n        const routeResult = determineDocumentTypeAndRoute({\n          documentType: currentDetectionResult.documentType,\n          accuracy: currentDetectionResult.accuracy\n        });\n        console.log('承認ルート:', routeResult);\n      }\n    } catch (error) {\n      showError('承認フロー確認に失敗しました: ' + error.message);\n    }\n  }\n\n  // 判定結果確定処理\n  async function handleFinalize() {\n    try {\n      const selectElement = documentTypeSelectTestId || documentTypeSelect;\n      const selectedType = selectElement ? selectElement.value : '';\n      \n      if (!selectedType) {\n        showError('文書種別を選択してください');\n        return;\n      }\n\n      // 業務ロジックで入力値を検証\n      if (validateApplicationInput) {\n        const validationResult = validateApplicationInput({\n          documentType: selectedType,\n          fileName: currentFile ? currentFile.name : '',\n          detectionResult: currentDetectionResult\n        });\n        \n        if (!validationResult.isValid) {\n          showError(validationResult.message || '入力値が不正です');\n          return;\n        }\n      }\n\n      // 判定結果を保存\n      if (window.aivicApi && window.aivicApi.save) {\n        const saveResult = await window.aivicApi.save('document_classifications', {\n          fileName: currentFile ? currentFile.name : '',\n          documentType: selectedType,\n          accuracy: currentDetectionResult ? currentDetectionResult.accuracy : 0,\n          subsidyScore: currentDetectionResult ? currentDetectionResult.subsidyScore : 0,\n          judgmentDate: new Date().toISOString(),\n          judgeUser: 'current_user'\n        });\n\n        if (saveResult.success) {\n          // 結果表示を更新\n          const resultElement = autoDetectionResultTestId || autoDetectionResult;\n          if (resultElement) {\n            resultElement.textContent = selectedType;\n            resultElement.style.display = 'block';\n          }\n\n          // 履歴を更新\n          await loadHistory();\n        }\n      }\n    } catch (error) {\n      showError('判定結果の確定に失敗しました: ' + error.message);\n    }\n  }\n\n  // 再判定処理\n  async function handleReDetection() {\n    try {\n      currentDetectionResult = null;\n      \n      // 表示をリセット\n      const resultElement = autoDetectionResultTestId || autoDetectionResult;\n      if (resultElement) {\n        resultElement.textContent = '';\n        resultElement.style.display = 'none';\n      }\n      \n      updateAccuracy(0);\n      updateSubsidyScore(0);\n      \n      // 自動判定を再実行\n      await handleAutoDetection();\n    } catch (error) {\n      showError('再判定に失敗しました: ' + error.message);\n    }\n  }\n\n  // 履歴読み込み\n  async function loadHistory() {\n    try {\n      if (window.aivicApi && window.aivicApi.list) {\n        const historyResult = await window.aivicApi.list('document_classifications', {\n          orderBy: 'judgmentDate',\n          orderDirection: 'desc',\n          limit: 10\n        });\n        \n        if (historyResult.success && historyResult.records) {\n          renderHistory(historyResult.records.map(record => ({\n            作成日時: record.judgmentDate,\n            文書名: record.fileName,\n            判定結果: record.documentType,\n            判定精度: record.accuracy,\n            判定者名: record.judgeUser\n          })));\n        }\n      }\n    } catch (error) {\n      console.error('履歴読み込みエラー:', error);\n    }\n  }\n\n  // イベントリスナーの設定\n  if (uploadButtonTestId || btnUpload) {\n    (uploadButtonTestId || btnUpload).addEventListener('click', handleFileUpload);\n  }\n\n  if (autoDetectButtonTestId || btnAutoDetect) {\n    (autoDetectButtonTestId || btnAutoDetect).addEventListener('click', handleAutoDetection);\n  }\n\n  if (previewButtonTestId || btnPreview) {\n    (previewButtonTestId || btnPreview).addEventListener('click', handlePreview);\n  }\n\n  if (confirmFlowButtonTestId || btnConfirmFlow) {\n    (confirmFlowButtonTestId || btnConfirmFlow).addEventListener('click', handleConfirmFlow);\n  }\n\n  if (finalizeButtonTestId || btnFinalize) {\n    (finalizeButtonTestId || btnFinalize).addEventListener('click', handleFinalize);\n  }\n\n  if (btnReDetect) {\n    btnReDetect.addEventListener('click', handleReDetection);\n  }\n\n  // 文書種別選択の変更イベント\n  if (documentTypeSelectTestId || documentTypeSelect) {\n    (documentTypeSelectTestId || documentTypeSelect).addEventListener('change', function() {\n      const resultElement = autoDetectionResultTestId || autoDetectionResult;\n      if (resultElement && this.value) {\n        resultElement.textContent = this.value;\n        resultElement.style.display = 'block';\n      }\n    });\n  }\n\n  // 初期化処理\n  loadDocumentTypes();\n  loadHistory();\n\n  // 初期状態の設定\n  if (errorMessage) {\n    errorMessage.style.display = 'none';\n  }\n}";
</script>

      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");

        el.style.transition = "opacity .3s";

    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }

      save: async function(tableIndex, item) {

    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {

    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
