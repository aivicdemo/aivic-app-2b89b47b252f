ow.aivicApi.list('delay-cases', filters);\n      const delayCases = response.data || [];\n\n      // 業務ロジックで遅延案件を識別・優先度付け\n      let processedCases = delayCases;\n      if (identifyStagnantApplications) {\n        processedCases = identifyStagnantApplications(delayCases);\n      }\n      if (determinePriorityForReminder) {\n        processedCases = processedCases.map(case => ({\n          ...case,\n          priority: determinePriorityForReminder(case)\n        }));\n      }\n\n      // 件数表示\n      if (delayCountElement) {\n        delayCountElement.textContent = `${processedCases.length}件`;\n      }\n\n      // テーブル表示\n      if (processedCases.length === 0) {\n        if (noDelayMessage) {\n          noDelayMessage.textContent = '遅延案件はありません';\n          noDelayMessage.style.display = 'block';\n        }\n        if (delayCasesTbody) {\n          delayCasesTbody.innerHTML = '';\n        }\n      } else {\n        if (noDelayMessage) {\n          noDelayMessage.style.display = 'none';\n        }\n        renderDelayCasesTable(processedCases);\n      }\n\n    } catch (error) {\n      console.error('遅延案件の取得に失敗:', error);\n      if (window.aivicNotify) {\n        window.aivicNotify.error('遅延案件の取得に失敗しました');\n      }\n    }\n  }\n\n  // テーブル描画関数\n  function renderDelayCasesTable(cases) {\n    if (!delayCasesTbody) return;\n\n    // ヘッダー行\n    const headerRow = document.createElement('tr');\n    headerRow.innerHTML = `\n      <th>申請ID</th>\n      <th>申請種別</th>\n      <th>申請者</th>\n      <th>現在承認者</th>\n      <th>遅延日数</th>\n      <th>遅延レベル</th>\n      <th>選択</th>\n    `;\n    delayCasesTbody.innerHTML = '';\n    delayCasesTbody.appendChild(headerRow);\n\n    // データ行\n    cases.forEach((caseData, index) => {\n      const row = document.createElement('tr');\n      row.innerHTML = `\n        <td>${caseData.applicationId || ''}</td>\n        <td>${caseData.documentType || ''}</td>\n        <td>${caseData.applicant || ''}</td>\n        <td>${caseData.currentApprover || ''}</td>\ .aivicApi.save('notifications', {\n          caseId: caseId,\n          recipients: recipients,\n          message: message,\n          type: 'reminder'\n        });\n\n        // 遅延チェック・通知処理\n        if (checkApprovalDelayAndNotify) {\n          await checkApprovalDelayAndNotify(caseData);\n        }\n      }\n\n      if (window.aivicNotify) {\n        window.aivicNotify.success('催促通知を送信しました');\n      }\n\n      // モーダルを閉じる\n      if (notifyModal) {\n        notifyModal.style.display = 'none';\n      }\n\n      // データを再読み込み\n      await loadDelayCases();\n\n    } catch (error) {\n      console.error('催促通知の送信に失敗:', error);\n      if (window.aivicNotify) {\n        window.aivicNotify.error('催促通知の送信に失敗しました');\n      }\n    }\n  }\n\n  // イベントリスナーの設定\n  if (searchButton) {\n    searchButton.addEventListener('click', loadDelayCases);\n  }\n\n  // フィルター変更時の自動検索\n  [documentTypeFilter, approvalStatusFilter, delayLevelFilter].forEach(filter => {\n    if (filter) {\n      filter.addEventListener('change', loadDelayCases);\n    }\n  });\n\n  // 催促通知ボタン\n  if (notifyButton) {\n    notifyButton.addEventListener('click', () => {\n      if (selectedCases.length === 0) {\n        if (window.aivicNotify) {\n          window.aivicNotify.error('催促する案件を選択してください');\n        }\n        return;\n      }\n\n      if (notifyModal) {\n        notifyModal.style.display = 'block';\n      }\n      if (notifyMessage) {\n        notifyMessage.textContent = `${selectedCases.length}件の案件に催促通知を送信しますか？`;\n      }\n    });\n  }\n\n  // 通知確認ボタン\n  if (confirmNotifyButton) {\n    confirmNotifyButton.addEventListener('click', () => {\n      sendReminderNotification(selectedCases);\n    });\n  }\n\n  // フィルターオプションの初期化\n  if (documentTypeFilter) {\n    documentTypeFilter.innerHTML = `\n      <option value=\"\">全ての種別</option>\n      <option value=\"vacation\">休暇申請</option>\n      <option value=\"expense\">経費申請</option>\n    `;\n  }\n\n  if (approvalStatusFilter) {\n    approvalStatusFilter.innerHTML = `\n   <script>
(function() {

  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};

  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },

        catch(e) { dbErr("更新"); return null; }
      },

        if (!API_URL) { dbErr("削除"); return {deleted:false}; }

    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
