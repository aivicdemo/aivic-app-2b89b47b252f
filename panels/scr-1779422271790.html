/A',\n          申請者ID: app.申請者ID,\n          現在承認者ID: app.現在承認者ID\n        };\n      })\n      .sort((a, b) => b.遅延日数 - a.遅延日数);\n  }\n\n  // フィルター適用関数\n  function applyFilters() {\n    const documentTypeFilter = container.querySelector('[data-testid=\"document-type-filter\"]')?.value || '全ての種別';\n    const approvalStatusFilter = container.querySelector('[data-testid=\"approval-status-filter\"]')?.value || '全ての状況';\n    const delayLevelFilter = container.querySelector('[data-testid=\"delay-level-filter\"]')?.value || '全てのレベル';\n    const searchKeyword = container.querySelector('[data-testid=\"search-input\"]')?.value || '';\n\n    filteredCases = allDelayCases.filter(c => {\n      if (documentTypeFilter !== '全ての種別' && c.申請種別 !== documentTypeFilter) return false;\n      if (approvalStatusFilter !== '全ての状況' && c.承認状態 !== approvalStatusFilter) return false;\n      if (delayLevelFilter !== '全てのレベル' && c.遅延レベル !== delayLevelFilter) return false;\n      if (searchKeyword && !c.申請者.includes(searchKeyword) && !c.現在承認者.includes(searchKeyword)) return false;\n      return true;\n    });\n\n    renderDelayCases(filteredCases);\n  }\n\n  // テーブル再描画関数\n  function renderDelayCases(cases) {\n    const tbody = container.querySelector('#delay-cases-tbody') || container.querySelector('[data-testid=\"delay-cases-tbody\"]');\n    const countEl = container.querySelector('#delay-count');\n    \n    if (countEl) countEl.textContent = `${cases.length}件`;\n    \n    if (!tbody) return;\n\n    if (cases.length === 0) {\n      tbody.innerHTML = '<tr><td colspan=\"9\" style=\"padding: 20px; text-align: center; color: var(--text-muted); font-size: 13px;\">遅延案件はありません</td></tr>';\n      return;\n    }\n    \n    tbody.innerHTML = cases.map(c => `\n      <tr data-id=\"${c.id}\" style=\"height: 36px;\">\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">\n          <input type=\"checkbox\" class=\"case-checkbox\" data-id=\"${c.id}\" style=\"accent-color: var(--primary);\">\n        </td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${c.申請ID}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${c.申請種別}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${c.申請者}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${c.現在承認者}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text); font-weight: 600;\">${c.遅延日数}日</td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">\n          <span style=\"background: ${c.遅延レベル色}; color: white; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 500;\">${c.遅延レベル}</span>\n        </td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${c.最終更新}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">\n          <button class=\"single-remind-btn\" data-id=\"${c.id}\" style=\"background: var(--primary); color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer;\">催促</button>\n        </td>\n      </tr>\n    `).join('');\n\n    // チェックボックスイベント\n    tbody.querySelectorAll('.case-checkbox').forEach(checkbox => {\n      checkbox.addEventListener('change', (e) => {\n        const id = e.target.dataset.id;\n        if (e.target.checked) {\n          selectedCases.add(id);\n        } else {\n          selectedCases.delete(id);\n        }\n        updateBulkActionButtons();\n      });\n    });\n\n    // 個別催促ボタンイベント\n    tbody.querySelectorAll('.single-remind-btn').forEach(btn => {\n      btn.addEventListener('click', async (e) => {\n        const id = e.target.dataset.id;\n        await handleSingleReminder(id);\n      });\n    });\n  }\n\n  // 一括操作ボタン状態更新\n  function updateBulkActionButtons() {\n    const bulkRemindBtn = container.querySelector('[data-testid=\"bulk-remind-button\"]');\n    const selectAllCheckbox = container.querySelector('[data-testid=\"select-all-checkbox\"]');\n    \n    if (bulkRemindBtn) {\n      bulkRemindBtn.disabled = selectedCases.size === 0;\n    }\n    \n    if (selectAllCheckbox) {\n      const visibleCases = filteredCases.length;\n      const selectedVisible = filteredCases.filter(c => selectedCases.has(c.id)).length;\n      selectAllCheckbox.checked = visibleCases > 0 && selectedVisible === visibleCases;\n      selectAllCheckbox.indeterminate = selectedVisible > 0 && selectedVisible < visibleCases;\n    }\n  }\n\n  // 個別催促処理\n  async function handleSingleReminder(caseId) {\n    try {\n      const caseData = allDelayCases.find(c => c.id === caseId);\n      if (!caseData) {\n        window.aivicNotify?.error('案件データが見つかりません');\n        return;\n      }\n\n      // 業務ロジック呼び出し\n      const reminderData = {\n        applicationId: caseData.id,\n        applicantId: caseData.申請者ID,\n        approverId: caseData.現在承認者ID,\n        delayDays: caseData.遅延日数,\n        documentType: caseData.申請種別\n      };\n\n      let priority, message, recipient;\n      \n      if (determinePriorityForReminder) {\n        priority = determinePriorityForReminder(reminderData);\n      }\n      \n      if (generateReminderMessage) {\n        message = generateReminderMessage(reminderData);\n      }\n      \n      if (identifyNotificationRecipient) {\n        recipient = identifyNotificationRecipient(reminderData);\n      }\n\n      // 通知送信API呼び出し\n      const notificationData = {\n        recipientId: recipient?.userId || caseData.現在承認者ID,\n        message: message || `申請ID: ${caseData.申請ID} の承認が${caseData.遅延日数}日遅延しています。`,\n        priority: priority || 'normal',\n        type: 'reminder'\n      };\n\n      await window.aivicApi.save('notifications', notificationData);\n      \n      window.aivicNotify?.success('催促通知を送信しました');\n      \n    } catch (error) {\n      console.error('催促通知送信エラー:', error);\n      window.aivicNotify?.error('催促通知の送信に失敗しました');\n    }\n  }\n\n  // 一括催促処理\n  async function handleBulkReminder() {\n    try {\n      if (selectedCases.size === 0) {\n        window.aivicNotify?.error('催促する案件を選択してください');\n        return;\n      }\n\n      const selectedCaseData = Array.from(selectedCases).map(id => \n        allDelayCases.find(c => c.id === id)\n      ).filter(Boolean);\n\n      // 業務ロジックで一括処理\n      for (const caseData of selectedCaseData) {\n        await handleSingleReminder(caseData.id);\n      }\n\n      selectedCases.clear();\n      updateBulkActionButtons();\n      \n      window.aivicNotify?.success(`${selectedCaseData.length}件の催促通知を送信しました`);\n      \n    } catch (error) {\n      console.error('一括催促エラー:', error);\n      window.aivicNotify?.error('一括催促の送信に失敗しました');\n    }\n  }\n\n  // 初期化処理\n  function initialize() {\n    // データ生成\n    allDelayCases = generateDelayCases();\n    filteredCases = [...allDelayCases];\n    \n    // 初期描画\n    renderDelayCases(filteredCases);\n\n    // フィルターボタンイベント\n    const filterBtn = container.querySelector('[data-testid=\"filter-button\"]');\n    if (filterBtn) {\n      filterBtn.addEventListener('click', applyFilters);\n    }\n\n    // 検索入力イベント\n    const searchInput = container.querySelector('[data-testid=\"search-input\"]');\n    if (searchInput) {\n      searchInput.addEventListener('input', applyFilters);\n    }\n\n    // 全選択チェックボックス\n    const selectAllCheckbox = container.querySelector('[data-testid=\"select-all-checkbox\"]');\n    if (selectAllCheckbox) {\n      selectAllCheckbox.addEventListener('change', (e) => {\n        if (e.target.checked) {\n          filteredCases.forEach(c => selectedCases.add(c.id));\n        } else {\n          filteredCases.forEach(c => selectedCases.delete(c.id));\n        }\n        \n        // 表示中のチェックボックスを更新\n        container.querySelectorAll('.case-checkbox').forEach(checkbox => {\n          checkbox.checked = selectedCases.has(checkbox.dataset.id);\n        });\n        \n        updateBulkActionButtons();\n      });\n    }\n\n    // 一括催促ボタン\n    const bulkRemindBtn = container.querySelector('[data-testid=\"bulk-remind-button\"]');\n    if (bulkRemindBtn) {\n      bulkRemindBtn.addEventListener('click', handleBulkReminder);\n    }\n\n    // 初期状態更新\n    updateBulkActionButtons();\n  }\n\n  // 初期化実行\n  initialize();\n\n  // 外部から参照可能な関数を返す\n  return {\n    refresh: initialize,\n    applyFilters,\n    getSelectedCases: () => Array.from(selectedCases)\n  };\n}";

    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
