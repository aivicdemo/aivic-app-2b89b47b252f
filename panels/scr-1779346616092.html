window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let currentTab = 'approval';\n  let approvalHistoryData = [];\n  let notificationHistoryData = [];\n\n  // 業務ロジックのインポート（実際の実装では適切にインポート）\n  const { checkApprovalStatusViewPermission, handleSystemFailureAlternativeProcess } = window.businessLogic || {};\n  const { determineNotificationTiming, checkApprovalDelayAndNotify } = window.businessLogic || {};\n\n  // 承認履歴テーブル再描画関数\n  function renderApprovalHistory(rows) {\n    const tbody = container.querySelector('#approval-history-tbody');\n    if (!tbody) return;\n    tbody.innerHTML = rows.map(r => {\n      const statusBadge = getStatusBadge(r.承認結果 || '');\n      return `\n        <tr data-id=\"${r.id}\" style=\"border-bottom: 1px solid var(--border);\">\n          <td style=\"padding: 6px 10px; color: var(--text);\">${r.申請書類番号 || ''}</td>\n          <td style=\"padding: 6px 10px; color: var(--text);\">${r.申請者名 || ''}</td>\n          <td style=\"padding: 6px 10px; color: var(--text);\">${r.承認者名 || ''}</td>\n          <td style=\"padding: 6px 10px;\">${statusBadge}</td>\n          <td style=\"padding: 6px 10px; color: var(--text);\">${formatDateTime(r.承認日時)}</td>\n          <td style=\"padding: 6px 10px; color: var(--text); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\" title=\"${r.承認コメント || ''}\">${r.承認コメント || ''}</td>\n          <td style=\"padding: 6px 10px; color: var(--text);\">${r.処理順序 || ''}</td>\n        </tr>\n      `;\n    }).join('');\n  }\n\n  // 通知履歴テーブル再描画関数\n  function renderNotificationHistory(rows) {\n    const tbody = container.querySelector('#notification-history-tbody');\n    if (!tbody) return;\n    tbody.innerHTML = rows.map(r => {\n      const statusBadge = getNotificationStatusBadge(r.送信状態 || '');\n      const readBadge = r.既読フラグ ? \n        '<span style=\"background: rgba(34, 197, 94, 0.2); color: #22c55e; padding: 2px 6px; border-radius: 4px; font-size: 11px;\">既読</span>' :\n        '<span style=\"background: rgba(239, 68, 68, 0.2); color: #ef4444; padding: 2px 6px; border-radius: 4px; font-size: 11px;\">未読</span>';\n      \n      return `\n        <tr data-id=\"${r.id}\" style=\"border-bottom: 1px solid var(--border);\">\n          <td style=\"padding: 6px 10px; color: var(--text);\">${r.通知種別 || ''}</td>\n          <td style=\"padding: 6px 10px; color: var(--text);\">${r.通知先ユーザー名 || ''}</td>\n          <td style=\"padding: 6px 10px; color: var(--text); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\" title=\"${r.通知タイトル || ''}\">${r.通知タイトル || ''}</td>\n          <td style=\"padding: 6px 10px; color: var(--text);\">${r.送信方法 || ''}</td>\n          <td style=\"padding: 6px 10px;\">${statusBadge}</td>\n          <td style=\"padding: 6px 10px; color: var(--text);\">${formatDateTime(r.送信日時)}</td>\n          <td style=\"padding: 6px 10px;\">${readBadge}</td>\n        </tr>\n      `;\n    }).join('');\n  }\n\n  // ステータスバッジ生成\n  function getStatusBadge(status) {\n    const statusMap = {\n      '承認': { bg: 'rgba(34, 197, 94, 0.2)', color: '#22c55e' },\n      '否認': { bg: 'rgba(239, 68, 68, 0.2)', color: '#ef4444' },\n      '保留': { bg: 'rgba(245, 158, 11, 0.2)', color: '#f59e0b' },\n      '差戻し': { bg: 'rgba(168, 85, 247, 0.2)', color: '#a855f7' }\n    };\n    const style = statusMap[status] || { bg: 'rgba(156, 163, 175, 0.2)', color: '#9ca3af' };\n    return `<span style=\"background: ${style.bg}; color: ${style.color}; padding: 2px 6px; border-radius: 4px; font-size: 11px;\">${status}</span>`;\n  }\n\n  // 通知ステータスバッジ生成\n  function getNotificationStatusBadge(status) {\n    const statusMap = {\n      '送信済み': { bg: 'rgba(34, 197, 94, 0.2)', color: '#22c55e' },\n      '送信失敗': { bg: 'rgba(239, 68, 68, 0.2)', color: '#ef4444' },\n      '送信中': { bg: 'rgba(245, 158, 11, 0.2)', color: '#f59e0b' }\n    };\n    const style = statusMap[status] || { bg: 'rgba(156, 163, 175, 0.2)', color: '#9ca3af' };\n    return `<span style=\"background: ${style.bg}; color: ${style.color}; padding: 2px 6px; border-radius: 4px; font-size: 11px;\">${status}</span>`;\n  }\n\n  // 日時フォーマット\n  function formatDateTime(dateStr) {\n    if (!dateStr) return '';\n    try {\n      const date = new Date(dateStr);\n      return date.toLocaleString('ja-JP', {\n        year: 'numeric',\n        month: '2-digit',\n        day: '2-digit',\n        hour: '2-digit',\n        minute: '2-digit'\n      });\n    } catch (e) {\n      return dateStr;\n    }\n  }\n\n  // タブ切り替え処理\n  function switchTab(tabName) {\n    currentTab = tabName;\n    \n    // タブボタンのアクティブ状態更新\n    const approvalTab = container.querySelector('[data-testid=\"approval-history-tab\"]');\n    const notificationTab = container.querySelector('[data-testid=\"notification-history-tab\"]');\n    const approvalTable = container.querySelector('#approval-history-table');\n    const notificationTable = container.querySelector('#notification-history-table');\n\n    if (approvalTab && notificationTab && approvalTable && notificationTable) {\n      if (tabName === 'approval') {\n        approvalTab.style.background = 'var(--primary)';\n        approvalTab.style.color = '#fff';\n        notificationTab.style.background = 'var(--bg-secondary)';\n        notificationTab.style.color = 'var(--text)';\n        approvalTable.style.display = 'table';\n        notificationTable.style.display = 'none';\n      } else {\n        notificationTab.style.background = 'var(--primary)';\n        notificationTab.style.color = '#fff';\n        approvalTab.style.background = 'var(--bg-secondary)';\n        approvalTab.style.color = 'var(--text)';\n        notificationTable.style.display = 'table';\n        approvalTable.style.display = 'none';\n      }\n    }\n  }\n\n  // 承認履歴データ取得\n  async function loadApprovalHistory() {\n    try {\n      // 権限チェック（業務ロジック使用）\n      if (checkApprovalStatusViewPermission) {\n        const hasPermission = checkApprovalStatusViewPermission({ userId: window.currentUser?.id });\n        if (!hasPermission) {\n          window.aivicNotify.error('承認履歴の閲覧権限がありません');\n          return;\n        }\n      }\n\n      const response = await window.aivicApi.list('approval_history', {});\n      if (response.success) {\n        approvalHistoryData = response.data || [];\n        renderApprovalHistory(approvalHistoryData);\n      } else {\n        throw new Error(response.message || '承認履歴の取得に失敗しました');\n      }\n    } catch (error) {\n      console.error('承認履歴取得エラー:', error);\n      \n      // システム障害時の代替処理（業務ロジック使用）\n      if (handleSystemFailureAlternativeProcess) {\n        const fallbackResult = handleSystemFailureAlternativeProcess({\n          operation: 'loadApprovalHistory',\n          error: error.message\n        });\n        if (fallbackResult.success) {\n          window.aivicNotify.info('代替手段で承認履歴を取得しました');\n          approvalHistoryData = fallbackResult.data || [];\n          renderApprovalHistory(approvalHistoryData);\n          return;\n        }\n      }\n      \n      window.aivicNotify.error('承認履歴の取得に失敗しました: ' + error.message);\n    }\n  }\n\n  // 通知履歴データ取得\n  async function loadNotificationHistory() {\n    try {\n      const response = await window.aivicApi.list('notification_history', {});\n      if (response.success) {\n        notificationHistoryData = response.data || [];\n        renderNotificationHistory(notificationHistoryData);\n      } else {\n        throw new Error(response.message || '通知履歴の取得に失敗しました');\n      }\n    } catch (error) {\n      console.error('通知履歴取得エラー:', error);\n      window.aivicNotify.error('通知履歴の取得に失敗しました: ' + error.message);\n    }\n  }\n\n  // 検索処理\n  async function performSearch() {\n    const searchInput = container.querySelector('[data-testid=\"history-search-input\"]');\n    const searchValue = searchInput ? searchInput.value.trim() : '';\n\n    try {\n      if (currentTab === 'approval') {\n        const response = await window.aivicApi.list('approval_history', {\n          search: searchValue\n        });\n        if (response.success) {\n          approvalHistoryData = response.data || [];\n          renderApprovalHistory(approvalHistoryData);\n        }\n      } else {\n        const response = await window.aivicApi.list('notification_history', {\n          search: searchValue\n        });\n        if (response.success) {\n          notificationHistoryData = response.data || [];\n          renderNotificationHistory(notificationHistoryData);\n        }\n      }\n    } catch (error) {\n      console.error('検索エラー:', error);\n      window.aivicNotify.error('検索に失敗しました: ' + error.message);\n    }\n  }\n\n  // 遅延通知チェック処理\n  async function checkDelayedApprovals() {\n    try {\n      if (checkApprovalDelayAndNotify) {\n        const result = checkApprovalDelayAndNotify({\n          approvalData: approvalHistoryData,\n          currentTime: new Date()\n        });\n        \n        if (result.hasDelays) {\n          window.aivicNotify.warning(`${result.delayedCount}件の承認遅延が検出されました`);\n          // 通知履歴を再読み込み\n          await loadNotificationHistory();\n        } else {\n          window.aivicNotify.info('承認遅延は検出されませんでした');\n        }\n      }\n    } catch (error) {\n      console.error('遅延チェックエラー:', error);\n      window.aivicNotify.error('遅延チェックに失敗しました: ' + error.message);\n    }\n  }\n\n  // イベントハンドラー設定\n  function setupEventHandlers() {\n    // タブ切り替え\n    const approvalTab = container.querySelector('[data-testid=\"approval-history-tab\"]');\n    const notificationTab = container.querySelector('[data-testid=\"notification-history-tab\"]');\n    \n    if (approvalTab) {\n      approvalTab.addEventListener('click', () => {\n        switchTab('approval');\n        loadApprovalHistory();\n      });\n    }\n    \n    if (notificationTab) {\n      notificationTab.addEventListener('click', () => {\n        switchTab('notification');\n        loadNotificationHistory();\n      });\n    }\n\n    // 検索ボタン\n    const searchButton = container.querySelector('[data-testid=\"history-search-button\"]');\n    if (searchButton) {\n      searchButton.addEventListener('click', performSearch);\n    }\n\n    // 検索入力でEnterキー\n    const searchInput = container.querySelector('[data-testid=\"history-search-input\"]');\n    if (searchInput) {\n      searchInput.addEventListener('keypress', (e) => {\n        if (e.key === 'Enter') {\n          performSearch();\n        }\n      });\n    }\n\n    // 更新ボタン\n    const refreshButton = container.querySelector('[data-testid=\"refresh-button\"]');\n    if (refreshButton) {\n      refreshButton.addEventListener('click', () => {\n        if (currentTab === 'approval') {\n          loadApprovalHistory();\n        } else {\n          loadNotificationHistory();\n        }\n      });\n    }\n\n    // 遅延チェックボタン\n    const delayCheckButton = container.querySelector('[data-testid=\"delay-check-button\"]');\n    if (delayCheckButton) {\n      delayCheckButton.addEventListener('click', checkDelayedApprovals);\n    }\n\n    // エクスポートボタン\n    const exportButton = container.querySelector('[data-testid=\"export-button\"]');\n    if (exportButton) {\n      exportButton.addEventListener('click', () => {\n        const data = currentTab === 'approval' ? approvalHistoryData : notificationHistoryData;\n        const filename = currentTab === 'approval' ? '承認履歴.csv' : '通知履歴.csv';\n        exportToCsv(data, filename);\n      });\n    }\n  }\n\n  // CSV エクスポート\n  function exportToCsv(data, filename) {\n    try {\n      if (!data || data.length === 0) {\n        window.aivicNotify.warning('エクスポートするデータがありません');\n        return;\n      }\n\n      const headers = Object.keys(data[0]);\n      const csvContent = [\n        headers.join(','),\n        ...data.map(row => headers.map(header => `\"${row[header] || ''}\"`).join(','))\n      ].join('\\n');\n\n      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });\n      const link = document.createElement('a');\n      link.href = URL.createObjectURL(blob);\n      link.download = filename;\n      link.click();\n      \n      window.aivicNotify.success('データをエクスポートしました');\n    } catch (error) {\n      console.error('エクスポートエラー:', error);\n      window.aivicNotify.error('エクスポートに失敗しました: ' + error.message);\n    }\n  }\n\n  // 初期化処理\n  function initialize() {\n    setupEventHandlers();\n    switchTab('approval');\n    loadApprovalHistory();\n  }\n\n  // 初期化実行\n  initialize();\n}";
