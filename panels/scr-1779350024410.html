window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let currentFile = null;\n  let currentDetection = null;\n  let changeHistory = [];\n\n  // DOM要素の取得\n  const uploadArea = container.querySelector('#upload-area');\n  const fileInput = container.querySelector('#file-input');\n  const uploadPlaceholder = container.querySelector('#upload-placeholder');\n  const uploadProgress = container.querySelector('#upload-progress');\n  const progressBar = container.querySelector('#progress-bar');\n  const detectionResult = container.querySelector('#detection-result');\n  const autoDetection = container.querySelector('#auto-detection');\n  const confidenceBar = container.querySelector('#confidence-bar');\n  const confidenceText = container.querySelector('#confidence-text');\n  const manualDocumentType = container.querySelector('#manual-document-type');\n  const detectionReason = container.querySelector('#detection-reason');\n  const approvalFlow = container.querySelector('#approval-flow');\n  const flowSteps = container.querySelector('#flow-steps');\n  const documentPreview = container.querySelector('#document-preview');\n  const changeHistoryDiv = container.querySelector('#change-history');\n  const errorMessage = container.querySelector('#error-message');\n\n  // ボタン要素\n  const btnDetect = container.querySelector('#btn-detect');\n  const btnReDetect = container.querySelector('#btn-re-detect');\n  const btnConfirmFlow = container.querySelector('#btn-confirm-flow');\n  const btnFinalize = container.querySelector('#btn-finalize');\n  const btnProcess = container.querySelector('#btn-process');\n\n  // 文書種別マスタデータ（テーブルから取得）\n  const documentTypes = tables[2]?.records || [\n    { id: '1', 文書種別コード: 'vacation-request', 文書種別名: '休暇申請書', 承認段数: 2 },\n    { id: '2', 文書種別コード: 'expense-report', 文書種別名: '経費精算書', 承認段数: 3 },\n    { id: '3', 文書種別コード: 'business-proposal', 文書種別名: '稟議書', 承認段数: 4 },\n    { id: '4', 文書種別コード: 'overtime-request', 文書種別名: '残業申請書', 承認段数: 1 },\n    { id: '5', 文書種別コード: 'purchase-request', 文書種別名: '購買申請書', 承認段数: 3 },\n    { id: '6', 文書種別コード: 'travel-request', 文書種別名: '出張申請書', 承認段数: 2 }\n  ];\n\n  // エラーメッセージ表示\n  function showError(message) {\n    errorMessage.textContent = message;\n    errorMessage.style.display = 'block';\n    setTimeout(() => {\n      errorMessage.style.display = 'none';\n    }, 5000);\n  }\n\n  // 変更履歴を追加\n  function addChangeHistory(action, details) {\n    const timestamp = new Date().toLocaleString('ja-JP');\n    changeHistory.unshift({ timestamp, action, details });\n    renderChangeHistory();\n  }\n\n  // 変更履歴を描画\n  function renderChangeHistory() {\n    if (changeHistory.length === 0) {\n      changeHistoryDiv.innerHTML = '<div style=\"font-size: 12px; color: var(--text-muted); text-align: center; padding: 20px;\">履歴はありません</div>';\n      return;\n    }\n\n    changeHistoryDiv.innerHTML = changeHistory.map(h => `\n      <div style=\"border-bottom: 1px solid rgba(255,255,255,0.08); padding: 8px 0; font-size: 11px;\">\n        <div style=\"color: var(--text); font-weight: 500;\">${h.action}</div>\n        <div style=\"color: var(--text-muted); margin: 2px 0;\">${h.details}</div>\n        <div style=\"color: var(--text-muted);\">${h.timestamp}</div>\n      </div>\n    `).join('');\n  }\n\n  // ファイルアップロード処理\n  function handleFileUpload(file) {\n    if (!file) return;\n\n    currentFile = file;\n    uploadPlaceholder.style.display = 'none';\n    uploadProgress.style.display = 'block';\n\n    // プログレスバーアニメーション\n    let progress = 0;\n    const interval = setInterval(() => {\n      progress += Math.random() * 20;\n      if (progress >= 100) {\n        progress = 100;\n        clearInterval(interval);\n        setTimeout(() => {\n          uploadProgress.style.display = 'none';\n          uploadPlaceholder.style.display = 'block';\n          uploadPlaceholder.innerHTML = `\n            <div style=\"font-size: 13px; color: var(--text); margin-bottom: 4px;\">${file.name}</div>\n            <div style=\"font-size: 11px; color: var(--text-muted);\">ファイルサイズ: ${(file.size / 1024).toFixed(1)} KB</div>\n          `;\n          btnDetect.disabled = false;\n          showDocumentPreview(file);\n          addChangeHistory('ファイルアップロード', `${file.name} (${(file.size / 1024).toFixed(1)} KB)`);\n        }, 500);\n      }\n      progressBar.style.width = progress + '%';\n    }, 100);\n  }\n\n  // 文書プレビュー表示\n  function showDocumentPreview(file) {\n    if (file.type.startsWith('image/')) {\n      const reader = new FileReader();\n      reader.onload = (e) => {\n        documentPreview.innerHTML = `<img src=\"${e.target.result}\" style=\"max-width: 100%; max-height: 100%; object-fit: contain;\">`;\n      };\n      reader.readAsDataURL(file);\n    } else {\n      documentPreview.innerHTML = `\n        <div style=\"text-align: center;\">\n          <div style=\"font-size: 24px; margin-bottom: 8px;\">📄</div>\n          <div style=\"font-size: 12px; color: var(--text);\">${file.name}</div>\n          <div style=\"font-size: 11px; color: var(--text-muted); margin-top: 4px;\">${file.type || 'Unknown'}</div>\n        </div>\n      `;\n    }\n  }\n\n  // 文書種別判定処理\n  function performDetection() {\n    if (!currentFile) {\n      showError('ファイルが選択されていません');\n      return;\n    }\n\n    // 模擬的な判定処理\n    const fileName = currentFile.name.toLowerCase();\n    let detectedType = null;\n    let confidence = 0;\n    let reason = '';\n\n    if (fileName.includes('休暇') || fileName.includes('vacation')) {\n      detectedType = documentTypes.find(t => t.文書種別コード === 'vacation-request');\n      confidence = 92;\n      reason = 'ファイル名に「休暇」が含まれており、休暇申請書と判定しました。';\n    } else if (fileName.includes('経費') || fileName.includes('expense')) {\n      detectedType = documentTypes.find(t => t.文書種別コード === 'expense-report');\n      confidence = 88;\n      reason = 'ファイル名に「経費」が含まれており、経費精算書と判定しました。';\n    } else if (fileName.includes('稟議') || fileName.includes('proposal')) {\n      detectedType = documentTypes.find(t => t.文書種別コード === 'business-proposal');\n      confidence = 85;\n      reason = 'ファイル名に「稟議」が含まれており、稟議書と判定しました。';\n    } else if (fileName.includes('残業') || fileName.includes('overtime')) {\n      detectedType = documentTypes.find(t => t.文書種別コード === 'overtime-request');\n      confidence = 90;\n      reason = 'ファイル名に「残業」が含まれており、残業申請書と判定しました。';\n    } else {\n      detectedType = documentTypes[Math.floor(Math.random() * documentTypes.length)];\n      confidence = 65;\n      reason = 'ファイル名からの判定が困難なため、文書内容を解析して判定しました。';\n    }\n\n    currentDetection = {\n      type: detectedType,\n      confidence: confidence,\n      reason: reason\n    };\n\n    // UI更新\n    detectionResult.style.display = 'block';\n    autoDetection.textContent = detectedType.文書種別名;\n    confidenceBar.style.width = confidence + '%';\n    confidenceText.textContent = confidence + '%';\n    detectionReason.textContent = reason;\n    manualDocumentType.value = detectedType.文書種別コード;\n\n    // ボタン状態更新\n    btnReDetect.disabled = false;\n    btnConfirmFlow.disabled = false;\n    btnFinalize.disabled = false;\n\n    addChangeHistory('自動判定実行', `${detectedType.文書種別名} (信頼度: ${confidence}%)`);\n    showApprovalFlow(detectedType);\n  }\n\n  // 承認フロー表示\n  function showApprovalFlow(docType) {\n    if (!docType) return;\n\n    approvalFlow.style.display = 'block';\n    const steps = [];\n    for (let i = 1; i <= docType.承認段数; i++) {\n      steps.push(`${i}次承認: 部門長${i > 1 ? `(${i}段階)` : ''}`);\n    }\n    flowSteps.innerHTML = steps.map((step, index) => `\n      <div style=\"display: flex; align-items: center; margin-bottom: 4px;\">\n        <div style=\"width: 20px; height: 20px; border-radius: 50%; background: var(--primary); color: #fff; font-size: 10px; display: flex; align-items: center; justify-content: center; margin-right: 8px;\">\n          ${index + 1}\n        </div>\n        <span>${step}</span>\n      </div>\n    `).join('');\n  }\n\n  // イベントリスナー設定\n  uploadArea.addEventListener('click', () => fileInput.click());\n  \n  uploadArea.addEventListener('dragover', (e) => {\n    e.preventDefault();\n    uploadArea.style.borderColor = 'var(--primary)';\n  });\n\n  uploadArea.addEventListener('dragleave', () => {\n    uploadArea.style.borderColor = 'rgba(255,255,255,0.18)';\n  });\n\n  uploadArea.addEventListener('drop', (e) => {\n    e.preventDefault();\n    uploadArea.style.borderColor = 'rgba(255,255,255,0.18)';\n    const files = e.dataTransfer.files;\n    if (files.length > 0) {\n      handleFileUpload(files[0]);\n    }\n  });\n\n  fileInput.addEventListener('change', (e) => {\n    if (e.target.files.length > 0) {\n      handleFileUpload(e.target.files[0]);\n    }\n  });\n\n  btnDetect.addEventListener('click', performDetection);\n  btnReDetect.addEventListener('click', performDetection);\n\n  btnConfirmFlow.addEventListener('click', () => {\n    const selectedType = manualDocumentType.value;\n    if (selectedType) {\n      const docType = documentTypes.find(t => t.文書種別コード === selectedType);\n      showApprovalFlow(docType);\n      addChangeHistory('承認フロー確認', `${docType.文書種別名}の承認フローを確認`);\n    } else {\n      showError('文書種別を選択してください');\n    }\n  });\n\n  btnFinalize.addEventListener('click', async () => {\n    if (!currentDetection && !manualDocumentType.value) {\n      showError('文書種別が判定されていません');\n      return;\n    }\n\n    const finalType = manualDocumentType.value || currentDetection.type.文書種別コード;\n    const docType = documentTypes.find(t => t.文書種別コード === finalType);\n    \n    // 申請書類として保存\n    const applicationData = {\n      申請種別: docType.文書種別名,\n      申請タイトル: currentFile.name,\n      申請内容: `自動判定により${docType.文書種別名}として分類`,\n      承認状態: '申請中',\n      承認段階: 1,\n      緊急フラグ: false,\n      添付ファイル有無: true,\n      申請者ID: 'current-user-id'\n    };\n\n    const saved = await window.aivicApi.save(1, applicationData);\n    if (saved) {\n      addChangeHistory('判定結果確定', `${docType.文書種別名}として確定`);\n      btnProcess.disabled = false;\n    } else {\n      showError('判定結果の保存に失敗しました');\n    }\n  });\n\n  btnProcess.addEventListener('click', () => {\n    window.showScreen(\"scr-1779346876884\");\n  });\n\n  manualDocumentType.addEventListener('change', (e) => {\n    if (e.target.value) {\n      const docType = documentTypes.find(t => t.文書種別コード === e.target.value);\n      showApprovalFlow(docType);\n      btnConfirmFlow.disabled = false;\n      btnFinalize.disabled = false;\n      addChangeHistory('手動種別選択', `${docType.文書種別名}を手動選択`);\n    }\n  });\n\n  // 初期化\n  renderChangeHistory();\n}";

  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）

    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {

    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);

      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }

    _aivicNavLastTarget = targetPath;

  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {

  document.addEventListener("DOMContentLoaded", function() {

    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;

      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }

      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
