<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ハイブリッド申請承認システム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-main: #ffffff;
            --bg-card: #f8fafc;
            --bg-sidebar: #f1f5f9;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-muted: #64748b;
            --text-light: #94a3b8;
            --top-bar-bg: #ffffff;
            --top-bar-border: #e2e8f0;
            --success: #059669;
            --warning: #d97706;
            --danger: #dc2626;
            --radius: 8px;
            --radius-sm: 6px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 13px;
            line-height: 1.4;
            color: var(--text);
            background: var(--bg-main);
        }

        .app-layout {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--top-bar-bg);
        }

        .logo {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }

        .nav-section {
            padding: 12px 0;
        }

        .nav-section-title {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0 16px 8px;
        }

        .nav-item {
            display: block;
            padding: 6px 16px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .nav-item:hover {
            background: rgba(59, 130, 246, 0.08);
            color: var(--primary);
        }

        .nav-item.aivic-active {
            background: rgba(59, 130, 246, 0.12);
            color: var(--primary);
            font-weight: 500;
            border-right: 2px solid var(--primary);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            height: 52px;
            background: var(--top-bar-bg);
            border-bottom: 1px solid var(--top-bar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .breadcrumb {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 500;
        }

        .logout-link {
            font-size: 12px;
            color: var(--text-muted);
            text-decoration: none;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            transition: background 0.15s ease;
        }

        .logout-link:hover {
            background: var(--bg-card);
        }

        .content-area {
            flex: 1;
            overflow: auto;
            padding: 16px 20px;
        }

        .panel-container {
            height: 100%;
            background: var(--bg-main);
        }

        .status-indicator {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .status-pending { background: var(--warning); }
        .status-approved { background: var(--success); }
        .status-rejected { background: var(--danger); }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .badge-primary {
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary);
        }

        .badge-success {
            background: rgba(5, 150, 105, 0.1);
            color: var(--success);
        }

        .badge-warning {
            background: rgba(217, 119, 6, 0.1);
            color: var(--warning);
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            margin-bottom: 12px;
        }

        .card-header {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
            background: var(--bg-main);
            color: var(--text);
        }

        .btn:hover {
            background: var(--bg-card);
            border-color: var(--primary);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .table th,
        .table td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .table th {
            font-weight: 500;
            color: var(--text-muted);
            background: var(--bg-card);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .table tbody tr:hover {
            background: rgba(59, 130, 246, 0.02);
        }

        .loading-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--text-light);
            font-size: 12px;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            
            .content-area {
                padding: 12px 16px;
            }
        }
    </style>

id","required":true,"description":"適用される承認フロー定義への外部キー"},{"name":"現在ステップ番号","type":"integer","required":true,"description":"現在処理中の承認ステップ番号"},{"name":"現在承認者ID","type":"uuid","required":false,"description":"現在の承認担当者のユーザーID"},{"name":"処理状況","type":"varchar(100)","required":true,"description":"処理の現在状況（申請中/承認待ち/承認済み/差戻し/却下/取下げ）"},{"name":"開始日時","type":"timestamp","required":true,"description":"処理ルートの開始日時"},{"name":"完了日時","type":"timestamp","required":false,"description":"処理ルートの完了日時"},{"name":"期限日時","type":"timestamp","required":false,"description":"処理完了の期限日時"},{"name":"優先度","type":"integer","required":true,"description":"処理の優先度（1:低 2:通常 3:高 4:緊急）"},{"name":"自動処理フラグ","type":"boolean","required":true,"description":"自動処理対象かどうかのフラグ"},{"name":"備考","type":"text","required":false,"description":"処理ルートに関する備考・メモ"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"遅延検知設定","purpose":"申請承認プロセスにおける遅延を検知するための設定を管理し、承認ステップごとの期限や通知タイミングを定義する","columns":[{"name":"遅延検知設定ID","type":"uuid","required":true,"description":"遅延検知設定の一意識別子（主キー）"},{"name":"文書種別ID","type":"uuid","required":true,"description":"文書種別マスタへの外部キー"},{"name":"承認ステップID","type":"uuid","required":false,"description":"承認ステップへの外部キー（全ステップ共通の場合はNULL）"},{"name":"設定名","type":"varchar(100)","required":true,"description":"遅延検知設定の名称"},{"name":"期限日数","type":"integer","required":true,"description":"承認期限までの日数"},{"name":"警告日数","type":"integer","required":false,"description":"期限前の警告通知を行う日数"},{"name":"エスカレーション日数","type":"integer","required":false,"description":"期限超過後のエスカレーション通知を行う日数"},{"name":"営業日計算フラグ","type":"boolean","required":true,"description":"営業日ベースで計算するかどうか"},{"name":"有効フラグ","type":"boolean","required":true,"description":"設定が有効かどうか"},{"name":"備考","type":"text","required":false,"description":"設定に関する補足説明"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"補助金関連度マスタ","purpose":"申請書類と補助金制度の関連度を管理し、適切な承認フローや処理ルートの決定に使用するマスタテーブル","columns":[{"name":"補助金関連度ID","type":"uuid","required":true,"description":"補助金関連度の一意識別子（主キー）"},{"name":"補助金関連度コード","type":"varchar(100)","required":true,"description":"補助金関連度の業務コード（表示・検索用）"},{"name":"補助金関連度名","type":"varchar(100)","required":true,"description":"補助金関連度の名称"},{"name":"関連度レベル","type":"integer","required":true,"description":"関連度の数値レベル（1:低、2:中、3:高など）"},{"name":"説明","type":"text","required":false,"description":"補助金関連度の詳細説明"},{"name":"表示順","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"マスタデータの有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]}];

window.AIVIC_PAGE_INIT_JS = "js\nfunction(container, apiUrl, tables) {\n  // 業務ロジックのインポート\n  const { \n    determinePriorityForApprovalNotification,\n    identifyNotificationRecipient,\n    processUrgentApplicationPriority,\n    checkApprovalStatusViewPermission,\n    getProgressDataWithAccessControl,\n    identifyStagnantApplications,\n    determinePriorityForReminder,\n    generateReminderMessage\n  } = window.businessLogic || {};\n\n  const tbody = container.querySelector(\"#notification-tbody\");\n  const unreadCountEl = container.querySelector(\"#unread-count\");\n  const urgencyFilter = container.querySelector('[data-testid=\"urgency-filter\"]');\n  const documentTypeFilter = container.querySelector('[data-testid=\"document-type-filter\"]');\n  const applicantFilter = container.querySelector('[data-testid=\"applicant-filter\"]');\n  const deadlineFilter = container.querySelector('[data-testid=\"deadline-filter\"]');\n  const searchButton = container.querySelector('[data-testid=\"search-button\"]');\n  const refreshButton = container.querySelector('[data-testid=\"refresh-button\"]');\n  \n  let currentNotifications = [];\n  \n  // 緊急度アイコンを取得\n  function getUrgencyIcon(priority) {\n    switch(priority) {\n      case 4: return '<span style=\"color: #ff4444; font-weight: bold;\">🚨</span>';\n      case 3: return '<span style=\"color: #ff8800; font-weight: bold;\">⚠️</span>';\n      case 2: return '<span style=\"color: #4488ff;\">📋</span>';\n      case 1: return '<span style=\"color: #888888;\">📄</span>';\n      default: return '<span style=\"color: #888888;\">📄</span>';\n    }\n  }\n  \n  // 期限チェック\n  function getDeadlineStatus(deadline) {\n    if (!deadline) return '';\n    const now = new Date();\n    const deadlineDate = new Date(deadline);\n    const diffHours = (deadlineDate - now) / (1000 * 60 * 60);\n    \n    if (diffHours < 0) {\n      return '<span style=\"color: #ff4444; font-weight: bold;\">期限超過</span>';\n    } else if (diffHours < 24) {\n      return '<span style=\"color: #ff8800; font-weight: bold;\">本日期限</span>';\n    } else if (diffHours < 48) {\n      return '<span style=\"color: #ffaa00;\">明日期限</span>';\n    }\n    return '';\n  }\n  \n  // 日時フォーマット\n  function formatDateTime(dateStr) {\n    if (!dateStr) return '';\n    const date = new Date(dateStr);\n    return `${date.getMonth()+1}/${date.getDate()} ${date.getHours().toString().padStart(2,'0')}:${date.getMinutes().toString().padStart(2,'0')}`;\n  }\n  \n  // 通知データを結合して表示用データを作成\n  function createNotificationData() {\n    const notifications = tables[5]?.records || []; // 通知履歴\n    const applications = tables[1]?.records || []; // 申請書類\n    const users = tables[0]?.records || []; // ユーザー\n    const routes = tables[7]?.records || []; // 処理ルート\n    \n    let notificationData = notifications\n      .filter(n => n.通知種別 === '承認依頼' && n.通知対象ユーザーID)\n      .map(notification => {\n        const application = applications.find(a => a.申請書類ID === notification.申請書類ID);\n        const applicant = users.find(u => u.ユーザーID === application?.申請者ID);\n        const route = routes.find(r => r.申請書類ID === notification.申請書類ID);\n        \n        let priority = route?.優先度 || 2;\n        \n        // 業務ロジックで優先度を決定\n        if (determinePriorityForReminder) {\n          try {\n            const priorityResult = determinePriorityForReminder({\n              申請書類: application,\n              処理ルート: route,\n              申請者: applicant,\n              通知: notification\n            });\n            if (priorityResult && priorityResult.優先度) {\n              priority = priorityResult.優先度;\n            }\n          } catch (error) {\n            console.warn('優先度決定エラー:', error);\n          }\n        }\n        \n        // 緊急申請の優先度処理\n        if (processUrgentApplicationPriority && application?.緊急フラグ) {\n          try {\n            const urgentResult = processUrgentApplicationPriority({\n              申請書類: application,\n              処理ルート: route\n            });\n            if (urgentResult && urgentResult.優先度) {\n              priority = Math.max(priority, urgentResult.優先度);\n            }\n          } catch (error) {\n            console.warn('緊急申請優先度処理エラー:', error);\n          }\n        }\n        \n        return {\n          通知ID: notification.通知ID,\n          申請書類ID: application?.申請書類ID,\n          申請書類名: application?.申請書類名 || '不明',\n          文書種別: application?.文書種別 || '不明',\n          申請者名: applicant?.氏名 || '不明',\n          申請者ID: applicant?.ユーザーID,\n          優先度: priority,\n          承認期限: route?.承認期限,\n          通知日時: notification.通知日時,\n          既読フラグ: notification.既読フラグ,\n          申請日: application?.申請日,\n          申請金額: application?.申請金額,\n          現在のステップ: route?.現在のステップ || '承認待ち'\n        };\n      });\n    \n    // 滞留案件の特定\n    if (identifyStagnantApplications) {\n      try {\n        const stagnantResult = identifyStagnantApplications({\n          申請書類一覧: applications,\n          処理ルート一覧: routes,\n          通知履歴: notifications\n        });\n        \n        if (stagnantResult && stagnantResult.滞留案件一覧) {\n          stagnantResult.滞留案件一覧.forEach(stagnant => {\n            const existingIndex = notificationData.findIndex(n => n.申請書類ID === stagnant.申請書類ID);\n            if (existingIndex >= 0) {\n              notificationData[existingIndex].優先度 = Math.max(notificationData[existingIndex].優先度, 3);\n              notificationData[existingIndex].滞留フラグ = true;\n            }\n          });\n        }\n      } catch (error) {\n        console.warn('滞留案件特定エラー:', error);\n      }\n    }\n    \n    return notificationData.sort((a, b) => {\n      if (a.優先度 !== b.優先度) return b.優先度 - a.優先度;\n      if (a.既読フラグ !== b.既読フラグ) return a.既読フラグ ? 1 : -1;\n      return new Date(b.通知日時) - new Date(a.通知日時);\n    });\n  }\n  \n  // フィルター適用\n  function applyFilters(data) {\n    let filtered = [...data];\n    \n    const urgencyValue = urgencyFilter?.value;\n    if (urgencyValue && urgencyValue !== '全て') {\n      const priorityMap = { '緊急': 4, '高': 3, '通常': 2, '低': 1 };\n      const targetPriority = priorityMap[urgencyValue];\n      if (targetPriority) {\n        filtered = filtered.filter(item => item.優先度 === targetPriority);\n      }\n    }\n    \n    const documentTypeValue = documentTypeFilter?.value;\n    if (documentTypeValue && documentTypeValue !== '全て') {\n      filtered = filtered.filter(item => item.文書種別 === documentTypeValue);\n    }\n    \n    const applicantValue = applicantFilter?.value;\n    if (applicantValue && applicantValue !== '全て') {\n      filtered = filtered.filter(item => item.申請者ID === applicantValue);\n    }\n    \n    const deadlineValue = deadlineFilter?.value;\n    if (deadlineValue && deadlineValue !== '全て') {\n      const now = new Date();\n      filtered = filtered.filter(item => {\n        if (!item.承認期限) return false;\n        const deadline = new Date(item.承認期限);\n        const diffDays = (deadline - now) / (1000 * 60 * 60 * 24);\n        \n        switch (deadlineValue) {\n          case '期限超過': return diffDays < 0;\n          case '本日': return diffDays >= 0 && diffDays < 1;\n          case '明日': return diffDays >= 1 && diffDays < 2;\n          case '1週間以内': return diffDays >= 0 && diffDays <= 7;\n          case '1ヶ月以内': return diffDays >= 0 && diffDays <= 30;\n          default: return true;\n        }\n      });\n    }\n    \n    return filtered;\n  }\n  \n  // テーブル行を描画\n  function renderNotificationRow(notification) {\n    const urgencyIcon = getUrgencyIcon(notification.優先度);\n    const deadlineStatus = getDeadlineStatus(notification.承認期限);\n    const formattedDateTime = formatDateTime(notification.通知日時);\n    const formattedDeadline = notification.承認期限 ? formatDateTime(notification.承認期限) : '';\n    \n    const rowClass = notification.既読フラグ ? 'read' : 'unread';\n    const stagnantBadge = notification.滞留フラグ ? '<span style=\"background: #ff4444; color: white; padding: 2px 6px; border-radius: 8px; font-size: 10px; margin-left: 4px;\">滞留</span>' : '';\n    \n    return `\n      <tr class=\"${rowClass}\" style=\"${!notification.既読フラグ ? 'background-color: #f8f9ff;' : ''}\">\n        <td style=\"padding: 8px; text-align: center;\">\n          ${urgencyIcon}\n          ${stagnantBadge}\n        </td>\n        <td style=\"padding: 8px;\">\n          <div style=\"font-weight: 500;\">${notification.申請書類名}</div>\n          <div style=\"font-size: 12px; color: #666; margin-top: 2px;\">${notification.文書種別}</div>\n        </td>\n        <td style=\"padding: 8px;\">${notification.申請者名}</td>\n        <td style=\"padding: 8px;\">\n          <div>${formattedDateTime}</div>\n        </td>\n        <td style=\"padding: 8px;\">\n          <div>${formattedDeadline}</div>\n          ${deadlineStatus}\n        </td>\n        <td style=\"padding: 8px;\">${notification.現在のステップ}</td>\n        <td style=\"padding: 8px; text-align: center;\">\n          <div style=\"display: flex; gap: 4px; justify-content: center;\">\n            <button onclick=\"handleApprovalAction('${notification.申請書類ID}', 'view')\" \n                    style=\"padding: 4px 8px; font-size: 12px; border: 1px solid #ddd; background: white; border-radius: 4px; cursor: pointer;\">\n              詳細\n            </button>\n            ${!notification.既読フラグ ? `\n              <button onclick=\"handleApprovalAction('${notification.通知ID}', 'markRead')\" \n                      style=\"padding: 4px 8px; font-size: 12px; border: 1px solid #007bff; background: #007bff; color: white; border-radius: 4px; cursor: pointer;\">\n                既読\n              </button>\n            ` : ''}\n          </div>\n        </td>\n      </tr>\n    `;\n  }\n  \n  // 通知一覧を描画\n  function renderNotifications() {\n    if (!tbody) return;\n    \n    const filteredData = applyFilters(currentNotifications);\n    \n    if (filteredData.length === 0) {\n      tbody.innerHTML = `\n        <tr>\n          <td colspan=\"7\" style=\"padding: 20px; text-align: center; color: #666;\">\n            承認案件がありません\n          </td>\n        </tr>\n      `;\n      return;\n    }\n    \n    tbody.innerHTML = filteredData.map(renderNotificationRow).join('');\n    \n    // 未読件数を更新\n    const unreadCount = currentNotifications.filter(n => !n.既読フラグ).length;\n    if (unreadCountEl) {\n      unreadCountEl.textContent = unreadCount;\n    }\n  }\n  \n  // 承認アクション処理\n  window.handleApprovalAction = async function(id, action) {\n    try {\n      if (action === 'view') {\n        // 閲覧権限チェック\n        if (checkApprovalStatusViewPermission) {\n          const permissionResult = checkApprovalStatusViewPermission({\n            申請書類ID: id,\n            ユーザーID: window.currentUser?.ユーザーID\n          });\n          \n          if (!permissionResult || !permissionResult.閲覧可能) {\n            window.aivicNotify.error('この申請書類を閲覧する権限がありません');\n            return;\n          }\n        }\n        \n        // 詳細画面に遷移\n        window.location.href = `/panels/scr-application-detail.html?id=${id}`;\n        \n      } else if (action === 'markRead') {\n        // 既読マーク\n        const result = await window.aivicApi.update('通知履歴', id, {\n          既読フラグ: true,\n          既読日時: new Date().toISOString()\n        });\n        \n        if (result.success) {\n          // データを再読み込み\n          await loadNotifications();\n          window.aivicNotify.success('既読にしました');\n        } else {\n          window.aivicNotify.error('既読処理に失敗しました');\n        }\n      }\n    } catch (error) {\n      console.error('承認アクション処理エラー:', error);\n      window.aivicNotify.error('処理中にエラーが発生しました');\n    }\n  };\n  \n  // 通知データを読み込み\n  async function loadNotifications() {\n    try {\n      // 最新データを取得\n      const [notifications, applications, users, routes] = await Promise.all([\n        window.aivicApi.list('通知履歴'),\n        window.aivicApi.list('申請書類'),\n        window.aivicApi.list('ユーザー'),\n        window.aivicApi.list('処理ルート')\n      ]);\n      \n      // tablesを更新\n      tables[5] = { records: notifications.data || [] };\n      tables[1] = { reco   // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
