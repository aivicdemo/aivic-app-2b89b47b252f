window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let currentPage = 1;\n  const itemsPerPage = 20;\n  let allNotifications = [];\n  let filteredNotifications = [];\n\n  // 緊急度アイコンを取得する関数\n  function getPriorityIcon(priority) {\n    switch(parseInt(priority)) {\n      case 4: return '<span style=\"color: #ff4444; font-size: 14px;\">🚨</span>';\n      case 3: return '<span style=\"color: #ff6a00; font-size: 14px;\">⚡</span>';\n      case 2: return '<span style=\"color: #ffa500; font-size: 14px;\">⚠️</span>';\n      case 1: return '<span style=\"color: #4a90e2; font-size: 14px;\">ℹ️</span>';\n      default: return '<span style=\"color: var(--text-muted); font-size: 14px;\">-</span>';\n    }\n  }\n\n  // 緊急度テキストを取得する関数\n  function getPriorityText(priority) {\n    switch(parseInt(priority)) {\n      case 4: return '緊急';\n      case 3: return '高';\n      case 2: return '中';\n      case 1: return '低';\n      default: return '-';\n    }\n  }\n\n  // 日時フォーマット関数\n  function formatDateTime(dateStr) {\n    if (!dateStr) return '-';\n    const date = new Date(dateStr);\n    return date.toLocaleDateString('ja-JP', {\n      month: '2-digit',\n      day: '2-digit',\n      hour: '2-digit',\n      minute: '2-digit'\n    });\n  }\n\n  // 期限チェック関数\n  function isOverdue(deadline) {\n    if (!deadline) return false;\n    return new Date(deadline) < new Date();\n  }\n\n  // 期限が近いかチェック関数\n  function isNearDeadline(deadline) {\n    if (!deadline) return false;\n    const now = new Date();\n    const deadlineDate = new Date(deadline);\n    const diffHours = (deadlineDate - now) / (1000 * 60 * 60);\n    return diffHours > 0 && diffHours <= 24;\n  }\n\n  // 通知データを構築する関数\n  function buildNotificationData() {\n    const notifications = [];\n    const notificationHistory = tables.find(t => t.tableName === '通知履歴')?.records || [];\n    const applications = tables.find(t => t.tableName === '申請書類')?.records || [];\n    const users = tables.find(t => t.tableName === 'ユーザー')?.records || [];\n    const approvalSteps = tables.find(t => t.tableName === '承認ステップ')?.records || [];\n\n    notificationHistory.forEach(notification => {\n      const application = applications.find(app => app.申請書類ID === notification.申請書類ID);\n      const applicant = users.find(user => user.ユーザーID === (application?.申請者ID));\n      const step = approvalSteps.find(step => step.承認ステップID === notification.承認ステップID);\n      \n      if (application && applicant) {\n        notifications.push({\n          id: notification.通知履歴ID,\n          notificationDate: notification.送信日時 || notification.作成日時,\n          applicationId: application.申請書類ID,\n          applicationTitle: application.申請タイトル,\n          applicantName: applicant.ユーザー名,\n          documentType: application.申請種別,\n          priority: application.緊急フラグ ? 4 : 2,\n          deadline: step?.期限日時,\n          isRead: notification.既読フラグ,\n          notificationType: notification.通知種別\n        });\n      }\n    });\n\n    return notifications.sort((a, b) => new Date(b.notificationDate) - new Date(a.notificationDate));\n  }\n\n  // テーブル再描画関数\n  function renderRows(notifications) {\n    const tbody = container.querySelector('#notification-tbody');\n    const emptyMessage = container.querySelector('#empty-message');\n    \n    if (!notifications || notifications.length === 0) {\n      tbody.innerHTML = '';\n      emptyMessage.style.display = 'block';\n      updatePagination(0);\n      return;\n    }\n\n    emptyMessage.style.display = 'none';\n    \n    const startIndex = (currentPage - 1) * itemsPerPage;\n    const endIndex = startIndex + itemsPerPage;\n    const pageNotifications = notifications.slice(startIndex, endIndex);\n    \n    tbody.innerHTML = pageNotifications.map(notification => {\n      const isOverdueFlag = isOverdue(notification.deadline);\n      const isNearDeadlineFlag = isNearDeadline(notification.deadline);\n      const rowStyle = !notification.isRead ? 'background: rgba(74, 144, 226, 0.05); font-weight: 500;' : '';\n      \n      return `\n        <tr data-id=\"${notification.id}\" style=\"${rowStyle}\">\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">\n            ${formatDateTime(notification.notificationDate)}\n            ${!notification.isRead ? '<span style=\"color: var(--primary); font-size: 10px; margin-left: 4px;\">●</span>' : ''}\n          </td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">\n            <a href=\"#\" class=\"document-link\" data-application-id=\"${notification.applicationId}\" \n               style=\"color: var(--primary); text-decoration: none; cursor: pointer;\">\n              ${notification.applicationTitle || '無題'}\n            </a>\n          </td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">\n            ${notification.applicantName || '-'}\n          </td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">\n            <div style=\"display: flex; align-items: center; gap: 4px;\">\n              ${getPriorityIcon(notification.priority)}\n              <span style=\"color: var(--text);\">${getPriorityText(notification.priority)}</span>\n            </div>\n          </td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">\n            <span style=\"color: ${isOverdueFlag ? '#ff4444' : isNearDeadlineFlag ? '#ff6a00' : 'var(--text)'};\">\n              ${formatDateTime(notification.deadline)}\n              ${isOverdueFlag ? ' <span style=\"font-size: 10px;\">期限超過</span>' : ''}\n              ${isNearDeadlineFlag ? ' <span style=\"font-size: 10px;\">期限間近</span>' : ''}\n            </span>\n          </td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">\n            <button class=\"action-btn secondary mark-read-btn\" data-id=\"${notification.id}\" \n                    style=\"background: transparent; color: var(--text); border: 1px solid rgba(255,255,255,0.18); padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; margin-right: 4px;\"\n                    ${notification.isRead ? 'disabled' : ''}>\n              ${notification.isRead ? '既読' : '既読にする'}\n            </button>\n          </td>\n        </tr>\n      `;\n    }).join('');\n    \n    updatePagination(notifications.length);\n  }\n\n  // ページネーション更新\n  function updatePagination(totalItems) {\n    const totalPages = Math.ceil(totalItems / itemsPerPage);\n    const pageInfo = container.querySelector('#page-info');\n    const btnPrev = container.querySelector('#btn-prev');\n    const btnNext = container.querySelector('#btn-next');\n    \n    pageInfo.textContent = `${currentPage} / ${Math.max(1, totalPages)}`;\n    btnPrev.disabled = currentPage <= 1;\n    btnNext.disabled = currentPage >= totalPages;\n    \n    btnPrev.style.opacity = btnPrev.disabled ? '0.5' : '1';\n    btnNext.style.opacity = btnNext.disabled ? '0.5' : '1';\n  }\n\n  // 未読件数バッジ更新\n  function updateUnreadBadge() {\n    const unreadCount = allNotifications.filter(n => !n.isRead).length;\n    const badge = container.querySelector('#unread-badge');\n    \n    if (unreadCount > 0) {\n      badge.textContent = unreadCount;\n      badge.style.display = 'inline-block';\n    } else {\n      badge.style.display = 'none';\n    }\n  }\n\n  // 遅延警告アラート更新\n  function updateDelayAlert() {\n    const overdueNotifications = allNotifications.filter(n => isOverdue(n.deadline));\n    const nearDeadlineNotifications = allNotifications.filter(n => isNearDeadline(n.deadline));\n    const alertDiv = container.querySelector('#delay-alert');\n    const messageDiv = container.querySelector('#delay-message');\n    \n    if (overdueNotifications.length > 0 || nearDeadlineNotifications.length > 0) {\n      let message = '';\n      if (overdueNotifications.length > 0) {\n        message += `期限超過: ${overdueNotifications.length}件`;\n      }\n      if (nearDeadlineNotifications.length > 0) {\n        if (message) message += ' / ';\n        message += `期限間近: ${nearDeadlineNotifications.length}件`;\n      }\n      messageDiv.textContent = message;\n      alertDiv.style.display = 'block';\n    } else {\n      alertDiv.style.display = 'none';\n    }\n  }\n\n  // 申請者フィルター選択肢を構築\n  function populateApplicantFilter() {\n    const applicantFilter = container.querySelector('#filter-applicant');\n    const users = tables.find(t => t.tableName === 'ユーザー')?.records || [];\n    \n    // 既存の選択肢をクリア（最初の「すべて」以外）\n    while (applicantFilter.children.length > 1) {\n      applicantFilter.removeChild(applicantFilter.lastChild);\n    }\n    \n    // 申請者として使われているユーザーのみを追加\n    const applicantIds = [...new Set(allNotifications.map(n => {\n      const applications = tables.find(t => t.tableName === '申請書類')?.records || [];\n      const app = applications.find(a => a.申請書類ID === n.applicationId);\n      return app?.申請者ID;\n    }).filter(Boolean))];\n    \n    applicantIds.forEach(userId => {\n      const user = users.find(u => u.ユーザーID === userId);\n      if (user) {\n        const option = document.createElement('option');\n        option.value = user.ユーザー名;\n        option.textContent = user.ユーザー名;\n        applicantFilter.appendChild(option);\n      }\n    });\n  }\n\n  // フィルター適用\n  function applyFilters() {\n    const priorityFilter = container.querySelector('#filter-priority').value;\n    const documentTypeFilter = container.querySelector('#filter-document-type').value;\n    const applicantFilter = container.querySelector('#filter-applicant').value;\n    const deadlineFilter = container.querySelector('#filter-deadline').value;\n    \n    filteredNotifications = allNotifications.filter(notification => {\n      // 緊急度フィルター\n      if (priorityFilter && notification.priority.toString() !== priorityFilter) {\n        return false;\n      }\n      \n      // 文書種別フィルター\n      if (documentTypeFilter && notification.documentType !== documentTypeFilter) {\n        return false;\n      }\n      \n      // 申請者フィルター\n      if (applicantFilter && notification.applicantName !== applicantFilter) {\n        return false;\n      }\n      \n      // 期限フィルター\n      if (deadlineFilter) {\n        const now = new Date();\n        const deadline = new Date(notification.deadline);\n        \n        switch (deadlineFilter) {\n          case 'today':\n            if (deadline.toDateString() !== now.toDateString()) return false;\n            break;\n          case 'week':\n            const weekFromNow = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000);\n            if (deadline > weekFromNow) return false;\n            break;\n          case 'month':\n            const monthFromNow = new Date(now.getTime() + 30 * 24 * 60 * 60 * 1000);\n            if (deadline > monthFromNow) return false;\n            break;\n          case 'overdue':\n            if (deadline >= now) return false;\n            break;\n        }\n      }\n      \n      return true;\n    });\n    \n    currentPage = 1;\n    renderRows(filteredNotifications);\n  }\n\n  // データ読み込みとレンダリング\n  async function loadData() {\n    try {\n      // 最新データを取得\n      const notificationHistoryTable = tables.findIndex(t => t.tableName === '通知履歴');\n      if (notificationHistoryTable >= 0) {\n        const latestData = await window.aivicApi.list(notificationHistoryTable);\n        if (latestData) {\n          tables[notificationHistoryTable].records = latestData;\n        }\n      }\n      \n      allNotifications = buildNotificationData();\n      filteredNotifications = [...allNotifications];\n      \n      populateApplicantFilter();\n      renderRows(filteredNotifications);\n      updateUnreadBadge();\n      updateDelayAlert();\n    } catch (error) {\n      console.error('データ読み込みエラー:', error);\n      // 初期データで表示\n      allNotifications = buildNotificationData();\n      filteredNotifications = [...allNotifications];\n      populateApplicantFilter();\n      renderRows(filteredNotifications);\n      updateUnreadBadge();\n      updateDelayAlert();\n    }\n  }\n\n  // 初期データ読み込み\n  loadData();\n\n  // 検索ボタンイベント\n  container.querySelector('#btn-search').addEventListener('click', () => {\n    applyFilters();\n  });\n\n  // フィルタークリアボタンイベント\n  container.querySelector('#btn-clear-filter').addEventListener('click', () => {\n    container.querySelector('#filter-priority').value = '';\n    container.querySelector('#filter-document-type').value = '';\n    container.querySelector('#filter-applicant').value = '';\n    container.querySelector('#filter-deadline').value = '';\n    \n    filteredNotifications = [...allNotifications];\n    currentPage = 1;\n    renderRows(filteredNotifications);\n  });\n\n  // 更新ボタンイベント\n  container.querySelector('#btn-refresh').addEventListener('click', () => {\n    loadData();\n  });\n\n  // ページネーションイベント\n  container.querySelector('#btn-prev').addEventListener('click', () => {\n    if (currentPage > 1) {\n      currentPage--;\n      renderRows(filteredNotifications);\n    }\n  });\n\n  container.querySelector('#btn-next').addEventListener('click', () => {\n    const totalPages = Math.ceil(filteredNotifications.length / itemsPerPage);\n    if (currentPage < totalPages) {\n      currentPage++;\n      renderRows(filteredNotifications);\n    }\n  });\n\n  // イベントデリゲーション\n  container.addEventListener('click', async (e) => {\n    // 申請書類リンククリック\n    const documentLink = e.target.closest('.document-link');\n    if (documentLink) {\n      e.preventDefault();\n      const applicationId = documentLink.dataset.applicationId;\n      if (applicationId) {\n        window.showScreen(\"scr-1779422434952\");\n      }\n      return;\n    }\n\n    // 既読ボタンクリック\n    const markReadBtn = e.target.closest('.mark-read-btn');\n    if (markReadBtn && !markReadBtn.disabled) {\n      const notificationId = markReadBtn.dataset.id;\n      try {\n        const notificationHistoryTable = tables.findIndex(t => t.tableName === '通知履歴');\n        if (notificationHistoryTable >= 0) {\n          await window.aivicApi.update(notificationHistoryTable, notificationId, {\n            既読フラグ: true,\n            既読日時: new Date().toISOString()\n          });\n          \n          // ローカルデータも更新\n          const notification = allNotifications.find(n => n.id === notificationId);\n          if (notification) {\n            notification.isRead = true;\n          }\n          \n          renderRows(filteredNotifications);\n          updateUnreadBadge();\n        }\n      } catch (error) {\n        console.error('既読更新エラー:', error);\n        alert('既読の更新に失敗しました');\n      }\n    }\n  });\n}";

      document.body.appendChild(c);

      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");

    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
