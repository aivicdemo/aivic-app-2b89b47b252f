ding: 6px 10px; font-size: 13px; color: var(--text);\">${step.approverName}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${step.position}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">\n          <span style=\"padding: 2px 6px; border-radius: 4px; font-size: 11px; ${step.required ? 'background: rgba(34, 197, 94, 0.2); color: #22c55e;' : 'background: rgba(156, 163, 175, 0.2); color: #9ca3af;'}\">\n            ${step.required ? '必須' : '任意'}\n          </span>\n        </td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">\n          <span style=\"padding: 2px 6px; border-radius: 4px; font-size: 11px; ${step.proxyAllowed ? 'background: rgba(59, 130, 246, 0.2); color: #3b82f6;' : 'background: rgba(156, 163, 175, 0.2); color: #9ca3af;'}\">\n            ${step.proxyAllowed ? '許可' : '不許可'}\n          </span>\n        </td>\n        <td style=\"padding: 6px 10px; font-size: 13px;\">\n          <button class=\"action-btn secondary delete-step-btn\" data-step-id=\"${step.id}\" style=\"padding: 4px 8px; font-size: 11px;\">削除</button>\n        </td>\n      </tr>\n    `).join('');\n\n    // イベントハンドラーを再アタッチ\n    attachStepEventHandlers();\n  }\n\n  // ステップ関連のイベントハンドラーをアタッチ\n  function attachStepEventHandlers() {\n    // 上移動ボタン\n    container.querySelectorAll('.move-up-btn').forEach(btn => {\n      btn.addEventListener('click', (e) => {\n        const stepId = e.target.dataset.stepId;\n        moveStepUp(stepId);\n      });\n    });\n\n    // 下移動ボタン\n    container.querySelectorAll('.move-down-btn').forEach(btn => {\n      btn.addEventListener('click', (e) => {\n        const stepId = e.target.dataset.stepId;\n        moveStepDown(stepId);\n      });\n    });\n\n    // 削除ボタン\n    container.querySelectorAll('.delete-step-btn').forEach(btn => {\n      btn.addEventListener('click', (e) => {\n        const stepId = e.target.dataset.stepId;\n        deleteStep(stepId);\n      });\n    });\n  }\n\n  // ステップを上に移動\n  function moveStepUp(stepId) {\n    const index = approvalSteps.findIndex(step => step.id === stepId);\n    if (index > 0) {\n      [approvalSteps[index - 1], approvalSteps[index]] = [approvalSteps[index], approvalSteps[index - 1]];\n      renderApprovalSteps();\n    }\n  }\n\n  // ステップを下に移動\n  function moveStepDown(stepId) {\n    const index = approvalSteps.findIndex(step => step.id === stepId);\n    if (index < approvalSteps.length - 1) {\n      [approvalSteps[index], approvalSteps[index + 1]] = [approvalSteps[index + 1], approvalSteps[index]];\n      renderApprovalSteps();\n    }\n  }\n\n  // ステップを削除\n  function deleteStep(stepId) {\n    if (confirm('この承認ステップを削除しますか？')) {\n      approvalSteps = approvalSteps.filter(step => step.id !== stepId);\n      renderApprovalSteps();\n    }\n  }\n\n  // 処理ルートデータ読み込み\n  async function loadRouteData() {\n    try {\n      const routes = await window.aivicApi.list(6); // 処理ルートテーブル\n      const route = routes.find(r => r.処理ルートID === currentRouteId) || routes[0];\n      \n      if (route) {\n        const routeIdInput = container.querySelector('#route-id');\n        const routeNameInput = container.querySelector('[data-testid=\"route-name\"]');\n        const documentTypeSelect = container.querySelector('[data-testid=\"document-type-select\"]');\n        \n        if (routeIdInput) routeIdInput.value = route.処理ルートID || currentRouteId;\n        if (routeNameInput) routeNameInput.value = route.処理ルート名 || '';\n        if (documentTypeSelect) documentTypeSelect.value = route.文書種別 || '';\n\n        // 承認ステップデータを読み込み\n        const steps = await window.aivicApi.list(7); // 承認ステップテーブル\n        approvalSteps = steps.filter(s => s.処理ルートID === currentRouteId).map(s => ({\n          id: s.ステップID,\n          approverName: s.承認者名,\n          position: s.役職,\n          required: s.必須フラグ,\n          proxyAllowed: s.代理承認許可フラグ,\n          order: s.順序\n        })).sort((a, b) => a.order - b.order);\n\n        renderApprovalSteps();\n      }\n    } catch (error) {\n      showError('処理ルートデータの読み込みに失敗しました: ' + error.message);\n    }\n  }\n\n  // 承認者追加モーダルの初期化\n  function initAddApproverModal() {\n    const addButton = container.querySelector('[data-testid=\"add-approver-button\"]');\n    const modal = container.querySelector('#add-approver-modal');\n    const modalAddButton = container.querySelector('[data-testid=\"modal-add-button\"]');\n    const modalCancelButton = container.querySelector('[data-testid=\"modal-cancel-button\"]');\n\n    if (addButton) {\n      addButton.addEventListener('click', () => {\n        if (modal) modal.style.display = 'block';\n      });\n    }\n\n    if (modalAddButton) {\n      modalAddButton.addEventListener('click', () => {\n        addApproverFromModal();\n      });\n    }\n\n    if (modalCancelButton) {\n      modalCancelButton.addEventListener('click', () => {\n        if (modal) modal.style.display = 'none';\n      });\n    }\n  }\n\n  // モーダルから承認者を追加\n  function addApproverFromModal() {\n    const approverSelect = container.querySelector('[data-testid=\"modal-approver-select\"]');\n    const requiredCheckbox = container.querySelector('[data-testid=\"modal-required-checkbox\"]');\n    const proxyCheckbox = container.querySelector('[data-testid=\"modal-proxy-checkbox\"]');\n    const modal = container.querySelector('#add-approver-modal');\n\n    if (!approverSelect || !approverSelect.value) {\n      showError('承認者を選択してください');\n      return;\n    }\n\n    const selectedOption = approverSelect.options[approverSelect.selectedIndex];\n    const [name, position] = selectedOption.text.split(' (');\n    \n    const newStep = {\n      id: 'step-' + Date.now(),\n      approverName: name,\n      position: position ? position.replace(')', '') : '',\n      required: requiredCheckbox ? requiredCheckbox.checked : false,\n      proxyAllowed: proxyCheckbox ? proxyCheckbox.checked : false,\n      order: approvalSteps.length + 1\n    };\n\n    approvalSteps.push(newStep);\n    renderApprovalSteps();\n\n    // モーダルを閉じる\n    if (modal) modal.style.display = 'none';\n    \n    // フォームをリセット\n    if (approverSelect) approverSelect.selectedIndex = 0;\n    if (requiredCheckbox) requiredCheckbox.checked = false;\n    if (proxyCheckbox) proxyCheckbox.checked = false;\n  }\n\n  // 処理ルート更新処理\n  async function updateRoute() {\n    try {\n      const routeIdInput = container.querySelector('#route-id');\n      const routeNameInput = container.querySelector('[data-testid=\"route-name\"]');\n      const documentTypeSelect = container.querySelector('[data-testid=\"document-type-select\"]');\n\n      if (!routeIdInput || !routeNameInput || !documentTypeSelect) {\n        showError('必要な入力項目が見つかりません');\n        return;\n      }\n\n      const routeData = {\n        処理ルートID: routeIdInput.value,\n        処理ルート名: routeNameInput.value,\n        文書種別: documentTypeSelect.value,\n        更新日時: new Date().toISOString()\n      };\n\n      // 業務ロジックを使用して処理ルートを更新\n      if (updateProcessingRoutesByRegulationChange) {\n        const result = updateProcessingRoutesByRegulationChange({\n          routeId: routeData.処理ルートID,\n          routeName: routeData.処理ルート名,\n          documentType: routeData.文書種別,\n          approvalSteps: approvalSteps\n        });\n        \n        if (!result.success) {\n          showError(result.error || '処理ルートの更新に失敗しました');\n          return;\n        }\n      }\n\n      // データベース更新\n      await window.aivicApi.update(6, routeData.処理ルートID, routeData);\n\n      // 承認ステップも更新\n      for (let i = 0; i < approvalSteps.length; i++) {\n        const step = approvalSteps[i];\n        const stepData = {\n          ステップID: step.id,\n          処理ルートID: routeData.処理ルートID,\n          承認者名: step.approverName,\n          役職: step.position,\n          必須フラグ: step.required,\n          代理承認許可フラグ: step.proxyAllowed,\n          順序: i + 1\n        };\n        \n        try {\n          await window.aivicApi.update(7, step.id, stepData);\n        }   // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
