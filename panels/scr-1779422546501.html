/api/document-types');\n      const select = container.querySelector(\"#document-type\");\n      select.innerHTML = '<option value=\"\">選択してください</option>' +\n        types.map(type => `<option value=\"${type.id}\">${type.name}</option>`).join('');\n    } catch (error) {\n      window.aivicNotify.error('文書種別の読み込みに失敗しました');\n    }\n  }\n\n  // 承認者読み込み\n  async function loadApprovers() {\n    try {\n      const approvers = await window.aivicApi.list('/api/approvers');\n      const select = container.querySelector(\"#modal-approver\");\n      if (select) {\n        select.innerHTML = '<option value=\"\">選択してください</option>' +\n          approvers.map(approver => `<option value=\"${approver.id}\">${approver.name}</option>`).join('');\n      }\n    } catch (error) {\n      window.aivicNotify.error('承認者の読み込みに失敗しました');\n    }\n  }\n\n  // 承認ステップテーブル再描画\n  function renderApprovalSteps() {\n    const tbody = container.querySelector(\"#approval-steps-tbody\");\n    if (!tbody) return;\n    \n    tbody.innerHTML = approvalSteps.map((step, index) => `\n      <tr data-step-id=\"${step.id}\">\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">\n          <div style=\"display: flex; align-items: center; gap: 4px;\">\n            ${step.order}\n            <button class=\"move-up-btn\" data-index=\"${index}\" style=\"background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 2px;\" ${index === 0 ? 'disabled' : ''}>↑</button>\n            <button class=\"move-down-btn\" data-index=\"${index}\" style=\"background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 2px;\" ${index === approvalSteps.length - 1 ? 'disabled' : ''}>↓</button>\n          </div>\n        </td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${step.approverName}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">\n          <input type=\"checkbox\" ${step.required ? 'checked' : ''} onchange=\"updateStepRequired('${step.id}', this.checked)\" style=\"accent-color: var(--primary);\">\n        </td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">\n          <input type=\"checkbox\" ${step.proxyAllowed ? 'checked' : ''} onchange=\"updateStepProxy('${step.id}', this.checked)\" style=\"accent-color: var(--primary);\">\n        </td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">\n          <button class=\"delete-step-btn action-btn secondary\" data-step-id=\"${step.id}\" style=\"background: transparent; color: var(--text); border: 1px solid rgba(255,255,255,0.18); padding: 4px 8px; border-radius: 4px; font-size: 12px; cursor: pointer;\">削除</button>\n        </td>\n      </tr>\n    `).join(\"\");\n    \n    // イベントリスナー再設定\n    attachStepEventListeners();\n  }\n\n  // ステップイベントリスナー設定\n  function attachStepEventListeners() {\n    // 移動ボタン\n    container.querySelectorAll('.move-up-btn').forEach(btn => {\n      btn.addEventListener('click', (e) => {\n        const index = parseInt(e.target.dataset.index);\n        moveStep(index, index - 1);\n      });\n    });\n\n    container.querySelectorAll('.move-down-btn').forEach(btn => {\n      btn.addEventListener('click', (e) => {\n        const index = parseInt(e.target.dataset.index);\n        moveStep(index, index + 1);\n      });\n    });\n\n    // 削除ボタン\n    container.querySelectorAll('.delete-step-btn').forEach(btn => {\n      btn.addEventListener('click', (e) => {\n        const stepId = e.target.dataset.stepId;\n        deleteStep(stepId);\n      });\n    });\n  }\n\n  // ステップ移動\n  function moveStep(fromIndex, toIndex) {\n    if (toIndex < 0 || toIndex >= approvalSteps.length) return;\n    \n    const [movedStep] = approvalSteps.splice(fromIndex, 1);\n    approvalSteps.splice(toIndex, 0, movedStep);\n    \n    // 順序更新\n    approvalSteps.forEach((step, index) => {\n      step.order = index + 1;\n    });\n    \n    renderApprovalSteps();\n  }\n\n  // ステップ削除\n  function deleteStep(stepId) {\n    approvalSteps = approvalSteps.filter(step => step.id !== stepId);\n    // 順序更新\n    approvalSteps.forEach((step, index) => {\n      step.order = index + 1;\n    });\n    renderApprovalSteps();\n  }\n\n  // ステップ必須設定更新\n  window.updateStepRequired = function(stepId, required) {\n    const step = approvalSteps.find(s => s.id === stepId);\n    if (step) {\n      step.required = required;\n    }\n  };\n\n  // ステップ代理設定更新\n  window.updateStepProxy = function(stepId, proxyAllowed) {\n    const step = approvalSteps.find(s => s.id === stepId);\n    if (step) {\n      step.proxyAllowed = proxyAllowed;\n    }\n  };\n\n  // エラーメッセージ表示\n  function showError(message) {\n    const errorDiv = container.querySelector(\"#error-message\");\n    if (errorDiv) {\n      errorDiv.textContent = message;\n      errorDiv.style.display = \"block\";\n      setTimeout(() => {\n        errorDiv.style.display = \"none\";\n      }, 5000);\n    }\n  }\n\n  // バリデーション\n  function validateForm() {\n    const routeName = container.querySelector(\"#route-name\").value.trim();\n    const documentType = container.querySelector(\"#document-type\").value;\n    const delayHours = container.querySelector(\"#delay-hours\").value;\n\n    if (!routeName) {\n      showError(\"処理ルート名は必須です\");\n      return false;\n    }\n    \n    if (routeName.length > 100) {\n      showError(\"処理ルート名は100文字以内で入力してください\");\n      return false;\n    }\n\n    if (!documentType) {\n      showError(\"文書種別を選択してください\");\n      return false;\n    }\n\n    if (approvalSteps.length === 0) {\n      showError(\"承認者を設定してください\");\n      return false;\n    }\n\n    const hasRequired = approvalSteps.some(step => step.required);\n    const requiredApproval = container.querySelector(\"#required-approval\").checked;\n    if (requiredApproval && !hasRequired) {\n      showError(\"必須承認者を設定してください\");\n      return false;\n    }\n\n    const delayHoursNum = parseInt(delayHours);\n    if (delayHoursNum < 0) {\n      showError(\"遅延検知時間は正の数値で入力してください\");\n      return false;\n    }\n\n    return true;\n  }\n\n  // 処理ルート更新\n  async function updateRoute() {\n    if (!validateForm()) return;\n\n    try {\n      const routeData = {\n        id: currentRouteId,\n        name: container.querySelector(\"#route-name\").value.trim(),\n        documentType: container.querySelector(\"#document-type\").value,\n        delayHours: parseInt(container.querySelector(\"#delay-hours\").value),\n        subsidyLevel: container.querySelector(\"#subsidy-level\").value,\n        requiredApproval: container.querySelector(\"#required-approval\").checked,\n        proxyApproval: container.querySelector(\"#proxy-approval\").checked,\n        approvalSteps: approvalSteps\n      };\n\n      // 業務ロジック呼び出し\n      if (updateProcessingRoutesByRegulationChange) {\n        const validationResult = updateProcessingRoutesByRegulationChange(routeData);\n        if (!validationResult.isValid) {\n          showError(validationResult.message);\n          return;\n        }\n      }\n\n      await window.aivicApi.update(`/api/processing-routes/${currentRouteId}`, routeData);\n      window.aivicNotify.success('処理ルートを更新しました');\n      \n    } catch (error) {\n      window.aivicNotify.error('処理ルートの更新に失敗しました');\n    }\n  }\n\n  // 承認者追加\n  async function addApprover() {\n    const approverId = container.querySelector(\"#modal-approver\").value;\n    const order = parseInt(container.querySelector(\"#modal-order\").value);\n    \n    if (!approverId) {\n      showError(\"承認者を選択してください\");\n      return;\n    }\n\n    if (!order || order < 1) {\n      showError(\"順序は1以上の数値で入力してください\");\n      return;\n    }\n\n    try {\n      const approver = await window.aivicApi.get(`/api/approvers/${approverId}`);\n      \n      const newStep = {\n        id: Date.now().toString(),\n        approverId: approverId,\n        approverName: approver.name,\n        order: order,\n        required: false,\n        proxyAllowed: false\n      };\n\n      // 業務ロジック呼び出し\n      if (determineApprovalHierarchy) {\n        const hierarchyResult = determineApprovalHierarchy({\n          approver: approver,\n          existingSteps: approvalSteps\n        });\n        if (hierarchyResult.authorityLevel) {\n          newStep.authorityLevel = hierarchyResult.authorityLevel;\n        }\n      }\n\n      approvalSteps.push(newStep);\n      approvalSteps.sort((a, b) => a.order - b.order);\n      \n      renderApprovalSteps();\n      \n      // モーダルクリア\n      container.querySelector(\"#modal-approver\").value = '';\n      container.querySelector(\"#modal-order\").value = '';\n      \n      // モーダル閉じる\n      const modal = container.querySelector(\"#add-approver-modal\");\n      if (modal) {\n        modal.style.display = 'none';\n      }\n      \n    } catch (error) {\n      window.aivicNotify.error('承認者の追加に失敗しました');\n    }\n  }\n\n  // イベントリスナー設定\n  function attachEventListeners() {\n    // 更新ボタン\n    const updateBtn = container.querySelector(\"#update-btn\");\n    if (updateBtn) {\n      updateBtn.addEventListener('click', updateRoute);\n    }\n\n    // 承認者追加ボタン\n    const addApproverBtn = container.querySelector(\"#add-approver-btn\");\n    if (addApproverBtn) {\n      addApproverBtn.addEventListener('click', () => {\n        const modal = container.querySelector(\"#add-approver-modal\");\n        if (modal) {\n          modal.style.display = 'block';\n        }\n      });\n    }\n\n    // モーダル追加ボタン\n    const modalAddBtn = container.querySelector(\"#modal-add-btn\");\n    if (modalAddBtn) {\n      modalAddBtn.addEventListener('click', addApprover);\n    }\n\n    // モーダルキャンセルボタン\n    const modalCancelBtn = container.querySelector(\"#modal-cancel-btn\");\n    if (modalCancelBtn) {\n      modalCancelBtn.addEventListener('click', () => {\n        const modal = container.querySelector(\"#add-approver-modal\");\n        if (modal) {\n          modal.style.display = 'none';\n        }\n      });\n    }\n\n    // 検索ボタン\n    const searchBtn = container.querySelector(\"#search-btn\");\n    if (searchBtn) {\n      searchBtn.addEventListener('click', async () => {\n        const routeId = container.querySelector(\"#route-id\").value.trim();\n        if (routeId) {\n          currentRouteId = routeId;\n          await loadRouteData(routeId);\n        }\n      });\n    }\n  }\n\n  // 初期化\n  loadInitialData();\n  attachEventListeners();\n}";

      document.body.appendChild(c);
      return c;
    }

      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");

        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);

      list: async function(tableIndex) {

    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {

    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
