 const modalCancelButton = container.querySelector('[data-testid=\"modal-cancel-button\"]');\n  const sendNotificationButton = container.querySelector('[data-testid=\"send-notification-button\"]');\n  const notifyApplicantCheckbox = container.querySelector('[data-testid=\"notify-applicant\"]');\n  const notifyCurrentApproverCheckbox = container.querySelector('[data-testid=\"notify-current-approver\"]');\n\n  // 初期化処理\n  async function initialize() {\n    try {\n      // 申請書類データの読み込み\n      const applications = await window.aivicApi.list('applications');\n      populateApplicationSelect(applications);\n\n      // 処理ルートデータの読み込み\n      const routes = await window.aivicApi.list('routes');\n      populateRouteSelect(routes);\n\n    } catch (error) {\n      console.error('初期化エラー:', error);\n      showError('データの読み込みに失敗しました');\n    }\n  }\n\n  // 申請書類選択肢の設定\n  function populateApplicationSelect(applications) {\n    if (!applicationSelect) return;\n    \n    applicationSelect.innerHTML = '<option value=\"\">申請書類を選択してください</option>';\n    applications.forEach(app => {\n      const option = document.createElement('option');\n      option.value = app.申請書類名 || app.id;\n      option.textContent = app.申請書類名 || `申請${app.id}`;\n      applicationSelect.appendChild(option);\n    });\n  }\n\n  // 処理ルート選択肢の設定\n  function populateRouteSelect(routes) {\n    if (!newRouteSelect) return;\n    \n    newRouteSelect.innerHTML = '<option value=\"\">新しい処理ルートを選択してください</option>';\n    routes.forEach(route => {\n      const option = document.createElement('option');\n      option.value = route.ルート名 || route.id;\n      option.textContent = route.ルート名 || `ルート${route.id}`;\n      newRouteSelect.appendChild(option);\n    });\n  }\n\n  // 承認ステップ再描画関数\n  function renderApprovalSteps(steps) {\n    if (!approvalStepsTbody) return;\n    \n    if (!steps || steps.length === 0) {\n      approvalStepsTbody.innerHTML = '<tr><td colspan=\"4\" style=\"text-align: center; color: var(--text-muted); padding: 20px;\">承認ステップがありません</td></tr>';\n      return;\n    }\n\n    approvalStepsTbody.innerHTML = steps.map(step => {\n      const user = tables[USER_TABLE].records.find(u => u.id === step.承認者ID) || {};\n      const statusBadge = getStatusBadge(step.承認状態);\n      \n      return `\n        <tr data-id=\"${step.id}\">\n          <td>${step.ステップ番号}</td>\n          <td>${user.ユーザー名 || '未設定'}</td>\n          <td>${statusBadge}</td>\n          <td>\n            <button class=\"action-btn secondary change-approver-btn\" data-testid=\"change-approver-button\" data-step-id=\"${step.id}\">承認者変更</button>\n          </td>\n        </tr>\n      `;\n    }).join('');\n\n    // 承認者変更ボタンのイベントハンドラー設定\n    container.querySelectorAll('.change-approver-btn').forEach(btn => {\n      btn.addEventListener('click', handleApproverChange);\n    });\n  }\n\n  // ステータスバッジ生成\n  function getStatusBadge(status) {\n    const statusMap = {\n      '未承認': { bg: 'rgba(156, 163, 175, 0.2)', color: 'var(--text)' },\n      '承認済': { bg: 'rgba(34, 197, 94, 0.2)', color: '#22c55e' },\n      '否認': { bg: 'rgba(239, 68, 68, 0.2)', color: '#ef4444' },\n      '保留': { bg: 'rgba(251, 191, 36, 0.2)', color: '#fbbf24' }\n    };\n    \n    const style = statusMap[status] || statusMap['未承認'];\n    return `<span style=\"background: ${style.bg}; color: ${style.color}; padding: 2px 8px; border-radius: 4px; font-size: 11px;\">${status}</span>`;\n  }\n\n  // エラー表示\n  function showError(message) {\n    if (errorText) errorText.textContent = message;\n    if (errorMessage) errorMessage.style.display = 'block';\n    setTimeout(() => {\n      if (errorMessage) errorMessage.style.display = 'none';\n    }, 5000);\n  }\n\n  // 確認モーダル表示\n  function showConfirmationModal(content) {\n    if (confirmationContent) confirmationContent.innerHTML = content;\n    if (confirmationModal) confirmationModal.style.display = 'block';\n  }\n\n  // 確認モーダル非表示\n  function hideConfirmationModal() {\n    if (confirmationModal) confirmationModal.style.display = 'none';\n  }\n\n  // 申請書類選択時の処理\n  async function handleApplicationSelect() {\n    const applicationId = applicationSelect?.value;\n    if (!applicationId) {\n      currentApplicationData = null;\n      currentApprovalSteps = [];\n      renderApprovalSteps([]);\n      if (currentRouteDisplay) currentRouteDisplay.textContent = '';\n      return;\n    }\n\n    try {\n      // 申請データと承認ステップの取得\n      const applicationData = await window.aivicApi.list('applications', { filter: { id: applicationId } });\n      const approvalSteps = await window.aivicApi.list('approval_steps', { filter: { 申請ID: applicationId } });\n      \n      currentApplicationData = applicationData[0];\n      currentApprovalSteps = approvalSteps;\n      \n      renderApprovalSteps(approvalSteps);\n      \n      if (currentRouteDisplay) {\n        currentRouteDisplay.textContent = currentApplicationData?.現在のルート || '未設定';\n      }\n      \n    } catch (error) {\n      console.error('申請データ取得エラー:', error);\n      showError('申請データの取得に失敗しました');\n    }\n  }\n\n  // ルート更新ボタン処理\n  function handleRouteUpdate() {\n    if (!applicationSelect?.value) {\n      showError('申請書類を選択してください');\n      return;\n    }\n    \n    // ルート更新画面への遷移\n    window.showScreen('scr-1779422546501');\n  }\n\n  // 承認者変更処理\n  async function handleApproverChange(event) {\n    const stepId = event.target.dataset.stepId;\n    \n    try {\n      if (handleApproverAbsenceSubstitution) {\n        const result = await handleApproverAbsenceSubstitution({\n          stepId: stepId,\n          currentApprover: currentApprovalSteps.find(s => s.id === stepId)?.承認者ID\n        });\n        \n        if (result.success) {\n          // 承認ステップの再読み込み\n          await handleApplicationSelect();\n          window.aivicNotify.success('承認者が変更されました');\n        } else {\n          showError(result.error || '承認者変更に失敗しました');\n        }\n      }\n    } catch (error) {\n      console.error('承認者変更エラー:', error);\n      showError('承認者変更に失敗しました');\n    }\n  }\n\n  // 処理ルート変更確認\n  function handleRouteChangeConfirm() {\n    if (!applicationSelect?.value) {\n      showError('申請書類を選択してください');\n      return;\n    }\n    \n    if (!newRouteSelect?.value) {\n      showError('新しい処理ルートを選択してください');\n      return;\n    }\n    \n    if (!changeReasonTextarea?.value.trim()) {\n      showError('変更理由を入力してください');\n      return;\n    }\n\n    const confirmContent = `\n      <h3>変更内容確認</h3>\n      <p><strong>申請書類:</strong> ${applicationSelect.value}</p>\n      <p><strong>新しいルート:</strong> ${newRouteSelect.value}</p>\n      <p><strong>変更理由:</strong> ${changeReasonTextarea.value}</p>\n    `;\n    \n    showConfirmationModal(confirmContent);\n  }\n\n  // 処理ルート変更実行\n  async function handleRouteChangeExecute() {\n    if (!newRouteSelect?.value) {\n      showError('新しい処理ルートを選択してください');\n      return;\n    }\n    \n    if (!changeReasonTextarea?.value.trim()) {\n      showError('変更理由を入力してください');\n      return;\n    }\n\n    try {\n      if (updateProcessingRoutesByRegulationChange) {\n        const result = await updateProcessingRoutesByRegulationChange({\n          applicationId: currentApplicationData?.id,\n          newRoute: newRouteSelect.value,\n          reason: changeReasonTextarea.value\n        });\n        \n        if (result.success) {\n          hideConfirmationModal();\n          window.aivicNotify.success('処理ルートが変更されました');\n          // フォームリセット\n          if (changeReasonTextarea) changeReasonTextarea.value = '';\n          if (newRouteSelect) newRouteSelect.value = '';\n          await handleApplicationSelect();\n        } else {\n          showError(result.error || '処理ルート変更に失敗しました');\n        }\n      }\n    } catch (error) {\n      console.error('処理ルート変更エラー:', error);\n      showError('処理ルート変更に失敗しました');\n    }\n  }\n\n  // 通知送信処理\n  async function handleSendNotification() {\n    const message = notificationMessage?.value?.trim();\n    if (!message) {\n      showError('通知メッセージを入力してください');\n      return;\n    }\n\n    try {\n      const notificationTargets = [];\n      \n      if (notifyApplicantCheckbox?.checked) {\n        notificationTargets.push('applicant');\n      }\n      \n      if (notifyCurrentApproverCheckbox?.checked) {\n        notificationTargets.push('current_approver');\n      }\n\n      if (determineNotificationTargets) {\n        const result = await determineNotificationTargets({\n          applicationId: currentApplicationData?.id,\n          message: message,\n          targets: notificationTargets\n        });\n        \n        if (result.success) {\n          showConfirmationModal(`\n            <h3>変更内容確認</h3>\n            <p>通知を送信しました</p>\n            <p><strong>対象者:</strong> ${notificationTargets.join(', ')}</p>\n            <p><strong>メッセージ:</strong> ${message}</p>\n          `);\n        } else {\n          showError(result.error || '通知送信に失敗しました');\n        }\n      }\n    } catch (error) {\n      console.error('通知送信エラー:', error);\n      showError('通知送信に失敗しました');\n    }\n  }\n\n  // モーダルキャンセル処理\n  function handleModalCancel() {\n    hideConfirmationModal();\n    // フォームリセット\n    if (changeReasonTextarea) changeReasonTextarea.value = '';\n    if (newRouteSelect) newRouteSelect.value = '';\n    if (notificationMessage) notificationMessage.value = '';\n  }\n\n  // 文字数カウント更新\n  function updateCharCount(textarea, countElement, maxLength = 500) {\n    if (!textarea || !countElement) return;\n    \n    const currentLength = textarea.value.length;\n    countElement.textContent = `${currentLength}/${maxLength}`;\n    \n    if (currentLength > maxLength) {\n      countElement.style.color = '#ef4444';\n    } else {\n      countElement.style.color = 'var(--text-muted)';\n    }\n  }\n\n  // イベントハンドラーの設定\n  if (applicationSelect) {\n    applicationSelect.addEventListener('change', handleApplicationSelect);\n  }\n\n  if (routeUpdateButton) {\n    routeUpdateButton.addEventListener('click', handleRouteUpdate);\n  }\n\n  if (confirmButton) {\n    confirmButton.addEventListener('click', handleRouteChangeConfirm);\n  }\n\n  if (executeButton) {\n    executeButton.addEventListener('click', handleRouteChangeExecute);\n  }\n\n  if (modalExecuteButton) {\n    modalExecuteButton.addEventListener('click', handleRouteChangeExecute);\n  }\n\n  if (modalCancelButton) {\n    modalCancelButton.addEventListener('click', handleModalCancel);\n  }\n\n  if (sendNotificationButton) {\n    sendNotificationButton.addEventListener('click', handleSendNotification);\n  }\n\n  if (changeReasonTextarea && reasonCharCount) {\n    changeReasonTextarea.addEventListener('input', () => {\n      updateCharCount(changeReasonTextarea, reasonCharCount);\n    });\n  }\n\n  if (notificationMessage && messageCharCount) {\n    notificationMessage.addEventListener('input', () => {\n      updateCharCount(notificationMessage, messageCharCount);\n    });\n  }\n\n  // 初期化実行\n  initialize();\n}";

      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
