ntent = count;\n    if (count > 1000) {\n      notificationMessageTextarea.value = notificationMessageTextarea.value.substring(0, 1000);\n      messageCharCount.textContent = 1000;\n    }\n  });\n\n  // 申請書類データの読み込み\n  async function loadApplications() {\n    const applications = await window.aivicApi.list(tables.indexOf(applicationTable));\n    if (applications) {\n      applicationSelect.innerHTML = '<option value=\"\">選択してください</option>';\n      applications.forEach(app => {\n        const option = document.createElement('option');\n        option.value = app.id;\n        option.textContent = `${app.申請種別} - ${app.申請タイトル}`;\n        applicationSelect.appendChild(option);\n      });\n    }\n  }\n\n  // 処理ルートデータの読み込み\n  async function loadRoutes() {\n    const flows = await window.aivicApi.list(tables.indexOf(approvalFlowTable));\n    if (flows) {\n      newRouteSelect.innerHTML = '<option value=\"\">選択してください</option>';\n      flows.forEach(flow => {\n        const option = document.createElement('option');\n        option.value = flow.id;\n        option.textContent = flow.承認フロー名;\n        newRouteSelect.appendChild(option);\n      });\n    }\n  }\n\n  // 現在の処理ルート表示\n  async function displayCurrentRoute(applicationId) {\n    const routes = await window.aivicApi.list(tables.indexOf(routeTable));\n    const applications = await window.aivicApi.list(tables.indexOf(applicationTable));\n    \n    if (routes && applications) {\n      const route = routes.find(r => r.申請書類ID === applicationId);\n      const application = applications.find(a => a.id === applicationId);\n      \n      if (route && application) {\n        currentRoute = route;\n        currentApplication = application;\n        \n        currentRouteDisplay.innerHTML = `\n          <div style=\"font-size: 12px; color: var(--text);\">\n            <div><strong>申請種別:</strong> ${application.申請種別}</div>\n            <div><strong>申請者:</strong> ${application.申請者ID}</div>\n            <div><strong>現在の状況:</strong> ${route.処理状況}</div>\n            <div><strong>現在のステップ:</strong> ${route.現在ステップ番号}</div>\n          </div>\n        `;\n        \n        await loadApprovalSteps(applicationId);\n      } else {\n        currentRouteDisplay.innerHTML = '<div class=\"muted\" style=\"font-size: 12px;\">処理ルート情報が見つかりません</div>';\n      }\n    }\n  }\n\n  // 承認ステップ一覧の表示\n  async function loadApprovalSteps(applicationId) {\n    const steps = await window.aivicApi.list(tables.indexOf(approvalStepTable));\n    const users = await window.aivicApi.list(tables.indexOf(userTable));\n    \n    if (steps && users) {\n      const appSteps = steps.filter(s => s.申請書類ID === applicationId);\n      \n      if (appSteps.length > 0) {\n        approvalStepsTbody.innerHTML = appSteps.map(step => {\n          const approver = users.find(u => u.id === step.承認者ID);\n          const approverName = approver ? approver.ユーザー名 : '不明';\n          \n          return `\n            <tr>\n              <td style=\"padding: 6px 10px; font-size: 12px;\">${step.ステップ番号}</td>\n              <td style=\"padding: 6px 10px; font-size: 12px;\">${approverName}</td>\n              <td style=\"padding: 6px 10px; font-size: 12px;\">${step.承認状態}</td>\n              <td style=\"padding: 6px 10px; font-size: 12px;\">${step.期限日時 ? new Date(step.期限日時).toLocaleDateString() : '-'}</td>\n            </tr>\n          `;\n        }).join('');\n      } else {\n        approvalStepsTbody.innerHTML = '<tr><td colspan=\"4\" style=\"padding: 12px; text-align: center; color: var(--text-muted); font-size: 12px;\">承認ステップが見つかりません</td></tr>';\n      }\n    }\n  }\n\n  // エラー表示\n  function showError(message) {\n    errorMessage.textContent = message;\n    errorMessage.style.display = 'block';\n    setTimeout(() => {\n      errorMessage.style.display = 'none';\n    }, 5000);\n  }\n\n  // バリデーション\n  function validateForm() {\n    if (!applicationSelect.value) {\n      showError('申請書類を選択してください');\n      return false;\n    }\n    \n    if (!newRouteSelect.value) {\n      showError('新しい処理ルートを選択してください');\n      return false;\n    }\n    \n    if (!changeReasonTextarea.value.trim()) {\n      showError('変更理由を入力してください');\n      return false;\n    }\n    \n    // 同一処理ルート選択チェック\n    if (currentRoute && currentRoute.承認フロー定義ID === newRouteSelect.value) {\n      if (!confirm('現在と同じ処理ルートが選択されています。変更する必要がありますか？')) {\n        return false;\n      }\n    }\n    \n    return true;\n  }\n\n  // 通知バリデーション\n  function validateNotification() {\n    const selectedTargets = container.querySelectorAll('input[name=\"notify-target\"]:checked');\n    if (selectedTargets.length === 0) {\n      showError('通知対象者を選択してください');\n      return false;\n    }\n    \n    if (!notificationMessageTextarea.value.trim()) {\n      showError('通知メッセージを入力してください');\n      return false;\n    }\n    \n    return true;\n  }\n\n  // イベントリスナー\n  applicationSelect.addEventListener('change', (e) => {\n    if (e.target.value) {\n      displayCurrentRoute(e.target.value);\n    } else {\n      currentRouteDisplay.innerHTML = '<div class=\"muted\" style=\"font-size: 12px;\">申請書類を選択してください</div>';\n      approvalStepsTbody.innerHTML = '<tr><td colspan=\"4\" style=\"padding: 12px; text-align: center; color: var(--text-muted); font-size: 12px;\">申請書類を選択してください</td></tr>';\n    }\n  });\n\n  // 全選択・全解除\n  container.querySelector('#select-all-btn').addEventListener('click', () => {\n    container.querySelectorAll('input[name=\"notify-target\"]').forEach(cb => cb.checked = true);\n  });\n\n  container.querySelector('#deselect-all-btn').addEventListener('click', () => {\n    container.querySelectorAll('input[name=\"notify-target\"]').forEach(cb => cb.checked = false);\n  });\n\n  // 承認者変更ボタン\n  container.querySelector('#change-approver-btn').addEventListener('click', () => {\n    if (!currentApplication) {\n      showError('申請書類を選択してください');\n      return;\n    }\n    alert('承認者変更機能は別画面で実装されます');\n  });\n\n  // 変更内容確認ボタン\n  container.querySelector('#confirm-btn').addEventListener('click', () => {\n    if (!validateForm()) return;\n    \n    const selectedRoute = newRouteSelect.options[newRouteSelect.selectedIndex].text;\n    const reason = changeReasonTextarea.value;\n    \n    confirmationContent.innerHTML = `\n      <div style=\"margin-bottom: 8px;\"><strong>申請書類:</strong> ${applicationSelect.options[applicationSelect.selectedIndex].text}</div>\n      <div style=\"margin-bottom: 8px;\"><strong>新しい処理ルート:</strong> ${selectedRoute}</div>\n      <div style=\"margin-bottom: 8px;\"><strong>変更理由:</strong> ${reason}</div>\n    `;\n    \n    confirmationModal.style.display = 'flex';\n  });\n\n  // 処理ルート変更実行ボタン\n  container.querySelector('#execute-btn').addEventListener('click', async () => {\n    if (!validateForm()) return;\n    \n    try {\n      // 処理ルートの更新\n      const updated = await window.aivicApi.update(tables.indexOf(routeTable), currentRoute.id, {\n        承認フロー定義ID: newRouteSelect.value,\n        処理状況: '承認待ち',\n        更新日時: new Date().toISOString(),\n        更新者ID: 'current-user-id'\n      });\n      \n      if (updated) {\n        alert('処理ルートが正常に変更されました');\n        // フォームリセット\n        changeReasonTextarea.value = '';\n        reasonCharCount.textContent = '0';\n        displayCurrentRoute(applicationSelect.value);\n      }\n    } catch (error) {\n      showError('処理ルートの変更に失敗しました');\n    }\n  });\n\n  // 通知送信ボタン\n  container.querySelector('#send-notification-btn').addEventListener('click', async () => {\n    if (!validateNotification()) return;\n    \n    try {\n      const selectedTargets = Array.from(container.querySelectorAll('input[name=\"notify-target\"]:checked'));\n      const message = notificationMessageTextarea.value;\n      \n      // 各対象者に通知を送信\n      for (const target of selectedTargets) {\n        await window.aivicApi.save(tables.indexOf(notificationTable), {\n          申請書類ID: applicationSelect.value,\n          通知対象ユーザーID: target.value,\n          通知種別: '処理ルート変更',\n          通知タイトル: '処理ルート変更のお知らせ',\n          通知内容: message,\n          送信方法: 'システム内通知',\n          送信状態: '送信完了',\n          送信日時: new Date().toISOString(),\n          既読フラグ: false,\n          再送回数: 0,\n          作成日時: new Date().toISOString(),\n          作成者ID: 'current-user-id'\n        });\n      }\n      \n      alert('通知が正常に送信されました');\n      // フォームリセット\n      notificationMessageTextarea.value = '';\n      messageCharCount.textContent = '0';\n      container.querySelectorAll('input[name=\"notify-target\"]').forEach(cb => cb.checked = false);\n    } catch (error) {\n      showError('通知の送信に失敗しました');\n    }\n  });\n\n  // ルート更新ボタン（画面遷移）\n  container.querySelector('#route-update-btn').addEventListener('click', () => {\n    window.showScreen(\"scr-1779422546501\");\n  });\n\n  // キャンセルボタン\n  container.querySelector('#cancel-btn').addEventListener('click', () => {\n    if (confirm('入力内容がクリアされますが、よろしいですか？')) {\n      // フォームリセット\n      applicationSelect.value = '';\n      newRouteSelect.value = '';\n      changeReasonTextarea.value = '';\n      notificationMessageTextarea.value = '';\n      reasonCharCount.textContent = '0';\n      messageCharCount.textContent = '0';\n      currentRouteDisplay.innerHTML = '<div class=\"muted\" style=\"font-size: 12px;\">申請書類を選択してください</div>';\n      approvalStepsTbody.innerHTML = '<tr><td colspan=\"4\" style=\"padding: 12px; text-align: center; color: var(--text-muted); font-size: 12px;\">申請書類を選択してください</td></tr>';\n      container.querySelectorAll('input[name=\"notify-target\"]').forEach(cb => cb.checked = false);\n      currentApplication = null;\n      currentRoute = null;\n    }\n  });\n\n  // モーダルのイベントリスナー\n  container.querySelector('#modal-cancel-btn').addEventListener('click', () => {\n    confirmationModal.style.display = 'none';\n  });\n\n  container.querySelector('#modal-execute-btn').addEventListener('click', async () => {\n    confirmationModal.style.display = 'none';\n    \n    try {\n      // 処理ルートの更新\n      const updated = await window.aivicApi.update(tables.indexOf(routeTable), currentRoute.id, {\n        承認フロー定義ID: newRouteSelect.value,\n        処理状況: '承認待ち',\n        更新日時: new Date().toISOString(),\n        更新者ID: 'current-user-id'\n      });\n      \n      if (updated) {\n        alert('処理ルートが正常に変更されました');\n        displayCurrentRoute(applicationSelect.value);\n      }\n    } catch (error) {\n      showError('処理ルートの変更に失敗しました');\n    }\n  });\n\n  // 初期データ読み込み\n  loadApplications();\n  loadRoutes();\n}";

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    // **content 要素の hidden 強制除去（2026-05-24 Playwright 大量 fail 対応）**:
    // AI が生成した panel HTML には class="hidden" / hidden 属性 / style="display:none"
    // が content 要素（#xxx-tbody / #xxx-list / [data-testid="error-message"] 等）に付いて
    // いることがある。それを Playwright が toBeVisible() で待ち続けて timeout する事故が頻発。
    //
    // ポリシー: panel コンテナ配下の全要素について以下を実行:
    //   - class="hidden" / display:none / hidden 属性を **content 要素では除去**
    //   - **modal 系**（.modal, .modal-backdrop, [role="dialog"], [data-modal] 等）は除外
    //     （これらは仕様上初期非表示が正しい）
    var isModalLike = function(el) {
      if (!el || !el.classList) return false;
      var cn = String(el.className || "");
      if (/modal|dialog|overlay|popup|dropdown|tooltip/i.test(cn)) return true;
      var role = el.getAttribute && el.getAttribute("role");
      if (role === "dialog" || role === "alertdialog" || role === "tooltip" || role === "menu") return true;
      if (el.hasAttribute && (el.hasAttribute("data-modal") || el.hasAttribute("data-dropdown") || el.hasAttribute("data-popup"))) return true;
      return false;
    };
    var unhideContentElements = function(root) {
      var all = root.querySelectorAll('.hidden, [hidden], [style*="display:none"], [style*="display: none"]');
      for (var k = 0; k < all.length; k++) {
        var el = all[k];
        // modal 系は触らない
        if (isModalLike(el)) continue;
        // parent chain で modal 内なら触らない
        var p = el.parentElement;
        var insideModal = false;
        while (p && p !== root) {
          if (isModalLike(p)) { insideModal = true; break; }
          p = p.parentElement;
        }
        if (insideModal) continue;
        // 除去
        el.classList.remove('hidden');
        el.removeAttribute('hidden');
        if (el.style && el.style.display === 'none') el.style.display = '';
      }
    };
    try { unhideContentElements(container); } catch (e) { console.warn('[aivic] unhideContent failed:', e); }

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
