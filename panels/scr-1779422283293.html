<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ハイブリッド申請承認システム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-main: #ffffff;
            --bg-card: #f8fafc;
            --bg-sidebar: #f1f5f9;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-muted: #64748b;
            --text-light: #94a3b8;
            --top-bar-bg: #ffffff;
            --top-bar-border: #e2e8f0;
            --success: #059669;
            --warning: #d97706;
            --danger: #dc2626;
            --radius: 8px;
            --radius-sm: 6px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 13px;
            line-height: 1.4;
            color: var(--text);
            background: var(--bg-main);
        }

        .app-layout {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--top-bar-bg);
        }

        .logo {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }

        .nav-section {
            padding: 12px 0;
        }

        .nav-section-title {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0 16px 8px;
        }

        .nav-item {
            display: block;
            padding: 6px 16px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .nav-item:hover {
            background: rgba(59, 130, 246, 0.08);
            color: var(--primary);
        }

        .nav-item.aivic-active {
            background: rgba(59, 130, 246, 0.12);
            color: var(--primary);
            font-weight: 500;
            border-right: 2px solid var(--primary);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            height: 52px;
            background: var(--top-bar-bg);
            border-bottom: 1px solid var(--top-bar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .breadcrumb {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 500;
        }

        .logout-link {
            font-size: 12px;
            color: var(--text-muted);
            text-decoration: none;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            transition: background 0.15s ease;
        }

        .logout-link:hover {
            background: var(--bg-card);
        }

        .content-area {
            flex: 1;
            overflow: auto;
            padding: 16px 20px;
        }

        .panel-container {
            height: 100%;
            background: var(--bg-main);
        }

        .status-indicator {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .status-pending { background: var(--warning); }
        .status-approved { background: var(--success); }
        .status-rejected { background: var(--danger); }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .badge-primary {
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary);
        }

        .badge-success {
            background: rgba(5, 150, 105, 0.1);
            color: var(--success);
        }

        .badge-warning {
            background: rgba(217, 119, 6, 0.1);
            color: var(--warning);
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            margin-bottom: 12px;
        }

        .card-header {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
            background: var(--bg-main);
            color: var(--text);
        }

        .btn:hover {
            background: var(--bg-card);
            border-color: var(--primary);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .table th,
        .table td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .table th {
            font-weight: 500;
            color: var(--text-muted);
            background: var(--bg-card);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .table tbody tr:hover {
            background: rgba(59, 130, 246, 0.02);
        }

        .loading-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--text-light);
            font-size: 12px;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            
            .content-area {
                padding: 12px 16px;
            }
        }
    </style>

equired":false,"description":"設定に関する補足説明"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"補助金関連度マスタ","purpose":"申請書類と補助金制度の関連度を管理し、適切な承認フローや処理ルートの決定に使用するマスタテーブル","columns":[{"name":"補助金関連度ID","type":"uuid","required":true,"description":"補助金関連度の一意識別子（主キー）"},{"name":"補助金関連度コード","type":"varchar(100)","required":true,"description":"補助金関連度の業務コード（表示・検索用）"},{"name":"補助金関連度名","type":"varchar(100)","required":true,"description":"補助金関連度の名称"},{"name":"関連度レベル","type":"integer","required":true,"description":"関連度の数値レベル（1:低、2:中、3:高など）"},{"name":"説明","type":"text","required":false,"description":"補助金関連度の詳細説明"},{"name":"表示順","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"マスタデータの有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]}];

window.AIVIC_PAGE_INIT_JS = "js\nfunction(container, apiUrl, tables) {\n  // 業務ロジックのインポート\n  const { \n    validateApplicationInput,\n    determineApprovalHierarchy,\n    processUrgentApplicationPriority,\n    handleApproverAbsenceSubstitution,\n    determineNotificationTargets,\n    updateProcessingRoutesByRegulationChange,\n    ensureBusinessContinuityDuringSystemUpdate\n  } = window.businessLogic || {};\n\n  // テーブルインデックスの定義\n  const APPLICATION_TABLE = 1; // 申請書類\n  const APPROVAL_FLOW_TABLE = 3; // 承認フロー定義\n  const APPROVAL_STEP_TABLE = 4; // 承認ステップ\n  const PROCESSING_ROUTE_TABLE = 6; // 処理ルート\n  const USER_TABLE = 0; // ユーザー\n\n  let currentApplicationId = null;\n  let currentRouteData = null;\n\n  // 承認ステップテーブル再描画関数\n  function renderApprovalSteps(steps) {\n    const tbody = container.querySelector(\"#approval-steps-tbody\");\n    if (!tbody) return;\n    \n    if (!steps || steps.length === 0) {\n      tbody.innerHTML = '<tr><td colspan=\"5\" style=\"padding: 12px; text-align: center; color: var(--text-muted); font-size: 12px;\">承認ステップがありません</td></tr>';\n      return;\n    }\n\n    tbody.innerHTML = steps.map(step => `\n      <tr data-id=\"${step.id}\">\n        <td style=\"padding: 6px 10px; font-size: 12px;\">${step.ステップ番号 || step.承認段階 || '-'}</td>\n        <td style=\"padding: 6px 10px; font-size: 12px;\">${step.承認者名 || step.承認者ID || '-'}</td>\n        <td style=\"padding: 6px 10px; font-size: 12px;\">${step.承認者役職 || step.役職 || '-'}</td>\n        <td style=\"padding: 6px 10px; font-size: 12px;\">${step.期限日時 ? new Date(step.期限日時).toLocaleDateString() : '-'}</td>\n        <td style=\"padding: 6px 10px; font-size: 12px;\">\n          <span style=\"padding: 2px 6px; border-radius: 4px; font-size: 11px; background: ${getStatusColor(step.承認状態)};\">\n            ${step.承認状態 || '未承認'}\n          </span>\n        </td>\n      </tr>\n    `).join(\"\");\n  }\n\n  // ステータス色取得\n  function getStatusColor(status) {\n    switch(status) {\n      case '承認済': return 'rgba(34, 197, 94, 0.2)';\n      case '否認': return 'rgba(239, 68, 68, 0.2)';\n      case '保留': return 'rgba(245, 158, 11, 0.2)';\n      default: return 'rgba(156, 163, 175, 0.2)';\n    }\n  }\n\n  // 申請書類選択時の処理\n  async function handleApplicationSelect(applicationId) {\n    const statusInput = container.querySelector(\"#input-status\");\n    const currentRouteElement = container.querySelector(\"#current-route\");\n    \n    if (!applicationId) {\n      if (statusInput) statusInput.value = \"\";\n      if (currentRouteElement) currentRouteElement.textContent = \"申請書類を選択してください\";\n      renderApprovalSteps([]);\n      return;\n    }\n\n    currentApplicationId = applicationId;\n\n    try {\n      // 申請書類の詳細を取得\n      const applications = await window.aivicApi.list(APPLICATION_TABLE);\n      const application = applications.find(app => app.id === applicationId);\n      \n      if (application) {\n        if (statusInput) statusInput.value = application.承認状態 || '申請中';\n        \n        // 現在の処理ルートを表示\n        const routes = await window.aivicApi.list(PROCESSING_ROUTE_TABLE);\n        const currentRoute = routes.find(route => route.申請書類ID === applicationId);\n        \n        if (currentRoute) {\n          currentRouteData = currentRoute;\n          if (currentRouteElement) {\n            currentRouteElement.textContent = \n              `${currentRoute.処理状況} - ステップ${currentRoute.現在ステップ番号} (${currentRoute.現在承認者ID || '未設定'})`;\n          }\n        } else {\n          if (currentRouteElement) currentRouteElement.textContent = \"処理ルートが設定されていません\";\n        }\n\n        // 承認ステップを取得・表示\n        const steps = await window.aivicApi.list(APPROVAL_STEP_TABLE);\n        const applicationSteps = steps.filter(step => step.申請書類ID === applicationId);\n        renderApprovalSteps(applicationSteps);\n      }\n    } catch (error) {\n      console.error('申請書類選択エラー:', error);\n      window.aivicNotify?.error('申請書類の取得に失敗しました');\n    }\n  }\n\n  // 承認者変更ボタンの処理\n  async function handleChangeApprover() {\n    if (!currentApplicationId) {\n      window.aivicNotify?.error('申請書類を選択してください');\n      return;\n    }\n\n    try {\n      // 承認者変更モーダルを表示\n      const modal = container.querySelector('.change-approver-modal');\n      if (modal) {\n        modal.style.display = 'block';\n        \n        // 新しい処理ルートの選択肢を読み込み\n        const flows = await window.aivicApi.list(APPROVAL_FLOW_TABLE);\n        const routeSelect = container.querySelector('[data-testid=\"new-route-select\"]');\n        if (routeSelect) {\n          routeSelect.innerHTML = '<option value=\"\">選択してください</option>' +\n            flows.map(flow => `<option value=\"${flow.id}\">${flow.フロー名}</option>`).join('');\n        }\n      }\n    } catch (error) {\n      console.error('承認者変更エラー:', error);\n      window.aivicNotify?.error('承認者変更の準備に失敗しました');\n    }\n  }\n\n  // 処理ルート変更確認の処理\n  async function handleConfirmRouteChange() {\n    const newRouteSelect = container.querySelector('[data-testid=\"new-route-select\"]');\n    const changeReasonInput = container.querySelector('[data-testid=\"change-reason\"]');\n    \n    if (!newRouteSelect?.value) {\n      window.aivicNotify?.error('新しい処理ルートを選択してください');\n      return;\n    }\n\n    if (!changeReasonInput?.value.trim()) {\n      window.aivicNotify?.error('変更理由を入力してください');\n      return;\n    }\n\n    try {\n      // 業務ロジックで承認階層を決定\n      const hierarchyResult = determineApprovalHierarchy && determineApprovalHierarchy({\n        申請書類ID: currentApplicationId,\n        新しいフローID: newRouteSelect.value,\n        変更理由: changeReasonInput.value\n      });\n\n      // 確認ダイアログを表示\n      const confirmationContent = container.querySelector('.confirmation-content');\n      const confirmationDialog = container.querySelector('.confirmation-dialog');\n      \n      if (confirmationContent && confirmationDialog) {\n        const flows = await window.aivicApi.list(APPROVAL_FLOW_TABLE);\n        const selectedFlow = flows.find(flow => flow.id === newRouteSelect.value);\n        \n        confirmationContent.textContent = `${selectedFlow?.フロー名 || '選択されたフロー'}に変更します`;\n        confirmationDialog.style.display = 'block';\n      }\n    } catch (error) {\n      console.error('ルート変更確認エラー:', error);\n      window.aivicNotify?.error('ルート変更の確認に失敗しました');\n    }\n  }\n\n  // 変更実行の処理\n  async function handleExecuteChange() {\n    const newRouteSelect = container.querySelector('[data-testid=\"new-route-select\"]');\n    const changeReasonInput = container.querySelector('[data-testid=\"change-reason\"]');\n\n    try {\n      // 業務ロジックで処理ルート更新\n      const updateResult = updateProcessingRoutesByRegulationChange && updateProcessingRoutesByRegulationChange({\n        申請書類ID: currentApplicationId,\n        新しいフローID: newRouteSelect.value,\n        変更理由: changeReasonInput.value,\n        変更者: 'current_user'\n      });\n\n      // データベース更新\n      if (currentRouteData) {\n        await window.aivicApi.update(PROCESSING_ROUTE_TABLE, currentRouteData.id, {\n          ...currentRouteData,\n          承認フローID: newRouteSelect.value,\n          変更理由: changeReasonInput.value,\n          変更日時: new Date().toISOString()\n        });\n      }\n\n      // 成功メッセージ表示\n      const successMessage = container.querySelector('.success-message');\n      const completionMessage = container.querySelector('.completion-message');\n      \n      if (successMessage) {\n        successMessage.textContent = '処理ルートが正常に変更されました';\n        successMessage.style.display = 'block';\n      }\n      \n      if (completionMessage) {\n        completionMessage.textContent = '処理ルート変更が完了しました';\n        completionMessage.style.display = 'block';\n      }\n\n      // 履歴ログ更新\n      const historyLog = container.querySelector('.history-log');\n      if (historyLog) {\n        historyLog.textContent = '新しいルート情報が設定されました';\n      }\n\n      // 現在のルート表示を更新\n      await handleApplicationSelect(currentApplicationId);\n\n      // モーダルを閉じる\n      const confirmationDialog = container.querySelector('.confirmation-dialog');\n      if (confirmationDialog) {\n        confirmationDialog.style.display = 'none';\n      }\n\n    } catch (error) {\n      console.error('変更実行エラー:', error);\n      window.aivicNotify?.error('処理ルートの変更に失敗しました');\n    }\n  }\n\n  // 通知送信の処理\n  async function handleSendNotification() {\n    const notifyApplicant = container.querySelector('[data-testid=\"notify-applicant\"]');\n    const notifyCurrentApprover = container.querySelector('[data-testid=\"notify-current-approver\"]');\n    const notificationMessage = container.querySelector('[data-testid=\"notification-message\"]');\n\n    if (!notificationMessage?.value.trim()) {\n      window.aivicNotify?.error('通知メッセージを入力してください');\n      return;\n    }\n\n    try {\n      // 業務ロジックで通知対象者を決定\n      const targets = determineNotificationTargets && determineNotificationTargets({\n        申請書類ID: currentApplicationId,\n        申請者通知: notifyApplicant?.checked,\n        承認者通知: notifyCurrentApprover?.checked\n      });\n\n      // 通知送信処理（実際の実装では通知APIを呼ぶ）\n      console.log('通知送信:', {\n        targets,\n        message: notificationMessage.value\n      });\n\n      // 成功メッセージ表示\n      const sendSuccessMessage = container.querySelector('.send-success-message');\n      if (sendSuccessMessage) {\n        sendSuccessMessage.textContent = '通知メッセージの送信が完了しました';\n        sendSuccessMessage.style.display = 'block';\n      }\n\n      window.aivicNotify?.success('通知を送信しました');\n\n    } catch (error) {\n      console.error('通知送信エラー:', error);\n      window.aivicNotify?.error('通知の送信に失敗しました');\n    }\n  }\n\n  // キャンセル処理\n  function handleCancel() {\n    // フォームをリセット\n    const applicationSelect = container.querySelector('[data-testid=\"application-select\"]');\n    const changeReasonInput = container.querySelector('[data-testid=\"change-reason\"]');\n    const newRouteSelect = container.querySelector('[data-testid=\"new-route-select\"]');\n    \n    if (applicationSelect) applicationSelect.value = '';\n    if (changeReasonInput) changeReasonInput.value = '';\n    if (newRouteSelect) newRouteSelect.value = '';\n\n    // モーダルを閉じる\n    const confirmationDialog = container.querySelector('.confirmation-dialog');\n    if (confirmationDialog) {\n      confirmationDialog.style.display = 'none';\n    }\n\n    // 状態をリセット\n    currentApplicationId = null;\n    currentRouteData = null;\n\n    // 画面表示をリセット\n    handleApplicationSelect(null);\n  }\n\n  // 初期化処理\n  async function initialize() {\n    try {\n      // 申請書類の選択肢を読み込み\n      const applications = await window.aivicApi.list(APPLICATION_TABLE);\n      const applicationSelect = container.querySelector('[data-testid=\"application-select\"]');\n      \n      if (applicationSelect) {\n        applicationSelect.innerHTML = '<option value=\"\">選択してください</option>' +\n          applications.map(app => \n            `<option value=\"${app.id}\">${app.申請種別} - ${app.件名}（${app.申請者名}）</option>`\n          ).join('');\n\n        // 申請書類選択のイベントリスナー\n        applicationSelect.addEventListener('change', (e) => {\n          handleApplicationSelect(e.target.value);\n        });\n      }\n\n      // 各ボタンのイベントリスナーを設定\n      const changeApproverButton = container.querySelector('[data-testid=\"change-approver-button\"]');\n      if (changeApproverButton) {\n        changeApproverButton.addEventListener('click', handleChangeApprover);\n      }\n\n      const confirmButton = container.querySelector('[data-testid=\"confirm-button\"]');\n      if (confirmButton) {\n        confirmButton.addEventListener('click', handleConfirmRouteChange);\n      }\n\n      const executeButton = container.querySelector('[data-testid=\"execute-button\"]');\n      if (executeButton) {\n        executeButton.addEventListener('click', handleExecuteChange);\n      }\n\n      const notifyButton = container.querySelector('[data-testid=\"notify-button\"]');\n      if (notifyButton) {\n        notifyButton.addEventListener('click', handleSendNotification);\n      }\n\n      const cancelButton = container         if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
