window.AIVIC_PAGE_INIT_JS = "javascript\nfunction(container, apiUrl, tables) {\n  let currentDocumentId = null;\n  \n  // 業務ロジックのインポート（実際の実装では適切にインポート）\n  const { \n    checkApprovalStatusViewPermission, \n    getProgressDataWithAccessControl,\n    validateApplicationBeforeSubmission,\n    determineApprovalHierarchy,\n    processUrgentApplicationPriority,\n    handleSystemFailureAlternativeProcess,\n    identifyStagnantApplications\n  } = window.businessLogic || {};\n  \n  // 承認履歴テーブル再描画\n  function renderApprovalHistory(histories) {\n    const tbody = container.querySelector(\"#history-tbody\");\n    if (!tbody) return;\n    tbody.innerHTML = histories.map(h => `\n      <tr data-id=\"${h.id || ''}\">\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text); border-bottom: 1px solid rgba(255,255,255,0.05);\">${h.承認者名 || h.承認者ID || ''}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text); border-bottom: 1px solid rgba(255,255,255,0.05);\">\n          <span style=\"padding: 2px 6px; border-radius: 3px; font-size: 11px; ${getStatusStyle(h.承認結果 || h.結果)}\">${h.承認結果 || h.結果 || ''}</span>\n        </td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text); border-bottom: 1px solid rgba(255,255,255,0.05);\">${h.承認コメント || h.コメント || ''}</td>\n        <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text-muted); border-bottom: 1px solid rgba(255,255,255,0.05);\">${formatDateTime(h.承認日時 || h.処理日時)}</td>\n      </tr>\n    `).join(\"\");\n  }\n  \n  function getStatusStyle(status) {\n    switch(status) {\n      case '承認': case '承認済': return 'background: rgba(34,197,94,0.2); color: #22c55e;';\n      case '差戻し': return 'background: rgba(249,115,22,0.2); color: #f97316;';\n      case '却下': case '否認': return 'background: rgba(239,68,68,0.2); color: #ef4444;';\n      case '保留': return 'background: rgba(156,163,175,0.2); color: #9ca3af;';\n      default: return 'background: rgba(59,130,246,0.2); color: #3b82f6;';\n    }\n  }\n  \n  function formatDateTime(dateStr) {\n    if (!dateStr) return '';\n    const date = new Date(dateStr);\n    return date.toLocaleDateString('ja-JP') + ' ' + date.toLocaleTimeString('ja-JP', {hour: '2-digit', minute: '2-digit'});\n  }\n  \n  // 申請書類詳細表示\n  function displayDocumentDetails(doc) {\n    if (!doc) return;\n    \n    const docId = container.querySelector(\"#doc-id\");\n    const docApplicant = container.querySelector(\"#doc-applicant\");\n    const docType = container.querySelector(\"#doc-type\");\n    const docDate = container.querySelector(\"#doc-date\");\n    const docTitle = container.querySelector(\"#doc-title\");\n    const docContent = container.querySelector(\"#doc-content\");\n    const statusBadge = container.querySelector(\"#status-badge\");\n    const currentStep = container.querySelector(\"#current-step\");\n    const currentApprover = container.querySelector(\"#current-approver\");\n    \n    if (docId) docId.textContent = doc.id || doc.申請書類ID || '';\n    if (docApplicant) docApplicant.textContent = doc.申請者名 || doc.申請者ID || '';\n    if (docType) docType.textContent = doc.申請種別 || '';\n    if (docDate) docDate.textContent = formatDateTime(doc.作成日時);\n    if (docTitle) docTitle.textContent = doc.申請タイトル || '';\n    if (docContent) docContent.textContent = doc.申請内容 || '';\n    \n    // ステータス表示\n    if (statusBadge) {\n      statusBadge.textContent = doc.承認状態 || '申請中';\n      statusBadge.style.cssText = `padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; ${getStatusStyle(doc.承認状態)}`;\n    }\n    if (currentStep) currentStep.textContent = `${doc.承認段階 || 1}次承認待ち`;\n    if (currentApprover) currentApprover.textContent = doc.現在承認者名 || doc.現在承認者ID || '-';\n    \n    currentDocumentId = doc.id || doc.申請書類ID;\n  }\n  \n  // 承認処理\n  async function handleApproval(action) {\n    if (!currentDocumentId) {\n      window.aivicNotify.error('申請書類が選択されていません');\n      return;\n    }\n    \n    const commentInput = container.querySelector(\"#approval-comment\");\n    const comment = commentInput ? commentInput.value : '';\n    \n    try {\n      // 業務ロジックで承認前検証\n      if (validateApplicationBeforeSubmission) {\n        const validationResult = validateApplicationBeforeSubmission({\n          documentId: currentDocumentId,\n          action: action,\n          comment: comment\n        });\n        \n        if (!validationResult.isValid) {\n          window.aivicNotify.error(validationResult.message || '承認処理に必要な条件が満たされていません');\n          return;\n        }\n      }\n      \n      // 承認処理実行\n      const result = await window.aivicApi.update('approval_documents', currentDocumentId, {\n        承認結果: action,\n        承認コメント: comment,\n        承認日時: new Date().toISOString(),\n        承認者ID: window.currentUser?.id\n      });\n      \n      if (result.success) {\n        window.aivicNotify.success(`${action}処理が完了しました`);\n        if (commentInput) commentInput.value = '';\n        await loadDocumentData(currentDocumentId);\n      } else {\n        window.aivicNotify.error(result.message || '処理に失敗しました');\n      }\n    } catch (error) {\n      console.error('承認処理エラー:', error);\n      \n      // システム障害時の代替処理\n      if (handleSystemFailureAlternativeProcess) {\n        const alternativeResult = handleSystemFailureAlternativeProcess({\n          documentId: currentDocumentId,\n          action: action,\n          error: error.message\n        });\n        \n        if (alternativeResult.canProceed) {\n          window.aivicNotify.warning('システム障害のため代替処理で実行されました');\n        } else {\n          window.aivicNotify.error('システム障害により処理を継続できません');\n        }\n      } else {\n        window.aivicNotify.error('処理中にエラーが発生しました');\n      }\n    }\n  }\n  \n  // 申請書類データ読み込み\n  async function loadDocumentData(documentId) {\n    try {\n      // アクセス権限チェック\n      if (checkApprovalStatusViewPermission) {\n        const permissionResult = checkApprovalStatusViewPermission({\n          documentId: documentId,\n    window.aivicNotify.success('緊急処理として設定されました');\n          await loadDocumentData(currentDocumentId);\n        } else {\n          window.aivicNotify.error(urgentResult.message || '緊急処理の条件を満たしていません');\n        }\n      }\n    } catch (error) {\n      console.error('緊急処理エラー:', error);\n      window.aivicNotify.error('緊急処理の設定に失敗しました');\n    }\n  }\n  \n  // 滞留申請チェック\n  async function checkStagnantApplications() {\n    try {\n      if (identifyStagnantApplications) {\n        const stagnantResult = identifyStagnantApplications({\n          checkDate: new Date().toISOString()\n        });\n        \n        if (stagnantResult.stagnantApplications && stagnantResult.stagnantApplications.length > 0) {\n          const message = `滞留申請が${stagnantResult.stagnantApplications.length}件見つかりました`;\n          window.aivicNotify.warning(message);\n        } else {\n          window.aivicNotify.info('滞留申請はありません');\n        }\n      }\n    } catch (error) {\n      console.error('滞留チェックエラー:', error);\n      window.aivicNotify.error('滞留チェックに失敗しました');\n    }\n  }\n  \n  // イベントハンドラー設定\n  function setupEventHandlers() {\n    // 承認ボタン\n    const approveBtn = container.querySelector(\"#approve-btn\");\n    if (approveBtn) {\n      approveBtn.addEventListener('click', () => handleApproval('承認'));\n    }\n    \n    // 差戻しボタン\n    const rejectBtn = container.querySelector(\"#reject-btn\");\n    if (rejectBtn) {\n      rejectBtn.addEventListener('click', () => handleApproval('差戻し'));\n    }\n    \n    // 却下ボタン\n    const denyBtn = container.querySelector(\"#deny-btn\");\n    if (denyBtn) {\n      denyBtn.addEventListener('click', () => handleApproval('却下'));\n    }\n    \n    // 保留ボタン\n    const holdBtn = container.querySelector(\"#hold-btn\");\n    if (holdBtn) {\n      holdBtn.addEventListener('click', () => handleApproval('保留'));\n    }\n    \n    // 緊急処理ボタン\n    const urgentBtn = container.querySelector(\"#urgent-btn\");\n    if (urgentBtn) {\n      urgentBtn.addEventListener('click', handleUrgentProcess);\n    }\n    \n    // 滞留チェックボタン\n    const stagnantBtn = container.querySelector(\"#stagnant-check-btn\");\n    if (stagnantBtn) {\n      stagnantBtn.addEventListener('click', checkStagnantApplications);\n    }\n    \n    // 更新ボタン\n    const refreshBtn = container.querySelector(\"#refresh-btn\");\n    if (refreshBtn) {\n      refreshBtn.addEventListener('click', () => {\n        if (currentDocumentId) {\n          loadDocumentData(currentDocumentId);\n        }\n      });\n    }\n  }\n  \n  // 初期化\n  function initialize() {\n    setupEventHandlers();\n    \n    // URLパラメータから申請書類IDを取得\n    const urlParams = new URLSearchParams(window.location.search);\n    const documentId = urlParams.get('documentId');\n    \n    if (documentId) {\n      loadDocumentData(documentId);\n    }\n  }\n  \n  // 初期化実行\n  initialize();\n}";

    <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();
