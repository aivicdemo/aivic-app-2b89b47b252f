window.AIVIC_PAGE_INIT_JS = "js\nfunction(container, apiUrl, tables) {\n  // 業務ロジックのインポート\n  const { \n    determineApprovalHierarchy, \n    setApproverAuthorityLevel, \n    validateApplicationBeforeSubmission,\n    setApprovalDeadline,\n    processUrgentApplicationPriority,\n    updateProcessingRoutesByRegulationChange\n  } = window.businessLogic || {};\n\n  let currentSteps = [];\n  let editingStepIndex = -1;\n  let selectedApplicationId = null;\n\n  // 承認ステップテーブル再描画\n  function renderSteps(steps) {\n    const tbody = container.querySelector(\"#steps-tbody\");\n    if (!tbody) return;\n    \n    tbody.innerHTML = steps.map((step, index) => `\n      <tr data-index=\"${index}\">\n        <td style=\"text-align: center;\">\n          <div style=\"display: flex; gap: 4px; justify-content: center;\">\n            <button class=\"action-btn secondary move-up-btn\" data-index=\"${index}\" style=\"padding: 2px 6px; font-size: 11px;\" ${index === 0 ? 'disabled' : ''}>↑</button>\n            <span style=\"font-weight: 500;\">${index + 1}</span>\n            <button class=\"action-btn secondary move-down-btn\" data-index=\"${index}\" style=\"padding: 2px 6px; font-size: 11px;\" ${index === steps.length - 1 ? 'disabled' : ''}>↓</button>\n          </div>\n        </td>\n        <td>${step.approverName || step.approver || ''}</td>\n        <td style=\"text-align: center;\">\n          <span style=\"padding: 2px 6px; border-radius: 4px; font-size: 11px; ${step.required ? 'background: rgba(255, 100, 100, 0.2); color: #ff6464;' : 'background: rgba(100, 255, 100, 0.2); color: #64ff64;'}\">${step.required ? '必須' : '任意'}</span>\n        </td>\n        <td style=\"text-align: center;\">\n          <span style=\"font-size: 12px;\">${step.processType === 'parallel' ? '並列' : '直列'}</span>\n        </td>\n        <td style=\"text-align: center;\">${step.deadline || 3}</td>\n        <td>\n          <div style=\"display: flex; gap: 4px;\">\n            <button class=\"action-btn secondary edit-step-btn\" data-index=\"${index}\" style=\"padding: 4px 8px; font-size: 11px;\">編集</button>\n            <button class=\"action-btn secondary delete-step-btn\" data-index=\"${index}\" style=\"padding: 4px 8px; font-size: 11px;\">削除</button>\n          </div>\n        </td>\n      </tr>\n    `).join(\"\");\n\n    // イベントハンドラーを再アタッチ\n    attachStepTableHandlers();\n  }\n\n  // 現在のルート情報表示\n  function updateCurrentRouteInfo(applicationId) {\n    const routeInfo = container.querySelector(\"#current-route-info\");\n    if (!routeInfo) return;\n    \n    if (!applicationId) {\n      routeInfo.innerHTML = \"申請書類を選択してください\";\n      return;\n    }\n    \n    // 申請書類情報を取得して表示\n    const application = tables[1]?.records?.find(r => r.id === applicationId);\n    if (application) {\n      routeInfo.innerHTML = `\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; font-size: 12px;\">\n          <div><strong>申請種別:</strong> ${application.申請種別 || application.documentType || '経費申請'}</div>\n          <div><strong>申請者:</strong> ${application.申請者名 || application.applicantName || '山田太郎'}</div>\n          <div><strong>現在段階:</strong> ${application.承認段階 || application.currentStep || 1}次承認</div>\n        </div>\n        <div style=\"margin-top: 8px; font-size: 12px;\">\n          <strong>承認状態:</strong> ${application.承認状態 || application.approvalStatus || '承認中'}\n        </div>\n      `;\n    }\n  }\n\n  // フォームモーダルの表示/非表示\n  function showStepForm(stepIndex = -1) {\n    const modal = container.querySelector(\"#step-form-modal\");\n    if (!modal) return;\n    \n    editingStepIndex = stepIndex;\n    modal.style.display = \"block\";\n    \n    if (stepIndex >= 0) {\n      const step = currentSteps[stepIndex];\n      container.querySelector(\"#approver-name\").value = step.approverName || '';\n      container.querySelector(\"#step-required\").checked = step.required || false;\n      container.querySelector(\"#process-type\").value = step.processType || 'serial';\n      container.querySelector(\"#step-deadline\").value = step.deadline || 3;\n    } else {\n      container.querySelector(\"#approver-name\").value = '';\n      container.querySelector(\"#step-required\").checked = false;\n      container.querySelector(\"#process-type\").value = 'serial';\n      container.querySelector(\"#step-deadline\").value = 3;\n    }\n  }\n\n  function hideStepForm() {\n    const modal = container.querySelector(\"#step-form-modal\");\n    if (modal) {\n      modal.style.display = \"none\";\n    }\n  }\n\n  // ステップテーブルのイベントハンドラー\n  function attachStepTableHandlers() {\n    // 編集ボタン\n    container.querySelectorAll(\".edit-step-btn\").forEach(btn => {\n      btn.addEventListener(\"click\", (e) => {\n        const index = parseInt(e.target.dataset.index);\n        showStepForm(index);\n      });\n    });\n\n    // 削除ボタン\n    container.querySelectorAll(\".delete-step-btn\").forEach(btn => {\n      btn.addEventListener(\"click\", (e) => {\n        const index = parseInt(e.target.dataset.index);\n        if (confirm(\"このステップを削除しますか？\")) {\n          currentSteps.splice(index, 1);\n          renderSteps(currentSteps);\n        }\n      });\n    });\n\n    // 上移動ボタン\n    container.querySelectorAll(\".move-up-btn\").forEach(btn => {\n      btn.addEventListener(\"click\", (e) => {\n        const index = parseInt(e.target.dataset.index);\n        if (index > 0) {\n          [currentSteps[index], currentSteps[index - 1]] = [currentSteps[index - 1], currentSteps[index]];\n          renderSteps(currentSteps);\n        }\n      });\n    });\n\n    // 下移動ボタン\n    container.querySelectorAll(\".move-down-btn\").forEach(btn => {\n      btn.addEventListener(\"click\", (e) => {\n        const index = parseInt(e.target.dataset.index);\n        if (index < currentSteps.length - 1) {\n          [currentSteps[index], currentSteps[index + 1]] = [currentSteps[index + 1], currentSteps[index]];\n          renderSteps(currentSteps);\n        }\n      });\n    });\n  }\n\n  // 申請書類選択の変更イベント\n  const applicationSelect = container.querySelector(\"#application-select\");\n  if (applicationSelect) {\n    applicationSelect.addEventListener(\"change\", (e) => {\n      selectedApplicationId = e.target.value;\n      updateCurrentRouteInfo(selectedApplicationId);\n      \n      // 既存のルート情報を読み込み\n      if (selectedApplicationId) {\n        loadCurrentRoute(selectedApplicationId);\n      }\n    });\n  }\n\n  // 既存ルート読み込み\n  async function loadCurrentRoute(applicationId) {\n    try {\n      const application = tables[1]?.records?.find(r => r.id === applicationId);\n      if (application && application.approvalRoute) {\n        currentSteps = JSON.parse(application.approvalRoute);\n        renderSteps(currentSteps);\n      } else {\n        // 業務ロジックで承認階層を決定\n        if (determineApprovalHierarchy) {\n          const hierarchyResult = determineApprovalHierarchy({\n            documentType: application?.申請種別 || application?.documentType,\n            amount: application?.金額 || application?.amount,\n            applicant: application?.申請者名 || application?.applicantName\n          });\n          \n          if (hierarchyResult.success) {\n            currentSteps = hierarchyResult.hierarchy.map((level, index) => ({\n              approverName: level.approverName,\n              required: level.required !== false,\n              processType: level.processType || 'serial',\n              deadline: level.deadline || 3\n            }));\n            renderSteps(currentSteps);\n          }\n        }\n      }\n    } catch (error) {\n      window.aivicNotify.error(\"ルート情報の読み込みに失敗しました\");\n    }\n  }\n\n  // 新規ステップ追加ボタン\n  const addStepBtn = container.querySelector(\"#add-step-btn\");\n  if (addStepBtn) {\n    addStepBtn.addEventListener(\"click\", () => {\n      showStepForm();\n    });\n  }\n\n  // ステップフォーム保存ボタン\n  const saveStepBtn = container.querySelector(\"#save-step-btn\");\n  if (saveStepBtn) {\n    saveStepBtn.addEventListener(\"click\", () => {\n      const approverName = container.querySelector(\"#approver-name\").value;\n      const required = container.querySelector(\"#step-required\").checked;\n      const processType = container.querySelector(\"#process-type\").value;\n      const deadline = parseInt(container.querySelector(\"#step-deadline\").value);\n\n      if (!approverName.trim()) {\n        window.aivicNotify.error(\"承認者名を入力してください\");\n        return;\n      }\n\n      const stepData = {\n        approverName: approverName.trim(),\n        required,\n        processType,\n        deadline\n      };\n\n      // 業務ロジックで承認者権限レベルを設定\n      if (setApproverAuthorityLevel) {\n        const authorityResult = setApproverAuthorityLevel({\n          approverName: stepData.approverName,\n          documentType: selectedApplicationId ? \n            tables[1]?.records?.find(r => r.id === selectedApplicationId)?.申請種別 : null\n        });\n        \n        if (authorityResult.success) {\n          stepData.authorityLevel = authorityResult.authorityLevel;\n        }\n      }\n\n      if (editingStepIndex >= 0) {\n        currentSteps[editingStepIndex] = stepData;\n      } else {\n        currentSteps.push(stepData);\n      }\n\n      renderSteps(currentSteps);\n      hideStepForm();\n      window.aivicNotify.success(\"ステップを保存しました\");\n    });\n  }\n\n  // ステップフォームキャンセルボタン\n  const cancelStepBtn = container.querySelector(\"#cancel-step-btn\");\n  if (cancelStepBtn) {\n    cancelStepBtn.addEventListener(\"click\", hideStepForm);\n  }\n\n  // ルート更新ボタン\n  const updateRouteBtn = container.querySelector(\"#update-route-btn\");\n  if (updateRouteBtn) {\n    updateRouteBtn.addEventListener(\"click\", async () => {\n      if (!selectedApplicationId) {\n        window.aivicNotify.error(\"申請書類を選択してください\");\n        return;\n      }\n\n      if (currentSteps.length === 0) {\n        window.aivicNotify.error(\"承認ステップを追加してください\");\n        return;\n      }\n\n      try {\n        // 業務ロジックで申請を検証\n        if (validateApplicationBeforeSubmission) {\n          const application = tables[1]?.records?.find(r => r.id === selectedApplicationId);\n          const validationResult = validateApplicationBeforeSubmission({\n            applicationId: selectedApplicationId,\n            documentType: application?.申請種別 || application?.documentType,\n            approvalRoute: currentSteps\n          });\n\n          if (!validationResult.success) {\n            window.aivicNotify.error(validationResult.message || \"申請の検証に失敗しました\");\n            return;\n          }\n        }\n\n        // ルート更新処理\n        const updateData = {\n          id: selectedApplicationId,\n          approvalRoute: JSON.stringify(currentSteps),\n          updatedAt: new Date().toISOString()\n        };\n\n        await window.aivicApi.update(\"applications\", selectedApplicationId, updateData);\n        window.aivicNotify.success(\"処理ルートを更新しました\");\n        \n        // 承認処理画面に戻る\n        setTimeout(() => {\n          window.showScreen('scr-1779346222651');\n        }, 1000);\n\n      } catch (error) {\n        window.aivicNotify.error(\"ルートの更新に失敗しました\");\n      }\n    });\n  }\n\n  // 自動生成ボタン\n  const autoGenerateBtn = container.querySelector(\"#auto-generate-btn\");\n  if (autoGenerateBtn) {\n    autoGenerateBtn.addEventListener(\"click\", () => {\n      if (!selectedApplicationId) {\n        window.aivicNotify.error(\"申請書類を選択してください\");\n        return;\n      }\n\n      const application = tables[1]?.records?.find(r => r.id === selectedApplicationId);\n      if (!application) return;\n\n      // 業務ロジックで承認階層を自動決定\n      if (determineApprovalHierarchy) {\n        const hierarchyResult = determineApprovalHierarchy({\n          documentType: application.申請種別 || application.documentType,\n          amount: application.金額 || application.amount,\n          applicant: application.申請者名 || application.applicantName,\n          urgency: application.緊急度 || application.urgency\n        });\n\n        if (hierarchyResult.success) {\n          currentSteps = hierarchyResult.hierarchy.map(level => ({\n            approverName: level.approverName,\n            required: level.required !== false,\n            processType: level.processType || 'serial',\n            deadline: level.deadline || 3\n          }));\n          \n          renderSteps(currentSteps);\n          window.aivicNotify.success(\"承認ルートを自動生成しました\");\n        } else {\n          window.aivicNotify.error(\"承認ルートの自動生成に失敗しました\");\n        }\n      } else {\n        // フォールバック: デフォルトルート\n        currentSteps = [\n          { approverName: \"課長\", required: true, processType: \"serial\", deadline: 3 },\n          { approverName: \"部長\", required: true, processType: \"serial\", deadline: 5 }\n        ];\n        renderSteps(currentSteps);\n        window.aivicNotify.success(\"デフォルトの承認ルートを生成しました\");\n      }\n    });\n  }\n\n  // 初期化処理\n  function initialize() {\n    // 申請書類選択肢を設定\n    if (applicationSelect && tables[1]?.records) {\n      applicationSelect.innerHTML = '<option value=\"\">選択してください</option>' +\n        tables[1].records.map(app => \n          `<option value=\"${app.id}\">${app.申請種別 || app.documentType} - ${app.申請者名 || app.applicantName}</option>`\n        ).join('');\n    }\n\n    // 初期表示\n    renderSteps(currentSteps);\n    updateCurrentRouteInfo(null);\n  }\n\n  // 初期化実行\n  initialize();\n}";
