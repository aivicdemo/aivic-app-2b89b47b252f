th}件`;\n  }\n\n  function getStatusBadge(status) {\n    const statusColors = {\n      '申請中': { bg: '#ff9500', color: '#fff' },\n      '承認済': { bg: '#00c851', color: '#fff' },\n      '却下': { bg: '#ff4444', color: '#fff' },\n      '取下げ': { bg: '#666', color: '#fff' }\n    };\n    const colors = statusColors[status] || { bg: 'rgba(255,255,255,0.1)', color: 'var(--text-muted)' };\n    return `<span style=\"background: ${colors.bg}; color: ${colors.color}; padding: 2px 6px; border-radius: 4px; font-size: 11px;\">${status}</span>`;\n  }\n\n  function formatDate(dateStr) {\n    if (!dateStr) return '';\n    const date = new Date(dateStr);\n    return date.toLocaleDateString('ja-JP');\n  }\n\n  // 2. 初期データを即座に描画\n  if (tables[0] && tables[0].records) {\n    allDocuments = tables[0].records;\n    renderRows(allDocuments);\n  }\n\n  // 最新データを取得\n  window.aivicApi.list(0).then(rows => {\n    if (rows) {\n      allDocuments = rows;\n      renderRows(rows);\n    }\n  });\n\n  // 3. 検索ボタンのイベントリスナー\n  container.querySelector(\"#btn-search\").addEventListener(\"click\", () => {\n    const keyword = container.querySelector(\"#input-keyword\").value.toLowerCase();\n    const docType = container.querySelector(\"#select-doc-type\").value;\n    const applicant = container.querySelector(\"#input-applicant\").value.toLowerCase();\n    const dateFrom = container.querySelector(\"#input-date-from\").value;\n    const dateTo = container.querySelector(\"#input-date-to\").value;\n    const approvalDateFrom = container.querySelector(\"#input-approval-date-from\").value;\n    const approvalDateTo = container.querySelector(\"#input-approval-date-to\").value;\n    const approver = container.querySelector(\"#select-approver\").value;\n    const department = container.querySelector(\"#select-department\").value;\n    const urgency = container.querySelector('input[name=\"urgency\"]:checked').value;\n\n    // チェックボックスの状態を取得\n    const statusFilters = [];\n    if (container.querySelector(\"#status-pending\").checked) statusFilters.push(\"申請中\");\n    if (container.querySelector(\"#status-approved\").checked) statusFilters.push(\"承認済\");\n    if (container.querySelector(\"#status-rejected\").checked) statusFilters.push(\"却下\");\n\n    const filtered = allDocuments.filter(doc => {\n      // キーワード検索\n      if (keyword && !JSON.stringify(doc).toLowerCase().includes(keyword)) return false;\n      \n      // 文書種別\n      if (docType && doc.申請種別 !== docType) return false;\n      \n      // 申請者名\n      if (applicant && !(doc.申請者名 || '').toLowerCase().includes(applicant)) return false;\n      \n      // 承認状態\n      if (statusFilters.length > 0 && !statusFilters.includes(doc.承認状態)) return false;\n      \n      // 申請日範囲\n      if (dateFrom || dateTo) {\n        const docDate = new Date(doc.作成日時);\n        if (dateFrom && docDate < new Date(dateFrom)) return false;\n        if (dateTo && docDate > new Date(dateTo + 'T23:59:59')) return false;\n      }\n      \n      // 承認完了日範囲\n      if (approvalDateFrom || approvalDateTo) {\n        if (!doc.最終承認日時) return false;\n        const approvalDate = new Date(doc.最終承認日時);\n        if (approvalDateFrom && approvalDate < new Date(approvalDateFrom)) return false;\n        if (approvalDateTo && approvalDate > new Date(approvalDateTo + 'T23:59:59')) return false;\n      }\n      \n      // 承認者\n      if (approver && doc.最終承認者名 !== approver) return false;\n      \n      // 部署\n      if (department && doc.申請者部署 !== department) return false;\n      \n      // 緊急度\n      if (urgency === '緊急' && !(doc.緊急フラグ === true || doc.緊急フラグ === 'true')) return false;\n      if (urgency === '通常' && (doc.緊急フラグ === true || doc.緊急フラグ === 'true')) return false;\n      \n      return true;\n    });\n\n    renderRows(filtered);\n  });\n\n  // 条件クリアボタン\n  container.querySelector(\"#btn-clear\").addEventListener(\"click\", () => {\n    container.querySelector(\"#input-keyword\").value = '';\n    container.querySelector(\"#select-doc-type\").value = '';\n    container.querySelector(\"#input-applicant\").value = '';\n    container.querySelector(\"#input-date-from\").value = '';\n    container.querySelector(\"#input-date-to\").value = '';\n    container.querySelector(\"#input-approval-date-from\").value = '';\n    container.querySelector(\"#input-approval-date-to\").value = '';\n    container.querySelector(\"#select-approver\").value = '';\n    container.querySelector(\"#select-department\").value = '';\n    container.querySelector(\"#status-pending\").checked = false;\n    container.querySelector(\"#status-approved\").checked = false;\n    container.querySelector(\"#status-rejected\").checked = false;\n    container.querySelector('input[name=\"urgency\"][value=\"\"]').checked = true;\n    \n    renderRows(allDocuments);\n  });\n\n  // 詳細検索展開ボタン\n  container.querySelector(\"#btn-toggle-advanced\").addEventListener(\"click\", () => {\n    isAdvancedVisible = !isAdvancedVisible;\n    advancedSearch.style.display = isAdvancedVisible ? 'block' : 'none';\n    container.querySelector(\"#btn-toggle-advanced\").textContent = isAdvancedVisible ? '詳細検索を閉じる' : '詳細検索';\n  });\n\n  // CSVエクスポートボタン\n  container.querySelector(\"#btn-export\").addEventListener(\"click\", () => {\n    const headers = ['申請書類ID', '申請種別', '申請タイトル', '申請者名', '承認状態', '申請日', '緊急フラグ'];\n    const csvContent = '\\uFEFF' + [\n      headers.join(','),\n      ...allDocuments.map(doc => [\n        `\"${doc.id || ''}\"`,\n        `\"${doc.申請種別 || ''}\"`,\n        `\"${doc.申請タイトル || ''}\"`,\n        `\"${doc.申請者名 || ''}\"`,\n        `\"${doc.承認状態 || ''}\"`,\n        `\"${formatDate(doc.作成日時)}\"`,\n        `\"${(doc.緊急フラグ === true || doc.緊急フラグ === 'true') ? '緊急' : '通常'}\"`\n      ].join(','))\n    ].join('\\n');\n\n    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });\n    const link = document.createElement('a');\n    link.href = URL.createObjectURL(blob);\n    link.download = `電子文書検索結果_${new Date().toISOString().split('T')[0]}.csv`;\n    link.click();   <!-- 検索結果エリア -->
  <div class="card" style="padding: 12px;">

    </div>

    <div class="table-wrap">
      <table data-testid="document-list">
        <thead>
          <tr>
            <th style="padding: 6px 10px; font-size: 12px; font-weight: 600; color: var(--text); border-bottom: 1px solid var(--border);">申請書類ID</th>
            <th style="padding: 6px 10px; font-size: 12px; font-weight: 600; color: var(--text); border-bottom: 1px solid var(--border);">申請種別</th>
            <th style="padding: 6px 10px; font-size: 12px; font-weight: 600; color: var(--text); border-bottom: 1px solid var(--border);">申請タイトル</th>
            <th style="padding: 6px 10px; font-size: 12px; font-weight: 600; color: var(--text); border-bottom: 1px solid var(--border);">申請者</th>
            <th style="padding: 6px 10px; font-size: 12px; font-weight: 600; color: var(--text); border-bottom: 1px solid var(--border);">承認状態</th>

            </div>
        </main>

    <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
