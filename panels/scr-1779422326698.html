| !fileInput.files.length) {\n        window.aivicNotify?.error('アップロードするファイルを選択してください。');\n        return;\n      }\n\n      try {\n        const formData = new FormData();\n        Array.from(fileInput.files).forEach(file => {\n          formData.append('files', file);\n        });\n\n        const response = await fetch(`${apiUrl}/upload`, {\n          method: 'POST',\n          body: formData\n        });\n\n        if (response.ok) {\n          window.aivicNotify?.success('ファイルのアップロードが完了しました。');\n        } else {\n          throw new Error('アップロードに失敗しました。');\n        }\n      } catch (error) {\n        window.aivicNotify?.error('ファイルのアップロードに失敗しました。');\n      }\n    });\n  }\n\n  // エラー表示関数\n  function showError(message) {\n    const errorDiv = container.querySelector('#error-message');\n    if (errorDiv) {\n      errorDiv.textContent = message;\n      errorDiv.style.display = 'block';\n      setTimeout(() => {\n        errorDiv.style.display = 'none';\n      }, 5000);\n    }\n  }\n\n  // フォームデータ取得関数\n  function getFormData() {\n    return {\n      title: container.querySelector('[data-testid=\"title-input\"]')?.value?.trim() || '',\n      documentType: container.querySelector('[data-testid=\"document-type-select\"]')?.value || '',\n      department: container.querySelector('[name=\"departments\"]')?.value || '',\n      applicationDate: container.querySelector('[data-testid=\"application-date-input\"]')?.value || '',\n      approvalFlow: container.querySelector('[data-testid=\"approval-flow-select\"]')?.value || '',\n      content: container.querySelector('[data-testid=\"content-textarea\"]')?.value?.trim() || '',\n      reason: container.querySelector('[data-testid=\"reason-textarea\"]')?.value?.trim() || '',\n      urgency: container.querySelector('input[name=\"urgency\"]:checked')?.value || '',\n      amount: container.querySelector('#amount')?.value || '',\n      files: fileInput?.files || []\n    };\n  }\n\n  // バリデーション関数\n  function validateForm(formData) {\n    // 業務ロジックを使用したバリデーション\n    if (validateApplicationInput) {\n      const validationResult = validateApplicationInput({\n        title: formData.title,\n        documentType: formData.documentType,\n        content: formData.content,\n        reason: formData.reason,\n        applicationDate: formData.applicationDate\n      });\n\n      if (!validationResult.isValid) {\n        return { isValid: false, message: validationResult.message };\n      }\n    }\n\n    // 基本バリデーション\n    if (!formData.title) {\n      return { isValid: false, message: '申請書類タイトルは必須です。' };\n    }\n\n    if (formData.title.length > 100) {\n      return { isValid: false, message: '申請書類タイトルは100文字以内で入力してください。' };\n    }\n\n    if (!formData.documentType) {\n      return { isValid: false, message: '文書種別を選択してください。' };\n    }\n\n    if (!formData.applicationDate) {\n      return { isValid: false, message: '申請日を入力してください。' };\n    }\n\n    if (formData.content && formData.content.length > 2000) {\n      return { isValid: false, message: '申請内容詳細は2000文字以内で入力してください。' };\n    }\n\n    if (formData.reason && formData.reason.length > 1000) {\n      return { isValid: false, message: '申請理由は1000文字以内で入力してください。' };\n    }\n\n    // 金額と期間のバリデーション\n    if (validateApplicationAmountAndPeriod && formData.amount) {\n      const amountValidation = validateApplicationAmountAndPeriod({\n        amount: parseFloat(formData.amount),\n        period: formData.applicationDate\n      });\n\n      if (!amountValidation.isValid) {\n        return { isValid: false, message: amountValidation.message };\n      }\n    }\n\n    return { isValid: true };\n  }\n\n  // 下書き保存処理\n  const saveDraftBtn = container.querySelector('[data-testid=\"save-draft-button\"]');\n  if (saveDraftBtn) {\n    saveDraftBtn.addEventListener('click', async () => {\n      const formData = getFormData();\n      const validation = validateForm(formData);\n\n      if (!validation.isValid) {\n        showError(validation.message);\n        return;\n      }\n\n      try {\n        // 文書種別とルートの決定\n        let processingRoute = 'standard';\n        if (determineDocumentTypeAndRoute) {\n          const routeResult = determineDocumentTypeAndRoute({\n            documentType: formData.documentType,\n            amount: formData.amount,\n            urgency: formData.urgency,\n            department: formData.department\n          });\n          processingRoute = routeResult.route;\n        }\n\n        // 承認階層の決定\n        let approvalHierarchy = [];\n        if (determineApprovalHierarchy) {\n          approvalHierarchy = determineApprovalHierarchy({\n            documentType: formData.documentType,\n            amount: formData.amount,\n            department: formData.department\n          });\n        }\n\n        const draftData = {\n          ...formData,\n          status: 'draft',\n          processingRoute,\n          approvalHierarchy,\n          createdAt: new Date().toISOString(),\n          updatedAt: new Date().toISOString()\n        };\n\n        const response = await window.aivicApi.save('applications', draftData);\n        \n        if (response.success) {\n          window.aivicNotify?.success('下書きを保存しました。');\n        } else {\n          throw new Error(response.message || '保存に失敗しました。');\n        }\n      } catch (error) {\n        showError('下書きの保存に失敗しました。');\n        console.error('Save draft error:', error);\n      }\n    });\n  }\n\n  // 申請提出処理\n  const submitBtn = container.querySelector('[data-testid=\"submit-button\"]');\n  if (submitBtn) {\n    submitBtn.addEventListener('click', async () => {\n      const formData = getFormData();\n      \n      // 提出前バリデーション\n      if (validateApplicationBeforeSubmission) {\n        const submissionValidation = validateApplicationBeforeSubmission({\n          title: formData.title,\n          documentType: formData.documentType,\n          content: formData.content,\n          reason: formData.reason,\n          applicationDate: formData.applicationDate,\n          urgency: formData.urgency\n        });\n\n        if (!submissionValidation.isValid) {\n          showError(submissionValidation.message);\n          return;\n        }\n      }\n\n      const validation = validateForm(formData);\n      if (!validation.isValid) {\n        showError(validation.message);\n        return;\n      }\n\n      // 必須項目の追加チェック（提出時）\n      if (!formData.reason && (formData.documentType === '休暇申請' || formData.documentType === '出張申請')) {\n        showError('申請理由は必須です。');\n        return;\n      }\n\n      try {\n        // 緊急度による優先度処理\n        let priority = 'normal';\n        if (processUrgentApplicationPriority && formData.urgency === 'highest') {\n          const priorityResult = processUrgentApplicationPriority({\n            urgency: formData.urgency,\n            documentType: formData.documentType,\n            amount: formData.amount\n          });\n          priority = priorityResult.priority;\n        }\n\n        // 文書種別とルートの決定\n        let processingRoute = 'standard';\n        if (determineProcessingRoute) {\n          const routeResult = determineProcessingRoute({\n            documentType: formData.documentType,\n            amount: formData.amount,\n            urgency: formData.urgency,\n            department: formData.department\n          });\n          processingRoute = routeResult.route;\n        }\n\n        // 承認階層の決定\n        let approvalHierarchy = [];\n        if (determineApprovalHierarchy) {\n          approvalHierarchy = determineApprovalHierarchy({\n            documentType: formData.documentType,\n            amount: formData.amount,\n            department: formData.department\n          });\n        }\n\n        // 承認期限の設定\n        let approvalDeadline = null;\n        if (setApprovalDeadline) {\n          approvalDeadline = setApprovalDeadline({\n            urgency: formData.urgency,\n            documentType: formData.documentType,\n            applicationDate: formData.applicationDate\n          });\n        }\n\n        // 通知対象の決定\n        let notificationTargets = [];\n        if (determineNotificationTargets) {\n          notificationTargets = determineNotificationTargets({\n            approvalHierarchy,\n            documentType: formData.documentType,\n            urgency: formData.urgency\n          });\n        }\n\n        const applicationData = {\n          ...formData,\n          status: 'submitted',\n          priority,\n          processingRoute,\n          approvalHierarchy,\n          approvalDeadline,\n          notificationTargets,\n          submittedAt: new Date().toISOString(),\n          createdAt: new Date().toISOString(),\n          updatedAt: new Date().toISOString()\n        };\n\n        const response = await window.aivicApi.save('applications', applicationData);\n        \n        if (response.success) {\n          window.aivicNotify?.success('申請書類を提出しました。');\n          \n          // フォームをリセット\n          const form = container.querySelector('#application-form');\n          if (form) {\n            form.reset();\n          }\n          \n          // ファイルリストをクリア\n          if (fileList) {\n            fileList.innerHTML = '';\n          }\n        } else {\n          throw new Error(response.message || '提出に失敗しました。');\n        }\n      } catch (error) {\n        showError('申請書類の提出に失敗しました。');\n        console.error('Submit error:', error);\n      }\n    });\n  }\n\n  // 文書種別変更時の処理\n  const documentTypeSelect = container.querySelector('[data-testid=\"document-type-select\"]');\n  if (documentTypeSelect) {\n    documentTypeSelect.addEventListener('change', async (e) => {\n      const documentType = e.target.value;\n      \n      try {\n        // 文書種別に応じた承認フローの取得\n        if (classifyDocumentTypeAndRoute) {\n          const classification = classifyDocumentTypeAndRoute({\n            documentType,\n            amount: container.querySelector('#amount')?.value || '0',\n            department: container.querySelector('[name=\"departments\"]')?       },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
