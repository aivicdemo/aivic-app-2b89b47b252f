ror = container.querySelector('#file-error');\n    const allowedTypes = ['.pdf', '.doc', '.docx', '.xls', '.xlsx', '.jpg', '.jpeg', '.png'];\n    const maxSize = 10 * 1024 * 1024; // 10MB\n\n    for (let file of files) {\n      const extension = '.' + file.name.split('.').pop().toLowerCase();\n      \n      if (!allowedTypes.includes(extension)) {\n        if (fileError) {\n          fileError.textContent = 'サポートされていないファイル形式です。PDF、Word、Excel、画像ファイル（JPG、PNG）のみアップロード可能です。';\n          fileError.style.display = 'block';\n        }\n        return;\n      }\n      \n      if (file.size > maxSize) {\n        if (fileError) {\n          fileError.textContent = 'ファイルサイズが上限（10MB）を超えています。';\n          fileError.style.display = 'block';\n        }\n        return;\n      }\n      \n      selectedFiles.push(file);\n    }\n    \n    if (fileError) {\n      fileError.style.display = 'none';\n    }\n    updateFileList();\n  }\n\n  // ファイルリスト表示更新\n  function updateFileList() {\n    const fileList = container.querySelector('#file-list');\n    if (fileList) {\n      fileList.innerHTML = selectedFiles.map((file, index) => `\n        <div style=\"display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; background: rgba(0,0,0,0.15); border-radius: 4px; margin-bottom: 4px;\">\n          <span style=\"font-size: 12px; color: var(--text);\">${file.name} (${(file.size / 1024).toFixed(1)}KB)</span>\n          <button type=\"button\" class=\"remove-file\" data-index=\"${index}\" style=\"background: none; border: none; color: #ff6a00; cursor: pointer; font-size: 12px;\">削除</button>\n        </div>\n      `).join('');\n      \n      // ファイル削除ボタンのイベントリスナー\n      fileList.querySelectorAll('.remove-file').forEach(button => {\n        button.addEventListener('click', (e) => {\n          const index = parseInt(e.target.dataset.index);\n          selectedFiles.splice(index, 1);\n          updateFileList();\n        });\n      });\n    }\n  }\n\n  // バリデーション\n  function validateForm() {\n    let isValid = true;\n    const errors = {};\n\n    // 必須項目チェック\n    const titleInput = container.querySelector('input[data-testid=\"application-title\"]');\n    const applicantInput = container.querySelector('input[name=\"applicantName\"]');\n    const contentInput = container.querySelector('textarea[name=\"applicationContent\"]');\n    const typeSelect = container.querySelector('select[name=\"documentType\"]');\n\n    if (titleInput) {\n      const title = titleInput.value.trim();\n      if (!title) {\n        errors.title = '申請書類タイトルは必須です。';\n        isValid = false;\n      } else if (title.length > 100) {\n        errors.title = '申請書類タイトルは100文字以内で入力してください。';\n        isValid = false;\n      }\n    }\n\n    if (applicantInput && !applicantInput.value.trim()) {\n      errors.applicant = '申請者名は必須です。';\n      isValid = false;\n    }\n\n    if (contentInput) {\n      const content = contentInput.value.trim();\n      if (!content) {\n        errors.content = '申請内容は必須です。';\n        isValid = false;\n      } else if (content.length > 2000) {\n        errors.content = '申請内容は2000文字以内で入力してください。';\n        isValid = false;\n      }\n    }\n\n    if (typeSelect && !typeSelect.value) {\n      errors.type = '文書種別を選択してください。';\n      isValid = false;\n    }\n\n    // エラー表示\n    displayErrors(errors);\n    \n    return isValid;\n  }\n\n  // エラー表示\n  function displayErrors(errors) {\n    // エラーメッセージをクリア\n    container.querySelectorAll('.error-message').forEach(el => el.style.display = 'none');\n    \n    // 各エラーを表示\n    Object.keys(errors).forEach(key => {\n      const errorElement = container.querySelector(`#${key}-error`);\n      if (errorElement) {\n        errorElement.textContent = errors[key];\n        errorElement.style.display = 'block';\n      }\n    });\n\n    // 汎用エラーメッセージ\n    if (Object.keys(errors).length > 0) {\n      const generalError = container.querySelector('.error-message');\n      if (generalError) {\n        generalError.style.display = 'block';\n      }\n    }\n  }\n\n  // フォームデータ取得\n  function getFormData() {\n    const titleInput = container.querySelector('input[data-testid=\"application-title\"]');\n    const applicantInput = container.querySelector('input[name=\"applicantName\"]');\n    const contentInput = container.querySelector('textarea[name=\"applicationContent\"]');\n    const typeSelect = container.querySelector('select[name=\"documentType\"]');\n    const dateInput = container.querySelector('input[name=\"applicationDate\"]');\n    const deptSelect = container.querySelector('[data-testid=\"dept-general\"]');\n    const urgencyHigh = container.querySelector('input[data-testid=\"urgency-high\"]');\n\n    return {\n      title: titleInput ? titleInput.value.trim() : '',\n      applicantName: applicantInput ? applicantInput.value.trim() : '',\n      content: contentInput ? contentInput.value.trim() : '',\n      documentType: typeSelect ? typeSelect.value : '',\n      applicationDate: dateInput ? dateInput.value : '',\n      department: deptSelect ? deptSelect.value : '',\n      urgency: urgencyHigh && urgencyHigh.checked ? 'high' : 'normal',\n      files: selectedFiles,\n      userId: currentUserId\n    };\n  }\n\n  // 申請書類作成処理\n  async function createApplication() {\n    try {\n      if (!validateForm()) {\n        return;\n      }\n\n      const formData = getFormData();\n      \n      // 業務ロジックによる入力検証\n      if (validateApplicationInput) {\n        const validationResult = validateApplicationInput(formData);\n        if (!validationResult.isValid) {\n          window.aivicNotify.error(validationResult.message || '入力内容に問題があります');\n          return;\n        }\n      }\n\n      // 文書種別判定とルーティング\n      let processingRoute = 'standard';\n      if (determineDocumentTypeAndRoute) {\n        const routeResult = determineDocumentTypeAndRoute(formData);\n        processingRoute = routeResult.route || 'standard';\n      }\n\n      // 申請データを保存\n      const applicationData = {\n        ...formData,\n unction uploadFiles() {\n    try {\n      const fileInput = container.querySelector('input[data-testid=\"file-input\"]');\n      if (fileInput && fileInput.files.length > 0) {\n        handleFileUpload(Array.from(fileInput.files));\n        \n        // アップロード完了メッセージ\n        window.aivicNotify.success('ファイルがアップロードされました');\n      }\n    } catch (error) {\n      console.error('ファイルアップロードエラー:', error);\n      window.aivicNotify.error('ファイルのアップロードに失敗しました');\n    }\n  }\n\n  // フォームリセット\n  function resetForm() {\n    const form = container.querySelector('#application-form');\n    if (form) {\n      form.reset();\n    }\n    selectedFiles = [];\n    updateFileList();\n    setTodayDate();\n  }\n\n  // 初期化処理\n  function initialize() {\n    // 初期データ設定\n    loadCurrentUser();\n    setTodayDate();\n\n    // イベントリスナー設定\n    \n    // 申請書類作成ボタン\n    const createButton = container.querySelector('button:has-text(\"申請書類作成\")') || \n                        container.querySelector('button[type=\"submit\"]') ||\n                        Array.from(container.querySelectorAll('button')).find(btn => btn.textContent.includes('申請書類作成'));\n    if (createButton) {\n      createButton.addEventListener('click', (e) => {\n        e.preventDefault();\n        createApplication();\n      });\n    }\n\n    // 下書き保存ボタン\n    const draftButton = container.querySelector('button[data-testid=\"draft-button\"]') ||\n                       Array.from(container.querySelectorAll('button')).find(btn => btn.textContent.includes('下書き'));\n    if (draftButton) {\n      draftButton.addEventListener('click', (e) => {\n        e.preventDefault();\n        saveDraft();\n      });\n    }\n\n    // ファイルアップロードボタン\n    const uploadButton = container.querySelector('button[data-testid=\"upload-button\"]') ||\n                        Array.from(container.querySelectorAll('button')).find(btn => btn.textContent.includes('アップロード'));\n    if (uploadButton) {\n      uploadButton.addEventListener('click', (e) => {\n        e.preventDefault();\n        uploadFiles();\n      });\n    }\n\n    // ファイル入力\n    const fileInput = container.querySelector('input[data-testid=\"file-input\"]') ||\n                     container.querySelector('input[type=\"file\"]');\n    if (fileInput) {\n      fileInput.addEventListener('change', (e) => {\n        if (e.target.files.length > 0) {\n          handleFileUpload(Array.from(e.target.files));\n        }\n      });\n    }\n\n    // 文字数カウンター\n    const contentTextarea = container.querySelector('textarea[name=\"applicationContent\"]');\n    if (contentTextarea) {\n      contentTextarea.addEventListener('input', () => {\n        updateCounter('applicationContent', 'content-counter', 2000);\n      });\n    }\n\n    const titleInput = container.querySelector('input[data-testid=\"application-title\"]');\n    if (titleInput) {\n      titleInput.addEventListener('input', () => {\n        updateCounter('application-title', 'title-counter', 100);\n      });\n    }\n\n    // フォーム送信防止\n    const form = container.querySelector('#application-form');\n    if (form) {\n      form.addEventListener('submit', (e) => {\n        e.preventDefault();\n        createApplication();\n      });\n    }\n  }\n\n  // 初期化実行\n  initialize();\n\n  // 外部から呼び出し可能な関数を返す\n  return {\n    createApplication,\n    saveDraft,\n    uploadFiles,\n    resetForm,\n    validateForm,\n    getFormData\n  };\n}";

    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
