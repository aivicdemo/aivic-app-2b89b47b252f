    fileInput.value = '';\n      fileList.innerHTML = '';\n    } else {\n      fileList.innerHTML = validFiles.map(f => \n        `<div style=\"color: var(--text); font-size: 11px;\">📎 ${f.name} (${Math.round(f.size/1024)}KB)</div>`\n      ).join('');\n    }\n  });\n\n  // エラー表示\n  function showError(message) {\n    const errorDiv = container.querySelector(\"#error-message\");\n    errorDiv.textContent = message;\n    errorDiv.style.display = 'block';\n    setTimeout(() => {\n      errorDiv.style.display = 'none';\n    }, 5000);\n  }\n\n  // バリデーション\n  function validateForm() {\n    const title = container.querySelector(\"#title\").value.trim();\n    const documentType = container.querySelector(\"#document-type\").value;\n    const applicationDate = container.querySelector(\"#application-date\").value;\n    const contentDetail = container.querySelector(\"#content-detail\").value.trim();\n    const reason = container.querySelector(\"#reason\").value.trim();\n    const amount = container.querySelector(\"#amount\").value;\n    const urgency = container.querySelector('input[name=\"urgency\"]:checked');\n    const approvalFlow = container.querySelector(\"#approval-flow\").value;\n\n    if (!title) {\n      showError(\"申請書類タイトルを入力してください\");\n      return false;\n    }\n    \n    if (title.length > 100) {\n      showError(\"申請書類タイトルは100文字以内で入力してください\");\n      return false;\n    }\n\n    if (!documentType) {\n      showError(\"文書種別を選択してください\");\n      return false;\n    }\n\n    if (!applicationDate) {\n      showError(\"申請日付を選択してください\");\n      return false;\n    }\n\n    const selectedDate = new Date(applicationDate);\n    const todayDate = new Date(today);\n    if (selectedDate < todayDate) {\n      showError(\"過去の日付は選択できません\");\n      return false;\n    }\n\n    if (!contentDetail) {\n      showError(\"申請内容詳細を入力してください\");\n      return false;\n    }\n\n    if (contentDetail.length > 2000) {\n      showError(\"申請内容詳細は2000文字以内で入力してください\");\n      return false;\n    }\n\n    if (!reason) {\n      showError(\"申請理由を入力してください\");\n      return false;\n    }\n\n    if (reason.length > 1000) {\n      showError(\"申請理由は1000文字以内で入力してください\");\n      return false;\n    }\n\n    if (amount && (isNaN(amount) || parseFloat(amount) < 0)) {\n      showError(\"申請金額は正の数値を入力してください\");\n      return false;\n    }\n\n    if (amount && parseFloat(amount) > 9999999) {\n      showError(\"申請金額は9,999,999円以下で入力してください\");\n      return false;\n    }\n\n    if (!urgency) {\n      showError(\"緊急度を選択してください\");\n      return false;\n    }\n\n    if (!approvalFlow) {\n      showError(\"承認フローを選択してください\");\n      return false;\n    }\n\n    return true;\n  }\n\n  // フォームデータ収集\n  function collectFormData(status = '申請中') {\n    const subsidies = Array.from(container.querySelectorAll('input[name=\"subsidy\"]:checked')).map(cb => cb.value);\n    const departments = Array.from(container.querySelectorAll('input[name=\"departments\"]:checked')).map(cb => cb.value);\n    const urgency = container.querySelector('input[name=\"urgency\"]:checked')?.value;\n    const files = container.querySelector(\"#attachment\").files;\n    \n    return {\n      申請種別: container.querySelector(\"#document-type\").value,\n      申請タイトル: container.querySelector(\"#title\").value.trim(),\n      申請内容: container.querySelector(\"#content-detail\").value.trim(),\n      申請金額: container.querySelector(\"#amount\").value ? parseInt(container.querySelector(\"#amount\").value) : null,\n      申請開始日: container.querySelector(\"#application-date\").value + 'T00:00:00Z',\n      申請終了日: null,\n      承認状態: status,\n      現在承認者ID: null,\n      承認段階: 1,\n      最終承認者ID: null,\n      最終承認日時: null,\n      緊急フラグ: urgency === 'urgent' || urgency === 'high',\n      添付ファイル有無: files && files.length > 0,\n      備考: container.querySelector(\"#reason\").value.trim(),\n      作成者ID: 'current-user-id',\n      更新者ID: 'current-user-id'\n    };\n  }\n\n  // 下書き保存\n  container.querySelector(\"#btn-draft\").addEventListener(\"click\", async () => {\n    const title = container.querySelector(\"#title\").value.trim();\n    if (!title) {\n      showError(\"申請書類タイトルを入力してください\");\n      return;\n    }\n\n    const formData = collectFormData('下書き');\n    const saved = await window.aivicApi.save(1, formData); // 申請書類テーブル\n    \n    if (saved) {\n      alert(\"下書きを保存しました\");\n      // フォームをクリア\n      container.querySelector(\"#application-form\").reset();\n      container.querySelector(\"#applicant\").value = currentUser.name;\n      container.querySelector(\"#application-date\").value = today;\n      container.querySelector('input[name=\"urgency\"][value=\"normal\"]').checked = true;\n      container.querySelector(\"#file-list\").innerHTML = '';\n    }\n  });\n\n  // 申請書類作成\n  container.querySelector(\"#btn-submit\").addEventListener(\"click\", async () => {\n    if (!validateForm()) return;\n\n    const formData = collectFormData('申請中');\n    const saved = await window.aivicApi.save(1, formData); // 申請書類テーブル\n    \n    if (saved) {\n      alert(\"申請書類を作成しました\");\n      // フォームをクリア\n      container.querySelector(\"#application-form\").reset();\n      container.querySelector(\"#applicant\").value = currentUser.name;\n      container.querySelector(\"#application-date\").value = today;\n      container.querySelector('input[name=\"urgency\"][value=\"normal\"]').checked = true;\n      container.querySelector(\"#file-list\").innerHTML = '';\n    }\n  });\n\n  // キャンセル\n  container.querySelector(\"#btn-cancel\").addEventListener(\"click\", () => {\n    if (confirm(\"入力内容が失われますが、よろしいですか？\")) {\n      container.querySelector(\"#application-form\").reset();\n      container.querySelector(\"#applicant\").value = currentUser.name;\n      container.querySelector(\"#application-date\").value = today;\n      container.querySelector('input[name=\"urgency\"][value=\"normal\"]').checked = true;\n      container.querySelector(\"#file-list\").innerHTML = '';\n    }\n  });\n\n  // 書類アップロードボタン\n  container.querySelector(\"#btn-upload\").addEventListener(\"click\", () => {\n    window.showScreen(\"scr-1779422207222\");\n  });\n\n  // フォーカス時のスタイル適用\n  const inputs = container.querySelectorAll('input, select, textarea');\n  inputs.forEach(input => {\n    input.addEventListener('focus', () => {\n      input.style.outline = 'none';\n      input.style.borderColor = 'var(--primary)';\n      input.style.boxShadow = '0 0 0 2px rgba(255,255,255,0.08)';\n    });\n    \n    input.addEventListener('blur', () => {\n      input.style.borderColor = 'rgba(255,255,255,0.18)';\n      input.style.boxShadow = 'none';\n    });\n  });\n}";

    <script>
(function() {

  var APP_ID = window.AIVIC_APP_ID || "";

  // 通知 helper（SPA 版と同じ）

    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");

      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);

      error: function(msg) { show("❌ " + msg, "error"); },

        catch(e) { dbErr("更新"); return null; }
      },

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。

    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
