ector('#history-tbody');\n    if (!tbody) return;\n    \n    tbody.innerHTML = rows.map(r => `\n      <tr data-id=\"${r.通知履歴ID || r.id || ''}\">\n        <td>${r.送信日時 || ''}</td>\n        <td>${r.申請書類ID || ''}</td>\n        <td>${r.通知種別 || ''}</td>\n        <td>${r.通知対象者名 || ''}</td>\n        <td>${r.送信方法 || ''}</td>\n        <td><span style=\"padding: 2px 6px; border-radius: 4px; font-size: 11px; background: ${getNotificationStatusColor(r.送信状態)};\">${r.送信状態 || ''}</span></td>\n        <td>${r.既読フラグ ? '既読' : '未読'}</td>\n        <td><button class=\"action-btn secondary detail-btn\" data-id=\"${r.通知履歴ID || r.id || ''}\" style=\"font-size: 11px; padding: 4px 8px;\">詳細</button></td>\n      </tr>\n    `).join('');\n    \n    // 詳細ボタンのイベントリスナーを追加\n    tbody.querySelectorAll('.detail-btn').forEach(btn => {\n      btn.addEventListener('click', handleNotificationDetailClick);\n    });\n  }\n\n  function getStatusColor(status) {\n    switch(status) {\n      case '承認済み': return 'rgba(34, 197, 94, 0.2)';\n      case '却下': return 'rgba(239, 68, 68, 0.2)';\n      case '保留中': return 'rgba(251, 191, 36, 0.2)';\n      case '承認待ち': return 'rgba(59, 130, 246, 0.2)';\n      default: return 'rgba(156, 163, 175, 0.2)';\n    }\n  }\n\n  function getNotificationStatusColor(status) {\n    switch(status) {\n      case '送信完了': return 'rgba(34, 197, 94, 0.2)';\n      case '送信失敗': return 'rgba(239, 68, 68, 0.2)';\n      case '送信中': return 'rgba(251, 191, 36, 0.2)';\n      case '送信待ち': return 'rgba(156, 163, 175, 0.2)';\n      default: return 'rgba(156, 163, 175, 0.2)';\n    }\n  }\n\n  // タブ切り替え処理\n  function handleTabSwitch(tabType) {\n    try {\n      currentTab = tabType;\n      \n      // タブの見た目を更新\n      const approvalTab = container.querySelector('#tab-approval');\n      const notificationTab = container.querySelector('#tab-notification');\n      \n      if (tabType === 'approval') {\n        approvalTab?.classList.add('active');\n        notificationTab?.classList.remove('active');\n        \n        // 承認履歴のヘッダーを表示\n        const approvalHeader = container.querySelector('#approval-header');\n        const notificationHeader = container.querySelector('#notification-header');\n        if (approvalHeader) approvalHeader.style.display = '';\n        if (notificationHeader) notificationHeader.style.display = 'none';\n        \n        renderApprovalRows(filteredData.length > 0 ? filteredData : allApprovalData);\n      } else {\n        notificationTab?.classList.add('active');\n        approvalTab?.classList.remove('active');\n        \n        // 通知履歴のヘッダーを表示\n        const approvalHeader = container.querySelector('#approval-header');\n        const notificationHeader = container.querySelector('#notification-header');\n        if (approvalHeader) approvalHeader.style.display = 'none';\n        if (notificationHeader) notificationHeader.style.display = '';\n        \n        renderNotificationRows(filteredData.length > 0 ? filteredData : allNotificationData);\n      }\n      \n      // レコードリストを表示状態にする\n      const recordList = container.querySelector('[data-testid=\"record-list\"]');\n      if (recordList) {\n        recordList.style.display = 'block';\n      }\n      \n    } catch (error) {\n      console.error('タブ切り替えエラー:', error);\n      if (window.aivicNotify) {\n        window.aivicNotify.error('タブの切り替えに失敗しました');\n      }\n    }\n  }\n\n  // 検索処理\n  async function handleSearch() {\n    try {\n      // フォーム値を取得\n      const startDate = container.querySelector('[data-testid=\"start-date\"]')?.value || '';\n      const endDate = container.querySelector('[data-testid=\"end-date\"]')?.value || '';\n      const documentNumber = container.querySelector('[data-testid=\"document-number\"]')?.value || '';\n      const documentType = container.querySelector('[data-testid=\"document-type-select\"]')?.value || '';\n      const approverName = container.querySelector('[data-testid=\"approver-name\"]')?.value || '';\n      const approvalStatus = container.querySelector('[data-testid=\"approval-status-select\"]')?.value || '';\n      const notificationType = container.querySelector('[data-testid=\"notification-type-select\"]')?.value || '';\n\n      // 業務ロジックを使用して検索条件を検証\n      if (checkApprovalStatusViewPermission) {\n        const hasPermission = checkApprovalStatusViewPermission({\n          userId: window.currentUser?.id,\n          requestedStatus: approvalStatus\n        });\n        \n        if (!hasPermission) {\n          if (window.aivicNotify) {\n            window.aivicNotify.error('この状況の履歴を参照する権限がありません');\n          }\n          return;\n        }\n      }\n\n      let sourceData = currentTab === 'approval' ? allApprovalData : allNotificationData;\n      let filtered = [...sourceData];\n\n      // 期間フィルター\n      if (startDate || endDate) {\n        filtered = filtered.filter(item => {\n          const itemDate = currentTab === 'approval' ? item.承認日時 : item.送信日時;\n          if (!itemDate) return false;\n          \n          const date = new Date(itemDate);\n          if (startDate && date < new Date(startDate)) return false;\n          if (endDate && date > new Date(endDate)) return false;\n          return true;\n        });\n      }\n\n      // 申請書類番号フィルター（完全一致）\n      if (documentNumber) {\n        filtered = filtered.filter(item => item.申請書類ID === documentNumber);\n      }\n\n      // 文書種別フィルター\n      if (documentType) {\n        filtered = filtered.filter(item => \n          currentTab === 'approval' ? item.文書種別 === documentType : item.通知種別 === documentType\n        );\n      }\n\n      // 承認者名フィルター（部分一致）\n      if (approverName && currentTab === 'approval') {\n        filtered = filtered.filter(item => \n          item.承認者名 && item.承認者名.includes(approverName)\n        );\n      }\n\n      // 処理状況フィルター\n      if (approvalStatus && currentTab === 'approval') {\n        filtered = filtered.filter(item => item.承認結果 === approvalStatus);\n      }\n\n      // 通知種別フィルター\n      if (notificationType && currentTab === 'notification') {\n        filtered = filtered.filter(item => item.通知種別 === notificationType);\n      }\n\n      filteredData = filtered;\n\n      // 結果を表示\n      if (currentTab === 'approval') {\n        renderApprovalRows(filtered);\n      } else {\n        renderNotificationRows(filtered);\n      }\n\n      // レコードリストを表示\n      const recordList = container.querySelector('[data-testid=\"record-list\"]');\n      if (recordList) {\n        recordList.style.display = 'block';\n      }\n\n    } catch (error) {\n      console.error('検索エラー:', error);\n      if (window.aivicNotify) {\n        window.aivicNotify.error('検索処理でエラーが発生しました');\n      }\n      \n      // システム障害時の代替処理\n      if (handleSystemFailureAlternativeProcess) {\n        handleSystemFailureAlternativeProcess({\n          operation: 'search',\n          error: error.message\n        });\n      }\n    }\n  }\n\n  // 承認履歴詳細クリック処理\n  function handleApprovalDetailClick(event) {\n    try {\n      const id = event.target.getAttribute('data-id');\n      const record = allApprovalData.find(r => (r.承認履歴ID || r.id) === id);\n      \n      if (record && generateReminderMessage) {\n        // 業務ロジックを使用してリマインダーメッセージを生成\n        const reminderInfo = generateReminderMessage({\n          approvalRecord: record,\n          currentDate: new Date()\n        });\n        \n        if (window.aivicNotify) {\n          window.aivicNotify.info(`承認履歴詳細: ${reminderInfo.message || '詳細情報を表示しました'}`);\n        }\n      }\n      \n      console.log('承認履歴詳細:', record);\n    } catch (error) {\n      console.error('承認履歴詳細表示エラー:', error);\n      if (window.aivicNotify) {\n        window.aivicNotify.error('承認履歴の詳細表示でエラーが発生しました');\n      }\n    }\n  }\n\n  // 通知履歴詳細クリック処理\n  function handleNotificationDetailClick(event) {\n    try {\n      const id = event.target.getAttribute('data-id');\n      const record = allNotificationData.find(r => (r.通知履歴ID || r.id) === id);\n      \n      if (record && identifyNotificationRecipient) {\n        // 業務ロジックを使用して通知対象者を特定\n        const recipientInfo = identifyNotificationRecipient({\n          notificationRecord: record\n        });\n        \n        if (window.aivicNotify) {\n          window.aivicNotify.info(`通知履歴詳細: ${recipientInfo.message || '詳細情報を表示しました'}`);\n        }\n      }\n      \n      console.log('通知履歴詳細:', record);\n    } catch (error) {\n      console.error('通知履歴詳細表示エラー:', error);\n      if (window.aivicNotify) {\n        window.aivicNotify.error('通知履歴の詳細表示でエラーが発生しました');\n      }\n    }\n  }\n\n  // 初期データ読み込み\n  async function loadData() {\n    try {\n      // システム更新中の業務継続性を確保\n      if (ensureBusinessContinuityDuringSystemUpdate) {\n        const continuityCheck = ensureBusinessContinuityDuringSystemUpdate({\n          operation: 'dataLoad'\n        });\n        \n        if (!continuityCheck.canProceed) {\n          if (window.aivicNotify) {\n            window.aivicNotify.warning('システム更新中のため、一部機能が制限されています');\n          }\n        }\n      }\n\n      let approvalData, notificationData;\n\n      try {\n        approvalData = await window.aivicApi.list(4); // 承認履歴テーブル\n        notificationData = await window.aivicApi.list(5); // 通知履歴テーブル\n      } catch (apiError) {\n        console.warn('API呼び出しエラー、フォールバックデータを使用:', apiError);\n        \n        // システム障害時のフォールバック処理\n        if (handleSystemFailureFallback) {\n          const fallbackResult = handleSystemFailureFallback({\n            operation: 'dataLoad',\n            error: apiError.message\n          });\n          \n          if (fallbackResult.useLocalData) {\n            approvalData = tables[4]?.records || [];\n            notificationData = tables[5]?.records || [];\n          }\n        }\n      }\n      \n      allApprovalData = approvalData || tables[4]?.records || [];\n      allNotificationData = notificationData || tables[5]?.records || [];\n      \n      // 停滞申請を特定\n      if (identifyStagnantApplications && allApprovalData.length > 0) {\n        const stagnantApps = identifyStagnantApplications({\n          approvalRecords: allApprovalData,\n          currentDate: new Date()\n        });\n        \n        if (stagnantApps.length > 0) {\n          console.log('停滞している申請:', stagnantApps);\n        }\n      }\n      \n      // 初期表示\n      if (currentTab === 'approval') {\n        renderApprovalRows(allApprovalData);\n      } else {\n        renderNotificationRows(allNotificationData);\n      }\n      \n      // レコードリストを表示\n      const recordList = container.querySelector('[data-testid=\"record-list\"]');\n      if (recordList) {\n        recordList.style.display = 'block';\n      }\n      \n    } catch (error) {\n      console.error('データ読み込みエラー:', error);\n      if (window.aivicNotify) {\n        window.aivicNotify.error('データの読み込みに失敗しました');\n      }\n      \n      // エラー時はフォールバックデータを使用\n      allApprovalData = tables[4]?.records || [];\n      allNotificationData = tables[5]?.records || [];\n      \n      if (currentTab === 'approval') {\n        renderApprovalRows(allApprovalData);\n      } else {\n        renderNotificationRows(allNotificationData);\n      }\n    }\n  }\n\n  // イベントリスナーの設定\n  function setupEventListeners() {\n    // タブ切り替え\n    const approvalTab = container.querySelector('#tab-approval');\n    const notificationTab = container.querySelector('#tab-notification');\n    \n    if (approvalTab) {\n      approvalTab.addEventListener('click', () => handleTabSwitch('approval'));\n    }\n    \n    if (notificationTab) {\n      notificationTab.addEventListener('click', () => handleTabSwitch('notification'));\n    }\n\n    // 検索ボタン\n    const searchButton = container.querySelector('[data-testid=\"search-button\"]');\n    if (searchButton) {\n      searchButton.addEventListener('click', handleSearch);\n    }\n\n    // Enterキーでの検索\n    const searchInputs = container.querySelectorAll('[data-testid=\"start-date\"], [data-testid=\"end-date\"], [data-testid=\"document-number\"], [data-testid=\"approver-name\"]');\n    searchInputs.forEach(input => {\n      input.addEventListener('keypress', (event) => {\n        if (event.key === 'Enter') {\n          handleSearch();\n        }\n      });\n    });\n\n    // セレクトボックスの変更時検索\n    const selectInputs = container.querySelectorAll('[data-testid=\"document-type-select\"], [data-testid=\"approval-status-select\"], [data-testid=\"notification-type-select\"]');\n    selectInputs.forEach(select => {\n      select.addEventListener('change', handleSearch);\n    });\n  }\n\n  // 初期化処理\n  function initialize() {\n    try {\n      setupEventListeners();\n      loadData();\n      \n      // 初期タブ状態を設定\n      handleTabSwitch('approval');\n      \n    } catch (error) {\n      console.error('初期化エラー:', error);\n      if (window.aivicNotify) {\n        window.aivicNotify.error('画面の初期化に失敗しました');\n      }\n    }\n  }\n\n  // 初期化実行\n  initialize();\n\n  // 外部から呼び出し可能な関数を返す\n  return {\n    refresh: loadData,\n    switchTab: handleTabSwitch,\n    search: handleSearch\n  };\n}";

      document.body.appendChild(c);

      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");

    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
