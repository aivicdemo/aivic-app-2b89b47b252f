window.AIVIC_PAGE_INIT_JS = "js\nfunction(container, apiUrl, tables) {\n  // 業務ロジックのインポート（実際の環境では適切にインポート）\n  const { \n    classifyDocumentTypeAndRoute, \n    determineDocumentTypeAndRoute,\n    validateApplicationInput,\n    checkMoeComplianceRequirements \n  } = window.businessLogic || {};\n\n  let currentFile = null;\n  let detectionResult = null;\n\n  // DOM要素の取得\n  const uploadArea = container.querySelector('#upload-area');\n  const fileInput = container.querySelector('#file-input');\n  const btnSelectFile = container.querySelector('#btn-select-file');\n  const fileInfo = container.querySelector('#file-info');\n  const fileName = container.querySelector('#file-name');\n  const fileSize = container.querySelector('#file-size');\n  const processingStatus = container.querySelector('#processing-status');\n  const statusText = container.querySelector('#status-text');\n  const detectionResultDiv = container.querySelector('#detection-result');\n  const detectedType = container.querySelector('#detected-type');\n  const accuracyFill = container.querySelector('#accuracy-fill');\n  const accuracyText = container.querySelector('#accuracy-text');\n  const appliedRule = container.querySelector('#applied-rule');\n  const manualTypeSelect = container.querySelector('#manual-type-select');\n  const btnReprocess = container.querySelector('#btn-reprocess');\n  const btnConfirm = container.querySelector('#btn-confirm');\n  const errorMessage = container.querySelector('#error-message');\n  const errorText = container.querySelector('#error-text');\n  const previewArea = container.querySelector('#preview-area');\n  const approvalFlow = container.querySelector('#approval-flow');\n  const btnViewApproval = container.querySelector('#btn-view-approval');\n  const appliedRulesCount = container.querySelector('#applied-rules-count');\n  const matchConditions = container.querySelector('#match-conditions');\n  const confidenceLevel = container.querySelector('#confidence-level');\n  const historyList = container.querySelector('#history-list');\n\n  // 文書種別マスタの取得\n  const documentTypes = tables[2]?.records || [];\n  \n  // 判別ルールの取得\n  const detectionRules = tables[9]?.records || [];\n\n  // ファイルサイズフォーマット\n  function formatFileSize(bytes) {\n    if (bytes === 0) return '0 Bytes';\n    const k = 1024;\n    const sizes = ['Bytes', 'KB', 'MB', 'GB'];\n    const i = Math.floor(Math.log(bytes) / Math.log(k));\n    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];\n  }\n\n  // エラー表示\n  function showError(message) {\n    errorText.textContent = message;\n    errorMessage.style.display = 'block';\n    window.aivicNotify?.error(message);\n  }\n\n  // エラー非表示\n  function hideError() {\n    errorMessage.style.display = 'none';\n  }\n\n  // 履歴の初期表示\n  function renderHistory() {\n    const history = JSON.parse(localStorage.getItem('detectionHistory') || '[]');\n    if (history.length === 0) {\n      historyList.innerHTML = '<div style=\"color: var(--text-muted); text-align: center; padding: 16px;\">履歴がありません</div>';\n      return;\n    }\n\n    historyList.innerHTML = history.slice(-10).reverse().map(item => `\n      <div style=\"padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 8px;\">\n        <div style=\"font-weight: 500; color: var(--text); margin-bottom: 2px;\">${item.fileName}</div>\n        <div style=\"color: var(--text-muted); margin-bottom: 2px;\">${item.detectedType}</div>\n        <div style=\"color: var(--text-muted); font-size: 11px;\">${item.timestamp}</div>\n      </div>\n    `).join('');\n  }\n\n  // 文書種別選択肢の初期化\n  function initializeDocumentTypeSelect() {\n    if (manualTypeSelect) {\n      manualTypeSelect.innerHTML = '<option value=\"\">手動で選択...</option>';\n      documentTypes.forEach(type => {\n        const option = document.createElement('option');\n        option.value = type.id;\n        option.textContent = type.name;\n        manualTypeSelect.appendChild(option);\n      });\n    }\n  }\n\n  // ファイル選択処理\n  function handleFileSelect(file) {\n    if (!file) return;\n\n    currentFile = file;\n    fileName.textContent = file.name;\n    fileSize.textContent = formatFileSize(file.size);\n    fileInfo.style.display = 'block';\n    hideError();\n\n    // プレビュー表示\n    if (file.type.startsWith('image/')) {\n      const reader = new FileReader();\n      reader.onload = function(e) {\n        previewArea.innerHTML = `<img src=\"${e.target.result}\" style=\"max-width: 100%; max-height: 200px; object-fit: contain;\">`;\n      };\n      reader.readAsDataURL(file);\n    } else if (file.type === 'application/pdf') {\n      previewArea.innerHTML = '<div style=\"padding: 20px; text-align: center; color: var(--text-muted);\">PDF プレビュー</div>';\n    } else {\n      previewArea.innerHTML = '<div style=\"padding: 20px; text-align: center; color: var(--text-muted);\">プレビュー不可</div>';\n    }\n\n    // 自動判別実行\n    processDocumentDetection();\n  }\n\n  // 文書判別処理\n  async function processDocumentDetection() {\n    if (!currentFile) return;\n\n    try {\n      // 処理中表示\n      processingStatus.style.display = 'block';\n      statusText.textContent = '文書を解析中...';\n      detectionResultDiv.style.display = 'none';\n\n      // 業務ロジックを使用した文書分類\n      const fileContent = await readFileAsText(currentFile);\n      const classificationInput = {\n        fileName: currentFile.name,\n        fileContent: fileContent,\n        fileType: currentFile.type,\n        fileSize: currentFile.size\n      };\n\n      let result;\n      if (classifyDocumentTypeAndRoute) {\n        result = classifyDocumentTypeAndRoute(classificationInput, documentTypes, detectionRules);\n      } else {\n        // フォールバック処理\n        result = await mockDocumentClassification(classificationInput);\n      }\n\n      detectionResult = result;\n\n      // 結果表示\n      displayDetectionResult(result);\n\n      // 履歴に追加\n      addToHistory(currentFile.name, result.documentType, result.confidence);\n\n    } catch (error) {\n      console.error('文書判別エラー:', error);\n      showError('文書の判別処理中にエラーが発生しました: ' + error.message);\n    } finally {\n      processingStatus.style.display = 'none';\n    }\n  }\n\n  // ファイル内容読み取り\n  function readFileAsText(file) {\n    return new Promise((resolve, reject) => {\n      const reader = new FileReader();\n      reader.onload = () => resolve(reader.result);\n      reader.onerror = reject;\n      reader.readAsText(file);\n    });\n  }\n\n  // モック文書分類（業務ロジックが利用できない場合）\n  async function mockDocumentClassification(input) {\n    await new Promise(resolve => setTimeout(resolve, 1500)); // 処理時間をシミュレート\n    \n    const mockTypes = ['申請書', '報告書', '契約書', '請求書'];\n    const randomType = mockTypes[Math.floor(Math.random() * mockTypes.length)];\n    const confidence = Math.floor(Math.random() * 30) + 70; // 70-99%\n    \n    return {\n      documentType: randomType,\n      confidence: confidence,\n      appliedRules: ['ファイル名パターン', 'キーワード検出'],\n      matchConditions: ['タイトルに「申請」を含む', '署名欄を検出'],\n      route: 'standard'\n    };\n  }\n\n  // 判別結果表示\n  function displayDetectionResult(result) {\n    detectedType.textContent = result.documentType;\n    accuracyFill.style.width = result.confidence + '%';\n    accuracyText.textContent = result.confidence + '%';\n    \n    if (result.appliedRules) {\n      appliedRule.textContent = result.appliedRules.join(', ');\n      appliedRulesCount.textContent = result.appliedRules.length;\n    }\n    \n    if (result.matchConditions) {\n      matchConditions.innerHTML = result.matchConditions.map(condition => \n        `<div style=\"margin-bottom: 4px;\">• ${condition}</div>`\n      ).join('');\n    }\n\n    // 信頼度レベル表示\n    let levelText = '高';\n    let levelColor = 'var(--success)';\n    if (result.confidence < 70) {\n      levelText = '低';\n      levelColor = 'var(--error)';\n    } else if (result.confidence < 85) {\n      levelText = '中';\n      levelColor = 'var(--warning)';\n    }\n    confidenceLevel.textContent = levelText;\n    confidenceLevel.style.color = levelColor;\n\n    detectionResultDiv.style.display = 'block';\n    \n    // 承認フロー表示\n    if (result.route) {\n      displayApprovalFlow(result.route);\n    }\n  }\n\n  // 承認フロー表示\n  function displayApprovalFlow(route) {\n    const flowSteps = getApprovalSteps(route);\n    approvalFlow.innerHTML = flowSteps.map((step, index) => `\n      <div style=\"display: flex; align-items: center; margin-bottom: 8px;\">\n        <div style=\"width: 24px; height: 24px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 12px; margin-right: 8px;\">\n          ${index + 1}\n        </div>\n        <div>${step}</div>\n      </div>\n    `).join('');\n  }\n\n  // 承認ステップ取得\n  function getApprovalSteps(route) {\n    const routes = {\n      standard: ['課長承認', '部長承認'],\n      urgent: ['部長承認'],\n      complex: ['課長承認', '部長承認', '役員承認']\n    };\n    return routes[route] || routes.standard;\n  }\n\n  // 履歴追加\n  function addToHistory(fileName, docType, confidence) {\n    const history = JSON.parse(localStorage.getItem('detectionHistory') || '[]');\n    history.push({\n      fileName: fileName,\n      detectedType: docType,\n      confidence: confidence,\n      timestamp: new Date().toLocaleString('ja-JP')\n    });\n    localStorage.setItem('detectionHistory', JSON.stringify(history));\n    renderHistory();\n  }\n\n  // 再処理\n  async function handleReprocess() {\n    if (!currentFile) return;\n    \n    const manualType = manualTypeSelect.value;\n    if (manualType) {\n      // 手動選択された種別で再処理\n      const selectedType = documentTypes.find(type => type.id === manualType);\n      if (selectedType) {\n        detectionResult = {\n          documentType: selectedType.name,\n          confidence: 100,\n          appliedRules: ['手動選択'],\n          matchConditions: ['ユーザーによる手動選択'],\n          route: 'standard'\n        };\n        displayDetectionResult(detectionResult);\n      }\n    } else {\n      // 自動判別を再実行\n      await processDocumentDetection();\n    }\n  }\n\n  // 確定処理\n  async function handleConfirm() {\n    if (!detectionResult || !currentFile) {\n      showError('判別結果がありません');\n      return;\n    }\n\n    try {\n      // 業務ロジックによる最終検証\n      if (validateApplicationInput) {\n        const validation = validateApplicationInput({\n          documentType: detectionResult.documentType,\n          fileName: currentFile.name,\n          confidence: detectionResult.confidence\n        });\n        \n        if (!validation.isValid) {\n          showError('入力検証エラー: ' + validation.errors.join(', '));\n          return;\n        }\n      }\n\n      // 文書情報を保存\n      const documentData = {\n        fileName: currentFile.name,\n        fileSize: currentFile.size,\n        documentType: detectionResult.documentType,\n        confidence: detectionResult.confidence,\n        appliedRules: detectionResult.appliedRules,\n        route: detectionResult.route,\n        createdAt: new Date().toISOString()\n      };\n\n      await window.aivicApi.save('documents', documentData);\n      \n      window.aivicNotify?.success('文書が正常に登録されました');\n      \n      // フォームリセット\n      resetForm();\n      \n    } catch (error) {\n      console.error('確定処理エラー:', error);\n      showError('文書の登録中にエラーが発生しました: ' + error.message);\n    }\n  }\n\n  // フォームリセット\n  function resetForm() {\n    currentFile = null;\n    detectionResult = null;\n    fileInput.value = '';\n    fileInfo.style.display = 'none';\n    detectionResultDiv.style.display = 'none';\n    processingStatus.style.display = 'none';\n    previewArea.innerHTML = '';\n    manualTypeSelect.value = '';\n    hideError();\n  }\n\n  // イベントリスナー設定\n  if (btnSelectFile) {\n    btnSelectFile.addEventListener('click', () => {\n      fileInput?.click();\n    });\n  }\n\n  if (fileInput) {\n    fileInput.addEventListener('change', (e) => {\n      const file = e.target.files[0];\n      if (file) {\n        handleFileSelect(file);\n      }\n    });\n  }\n\n  if (uploadArea) {\n    uploadArea.addEventListener('dragover', (e) => {\n      e.preventDefault();\n      uploadArea.style.borderColor = 'var(--primary)';\n    });\n\n    uploadArea.addEventListener('dragleave', (e) => {\n      e.preventDefault();\n      uploadArea.style.borderColor = 'rgba(255,255,255,0.2)';\n    });\n\n    uploadArea.addEventListener('drop', (e) => {\n      e.preventDefault();\n      uploadArea.style.borderColor = 'rgba(255,255,255,0.2)';\n      const file = e.dataTransfer.files[0];\n      if (file) {\n        fileInput.files = e.dataTransfer.files;\n        handleFileSelect(file);\n      }\n    });\n  }\n\n  if (btnReprocess) {\n    btnReprocess.addEventListener('click', handleReprocess);\n  }\n\n  if (btnConfirm) {\n    btnConfirm.addEventListener('click', handleConfirm);\n  }\n\n  if (btnViewApproval) {\n    btnViewApproval.addEventListener('click', () => {\n      if (detectionResult) {\n        window.aivicNotify?.info('承認フロー詳細画面を表示します');\n        // 実際の画面遷移処理をここに追加\n      }\n    });\n  }\n\n  // 初期化処理\n  initializeDocumentTypeSelect();\n  renderHistory();\n}";
</script>
