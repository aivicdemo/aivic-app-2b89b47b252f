('input[type=\"date\"]:first-of-type');\n  const endDateInput = container.querySelector('input[type=\"date\"]:last-of-type');\n  const searchButton = container.querySelector('button:contains(\"検索\")') || container.querySelector('button');\n  const clearButton = container.querySelector('button:contains(\"クリア\")') || container.querySelectorAll('button')[1];\n  const applicationTable = container.querySelector('table');\n  const applicationTableBody = applicationTable ? applicationTable.querySelector('tbody') : null;\n\n  // 初期データ読み込み\n  loadApplicationData();\n\n  // 検索ボタンのイベントハンドラ\n  if (searchButton) {\n    searchButton.addEventListener('click', handleSearch);\n  }\n\n  // クリアボタンのイベントハンドラ\n  if (clearButton) {\n    clearButton.addEventListener('click', handleClear);\n  }\n\n  // 申請データの読み込み\n  function loadApplicationData() {\n    const searchParams = getSearchParams();\n    \n    window.aivicApi.list('applications', searchParams)\n      .then(response => {\n        if (response.success) {\n          displayApplications(response.data);\n        } else {\n          window.aivicNotify.error('申請データの取得に失敗しました');\n        }\n      })\n      .catch(error => {\n        console.error('API Error:', error);\n        window.aivicNotify.error('申請データの取得中にエラーが発生しました');\n      });\n  }\n\n  // 検索条件の取得\n  function getSearchParams() {\n    return {\n      applicationId: applicationIdInput ? applicationIdInput.value : '',\n      applicantName: applicantNameInput ? applicantNameInput.value : '',\n      status: statusSelect ? statusSelect.value : '',\n      startDate: startDateInput ? startDateInput.value : '',\n      endDate: endDateInput ? endDateInput.value : ''\n    };\n  }\n\n  // 検索処理\n  function handleSearch() {\n    try {\n      const searchParams = getSearchParams();\n      \n      // 入力値の検証\n      const validationResult = validateApplicationInput(searchParams);\n      if (!validationResult.isValid) {\n        window.aivicNotify.error(validationResult.message);\n        return;\n      }\n\n      // 権限チェック\n      const permissionResult = checkApprovalStatusViewPermission({\n        userId: window.currentUser?.id,\n        role: window.currentUser?.role\n      });\n      \n      if (!permissionResult.hasPermission) {\n        window.aivicNotify.error('検索権限がありません');\n        return;\n      }\n\n      loadApplicationData();\n      \n    } catch (error) {\n      console.error('Search Error:', error);\n      window.aivicNotify.error('検索処理中にエラーが発生しました');\n    }\n  }\n\n  // クリア処理\n  function handleClear() {\n    if (applicationIdInput) applicationIdInput.value = '';\n    if (applicantNameInput) applicantNameInput.value = '';\n    if (statusSelect) statusSelect.value = '';\n    if (startDateInput) startDateInput.value = '';\n    if (endDateInput) endDateInput.value = '';\n    \n    loadApplicationData();\n  }\n\n  // 申請データの表示\n  function displayApplications(applications) {\n    if (!applicationTableBody) return;\n\n    applicationTableBody.innerHTML = '';\n\n    applications.forEach(application => {\n      try {\n        // 書類分類とルーティング\n        const classificationResult = classifyDocumentTypeAndRoute(application);\n        const routeResult = determineDocumentTypeAndRoute(application);\n        \n        // 承認階層の決定\n        const hierarchyResult = determineApprovalHierarchy({\n          amount: application.amount,\n          documentType: classificationResult.documentType,\n          department: application.department\n        });\n\n        // 進捗データの取得（アクセス制御付き）\n        const progressData = getProgressDataWithAccessControl({\n          applicationId: application.id,\n          userId: window.currentUser?.id,\n          role: window.currentUser?.role\n        });\n\n        const row = document.createElement('tr');\n        row.innerHTML = `\n          <td>${application.id}</td>\n          <td>${application.applicantName}</td>\n          <td>${classificationResult.documentType}</td>\n          <td>${application.amount ? application.amount.toLocaleString() : '-'}</td>\n          <td><span class=\"status-badge status-${application.status}\">${getStatusText(application.status)}</span></td>\n          <td>${application.applicationDate}</td>\n          <td>${progressData.currentApprover || '-'}</td>\n          <td>\n            <button class=\"btn-sm\" onclick=\"viewApplication('${application.id}')\">詳細</button>\n            <button class=\"btn-sm\" onclick=\"processApplication('${application.id}')\">処理</button>\n          </td>\n        `;\n\n        // 停滞申請の識別\n        const stagnantResult = identifyStagnantApplications([application]);\n        if (stagnantResult.stagnantApplications.length > 0) {\n          row.classList.add('stagnant-application');\n        }\n\n        applicationTableBody.appendChild(row);\n\n      } catch (error) {\n        console.error('Application Display Error:', error);\n        const row = document.createElement('tr');\n        row.innerHTML = `\n          <td>${application.id}</td>\n          <td>${application.applicantName}</td>\n          <td colspan=\"6\">表示エラー</td>\n        `;\n        applicationTableBody.appendChild(row);\n      }\n    });\n  }\n\n  // ステータステキストの取得\n  function getStatusText(status) {\n    const statusMap = {\n      'draft': '下書き',\n      'submitted': '申請中',\n      'reviewing': '審査中',\n      'approved': '承認済み',\n      'rejected': '却下',\n      'pending': '保留'\n    };\n    return statusMap[status] || status;\n  }\n\n  // 申請詳細表示\n  window.viewApplication = function(applicationId) {\n    try {\n      // 権限チェック\n      const permissionResult = checkApprovalStatusViewPermission({\n        userId: window.currentUser?.id,\n        role: window.currentUser?.role,\n        applicationId: applicationId\n      });\n      \n      if (!permissionResult.hasPermission) {\n        window.aivicNotify.error('詳細表示権限がありません');\n        return;\n      }\n\n      window.aivicApi.list('applications', { id: applicationId })\n        .then(response => {\n          if (response.success && response.data.length > 0) {\n            const application = response.data[0];\n            showApplicationDetail(application);\n          } else {\n            window.aivicNotify.error('申請データが見つかりません');\n          }\n        })\n        .catch(error => {\n          console.error('API Error:', error);\n          window.aivicNotify.error('申請データの取得に失敗しました');\n        });\n\n    } catch (error) {\n      console.error('View Application Error:', error);\n      window.aivicNotify.error('申請詳細表示中にエラーが発生しました');\n    }\n  };\n\n  // 申請処理\n  window.processApplication = function(applicationId) {\n    try {\n      window.aivicApi.list('applications', { id: applicationId })\n        .then(response => {\n          if (response.success && response.data.length > 0) {\n            const application = response.data[0];\n            \n            // 申請前検証\n            const validationResult = validateApplicationBeforeSubmission(application);\n            if (!validationResult.isValid) {\n              window.aivicNotify.error(validationResult.message);\n              return;\n            }\n\n            // 緊急申請の優先処理\n            const urgentResult = processUrgentApplicationPriority(application);\n            if (urgentResult.isUrgent) {\n              window.aivicNotify.info('緊急申請として優先処理されます');\n            }\n\n            // 承認期限の設定\n            const deadlineResult = setApprovalDeadline({\n              applicationId: application.id,\n              documentType: application.documentType,\n              isUrgent: urgentResult.isUrgent\n            });\n\n            // 次の承認者の決定\n            const nextApproverResult = determineNextApprover({\n              currentStage: application.currentStage,\n              amount: application.amount,\n              department: application.department\n            });\n\n            // 処理画面への遷移\n            showProcessingScreen(application, nextApproverResult);\n\n          } else {\n            window.aivicNotify.error('申請データが見つかりません');\n          }\n        })\n        .catch(error => {\n          console.error('API Error:', error);\n          window.aivicNotify.error('申請データの取得に失敗しました');\n        });\n\n    } catch (error) {\n      console.error('Process Application Error:', error);\n      \n      // システム障害時の代替処理\n      const alternativeResult = handleSystemFailureAlternativeProcess({\n        applicationId: applicationId,\n        errorType: 'processing_error'\n      });\n      \n      if (alternativeResult.alternativeAvailable) {\n        window.aivicNotify.info('代替処理を実行します');\n      } else {\n        window.aivicNotify.error('申請処理中にエラーが発生しました');\n      }\n    }\n  };\n\n  // 申請詳細画面の表示\n  function showApplicationDetail(application) {\n    // 詳細画面の実装（省略）\n    console.log('Show application detail:', application);\n  }\n\n  // 処理画面の表示\n  function showProcessingScreen(application, nextApprover) {\n    // 処理画面の実装（省略）\n    console.log('Show processing screen:', application, nextApprover);\n  }\n}";

    <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();
