ets) {\n          try {\n            const notificationTargets = determineNotificationTargets(currentApplications);\n            currentApplications = notificationTargets;\n          } catch (error) {\n            console.warn('業務ロジック呼び出しエラー:', error);\n          }\n        }\n\n        renderApplicationList();\n      } else {\n        window.aivicNotify?.error('申請データの取得に失敗しました');\n      }\n    } catch (error) {\n      console.error('検索エラー:', error);\n      \n      // システム障害時の代替処理\n      if (handleSystemFailureAlternativeProcess) {\n        try {\n          const fallbackResult = handleSystemFailureAlternativeProcess({\n            operation: 'search',\n            params: { applicationId: searchApplicationIdInput?.value, status: filterStatusSelect?.value }\n          });\n          if (fallbackResult.success) {\n            currentApplications = fallbackResult.data || [];\n            renderApplicationList();\n            return;\n          }\n        } catch (fallbackError) {\n          console.error('代替処理エラー:', fallbackError);\n        }\n      }\n      \n      window.aivicNotify?.error('検索処理でエラーが発生しました');\n    }\n  }\n\n  // 申請一覧の描画\n  function renderApplicationList() {\n    if (!notificationTargetTbody) return;\n\n    notificationTargetTbody.innerHTML = '';\n\n    currentApplications.forEach((app, index) => {\n      const row = document.createElement('tr');\n      row.innerHTML = `\n        <td>\n          <input type=\"checkbox\" data-app-id=\"${app.id}\" data-index=\"${index}\">\n        </td>\n        <td>${app.application_id || app.申請番号 || ''}</td>\n        <td>${app.applicant_name || app.申請者名 || ''}</td>\n        <td>${app.final_approval_date || app.最終承認日時 || ''}</td>\n        <td>${app.notification_status || app.通知状況 || '未通知'}</td>\n      `;\n      notificationTargetTbody.appendChild(row);\n\n      // チェックボックスのイベントリスナー\n      const checkbox = row.querySelector('input[type=\"checkbox\"]');\n      checkbox?.addEventListener('change', (e) => {\n        if (e
