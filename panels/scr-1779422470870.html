<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ハイブリッド申請承認システム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-main: #ffffff;
            --bg-card: #f8fafc;
            --bg-sidebar: #f1f5f9;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-muted: #64748b;
            --text-light: #94a3b8;
            --top-bar-bg: #ffffff;
            --top-bar-border: #e2e8f0;
            --success: #059669;
            --warning: #d97706;
            --danger: #dc2626;
            --radius: 8px;
            --radius-sm: 6px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 13px;
            line-height: 1.4;
            color: var(--text);
            background: var(--bg-main);
        }

        .app-layout {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--top-bar-bg);
        }

        .logo {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }

        .nav-section {
            padding: 12px 0;
        }

        .nav-section-title {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0 16px 8px;
        }

        .nav-item {
            display: block;
            padding: 6px 16px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .nav-item:hover {
            background: rgba(59, 130, 246, 0.08);
            color: var(--primary);
        }

        .nav-item.aivic-active {
            background: rgba(59, 130, 246, 0.12);
            color: var(--primary);
            font-weight: 500;
            border-right: 2px solid var(--primary);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            height: 52px;
            background: var(--top-bar-bg);
            border-bottom: 1px solid var(--top-bar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .breadcrumb {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 500;
        }

        .logout-link {
            font-size: 12px;
            color: var(--text-muted);
            text-decoration: none;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            transition: background 0.15s ease;
        }

        .logout-link:hover {
            background: var(--bg-card);
        }

        .content-area {
            flex: 1;
            overflow: auto;
            padding: 16px 20px;
        }

        .panel-container {
            height: 100%;
            background: var(--bg-main);
        }

        .status-indicator {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .status-pending { background: var(--warning); }
        .status-approved { background: var(--success); }
        .status-rejected { background: var(--danger); }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .badge-primary {
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary);
        }

        .badge-success {
            background: rgba(5, 150, 105, 0.1);
            color: var(--success);
        }

        .badge-warning {
            background: rgba(217, 119, 6, 0.1);
            color: var(--warning);
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            margin-bottom: 12px;
        }

        .card-header {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
            background: var(--bg-main);
            color: var(--text);
        }

        .btn:hover {
            background: var(--bg-card);
            border-color: var(--primary);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .table th,
        .table td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .table th {
            font-weight: 500;
            color: var(--text-muted);
            background: var(--bg-card);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .table tbody tr:hover {
            background: rgba(59, 130, 246, 0.02);
        }

        .loading-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--text-light);
            font-size: 12px;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            
            .content-area {
                padding: 12px 16px;
            }
        }
    </style>

id","required":true,"description":"適用される承認フロー定義への外部キー"},{"name":"現在ステップ番号","type":"integer","required":true,"description":"現在処理中の承認ステップ番号"},{"name":"現在承認者ID","type":"uuid","required":false,"description":"現在の承認担当者のユーザーID"},{"name":"処理状況","type":"varchar(100)","required":true,"description":"処理の現在状況（申請中/承認待ち/承認済み/差戻し/却下/取下げ）"},{"name":"開始日時","type":"timestamp","required":true,"description":"処理ルートの開始日時"},{"name":"完了日時","type":"timestamp","required":false,"description":"処理ルートの完了日時"},{"name":"期限日時","type":"timestamp","required":false,"description":"処理完了の期限日時"},{"name":"優先度","type":"integer","required":true,"description":"処理の優先度（1:低 2:通常 3:高 4:緊急）"},{"name":"自動処理フラグ","type":"boolean","required":true,"description":"自動処理対象かどうかのフラグ"},{"name":"備考","type":"text","required":false,"description":"処理ルートに関する備考・メモ"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"遅延検知設定","purpose":"申請承認プロセスにおける遅延を検知するための設定を管理し、承認ステップごとの期限や通知タイミングを定義する","columns":[{"name":"遅延検知設定ID","type":"uuid","required":true,"description":"遅延検知設定の一意識別子（主キー）"},{"name":"文書種別ID","type":"uuid","required":true,"description":"文書種別マスタへの外部キー"},{"name":"承認ステップID","type":"uuid","required":false,"description":"承認ステップへの外部キー（全ステップ共通の場合はNULL）"},{"name":"設定名","type":"varchar(100)","required":true,"description":"遅延検知設定の名称"},{"name":"期限日数","type":"integer","required":true,"description":"承認期限までの日数"},{"name":"警告日数","type":"integer","required":false,"description":"期限前の警告通知を行う日数"},{"name":"エスカレーション日数","type":"integer","required":false,"description":"期限超過後のエスカレーション通知を行う日数"},{"name":"営業日計算フラグ","type":"boolean","required":true,"description":"営業日ベースで計算するかどうか"},{"name":"有効フラグ","type":"boolean","required":true,"description":"設定が有効かどうか"},{"name":"備考","type":"text","required":false,"description":"設定に関する補足説明"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"補助金関連度マスタ","purpose":"申請書類と補助金制度の関連度を管理し、適切な承認フローや処理ルートの決定に使用するマスタテーブル","columns":[{"name":"補助金関連度ID","type":"uuid","required":true,"description":"補助金関連度の一意識別子（主キー）"},{"name":"補助金関連度コード","type":"varchar(100)","required":true,"description":"補助金関連度の業務コード（表示・検索用）"},{"name":"補助金関連度名","type":"varchar(100)","required":true,"description":"補助金関連度の名称"},{"name":"関連度レベル","type":"integer","required":true,"description":"関連度の数値レベル（1:低、2:中、3:高など）"},{"name":"説明","type":"text","required":false,"description":"補助金関連度の詳細説明"},{"name":"表示順","type":"integer","required":true,"description":"画面表示時の並び順"},{"name":"有効フラグ","type":"boolean","required":true,"description":"マスタデータの有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]}];

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  const tbody = container.querySelector(\"#application-tbody\");\n  let selectedApplications = new Set();\n\n  // 1. 再描画関数の定義\n  function renderApplications(applications) {\n    tbody.innerHTML = applications.map(app => {\n      const user = tables[0].records.find(u => u.id === app.申請者ID) || {};\n      const docType = tables[2].records.find(dt => dt.id === app.文書種別ID) || {};\n      const notificationStatus = getNotificationStatus(app.id);\n      \n      return `\n        <tr data-id=\"${app.id}\" style=\"height: 36px;\">\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">\n            <input type=\"checkbox\" class=\"app-checkbox\" data-id=\"${app.id}\" style=\"accent-color: var(--primary);\">\n          </td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${app.申請番号 || \"\"}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${user.ユーザー名 || \"\"}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">${docType.文書種別名 || \"\"}</td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">\n            <span style=\"padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 500; \n              ${app.承認状態 === '承認済' ? 'background: rgba(34, 197, 94, 0.15); color: #22c55e;' : \n                app.承認状態 === '却下' ? 'background: rgba(239, 68, 68, 0.15); color: #ef4444;' : \n                'background: rgba(251, 191, 36, 0.15); color: #fbbf24;'}\">\n              ${app.承認状態 || \"\"}\n            </span>\n          </td>\n          <td style=\"padding: 6px 10px; font-size: 13px; color: var(--text);\">\n            ${app.最終承認日時 ? new Date(app.最終承認日時).toLocaleString('ja-JP') : \"\"}\n          </td>\n          <td style=\"padding: 6px 10px; font-size: 13px;\">\n            <span style=\"padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 500; \n              ${notificationStatus === '送信済' ? 'background: rgba(34, 197, 94, 0.15); color: #22c55e;' : \n                'background: rgba(156, 163, 175, 0.15); color: #9ca3af;'}\">\n              ${notificationStatus}\n            </span>\n          </td>\n        </tr>\n      `;\n    }).join(\"\");\n  }\n\n  // 通知状況を取得する関数\n  function getNotificationStatus(applicationId) {\n    const notifications = tables[6].records.filter(n => n.申請書類ID === applicationId);\n    if (notifications.length === 0) return \"未送信\";\n    const latestNotification = notifications.sort((a, b) => new Date(b.送信日時) - new Date(a.送信日時))[0];\n    return latestNotification.送信状態 === '送信完了' ? '送信済' : '送信中';\n  }\n\n  // 2. 初期データ読み込み\n  window.aivicApi.list(1).then(applications => {\n    if (applications) {\n      // 承認済み・却下・差戻しの申請のみ表示\n      const completedApplications = applications.filter(app => \n        ['承認済', '却下', '差戻し'].includes(app.承認状態)\n      );\n      renderApplications(completedApplications);\n    }\n  });\n\n  // 3. 検索機能\n  container.querySelector(\"#btn-search\").addEventListener(\"click\", async () => {\n    const applicationId = container.querySelector(\"#search-application-id\").value;\n    const status = container.querySelector(\"#filter-status\").value;\n    const docType = container.querySelector(\"#filter-document-type\").value;\n\n    const applications = await window.aivicApi.list(1);\n    if (!applications) return;\n\n    let filtered = applications.filter(app => \n      ['承認済', '却下', '差戻し'].includes(app.承認状態)\n    );\n\n    if (applicationId) {\n      filtered = filtered.filter(app => \n        app.申請番号 && app.申請番号.includes(applicationId)\n      );\n    }\n\n    if (status) {\n      filtered = filtered.filter(app => app.承認状態 === status);\n    }\n\n    if (docType) {\n      const docTypeRecord = tables[2].records.find(dt => dt.文書種別名 === docType);\n      if (docTypeRecord) {\n        filtered = filtered.filter(app => app.文書種別ID === docTypeRecord.id);\n      }\n    }\n\n    renderApplications(filtered);\n  });\n\n  // 4. チェックボックス選択処理\n  container.addEventListener(\"change\", (e) => {\n    if (e.target.classList.contains(\"app-checkbox\")) {\n      const appId = e.target.dataset.id;\n      if (e.target.checked) {\n        selectedApplications.add(appId);\n      } else {\n        selectedApplications.delete(appId);\n      }\n      updateNotificationPreview();\n    }\n  });\n\n  // 5. 通知テンプレート変更処理\n  container.querySelector(\"#notification-template\").addEventListener(\"change\", (e) => {\n    updateNotificationPreview();\n  });\n\n  // 通知内容プレビュー更新\n  function updateNotificationPreview() {\n    const template = container.querySelector(\"#notification-template\").value;\n    const subjectInput = container.querySelector(\"#notification-subject\");\n    const contentTextarea = container.querySelector(\"#notification-content\");\n\n    if (selectedApplications.size === 0) {\n      subjectInput.value = \"\";\n      contentTextarea.value = \"\";\n      return;\n    }\n\n    let subject = \"\";\n    let content = \"\";\n\n    switch (template) {\n      case \"approval\":\n        subject = \"【承認完了】申請が承認されました\";\n        content = `申請者様\n\nお疲れ様です。\nご提出いただいた申請について、承認が完了いたしましたのでお知らせします。\n\n承認された申請: ${selectedApplications.size}件\n\n今後ともよろしくお願いいたします。\n\nハイブリッド申請承認システム`;\n        break;\n      case \"rejection\":\n        subject = \"【却下通知】申請が却下されました\";\n        content = `申請者様\n\nお疲れ様です。\nご提出いただいた申請について、却下となりましたのでお知らせします。\n\n却下された申請: ${selectedApplications.size}件\n\n詳細については承認者までお問い合わせください。\n\nハイブリッド申請承認システム`;\n        break;\n      case \"return\":\n        subject = \"【差戻し通知】申請が差戻されました\";\n        content = `申請者様\n\nお疲れ様です。\nご提出いただいた申請について、差戻しとなりましたのでお知らせします。\n\n差戻された申請: ${selectedApplications.size}件\n\n修正後、再度ご提出ください。\n\nハイブリッド申請承認システム`;\n        break;\n    }\n\n    subjectInput.value = subject;\n    contentTextarea.value = content;\n  }\n\n  // 6. 通知送信処理\n  container.querySelector(\"#btn-send-notification\").addEventListener(\"click\", async () => {\n    if (selectedApplications.size === 0) {\n      alert(\"通知対象の申請を選択してください。\");\n      return;\n    }\n\n    const emailNotify = container.querySelector(\"#notify-email\").checked;\n    const systemNotify = container.querySelector(\"#notify-system\").checked;\n    const smsNotify = container.querySelector(\"#notify-sms\").checked;\n\n    if (!emailNotify && !systemNotify && !smsNotify) {\n      alert(\"通知方法を選択してください。\");\n      return;\n    }\n\n    const subject = container.querySelector(\"#notification-subject\").value;\n    const content = container.querySelector(\"#notification-content\").value;\n\n    if (!subject || !content) {\n      alert(\"件名と通知内容を入力してください。\");\n      return;\n    }\n\n    if (!confirm(`${selectedApplications.size}件の申請に対して通知を送信しますか？`)) {\n      return;\n    }\n\n    // 通知履歴を作成\n    for (const appId of selectedApplications) {\n      const application = tables[1].records.find(app => app.id === appId);\n      if (!application) continue;\n\n      const methods = [];\n      if (emailNotify) methods.push(\"メール\");\n      if (systemNotify) methods.push(\"システム内通知\");\n      if (smsNotify) methods.push(\"SMS\");\n\n      for (const method of methods) {\n        const notificationData = {\n          申請書類ID: appId,\n          通知対象ユーザーID: application.申請者ID,\n          通知種別: application.承認状態 === '承認済' ? '承認完了' : \n                   application.承認状態 === '却下' ? '却下' : '差戻し',\n          通知タイトル: subject,\n          通知内容: content,\n          送信方法: method,\n          送信状態: '送信完了',\n          送信日時: new Date().toISOString(),\n          既読フラグ: false,\n          再送回数: 0,\n          作成日時: new Date().toISOString(),\n          更新日時: new Date().toISOString(),\n          作成者ID: 'current-user-id'\n        };\n\n        await window.aivicApi.save(6, notificationData);\n      }\n    }\n\n    alert(`${selectedApplications.size}件の申請に対して通知を送信しました。`);\n    selectedApplications.clear();\n    \n    // チェックボックスをクリア\n    container.querySelectorAll(\".app-checkbox\").forEach(cb => cb.checked = false);\n    \n    // プレビューをクリア\n    container.querySelector(\"#notification-subject\").value = \"\";\n    container.querySelector(\"#notification-content\").value = \"\";\n    \n    // 一覧を再読み込み\n    const applications = await window.aivicApi.list(1);\n    if (applications) {\n      const completedApplications = applications.filter(app => \n        ['承認済', '却下', '差戻し'].includes(app.承認状態)\n      );\n      renderApplications(completedApplications);\n    }\n  });\n\n  // 7. プレビュー確認\n  container.querySelector(\"#btn-preview\").addEventListener(\"click\", () => {\n    if (selectedApplications.size === 0) {\n      alert(\"通知対象の申請を選択してください。\");\n      return;\n    }\n\n    const subject = container.querySelector(\"#notification-subject\").value;\n    const content = container.querySelector(\"#notification-content\").value;\n\n    if (!subject || !content) {\n      alert(\"件名と通知内容を入力してください。\");\n      return;\n    }\n\n    const previewWindow = window.open(\"\", \"_blank\", \"width=600,height=400\");\n    previewWindow.document.write(`\n      <html>\n        <head><title>通知プレビュー</title></head>\n        <body style=\"font-family: sans-serif; padding: 20px;\">\n          <h2>通知プレビュー</h2>\n          <p><strong>対象申請数:</strong> ${selectedApplications.size}件</p>\n          <p><strong>件名:</strong> ${subject}</p>\n          <hr>\n          <div style=\"white-space: pre-wrap;\">${content}</div>\n        </body>\n      </html>\n    `);\n  });\n\n  // 8. 通知履歴画面への遷移\n  container.querySelector(\"#btn-history\").addEventListener(\"click\", () => {\n    window.showScreen(\"scr-1779422306272\");\n  });\n}";
</script>

      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
