name: AIVIC Auto Test
on:
  push:
    branches: [dev]
  workflow_dispatch: {}

# 【一時設定】Playwright は省略中。Jest のみ実行。logic-scaffolder 品質改善のため iteration cycle を短縮（2026-05-24〜）
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run Jest unit tests
        id: jest
        run: npx jest --ci --passWithNoTests --reporters=default --reporters=jest-junit
        env:
          JEST_JUNIT_OUTPUT_DIR: ./test-results
          JEST_JUNIT_OUTPUT_NAME: jest-junit.xml
        continue-on-error: true
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
      - name: Determine overall status
        if: always()
        run: |
          jest_outcome="${{ steps.jest.outcome }}"
          echo "Jest: $jest_outcome (Playwright: skipped temporarily)"
          if [ "$jest_outcome" != "success" ] && [ "$jest_outcome" != "skipped" ]; then
            echo "::error::Jest failed (jest=$jest_outcome)"
            exit 1
          fi
