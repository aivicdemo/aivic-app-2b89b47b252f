<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ハイブリッド申請承認システムの構築 - ログイン画面</title>
  <style>
    :root {
      --primary: #ff6b9d;
      --primary-hover: #ff4d8a;
      --bg-main: #fafafa;
      --bg-card: #ffffff;
      --bg-sidebar: #f5f5f5;
      --border: #e8e8e8;
      --text: #2d2d2d;
      --text-muted: #666666;
      --top-bar-bg: #ffffff;
      --top-bar-border: #f0f0f0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, var(--bg-main) 0%, #f0f0f0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text);
    }

    .login-container {
      background: var(--bg-card);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      border: 1px solid var(--border);
    }

    .logo-section {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      border-radius: 12px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 24px;
      font-weight: bold;
    }

    .login-title {
      font-size: 24px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }

    .login-subtitle {
      color: var(--text-muted);
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 16px;
      background: var(--bg-card);
      color: var(--text);
      transition: all 0.2s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(255, 107, 157, 0.1);
    }

    .login-button {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 8px;
    }

    .login-button:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(255, 107, 157, 0.3);
    }

    .login-button:active {
      transform: translateY(0);
    }

    .footer-note {
      text-align: center;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-muted);
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 32px 24px;
        margin: 0 16px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo-section">
      <div class="logo">H</div>
      <h1 class="login-title" data-testid="login-title">ログイン</h1>
      <p class="login-subtitle">ハイブリッド申請承認システムの構築</p>
    </div>

    <form data-testid="login-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="username">ユーザー名</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          class="form-input" 
          data-testid="username"
          placeholder="ユーザー名を入力"
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="password">パスワード</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-input" 
          data-testid="password"
          placeholder="パスワードを入力"
        >
      </div>

      <button type="submit" class="login-button" data-testid="login-button">
        ログイン
      </button>
    </form>

    <div class="footer-note">
      サンプル実装ではどの入力でもログインできます
    </div>
  </div>

  <script>
    document.querySelector('[data-testid="login-form"]').addEventListener('submit', function(e) {
      e.preventDefault();
      window.location.href = './index.html';
    });
  </script>
</body>
</html>
