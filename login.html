<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ハイブリッド申請承認システムの構築 - ログイン画面</title>
  <style>
    :root {
      --primary: #ff6b9d;
      --primary-hover: #e55a8a;
      --bg-main: #2c2c2c;
      --bg-card: #383838;
      --bg-sidebar: #333333;
      --border: #4a4a4a;
      --text: #f0f0f0;
      --text-muted: #b8b8b8;
      --top-bar-bg: #363636;
      --top-bar-border: #4d4d4d;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-main);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-title {
      font-size: 24px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }

    .login-subtitle {
      font-size: 14px;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      font-size: 16px;
      background: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(255, 107, 157, 0.1);
    }

    .form-input::placeholder {
      color: var(--text-muted);
    }

    .login-button {
      width: 100%;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      margin-top: 8px;
    }

    .login-button:hover {
      background: var(--primary-hover);
    }

    .login-button:active {
      transform: translateY(1px);
    }

    .login-footer {
      margin-top: 32px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 32px 24px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <h1 class="login-title" data-testid="login-title">ログイン</h1>
      <p class="login-subtitle">ハイブリッド申請承認システムの構築</p>
    </div>

    <form data-testid="login-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="username">ユーザー名</label>
        <input
          type="text"
          id="username"
          name="username"
          class="form-input"
          data-testid="username"
          placeholder="ユーザー名を入力"
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="password">パスワード</label>
        <input
          type="password"
          id="password"
          name="password"
          class="form-input"
          data-testid="password"
          placeholder="パスワードを入力"
        >
      </div>

      <button type="submit" class="login-button" data-testid="login-button">
        ログイン
      </button>
    </form>

    <div class="login-footer">
      サンプル実装ではどの入力でもログインできます
    </div>
  </div>

  <script>
    document.querySelector('[data-testid="login-form"]').addEventListener('submit', function(e) {
      e.preventDefault();
      window.location.href = './index.html';
    });
  </script>
</body>
</html>
