<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ハイブリッド申請承認システムの構築 - ログイン画面</title>
  <style>
    :root {
      --primary: #4a5568;
      --primary-hover: #2d3748;
      --bg-main: #fefefe;
      --bg-card: #f7fafc;
      --bg-sidebar: #edf2f7;
      --border: #e2e8f0;
      --text: #2d3748;
      --text-muted: #4a5568;
      --top-bar-bg: #ffffff;
      --top-bar-border: #cbd5e0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      background: var(--bg-card);
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
      padding: 48px 40px;
      position: relative;
      overflow: hidden;
    }

    .login-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #667eea, #764ba2);
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-title {
      color: var(--text);
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .login-subtitle {
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 400;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 16px;
      color: var(--text);
      background: var(--bg-main);
      transition: all 0.2s ease;
      outline: none;
    }

    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(74, 85, 104, 0.1);
    }

    .login-button {
      width: 100%;
      padding: 14px 24px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 8px;
    }

    .login-button:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(74, 85, 104, 0.3);
    }

    .login-button:active {
      transform: translateY(0);
    }

    .login-footer {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      text-align: center;
    }

    .sample-notice {
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.4;
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 32px 24px;
        margin: 16px;
      }
      
      .login-title {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <h1 class="login-title" data-testid="login-title">ハイブリッド申請承認システム</h1>
      <p class="login-subtitle">アカウントにサインイン</p>
    </div>

    <form data-testid="login-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="username">ユーザー名</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          class="form-input" 
          data-testid="username"
          placeholder="ユーザー名を入力"
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="password">パスワード</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-input" 
          data-testid="password"
          placeholder="パスワードを入力"
        >
      </div>

      <button type="submit" class="login-button" data-testid="login-button">
        ログイン
      </button>
    </form>

    <div class="login-footer">
      <p class="sample-notice">
        サンプル実装ではどの入力でもログインできます
      </p>
    </div>
  </div>

  <script>
    document.querySelector('[data-testid="login-form"]').addEventListener('submit', function(e) {
      e.preventDefault();
      window.location.href = './index.html';
    });
  </script>
</body>
</html>
